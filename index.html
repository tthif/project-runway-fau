<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Runway: Fau's Edition (AI Edition)</title>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome (ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    },
                    colors: {
                        fashion: {
                            950: '#0a0a0c',
                            900: '#121216',
                            800: '#1b1b21',
                            700: '#2a2a33',
                            600: '#3d3d49',
                            gold: '#d4af37',
                            red: '#c0283c',
                            sand: '#e8dcc4'
                        }
                    }
                }
            }
        };
    </script>

    <style>
        html, body { background: #0a0a0c; }
        .img-look { aspect-ratio: 3 / 4; object-fit: cover; background: #121216; }
        .score-slider { width: 100%; accent-color: #d4af37; }
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-thumb { background: #2a2a33; border-radius: 3px; }

        body { background: radial-gradient(ellipse at 50% -10%, #2a2210 0%, #0a0a0c 55%) fixed; }
        body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; mix-blend-mode: screen;
            background: conic-gradient(from 200deg at 50% -20%, transparent 0 40%, rgba(212,175,55,.12) 48%, transparent 56% 100%),
                        conic-gradient(from 160deg at 15% -20%, transparent 0 44%, rgba(255,255,255,.06) 50%, transparent 56% 100%);
            animation: sweep 9s ease-in-out infinite alternate; }
        @keyframes sweep { to { transform: translateX(6%) skewX(-4deg); opacity: .55; } }
        main, footer { position: relative; z-index: 1; }
        #mainView > * { animation: rise .6s ease both; }
        @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
        h2.font-cinzel { background: linear-gradient(90deg, #fff, #e8dcc4, #d4af37, #fff); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent !important; animation: shine 6s linear infinite; }
        @keyframes shine { to { background-position: 200% center; } }
        details > summary { list-style: none; } details > summary::-webkit-details-marker { display: none; }
        details[open] { border-color: #d4af37; }
        #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; background: radial-gradient(ellipse at 50% 30%, #2a2210, #0a0a0c 70%); transition: opacity 1s; cursor: pointer; }
        #splash .t { font-family: Cinzel, serif; font-size: clamp(1.8rem, 8vw, 3.6rem); letter-spacing: .25em; color: #fff; animation: rise 1.2s ease both; }
        #splash .k { color: #d4af37; letter-spacing: .6em; font-size: .7rem; font-family: Cinzel, serif; }
        #splash .q { color: #9ca3af; font-style: italic; font-size: .8rem; animation: rise 2s ease both; }
        #quoteStrip { transition: opacity .6s; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-fashion-950 text-gray-200 font-sans antialiased">

<div id="splash" onclick="this.remove()"><div class="k">F · A · U</div><div class="t">PROJECT RUNWAY</div><div class="q">“In fashion, one day you're in, and the next day you're out.”</div><div class="q" style="font-size:.6rem;letter-spacing:.3em">TOQUE PARA ENTRAR</div></div>

<!-- CABEÇALHO -->
<header class="border-b border-fashion-700 bg-fashion-900/90 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="navigate('runway')">
            <span class="font-cinzel font-bold text-white text-base tracking-widest">PROJECT RUNWAY</span>
            <span class="text-xs text-fashion-gold tracking-widest uppercase border-l border-fashion-700 pl-3 font-cinzel">FAU · AI EDITION</span>
        </div>
        <div id="userHeaderSlot" class="flex items-center space-x-3 text-xs"></div>
    </div>
</header>

<!-- NAVEGAÇÃO SUPERIOR -->
<nav class="border-b border-fashion-700 bg-fashion-950 sticky top-16 z-30 overflow-x-auto">
    <div id="navContainer" class="max-w-6xl mx-auto px-4 flex space-x-1 py-1 text-xs uppercase tracking-wider font-medium"></div>
</nav>

<!-- BANNER GLOBAL DE STATUS -->
<div id="globalStatusBanner" class="hidden bg-fashion-900 border-b border-fashion-700 text-xs py-2 px-4 text-center"></div>

<div id="quoteStrip" class="text-center text-[11px] italic text-fashion-gold/80 font-cinzel py-2 px-4 border-b border-fashion-800"></div>

<!-- ÁREA PRINCIPAL -->
<main class="flex-grow max-w-5xl w-full mx-auto px-4 py-6">
    <div id="mainView" class="space-y-6"></div>
</main>

<!-- MODAL DE HISTÓRICO DO ATELIÊ -->
<div id="atelierHistoryModal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col justify-center items-center p-6 text-center backdrop-blur-md">
    <div class="max-w-3xl w-full bg-fashion-900 border border-fashion-700 rounded-lg p-6 space-y-6 max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center border-b border-fashion-700 pb-3">
            <span id="historyModalTitle" class="font-cinzel text-fashion-gold text-sm tracking-widest uppercase font-bold">Portfólio da Maison</span>
            <button onclick="closeAtelierHistoryModal()" class="text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="historyModalContent" class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs"></div>
    </div>
</div>

<!-- MODAL DE ANÚNCIO (AO VIVO) -->
<div id="broadcastModal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col justify-center items-center p-6 text-center backdrop-blur-md">
    <div class="max-w-2xl w-full space-y-6">
        <div class="flex justify-between items-center border-b border-fashion-700 pb-3">
            <span class="font-cinzel text-fashion-gold text-sm tracking-widest uppercase font-bold">Veredito da Passarela</span>
            <button onclick="closeBroadcastModal()" class="text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="broadcastStage" class="space-y-6 py-6"></div>
    </div>
</div>

<!-- RODAPÉ -->
<footer class="border-t border-fashion-700 bg-fashion-950 py-5 text-center text-[10px] text-gray-500 uppercase tracking-widest">
    PROJECT RUNWAY: FAU'S EDITION (AI EDITION) &mdash; Make It Work!
</footer>

<!-- NOTIFICAÇÃO TOAST -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-fashion-900 border border-fashion-gold text-fashion-sand px-5 py-2.5 rounded shadow-2xl text-xs uppercase tracking-wider hidden z-50 flex items-center gap-2">
    <i class="fa-solid fa-circle-info text-fashion-gold"></i>
    <span id="toastMsg"></span>
</div>

<!-- Firebase (SDK compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAVdHqWpxfBmzDcR_Xdi7GJDlKRx7Ajk6k",
        authDomain: "project-runway-fau.firebaseapp.com",
        databaseURL: "https://project-runway-fau-default-rtdb.firebaseio.com",
        projectId: "project-runway-fau",
        storageBucket: "project-runway-fau.firebasestorage.app",
        messagingSenderId: "232801489501",
        appId: "1:232801489501:web:fc8bcf06415968dba433b4",
        measurementId: "G-QNSCG9MP94"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();

    const $ = s => document.querySelector(s);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const slug = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
    const formatEmail = n => slug(n) + '@fau.game';
    const now = () => Date.now();

    // Critérios Oficiais da AI Edition (Duas Notas: Direção Criativa e Runway)
    const CRITERIOS = [
        'Criatividade e Originalidade',
        'Conceito e Narrativa',
        'Qualidade Visual',
        'Styling e Composição',
        'Interpretação do Desafio'
    ];

    const ROTULOS_ABAS = {
        work: 'The Workroom (Prompt)',
        runway: 'The Runway',
        tribunal: 'Votação do Elenco',
        berlinda: 'A Berlinda (Bottom)',
        conf: 'Confessionário',
        historico: 'Histórico da Temporada',
        bancada: 'Bancada de Júri',
        direcao: 'Direção Executiva',
        manual: 'O Manual'
    };

    const ABAS_POR_PERFIL = {
        estilista: ['work', 'runway', 'tribunal', 'berlinda', 'conf', 'historico'],
        jurado: ['bancada', 'runway', 'conf', 'historico'],
        plateia: ['runway', 'tribunal', 'conf', 'historico'],
        admin: ['direcao', 'bancada', 'runway', 'tribunal', 'conf', 'historico']
    };

    Object.values(ABAS_POR_PERFIL).forEach(a => a.push('manual'));
    let currentUser = null;
    let isAdmin = false;
    let globalState = {};
    let activeTab = 'runway';
    let unsubsGlobal = [];
    let unsubsTab = [];
    let isAuthProcessing = false;
    let audioDrafts = {};

    const showToast = (msg, duration = 3000) => {
        const t = $('#toast');
        $('#toastMsg').textContent = msg;
        t.classList.remove('hidden');
        setTimeout(() => t.classList.add('hidden'), duration);
    };

    const renderView = html => { $('#mainView').innerHTML = html; };
    const sub = (query, callback) => unsubsTab.push(query.onSnapshot(callback, err => showToast(`Erro: ${err.message}`)));

    const safeExec = fn => async (...args) => {
        try {
            await fn(...args);
        } catch (err) {
            console.error(err);
            showToast(err.message || 'Erro na operação.');
        }
    };

    const compressImageToBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
            const img = new Image();
            img.onload = () => {
                const maxDim = 1000;
                const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
                const canvas = document.createElement('canvas');
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL('image/jpeg', 0.78));
            };
            img.onerror = reject;
            img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });

    const blobToBase64 = blob => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
    });

    setInterval(() => {
        const clock = $('#roundTimer');
        if (!clock) return;
        const diff = (globalState.prazo || 0) - now();
        if (diff <= 0) {
            clock.textContent = 'TEMPO ESGOTADO!';
            clock.classList.add('text-fashion-red');
            return;
        }
        const h = Math.floor(diff / 36e5);
        const m = Math.floor((diff % 36e5) / 6e4);
        const s = Math.floor((diff % 6e4) / 1e3);
        clock.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }, 1000);

    const showLogin = () => {
        renderView(`
            <div class="max-w-md mx-auto my-12 bg-fashion-900 border border-fashion-700 rounded-lg p-8 space-y-6 shadow-2xl">
                <div class="text-center space-y-2">
                    <span class="text-xs uppercase tracking-[0.2em] text-fashion-gold font-medium">AI Edition</span>
                    <h2 class="font-cinzel text-2xl text-white font-normal">Entrar no Reality</h2>
                    <p class="text-xs text-gray-400">Entre com as credenciais do seu ateliê, jurado ou público.</p>
                </div>

                <div class="space-y-4 text-xs">
                    <div>
                        <label class="block text-gray-300 mb-1 uppercase tracking-wider font-semibold">Nome do Ateliê / Usuário</label>
                        <input id="loginName" class="w-full bg-fashion-950 border border-fashion-700 rounded p-2.5 text-white focus:outline-none focus:border-fashion-gold" placeholder="Ex: Maison McQueen ou direcao">
                    </div>
                    <div>
                        <label class="block text-gray-300 mb-1 uppercase tracking-wider font-semibold">Senha</label>
                        <input id="loginPass" type="password" class="w-full bg-fashion-950 border border-fashion-700 rounded p-2.5 text-white focus:outline-none focus:border-fashion-gold" placeholder="••••••••">
                    </div>
                    <div class="flex items-center gap-2 pt-1 text-gray-400">
                        <input id="isGuestCheck" type="checkbox" class="w-4 h-4 rounded bg-fashion-950 border-fashion-700 accent-fashion-gold">
                        <label for="isGuestCheck" class="cursor-pointer">Criar acesso como Público (Plateia)</label>
                    </div>
                    <button id="btnLogin" class="w-full bg-fashion-gold hover:bg-fashion-gold-hover text-black font-semibold py-3 rounded text-xs uppercase tracking-widest transition duration-150">
                        Entrar na Temporada
                    </button>
                </div>
            </div>
        `);

        $('#btnLogin').onclick = safeExec(async () => {
            const name = $('#loginName').value.trim();
            const pass = $('#loginPass').value;
            const isGuest = $('#isGuestCheck').checked;

            if (!name || !pass) throw new Error('Preencha os campos de acesso.');

            try {
                await auth.signInWithEmailAndPassword(formatEmail(name), pass);
            } catch (err) {
                if (!isGuest) throw new Error('Credenciais inválidas. Verifique seus dados.');
                isAuthProcessing = true;
                try {
                    const cred = await auth.createUserWithEmailAndPassword(formatEmail(name), pass);
                    await db.doc(`perfis/${cred.user.uid}`).set({
                        ate: name,
                        role: 'plateia',
                        disabled: false,
                        createdAt: now()
                    });
                } finally {
                    isAuthProcessing = false;
                }
                initUserSession(auth.currentUser);
            }
        });
    };

    const initUserSession = async user => {
        unsubsGlobal.forEach(u => u());
        unsubsGlobal = [];
        unsubsTab.forEach(u => u());
        unsubsTab = [];
        $('#navContainer').innerHTML = '';

        if (!user) {
            $('#userHeaderSlot').innerHTML = '';
            return showLogin();
        }

        const adminCheck = await db.doc(`admins/${user.uid}`).get();
        const adminByEmail = user.email ? await db.doc(`admins/${user.email}`).get() : { exists: false };
        isAdmin = adminCheck.exists || adminByEmail.exists;

        const profileSnap = await db.doc(`perfis/${user.uid}`).get();
        const profileData = profileSnap.data() || {};

        if (profileData.disabled && !isAdmin) {
            await auth.signOut();
            showToast('Acesso desativado pela direção.');
            return showLogin();
        }

        currentUser = {
            uid: user.uid,
            role: 'plateia',
            ate: 'Público',
            ...profileData
        };

        if (isAdmin) {
            currentUser.role = 'admin';
            currentUser.ate = profileData.ate || 'Direção Executiva (Admin & Júri)';
        }

        $('#userHeaderSlot').innerHTML = `
            <span class="text-fashion-gold font-medium font-cinzel">${esc(currentUser.ate)}</span>
            <span class="text-[10px] bg-fashion-800 text-gray-300 px-2 py-0.5 rounded border border-fashion-700 uppercase font-semibold">${currentUser.role}${isAdmin ? ' (Júri)' : ''}</span>
            <button onclick="auth.signOut()" class="text-gray-400 hover:text-white transition ml-2" title="Sair">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </button>
        `;

        unsubsGlobal.push(db.doc('config/estado').onSnapshot(snap => {
            globalState = snap.data() || {};
            updateGlobalBanner();
            navigate(activeTab);
        }));
    };

    const updateGlobalBanner = () => {
        const b = $('#globalStatusBanner');
        let bannerMsg = '';

        if (globalState.elimTipo === 'none' || globalState.naoEliminatoria) {
            bannerMsg += `<span class="bg-blue-900/40 text-blue-300 border border-blue-600 px-2 py-0.5 rounded ml-2 font-mono uppercase font-bold">✨ RODADA NÃO ELIMINATÓRIA</span> `;
        } else if (globalState.elimDupla || globalState.elimTipo === 'double') {
            bannerMsg += `<span class="bg-fashion-red/20 text-red-400 px-2 py-0.5 rounded ml-2 font-mono uppercase font-bold">⚠️ ELIMINAÇÃO DUPLA (2 OUT)</span> `;
        }

        if (bannerMsg) {
            b.innerHTML = bannerMsg;
            b.classList.remove('hidden');
        } else {
            b.classList.add('hidden');
        }
    };

    const navigate = tabKey => {
        let allowedTabs = ABAS_POR_PERFIL[currentUser?.role] || ['runway', 'tribunal', 'conf'];
        if (currentUser?.out && currentUser?.role === 'estilista') {
            allowedTabs = ['runway', 'conf', 'historico', 'manual'];
        }

        activeTab = allowedTabs.includes(tabKey) ? tabKey : allowedTabs[0];
        unsubsTab.forEach(u => u());
        unsubsTab = [];

        $('#navContainer').innerHTML = allowedTabs.map(t => `
            <button onclick="navigate('${t}')" class="px-3 py-2 border-b-2 transition ${t === activeTab ? 'border-fashion-gold text-fashion-gold font-bold' : 'border-transparent text-gray-400 hover:text-white'}">
                ${ROTULOS_ABAS[t]}
            </button>
        `).join('');

        VIEWS[activeTab]();
    };

    auth.onAuthStateChanged(user => {
        if (!isAuthProcessing) initUserSession(user);
    });

    const VIEWS = {};

    // 1. CONFESSIONÁRIO

    VIEWS.manual = () => {
        const S = [
            ['📖','01 · The Competition','Competição entre estilistas usando IA. Não basta uma imagem bonita: é preciso ideia, narrativa e identidade autoral.'],
            ['🎯','02 · The Challenges','Cada rodada traz um briefing com tema, requisitos, restrições e instruções. O briefing da rodada prevalece sobre o manual.'],
            ['📸','03 · The Runway','Entrega obrigatória: FOTO + NOME DA CRIAÇÃO + CONCEITO (máx. 500 caracteres). Os três contam na avaliação.'],
            ['⚖️','04 · The Judging','5 critérios de 0 a 10: criatividade, conceito, qualidade visual, styling e interpretação do desafio. Soma das médias = até 50 pontos.'],
            ['💬','05 · Judges\' Critiques','Críticas individuais para TOP e BOTTOM, e para o WIN da rodada anterior. Todos recebem suas notas.'],
            ['🏆','06 · The Results','WIN · TOP · SAFE · BOTTOM · THE ELIMINATION POOL · OUT. BOTTOM é o desempenho da semana; só o Pool pode ser eliminado.'],
            ['📈','07 · The Ranking','Ranking acumulado da temporada. Ele define quem entra no Elimination Pool: consistência também vence.'],
            ['👑','08 · The Win','Protege o estilista na vaga do ranking acumulado, só naquela rodada (não é imunidade). Decide o desempate do voto de salvamento.'],
            ['✨','09 · Ícone da Moda','Voto secreto no melhor estilista. O Ícone escolhe o próximo tema às cegas, só com pistas. Não dá imunidade.'],
            ['🥀','10 · Fora de Moda','Voto secreto no pior estilista. Se empatar no salvamento, perde automaticamente.'],
            ['🗳️','11 · The Votes','Todos os votos são secretos. Ninguém vota em si mesmo. Só os resultados são anunciados.'],
            ['🚨','12 · The Elimination Pool','3 estilistas: os 2 piores da rodada + o pior do ranking acumulado (se já estiver no bottom, entra o próximo elegível).'],
            ['🛟','13 · The Save Vote','Mais votado e 2º mais votado são salvos; o menos votado é OUT. Empate: Fora de Moda perde → Ícone tem prioridade → WIN decide.'],
            ['🔥','14 · Top 5 — The Final Filter','Rodada somada ao acumulado: 1º vai direto à final, 5º sai. Os 3 do meio disputam 2 vagas só pela nota do Top 5.'],
            ['🏁','15 · The Grand Finale','Três finalistas, placar ZERADO, igualdade total. Vence quem brilhar na etapa final.'],
            ['🎤','16 · Final Word','Respeite briefings e prazos, defenda suas ideias. THE RUNWAY IS YOURS. MAKE IT COUNT.']
        ];
        renderView(`
            <div class="space-y-5">
                <div class="text-center space-y-2 py-4">
                    <span class="text-xs uppercase tracking-[0.3em] text-fashion-gold font-cinzel">F · A · U — Fashion, Art & Uniqueness</span>
                    <h2 class="font-cinzel text-2xl">Manual Oficial do Participante</h2>
                    <p class="text-gray-400 italic text-xs">“In fashion, one day you're in, and the next day you're out.”</p>
                </div>
                ${S.map((x, i) => `
                    <details class="bg-fashion-900 border border-fashion-700 rounded-lg p-4 group" ${i === 0 ? 'open' : ''}>
                        <summary class="cursor-pointer font-cinzel text-fashion-gold text-sm tracking-wider">${x[0]} ${x[1]}</summary>
                        <p class="text-gray-300 text-xs leading-relaxed mt-3">${x[2]}</p>
                    </details>`).join('')}
            </div>`);
    };

    VIEWS.conf = () => {
        if (!globalState.rodada && !isAdmin) {
            renderView(`
                <div class="bg-fashion-900 border border-fashion-700 p-12 rounded-lg text-center space-y-4 max-w-xl mx-auto my-12">
                    <i class="fa-solid fa-lock text-fashion-gold text-3xl"></i>
                    <h2 class="font-cinzel text-xl text-white">O Confessionário está Trancado</h2>
                    <p class="text-xs text-gray-400 leading-relaxed font-light">O Confessionário só será aberto quando a rodada for lançada pela Direção Executiva!</p>
                </div>
            `);
            return;
        }

        const canPost = currentUser.role === 'estilista';

        renderView(`
            <div class="space-y-4">
                <div class="border-b border-fashion-700 pb-2 flex justify-between items-end">
                    <div>
                        <span class="text-xs uppercase tracking-widest text-fashion-gold font-medium font-cinzel">Behind The Seams</span>
                        <h2 class="font-cinzel text-xl text-white font-normal">The Confessionals</h2>
                    </div>
                    <span class="text-[10px] text-gray-400 uppercase font-mono">Mural Aberto para Leitura</span>
                </div>

                <div id="chatFeed" class="bg-fashion-900 border border-fashion-700 rounded-lg p-4 h-96 overflow-y-auto space-y-3 text-xs">
                    <p class="text-gray-500 italic text-center py-8">Carregando depoimentos...</p>
                </div>

                ${canPost ? `

    // 2. THE WORKROOM (MAISON & PROMPT MASTER)

                            </div>

                    $('#charCounter').textContent = `${e.target.value.length} / 500 letras`;
                };
            }

            $('#myLooksCount').textContent = `${allMyLooks.length} looks`;
            $('#myLooksArchiveGrid').innerHTML = allMyLooks.map(l => {
                const lookEvals = myEvaluations.filter(e => e.look === l.id);
                const avgTotal = lookEvals.length ? (lookEvals.reduce((a, b) => a + b.total, 0) / lookEvals.length).toFixed(1) : null;

                return `
                    <div class="bg-fashion-950 p-3 rounded border border-fashion-700 space-y-2">
                        <img src="${esc(l.url)}" class="w-full img-look rounded">
                        <div class="flex justify-between items-center text-[10px]">
                            <span class="text-fashion-gold font-bold font-cinzel">Rodada ${esc(l.rodada)}</span>

                        <div class="bg-fashion-900 p-2 rounded border border-fashion-700/60 text-center space-y-1">

                                <div class="pt-1 border-t border-fashion-800 space-y-1 text-[9px] text-left">

                                        return `
                                            <div class="flex justify-between items-center text-gray-400">

            }).join('') || '<div class="col-span-full text-center text-gray-500 py-4">Sua maison ainda não enviou looks.</div>';

        $('#mainView').onclick = safeExec(async e => {
            const target = e.target;

                const designerName = $('#setupDesignerInput').value.trim();
                const atelierBio = $('#setupAtelierBioInput').value.trim();

                if (!atelierName || !designerName) throw new Error('Preencha o nome da maison e o estilista de referência.');

                await db.doc(`perfis/${currentUser.uid}`).update({
                    ate: atelierName,
                    estilistaFixo: designerName,
                    bio: atelierBio
                });

                currentUser.ate = atelierName;
                currentUser.estilistaFixo = designerName;
                currentUser.bio = atelierBio;

                showToast('Identidade da Maison oficializada com sucesso!');
                refreshWorkroomUI();

                if (now() > globalState.prazo) throw new Error('O tempo acabou! A rodada está encerrada.');

                const index = currentRoundLooks.length;

                const batch = db.batch();
                batch.set(db.doc(`looks/${lookDocId}`), {
                    uid: currentUser.uid,
                    ate: currentUser.ate,
                    estilistaFixo: currentUser.estilistaFixo || '',
                    rodada: globalState.rodada,
                    prompt: promptTxt,
                    titulo: lookTitle,
                    url: photoBase64,
                    mem: memorial,
                    t: now()
                });
                batch.set(db.doc(`envios/${lookDocId}`), {
                    rodada: globalState.rodada,
                    uid: currentUser.uid
                });

        db.collection('perfis').get().then(snap => {
            const profiles = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            activeStylistsCount = profiles.filter(d => d.role === 'estilista' && !d.out && !d.disabled).length;
            refreshWorkroomUI();

        let myEvaluations = [];

            refreshWorkroomUI();

    // 3. HISTÓRICO DA TEMPORADA & GALERIA DE ELIMINAÇÕES
    VIEWS.historico = async () => {
        renderView(`
            <div class="space-y-8">
                <div class="border-b border-fashion-700 pb-3 flex justify-between items-center">
                    <div>
                        <span class="text-xs uppercase tracking-widest text-fashion-gold font-medium font-cinzel">Desempenho Geral</span>
                        <h2 class="font-cinzel text-xl text-white font-normal">Histórico da Temporada (Track Record)</h2>
                    </div>
                </div>
                <div id="trackRecordTableContainer" class="bg-fashion-900 border border-fashion-700 p-4 rounded-lg overflow-x-auto text-xs font-mono">
                    <p class="text-gray-400 py-8 text-center">Calculando matriz de desempenho da temporada...</p>
                </div>

                <div class="space-y-4 pt-4 border-t border-fashion-700">
                    <div class="border-b border-fashion-700 pb-2">
                        <span class="text-xs uppercase tracking-widest text-fashion-red font-medium font-cinzel font-bold">Auf Wiedersehen</span>
                        <h3 class="font-cinzel text-lg text-white font-normal">Galeria de Eliminações (Hall dos Eliminados)</h3>
                    </div>
                    <div id="eliminationGalleryGrid" class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
                        <p class="text-gray-500 italic py-4">Carregando galeria...</p>
                    </div>
                </div>
            </div>
        `);

        const [perfisSnap, looksSnap, evalsSnap] = await Promise.all([
            db.collection('perfis').where('role', '==', 'estilista').get(),
            db.collection('looks').get(),
            db.collection('avaliacoes').get()
        ]);

        const stylists = perfisSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        const looks = looksSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        const evals = evalsSnap.docs.map(d => d.data());

        const rodadasSet = new Set();
        looks.forEach(l => { if (l.rodada) rodadasSet.add(l.rodada); });
        const rodadas = [...rodadasSet].sort();

        if (!rodadas.length) {
            $('#trackRecordTableContainer').innerHTML = '<p class="text-gray-500 py-8 text-center">Nenhuma rodada registrada com looks ainda.</p>';
            return;
        }

        const statsByStylist = {};
        stylists.forEach(s => { statsByStylist[s.id] = { ate: s.ate, scores: [], rounds: {} }; });

        const evalByLook = {};
        evals.forEach(e => { ((evalByLook[e.look] ??= []).push(e.total)); });

        looks.forEach(l => {
            if (!statsByStylist[l.uid]) statsByStylist[l.uid] = { ate: l.ate, scores: [], rounds: {} };
            const lookEvals = evalByLook[l.id] || [];
            if (lookEvals.length) {
                const avg = lookEvals.reduce((a, b) => a + b, 0) / lookEvals.length;
                statsByStylist[l.uid].scores.push(avg);
                statsByStylist[l.uid].rounds[l.rodada] = { avg, lookId: l.id };
            }
        });

        const rowsData = stylists.map(s => {
            const sObj = statsByStylist[s.id];
            const totalScores = sObj.scores;
            const ppe = totalScores.length ? (totalScores.reduce((a, b) => a + b, 0) / totalScores.length).toFixed(2) : '0.00';
            return { uid: s.id, ate: s.ate, ppe: Number(ppe), rounds: sObj.rounds, out: s.out };
        }).sort((a, b) => b.ppe - a.ppe);

        let html = `
            <table class="w-full text-center border-collapse">
                <thead>
                    <tr class="bg-fashion-950 text-fashion-gold border-b border-fashion-700 text-[11px] font-cinzel">
                        <th class="p-2.5 text-left border-r border-fashion-700">MAISON / ATELIÊ</th>
                        <th class="p-2.5 border-r border-fashion-700">P.P.E.</th>
                        ${rodadas.map(r => `<th class="p-2.5 border-r border-fashion-700 uppercase">${esc(r)}</th>`).join('')}
                    </tr>
                </thead>
                <tbody>
        `;

        rowsData.forEach(row => {
            html += `
                <tr class="border-b border-fashion-800 hover:bg-fashion-950/40 transition">
                    <td class="p-2.5 text-left font-bold text-white border-r border-fashion-700 font-cinzel">${esc(row.ate)}</td>
                    <td class="p-2.5 font-mono text-fashion-gold border-r border-fashion-700">${row.ppe}</td>
            `;

            rodadas.forEach(r => {
                const rData = row.rounds[r];
                let badgeText = '—';
                let badgeClass = 'bg-fashion-950 text-gray-600';

                if (row.out && !rData) {
                    badgeText = 'OUT';
                    badgeClass = 'bg-red-950 text-red-400 font-bold';
                } else if (rData) {
                    badgeText = `${rData.avg.toFixed(1)}p`;
                    badgeClass = rData.avg >= 42.0 ? 'bg-blue-900 text-blue-200 font-bold' : rData.avg >= 35.0 ? 'bg-fashion-800 text-gray-200' : 'bg-red-950 text-red-300';
                }

                html += `<td class="p-2 border-r border-fashion-800"><span class="px-2 py-1 rounded text-[10px] inline-block uppercase ${badgeClass}">${badgeText}</span></td>`;
            });
            html += `</tr>`;
        });

        html += `</tbody></table>`;
        $('#trackRecordTableContainer').innerHTML = html;

        const eliminatedStylists = stylists.filter(s => s.out);
        const elimGrid = $('#eliminationGalleryGrid');
        if (!eliminatedStylists.length) {

        } else {
            const elimHtmls = [];
            for (const s of eliminatedStylists) {
                const sLooks = looks.filter(l => l.uid === s.id).sort((a, b) => b.t - a.t);

                elimHtmls.push(`
                    <div class="bg-fashion-950 border border-red-900/40 p-3 rounded space-y-2 text-center relative overflow-hidden">

                        <div class="font-cinzel font-bold text-white text-sm">${esc(s.ate)}</div>
                        <p class="text-[10px] text-gray-400 italic">"You are out. Auf Wiedersehen."</p>

            elimGrid.innerHTML = elimHtmls.join('');
        }
    };

    // 4. BANCADA DE JÚRI (AI EDITION)
    VIEWS.bancada = () => {
        let looks = [];
        let evaluations = {};
        let currentMediaRecorder = null;
        let audioChunks = [];

        renderView(`
            <div class="space-y-6">
                <div class="border-b border-fashion-700 pb-3 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                    <div>
                        <span class="text-xs uppercase tracking-widest text-fashion-gold font-medium font-cinzel">Avaliação Técnica (AI Edition)</span>
                        <h2 class="font-cinzel text-xl text-white font-normal">Bancada de Júri · Rodada ${esc(globalState.rodada || '')}</h2>
                    </div>
                    <div class="flex gap-2">
                        <button id="btnOpenMatrix" class="bg-fashion-800 hover:bg-fashion-700 text-fashion-sand px-3 py-1.5 rounded border border-fashion-600 text-xs">

                        </button>
                        <button id="btnSubmitAllEvaluations" class="bg-fashion-gold hover:bg-fashion-gold-hover text-black px-4 py-1.5 rounded text-xs font-semibold uppercase tracking-wider">

                        </button>
                    </div>
                </div>

                <div id="juryMatrixContainer" class="hidden bg-fashion-900 border border-fashion-gold/40 p-4 rounded-lg space-y-3">
                    <span class="text-xs uppercase tracking-wider text-fashion-gold font-cinzel font-bold block">Visão Geral das Suas Notas:</span>
                    <div id="juryMatrixGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-3 text-xs"></div>
                </div>

                <div id="juryCardsContainer" class="space-y-8"></div>
            </div>
        `);

        const refreshJuryUI = () => {
            const container = $('#juryCardsContainer');
            if (!looks.length) {
                container.innerHTML = `<div class="bg-fashion-900 border border-fashion-700 p-8 rounded-lg text-center text-gray-500 text-xs">Aguardando as maisons enviarem suas criações geradas por IA.</div>`;
                return;
            }

            $('#juryMatrixGrid').innerHTML = looks.map(l => {
                const ev = evaluations[l.id] || {};
                const tot = ev.total || (ev.nota ? ev.nota.reduce((a, b) => a + b, 0).toFixed(1) : '0.0');
                return `
                    <div class="bg-fashion-950 p-2 rounded border border-fashion-700 text-center space-y-1">
                        <img src="${esc(l.url)}" class="w-full aspect-[3/4] object-cover rounded">
                        <div class="font-cinzel font-bold text-white truncate text-[11px]">${esc(l.ate)}</div>
                        <div class="text-fashion-gold font-mono font-bold text-xs">${tot} pts</div>
                    </div>
                `;
            }).join('');

            container.innerHTML = looks.map(look => {
                const ev = evaluations[look.id] || {};
                const scores = ev.nota || [5.0, 5.0, 5.0, 5.0, 5.0];
                const commentAdmin = ev.comentAdmin || '';
                const audioUrl = ev.audio || '';
                const draftAudio = audioDrafts[look.id];

                return `
                    <div class="bg-fashion-900 border border-fashion-700 rounded-lg p-6 space-y-6" data-look="${look.id}">
                        <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
                            <div class="md:col-span-4 space-y-3">
                                <img src="${esc(look.url)}" class="w-full img-look rounded border border-fashion-700 shadow-lg" loading="lazy">
                                <div class="font-cinzel font-bold text-fashion-gold text-sm">${esc(look.ate)} <span class="text-[10px] text-gray-400 font-sans block">Estilista Fixo: ${esc(look.estilistaFixo || 'N/D')}</span></div>
                                <div class="bg-fashion-950 p-2.5 rounded border border-fashion-700 space-y-1">
                                    <span class="text-[9px] uppercase tracking-wider text-fashion-gold font-bold font-cinzel block">Prompt Enviado pelo Estilista:</span>
                                    <p class="text-[11px] text-gray-300 font-mono bg-black/40 p-2 rounded">${esc(look.prompt)}</p>
                                </div>
                                <div class="bg-fashion-950 p-2.5 rounded border border-fashion-700 space-y-1">
                                    <span class="text-[9px] uppercase tracking-wider text-fashion-gold font-bold font-cinzel block">Conceito & Título ("${esc(look.titulo || '')}"):</span>
                                    <p class="text-[11px] text-gray-300 italic leading-relaxed">${esc(look.mem)}</p>
                                </div>
                            </div>
                            <div class="md:col-span-8 space-y-4 text-xs">
                                <div class="flex justify-between items-center border-b border-fashion-700 pb-2">
                                    <span class="uppercase tracking-wider text-gray-400 font-semibold font-cinzel">Critérios Oficiais AI Edition (0 a 10)</span>
                                    <div class="font-cinzel text-fashion-gold font-bold text-sm">
                                        Total: <span id="tot-${look.id}">${(scores.reduce((a, b) => a + b, 0)).toFixed(1)}</span> / 50.0
                                    </div>
                                </div>

                                <div class="space-y-3">
                                    ${CRITERIOS.map((c, i) => `
                                        <div class="space-y-1">
                                            <div class="flex justify-between text-gray-300">
                                                <span>${c}</span>
                                                <span class="font-mono text-fashion-gold font-bold" id="val-${look.id}-${i}">${Number(scores[i]).toFixed(1)}</span>
                                            </div>
                                            <input type="range" min="0" max="10" step="0.1" value="${scores[i]}" 
                                                data-look-id="${look.id}" data-idx="${i}" 
                                                class="score-slider w-full h-1 bg-fashion-700 rounded cursor-pointer">
                                        </div>
                                    `).join('')}
                                </div>

                                <div class="space-y-2 pt-2 border-t border-fashion-700/70">
                                    <label class="block uppercase tracking-wider text-fashion-gold font-semibold"><i class="fa-solid fa-lock"></i> Crítica do Jurado (Sigilosa: WhatsApp)</label>
                                    <textarea id="commAdmin-${look.id}" class="w-full bg-fashion-950 border border-fashion-700 rounded p-2 text-white focus:outline-none focus:border-fashion-gold" rows="3" placeholder="Sua crítica sobre o prompt, estética e fidelidade ao estilista fixo...">${esc(commentAdmin)}</textarea>
                                </div>

                                <div class="pt-2 border-t border-fashion-700/70 space-y-2">
                                    <label class="block uppercase tracking-wider text-gray-400 font-semibold">Nota de Voz (Opcional)</label>
                                    <div class="flex flex-wrap items-center gap-3">
                                        <button data-action="record-audio" data-look="${look.id}" class="bg-fashion-800 hover:bg-fashion-700 text-fashion-sand px-3 py-1.5 rounded border border-fashion-600 flex items-center gap-2">
                                            <i class="fa-solid fa-microphone text-fashion-gold"></i>
                                            <span id="recStatus-${look.id}">Gravar Áudio</span>
                                        </button>
                                        <div id="audioPlayerSlot-${look.id}">
                                            ${draftAudio ? `
                                                <div class="flex items-center gap-2">
                                                    <audio controls src="${draftAudio}" class="h-8 max-w-xs"></audio>
                                                    <button data-action="discard-audio" data-look="${look.id}" class="text-fashion-red hover:underline text-xs">Apagar</button>
                                                </div>
                                            ` : audioUrl ? `
                                                <div class="flex items-center gap-2">
                                                    <audio controls src="${esc(audioUrl)}" class="h-8 max-w-xs"></audio>
                                                    <span class="text-green-400 text-[10px]">Gravado</span>
                                                </div>
                                            ` : '<span class="text-gray-500 text-[11px]">Nenhum áudio gravado</span>'}
                                        </div>
                                    </div>
                                </div>

                                <button data-action="save-evaluation" data-look="${look.id}" class="w-full bg-fashion-gold hover:bg-fashion-gold-hover text-black font-semibold py-2.5 rounded uppercase tracking-wider transition">
                                    Salvar Avaliação Desse Look
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        };

        $('#btnOpenMatrix').onclick = () => { $('#juryMatrixContainer').classList.toggle('hidden'); };

        $('#mainView').oninput = e => {
            if (e.target.classList.contains('score-slider')) {
                const lId = e.target.dataset.lookId;
                const idx = e.target.dataset.idx;
                $(`#val-${lId}-${idx}`).textContent = Number(e.target.value).toFixed(1);

                const sliders = [...document.querySelectorAll(`.score-slider[data-look-id="${lId}"]`)];
                const sum = sliders.reduce((acc, curr) => acc + Number(curr.value), 0);
                $(`#tot-${lId}`).textContent = sum.toFixed(1);
            }
        };

        $('#mainView').onclick = safeExec(async e => {
            const btn = e.target.closest('button[data-action]');
            if (!btn) return;
            const act = btn.dataset.action;
            const lookId = btn.dataset.look;

            if (act === 'record-audio') {
                if (currentMediaRecorder && currentMediaRecorder.state === 'recording') {
                    currentMediaRecorder.stop();
                    return;
                }

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                currentMediaRecorder = new MediaRecorder(stream);
                currentMediaRecorder.ondataavailable = ev => audioChunks.push(ev.data);

                currentMediaRecorder.onstop = safeExec(async () => {
                    stream.getTracks().forEach(t => t.stop());
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const audioBase64 = await blobToBase64(blob);
                    audioDrafts[lookId] = audioBase64;
                    showToast('Áudio gravado! Ouça antes de salvar.');
                    $(`#recStatus-${lookId}`).textContent = 'Gravar Novo';
                    refreshJuryUI();
                });

                currentMediaRecorder.start();
                $(`#recStatus-${lookId}`).textContent = 'Parar Gravação';
            }

            if (act === 'discard-audio') {
                delete audioDrafts[lookId];
                showToast('Áudio apagado.');
                refreshJuryUI();
            }

            if (act === 'save-evaluation') {
                await saveSingleEvaluation(lookId);
                showToast('Avaliação salva com sucesso.');
            }
        });

        const saveSingleEvaluation = async lookId => {
            const targetLook = looks.find(l => l.id === lookId);
            const sliders = [...document.querySelectorAll(`.score-slider[data-look-id="${lookId}"]`)];
            const scores = sliders.map(s => Number(s.value));
            const totalSum = Number(scores.reduce((a, b) => a + b, 0).toFixed(1));
            const commentAdmin = $(`#commAdmin-${lookId}`) ? $(`#commAdmin-${lookId}`).value.trim() : '';
            const audioFinal = audioDrafts[lookId] || evaluations[lookId]?.audio || '';

            await db.doc(`avaliacoes/${lookId}_${currentUser.uid}`).set({
                look: lookId,
                alvo: targetLook.uid,
                alvoAte: targetLook.ate,
                rodada: targetLook.rodada,
                jurado: currentUser.uid,
                juradoNome: currentUser.ate,
                nota: scores,
                total: totalSum,
                comentAdmin: commentAdmin,
                audio: audioFinal,
                t: now()
            }, { merge: true });
        };

        $('#btnSubmitAllEvaluations').onclick = safeExec(async () => {
            for (const look of looks) { await saveSingleEvaluation(look.id); }
            showToast('Todas as notas foram enviadas para a direção!');
        });

        sub(db.collection('looks').where('rodada', '==', globalState.rodada || '-'), snap => {
            looks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            refreshJuryUI();
        });

        sub(db.collection('avaliacoes').where('jurado', '==', currentUser.uid), snap => {
            evaluations = {};
            snap.docs.forEach(d => evaluations[d.data().look] = d.data());
            refreshJuryUI();
        });
    };

    // 5. THE RUNWAY (A PASSARELA)
    VIEWS.runway = () => {
        if (!globalState.liberado && !isAdmin) {
            renderView(`
                <div class="bg-fashion-900 border border-fashion-700 p-12 rounded-lg text-center space-y-4 max-w-xl mx-auto my-12">
                    <i class="fa-solid fa-lock text-fashion-gold text-3xl"></i>
                    <h2 class="font-cinzel text-xl text-white">The Runway está fechada</h2>
                    <p class="text-xs text-gray-400 leading-relaxed font-light">As maisons estão finalizando seus prompts e escolhas de IA. O desfile começará em breve.</p>
                </div>
            `);
            return;
        }

        let looks = [];
        let reactions = [];
        let critiques = [];
        let selectedFaceOff = [];

        renderView(`
            <div class="space-y-8">
                <div class="border-b border-fashion-700 pb-3 flex justify-between items-center">
                    <div>
                        <span class="text-xs uppercase tracking-widest text-fashion-gold font-medium font-cinzel">Desfile Oficial (AI Edition)</span>
                        <h2 class="font-cinzel text-2xl text-white font-normal">The Runway · Rodada ${esc(globalState.rodada || '')}</h2>
                    </div>
                </div>

                <div id="publishedRankingBox"></div>
                <div id="faceOffComparisonBox" class="hidden bg-fashion-900 border border-fashion-gold/40 p-6 rounded-lg space-y-4"></div>
                <div id="runwayGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
            </div>
        `);

        const refreshRunwayUI = () => {
            const foBox = $('#faceOffComparisonBox');
            if (selectedFaceOff.length === 2) {
                const [lookA, lookB] = selectedFaceOff.map(id => looks.find(l => l.id === id)).filter(Boolean);
                if (lookA && lookB) {
                    foBox.classList.remove('hidden');
                    foBox.innerHTML = `
                        <div class="flex justify-between items-center border-b border-fashion-700 pb-2">
                            <span class="font-cinzel text-xs text-fashion-gold font-bold tracking-widest uppercase">Face-Off: Comparar Looks Lado a Lado</span>
                            <button onclick="selectedFaceOff = []; refreshRunwayUI();" class="text-gray-400 hover:text-white text-xs">Fechar</button>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="space-y-2 text-center">
                                <img src="${esc(lookA.url)}" class="w-full img-look rounded border border-fashion-700">
                                <span class="font-cinzel font-bold text-white text-xs">${esc(lookA.ate)}</span>
                            </div>
                            <div class="space-y-2 text-center">
                                <img src="${esc(lookB.url)}" class="w-full img-look rounded border border-fashion-700">
                                <span class="font-cinzel font-bold text-white text-xs">${esc(lookB.ate)}</span>
                            </div>
                        </div>
                    `;
                }
            } else {
                foBox.classList.add('hidden');
            }

            $('#runwayGrid').innerHTML = looks.map(look => {
                const reactCounts = {};
                reactions.filter(r => r.look === look.id).forEach(r => reactCounts[r.e] = (reactCounts[r.e] || 0) + 1);
                const lookCritiques = critiques.filter(c => c.look === look.id);
                const isChecked = selectedFaceOff.includes(look.id);

                return `
                    <div class="bg-fashion-900 border border-fashion-700 rounded-lg overflow-hidden space-y-3 p-4 flex flex-col justify-between">
                        <div class="space-y-2">
                            <div class="flex justify-between items-center border-b border-fashion-700/60 pb-2">
                                <button onclick="openAtelierHistory('${look.uid}', '${esc(look.ate)}')" class="font-cinzel font-bold text-fashion-gold hover:underline text-xs tracking-wider text-left flex items-center gap-1" title="Ver Histórico da Maison">
                                    <i class="fa-solid fa-book-open text-[10px]"></i> ${esc(look.ate)}
                                </button>
                                <label class="flex items-center gap-1.5 text-[10px] text-gray-400 cursor-pointer">
                                    <input type="checkbox" data-faceoff="${look.id}" ${isChecked ? 'checked' : ''} class="accent-fashion-gold">
                                    <span>Face-Off</span>
                                </label>
                            </div>
                            <img src="${esc(look.url)}" class="w-full img-look rounded border border-fashion-700 shadow" loading="lazy">
                            <div class="font-cinzel text-fashion-gold font-bold text-xs">${esc(look.titulo || 'Look Sem Nome')}</div>
                            <p class="text-[11px] text-gray-400 italic line-clamp-3 leading-relaxed">${esc(look.mem)}</p>
                        </div>

                        <div class="space-y-2 pt-2 border-t border-fashion-700/60">
                            <div class="flex justify-between gap-1">
                                ${['👍', '❤️', '👎', '💣', '✂️'].map(emoji => `
                                    <button data-react="${look.id}|${emoji}" class="flex-1 bg-fashion-950 hover:bg-fashion-800 border border-fashion-700 py-1.5 rounded text-xs transition">
                                        ${emoji} <span class="text-[10px] text-gray-400 font-mono">${reactCounts[emoji] || 0}</span>
                                    </button>
                                `).join('')}
                            </div>

                            <div class="pt-2 border-t border-fashion-800 space-y-1">
                                <div class="flex gap-1">
                                    <input id="critInput-${look.id}" maxlength="140" placeholder="Comentário da plateia (máx 140 letras)..." class="flex-grow bg-fashion-950 border border-fashion-700 rounded px-2 py-1 text-[11px] text-white focus:outline-none">
                                    <button data-send-crit="${look.id}" class="bg-fashion-800 hover:bg-fashion-700 text-fashion-gold px-2.5 py-1 rounded text-[10px] font-bold uppercase">Enviar</button>
                                </div>
                                <div class="max-h-20 overflow-y-auto space-y-1 pt-1">
                                    ${lookCritiques.map(c => `
                                        <div class="text-[10px] bg-fashion-950 p-1.5 rounded border border-fashion-800 text-gray-300">
                                            <strong class="text-fashion-gold">${esc(c.ate)}:</strong> ${esc(c.txt)}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        };

        $('#mainView').onclick = safeExec(async e => {
            const reactBtn = e.target.closest('button[data-react]');
            if (reactBtn) {
                const [lookId, emoji] = reactBtn.dataset.react.split('|');
                await db.doc(`reacoes/${lookId}_${currentUser.uid}`).set({
                    look: lookId,
                    e: emoji,
                    uid: currentUser.uid,
                    rodada: globalState.rodada
                });
            }

            const critBtn = e.target.closest('button[data-send-crit]');
            if (critBtn) {
                const lookId = critBtn.dataset.sendCrit;
                const input = $(`#critInput-${lookId}`);
                const txt = input.value.trim();
                if (!txt) return;
                await db.collection('criticas').add({
                    look: lookId,
                    rodada: globalState.rodada,

                refreshRunwayUI();

            looks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            refreshRunwayUI();

        sub(db.collection('reacoes').where('rodada', '==', globalState.rodada), snap => {
            reactions = snap.docs.map(d => d.data());
            refreshRunwayUI();

        sub(db.collection('criticas').where('rodada', '==', globalState.rodada).orderBy('t', 'desc'), snap => {

                                : 'bg-fashion-800 text-gray-300';
                            return `
                                <div class="bg-fashion-950 p-2.5 rounded border border-fashion-700 flex justify-between items-center">
                                    <span class="font-cinzel text-white"><strong>#${idx + 1}</strong> ${esc(row.ate)}</span>
                                    <span class="text-[10px] font-mono px-2 py-0.5 rounded font-bold uppercase ${statusClass}">${esc(row.status)}</span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        });
    };

    // 6. VOTAÇÃO DO ELENCO (ÍCONE & FORA DE MODA)

        if (!globalState.rodada || (globalState.prazo && now() > globalState.prazo && !isAdmin)) {
            renderView(`
                <div class="bg-fashion-900 border border-fashion-700 p-12 rounded-lg text-center space-y-4 max-w-xl mx-auto my-12">
                    <i class="fa-solid fa-lock text-fashion-gold text-3xl"></i>
                    <h2 class="font-cinzel text-xl text-white">Votação do Elenco Fechada</h2>

                <div class="bg-fashion-900 border border-fashion-700 p-12 rounded-lg text-center space-y-4 max-w-xl mx-auto my-12">

            const counts = {};
            snap.docs.forEach(d => counts[d.data().alvo] = (counts[d.data().alvo] || 0) + 1);
            return counts;
        };

        const computeSeasonStandings = async () => {
            const [profilesSnap, evalsSnap] = await Promise.all([
                db.collection('perfis').where('role', '==', 'estilista').get(),
                db.collection('avaliacoes').get()
            ]);

            const evaluationsByLook = {};
            evalsSnap.docs.forEach(d => {
                const data = d.data();
                ((evaluationsByLook[data.alvo] ??= {})[data.look] ??= { r: data.rodada, scores: [] }).scores.push(data.total);
            });

            const activeStylists = profilesSnap.docs.filter(d => !d.data().out && !d.data().disabled);
            const rows = activeStylists.map(doc => {
                let totalAccumulated = 0;
                let currentRoundScore = 0;
                const looksObj = evaluationsByLook[doc.id] || {};

                for (const lookKey in looksObj) {
                    const lookData = looksObj[lookKey];
                    const avg = lookData.scores.reduce((a, b) => a + b, 0) / lookData.scores.length;
                    if (lookData.r === globalState.rodada) currentRoundScore += avg;
                    if (globalState.fase !== 'final' || lookData.r === globalState.rodada) {
                        totalAccumulated += avg;
                    }
                }

                return { uid: doc.id, ate: doc.data().ate, tot: Number(totalAccumulated.toFixed(2)), rd: Number(currentRoundScore.toFixed(2)) };
