        $('#mainView').onclick = safeExec(async e => {
            const btn = e.target.closest('button[data-act], button[data-exec]');
            if (!btn) return;
            const act = btn.dataset.act || btn.dataset.exec?.split('|')[0];
            const uid = btn.dataset.uid;
            if (!isAdmin || !auth.currentUser) throw new Error('Apenas a produção pode gerenciar usuários.');
            if (['save-role','toggle-status','delete-profile','edit-profile'].includes(act) && (!uid || uid === auth.currentUser.uid)) throw new Error('Não é permitido alterar sua própria conta neste painel.');

            if (act === 'reset-random-password') {
                if (!uid) throw new Error('Selecione um usuário válido.');
                const name=btn.dataset.name||'este usuário';
                if (!confirm(`Gerar e aplicar uma nova senha aleatória para ${name}? A senha anterior deixará de funcionar imediatamente.`)) return;
                btn.disabled=true;
                try {
                    const result=await firebase.app().functions('us-central1').httpsCallable('adminResetRandomPassword')({uid});
                    const password=result.data?.password;
                    if (!password) throw new Error('O servidor não retornou a nova senha.');
                    const dialog=document.createElement('div');
                    dialog.className='fixed inset-0 z-[9999] bg-black/90 flex items-center justify-center p-4';
                    dialog.innerHTML=`<section role="dialog" aria-modal="true" aria-label="Nova senha" class="w-full max-w-md rounded-xl border border-fashion-gold bg-fashion-900 p-6 space-y-4"><p class="text-[10px] tracking-widest text-fashion-gold">USER MANAGEMENT · CREDENTIALS</p><h3 class="font-cinzel text-2xl text-white">Nova senha aplicada</h3><p class="text-sm text-gray-300">${esc(name)} já pode entrar com a nova senha. A anterior foi invalidada. Copie agora: ela não será exibida novamente.</p><input aria-label="Nova senha gerada" readonly class="w-full bg-fashion-950 border border-fashion-gold rounded-lg p-3 text-white font-mono" value="${esc(password)}"><div class="flex gap-2"><button type="button" data-copy class="flex-1 rounded-lg bg-fashion-gold p-3 text-black font-bold">Copiar senha</button><button type="button" data-close class="rounded-lg border border-fashion-700 px-4 text-white">Fechar</button></div></section>`;
                    document.body.appendChild(dialog);
                    dialog.querySelector('[data-copy]').onclick=async()=>{try{await navigator.clipboard.writeText(password);showToast('Nova senha copiada.');}catch{dialog.querySelector('input').select();showToast('Selecione e copie a senha.');}};
                    dialog.querySelector('[data-close]').onclick=()=>dialog.remove();
                    dialog.querySelector('input').focus();
                } catch(error) {
                    if(error.code==='functions/not-found'||error.code==='functions/unavailable') throw new Error('A função segura de redefinição ainda não está publicada no Firebase. Consulte o arquivo de instalação.');
                    throw error;
                } finally {btn.disabled=false;}
                return;
            }

            if (act === 'edit-profile') {
                const ref = db.doc(`perfis/${uid}`);
                const snap = await ref.get();
                if (!snap.exists) throw new Error('Perfil não encontrado.');
                const p = snap.data();
                const newName = prompt('Nome público / nome do ateliê (até 70 caracteres):', p.ate || '');
                if (newName === null) return;
                const ate = newName.trim();
                if (!ate || ate.length > 70 || /[<>]/.test(ate)) throw new Error('Informe um nome válido de até 70 caracteres, sem < ou >.');
                const newJurorName = p.role==='jurado' ? prompt('Nome do jurado para a bancada (não o usuário/login):', p.nomeJurado || p.nome || p.ate || '') : null;
                if(p.role==='jurado' && newJurorName===null)return;
                if(p.role==='jurado' && (!newJurorName.trim()||newJurorName.trim().length>70||/[<>]/.test(newJurorName)))throw new Error('Informe o nome do jurado (até 70 caracteres).');
                const newBio = prompt('Manifesto / biografia (até 300 caracteres):', p.bio || '');
                if (newBio === null) return;
                const bio = newBio.trim();
                if (bio.length > 300) throw new Error('A biografia deve ter até 300 caracteres.');
                await ref.update({ate, bio, ...(p.role==='jurado'?{nomeJurado:newJurorName.trim()}:{})});
                // Identidades reais são documentos separados e não são alteradas automaticamente.
                showToast('Perfil atualizado.');
            }

            if (act === 'save-role') {
                const sel = document.querySelector(`select[data-role-select="${uid}"]`);
                if (!sel) return;
                const newRole = sel.value;
                if (!['estilista','jurado','plateia'].includes(newRole)) throw new Error('Função inválida. O acesso ADM é controlado separadamente.');
                const oldSnap = await db.doc(`perfis/${uid}`).get();
                if (!oldSnap.exists) throw new Error('Perfil não encontrado.');
                if (oldSnap.data().role !== newRole && !confirm(`Alterar o tipo de ${oldSnap.data().ate || 'usuário'} para ${newRole}? Isso pode afetar acesso a rodadas e avaliações.`)) return;
                await db.doc(`perfis/${uid}`).update({ role: newRole });
                showToast('Função atualizada.');
            }

            if (act === 'toggle-status') {
                const currentDisabled = btn.dataset.current === 'true';
                if (!confirm(`${currentDisabled ? 'Reativar' : 'Desativar'} este usuário? ${currentDisabled ? 'Ele voltará a acessar o site.' : 'Ele perderá o acesso às áreas protegidas, mas seu histórico será preservado.'}`)) return;
                await db.doc(`perfis/${uid}`).update({ disabled: !currentDisabled });
                showToast('Status atualizado.');
            }

            if (act === 'delete-profile') {
                const name = btn.dataset.name || 'este perfil';
                if (!confirm(`Excluir o PERFIL de "${name}"?\n\nIsso remove o cadastro e a identidade administrativa, mas NÃO apaga a conta do Firebase Authentication nem os looks, notas e votos históricos. Para bloquear o acesso sem excluir, prefira Desativar.`)) return;
                const batch = db.batch();
                batch.delete(db.doc(`perfis/${uid}`));
                batch.delete(db.doc(`identidades/${uid}`));
                await batch.commit();
                showToast('Perfil removido do Firestore. A conta do Authentication não foi excluída.');
            }

            if (btn.dataset.exec) {
                const [execAct, val] = btn.dataset.exec.split('|');
                if (execAct === 'elim') {
                    await db.doc(`perfis/${val}`).update({ out: true });
                    await fauPublishOutIdentity(val);
                    showToast(`${atelierMap[val]} está OUT.`);
                }
                if (execAct === 'apply-top5' && calculationState) {
                    for (const outItem of calculationState.outList) {
                        await db.doc(`perfis/${outItem.uid}`).update({ out: true });
                        await fauPublishOutIdentity(outItem.uid);
                    }
                    await db.doc('config/estado').update({ fase: 'final' });
                    showToast('Top 3 definido para a Grande Final.');
                }
            }
        });

        // Casting Desk: gerenciamento unificado dos cadastros, sem criar contas Auth fictícias.
        const castSection=$('#castAuditList')?.closest('.bg-fashion-900');
        if(castSection){
            const toolbar=document.createElement('div');
            toolbar.className='flex flex-wrap items-center gap-2 mb-4';
            toolbar.innerHTML=`<input id="castSearch" aria-label="Buscar participantes" placeholder="Buscar nome, usuário, UID…" class="flex-1 min-w-[170px] bg-fashion-950 border border-fashion-700 rounded p-2 text-xs text-white">
              <select id="castFilter" aria-label="Filtrar perfis" class="bg-fashion-950 border border-fashion-700 rounded p-2 text-xs text-white"><option value="all">Todos</option><option value="active">Ativos</option><option value="disabled">Desativados</option><option value="out">Eliminados</option><option value="missing">Incompletos</option></select>
              <button id="castAdd" class="rounded bg-fashion-gold text-black px-3 py-2 text-xs font-bold">+ ADICIONAR PERFIL</button>`;
            $('#castAuditList').before(toolbar);
            const note=document.createElement('p');
            note.className='text-[11px] text-gray-400 mb-3';
            note.textContent='Gerencie nomes, função e status. Adicionar perfil exige um UID de uma conta já criada no Firebase Authentication; não cria login nem senha. Excluir não remove a conta Authentication.';
            toolbar.after(note);
        }
        let castRows=[];
        const castEdit=async(uid)=>{
            if(uid===auth.currentUser?.uid)throw new Error('Não é permitido alterar sua própria conta.');
            const row=castRows.find(x=>x.uid===uid);if(!row)throw new Error('Conta não encontrada.');
            const r=row.registration||{},l=row.legacy||{},p=row.profile||{};
            const real=prompt('Nome real:',r.real||l.real||'');if(real===null)return;
            const designer=prompt('Nome de Designer / Designer:',p.ate||r.designer||l.ate||'');if(designer===null)return;
            const username=r.username||p.username||l.username||''; // O login real não pode ser alterado editando o Firestore.
            const bio=prompt('Manifesto / biografia:',p.bio||'');if(bio===null)return;
            if(real.trim().length<2||real.length>90||designer.trim().length<2||designer.length>70||username.length>100||bio.length>300||/[<>]/.test(real+designer+username+bio))throw new Error('Confira os campos e limites de caracteres.');
            const batch=db.batch();
            if(row.registration)batch.update(db.doc(`inscricoes_designers/${uid}`),{real:real.trim(),designer:designer.trim()});
            if(row.profile)batch.update(db.doc(`perfis/${uid}`),{ate:designer.trim(),bio:bio.trim()});
            if(row.legacy)batch.update(db.doc(`identidades/${uid}`),{real:real.trim(),ate:designer.trim(),username:username.trim()});
            else batch.set(db.doc(`identidades/${uid}`),{real:real.trim(),ate:designer.trim(),username:username.trim(),email:r.email||'',updatedAt:now()},{merge:true});
            await batch.commit();showToast('Dados do participante atualizados.');
        };
        const castAdd=async()=>{
            const uid=prompt('UID da conta existente no Firebase Authentication (não é possível criar senha por este painel):');
            if(uid===null)return;
            if(!/^[A-Za-z0-9_-]{10,128}$/.test(uid.trim()))throw new Error('UID inválido.');
            if(uid.trim()===auth.currentUser?.uid)throw new Error('Não altere seu próprio acesso.');
            const ref=db.doc(`perfis/${uid.trim()}`);
            if((await ref.get()).exists)throw new Error('Esse UID já possui perfil. Use Editar.');
            const ate=prompt('Nome público / Designer:');if(ate===null)return;
            if(!ate.trim()||ate.length>70||/[<>]/.test(ate))throw new Error('Nome inválido.');
            const real=prompt('Nome real (opcional):','');if(real===null)return;
            if(real.length>90||/[<>]/.test(real))throw new Error('Nome real inválido.');
            const role=prompt('Função: estilista, jurado ou plateia','estilista');if(role===null)return;
            if(!['estilista','jurado','plateia'].includes(role))throw new Error('Função inválida.');
            if(!confirm(`Criar perfil ${role} para UID ${uid.trim()}? Confirme que esse UID pertence a uma conta Authentication existente.`))return;
            const batch=db.batch();
            batch.set(ref,{ate:ate.trim(),role,disabled:false,out:false,bio:'',createdAt:now()});
            if(real.trim())batch.set(db.doc(`identidades/${uid.trim()}`),{real:real.trim(),ate:ate.trim(),createdAt:now()},{merge:true});
            await batch.commit();showToast('Perfil criado. A conta Authentication deve existir para permitir login.');
        };
        $('#castAdd')?.addEventListener('click',()=>safeExec(castAdd)());
        $('#castSearch')?.addEventListener('input',()=>renderCastAudit());
        $('#castFilter')?.addEventListener('change',()=>renderCastAudit());
        const castHandleClick=e=>{
            const btn=e.target.closest('[data-cast-action]');if(!btn)return;
            const uid=btn.dataset.castUid,action=btn.dataset.castAction;
            safeExec(async()=>{
                if(!isAdmin||uid===auth.currentUser?.uid)throw new Error('Operação não permitida.');
                const row=castRows.find(x=>x.uid===uid);if(!row)throw new Error('Usuário não encontrado.');
                const profileRef=db.doc(`perfis/${uid}`);
                if(action==='edit')return castEdit(uid);
                if(action==='role'){
                    if(!row.profile)throw new Error('Adicione o perfil antes de alterar a função.');
                    const role=$('#castAuditList').querySelector(`[data-cast-role="${uid}"]`)?.value;
                    if(!['estilista','jurado','plateia'].includes(role))throw new Error('Função inválida.');
                    if(!confirm(`Alterar função para ${role}?`))return;
                    await profileRef.update({role});showToast('Função atualizada.');
                }
                if(action==='status'){
                    if(!row.profile)throw new Error('Perfil não encontrado.');
                    const disabled=!!row.profile.disabled;
                    if(!confirm(`${disabled?'Reativar':'Desativar'} este usuário?`))return;
                    await profileRef.update({disabled:!disabled});showToast('Status atualizado.');
                }
                if(action==='out'){
                    if(!row.profile)throw new Error('Perfil não encontrado.');
                    const out=!!row.profile.out;
                    if(!confirm(`${out?'Reintegrar':'Marcar como OUT'} este participante?`))return;
                    await profileRef.update({out:!out});if(!out)await fauPublishOutIdentity(uid);showToast('Situação na competição atualizada.');
                }
                if(action==='delete'){
                    if(!confirm('EXCLUIR cadastro e perfil do Firestore? Esta ação não exclui a conta do Firebase Authentication nem o histórico de looks, votos e notas. Prefira desativar se deseja apenas bloquear o acesso.'))return;
                    if(prompt('Digite EXCLUIR para confirmar:')!=='EXCLUIR')return;
                    const batch=db.batch();
                    if(row.profile)batch.delete(profileRef);
                    if(row.registration)batch.delete(db.doc(`inscricoes_designers/${uid}`));
                    if(row.legacy)batch.delete(db.doc(`identidades/${uid}`));
                    await batch.commit();showToast('Registros de cadastro removidos do Firestore.');
                }
            })();
        };
        $('#castAuditList')?.addEventListener('click',castHandleClick);
        $('#castQuickList')?.addEventListener('click',castHandleClick);
        // Auditoria unificada: inscrições novas + identidades legadas + perfis ativos.
        // A coleção identidades não é gravada pelo cadastro público (somente ADM).
        const auditCache={inscricoes:null,identidades:null,perfis:null};
        const auditErrors={};
        const renderCastAudit=()=>{
            const root=$('#castAuditList');if(!root)return;
            const entries=new Map();
            const ensure=uid=>{if(!entries.has(uid))entries.set(uid,{uid});return entries.get(uid);};
            (auditCache.identidades||[]).forEach(d=>{const x=ensure(d.id);x.legacy=d.data();});
            (auditCache.inscricoes||[]).forEach(d=>{const x=ensure(d.id);x.registration=d.data();});
            (auditCache.perfis||[]).forEach(d=>{const x=ensure(d.id);x.profile=d.data();});
            castRows=[...entries.values()].sort((a,b)=>String(a.registration?.real||a.legacy?.real||a.profile?.ate||'').localeCompare(String(b.registration?.real||b.legacy?.real||b.profile?.ate||''),'pt-BR'));
            const search=($('#castSearch')?.value||'').toLocaleLowerCase('pt-BR'),filter=$('#castFilter')?.value||'all';
            const rows=castRows.filter(x=>{
                const r=x.registration||{},l=x.legacy||{},p=x.profile||{};
                const hay=[x.uid,r.real,r.designer,r.username,r.email,l.real,l.username,p.ate,p.username].join(' ').toLocaleLowerCase('pt-BR');
                if(search&&!hay.includes(search))return false;
                if(filter==='active')return !!x.profile&&!p.disabled&&!p.out;
                if(filter==='disabled')return !!p.disabled;
                if(filter==='out')return !!p.out;
                if(filter==='missing')return !x.profile||(!x.registration&&!x.legacy);
                return true;
            });
            const errors=Object.entries(auditErrors).filter(([,value])=>value).map(([name,value])=>`<p class="text-red-300 p-2 border border-red-900 rounded">Erro ao consultar ${esc(name)}: ${esc(value)}. Verifique as regras do Firestore.</p>`).join('');
            const pending=Object.values(auditCache).some(v=>v===null);
            root.innerHTML=`<p class="text-[11px] text-gray-400 mb-2">${rows.length} exibido(s) de ${castRows.length} conta(s) · Inscrições + identidades antigas + perfis.</p>${errors}${rows.map(x=>{
                const reg=x.registration||{},legacy=x.legacy||{},profile=x.profile||{};
                const real=reg.real||legacy.real||'Nome real não registrado';
                const atelier=profile.ate||reg.designer||legacy.ate||'Designer não informado';
                const username=reg.username||profile.username||legacy.username||reg.email||legacy.email||'Não informado';
                const badges=[!x.registration&&!x.legacy?'Sem ficha de identidade':'',!x.profile?'Sem perfil de acesso':'',profile.disabled?'Desativado':'',profile.out?'Eliminado':''].filter(Boolean);
                const own=x.uid===auth.currentUser?.uid;
                return `<article class="p-3 border border-fashion-700 bg-fashion-950 rounded-xl space-y-3 mb-2">
                    <div class="flex flex-wrap justify-between gap-2"><div><p class="text-white font-semibold">${esc(real)}</p><p class="text-fashion-gold font-cinzel">${esc(atelier)}</p><p class="text-[10px] text-gray-400 break-all">${esc(username)} · UID: ${esc(x.uid)}</p></div><span class="text-xs ${profile.disabled?'text-red-300':'text-green-300'}">${profile.disabled?'DESATIVADO':x.profile?'ATIVO':'SEM PERFIL'}</span></div>
                    ${badges.length?`<p class="text-[10px] text-amber-300">${badges.map(esc).join(' · ')}</p>`:''}
                    <div class="flex flex-wrap items-center gap-2">
                        <button data-cast-action="edit" data-cast-uid="${esc(x.uid)}" ${own?'disabled':''} class="rounded border border-fashion-gold text-fashion-gold px-3 py-2 text-xs disabled:opacity-40">EDITAR</button>
                        <select data-cast-role="${esc(x.uid)}" ${own||!x.profile?'disabled':''} class="bg-fashion-900 border border-fashion-700 rounded p-2 text-xs text-white">${[['estilista','Designer'],['jurado','Jurado'],['plateia','Plateia']].map(([v,t])=>`<option value="${v}" ${profile.role===v?'selected':''}>${t}</option>`).join('')}</select>
                        <button data-cast-action="role" data-cast-uid="${esc(x.uid)}" ${own||!x.profile?'disabled':''} class="rounded border border-fashion-700 text-white px-3 py-2 text-xs disabled:opacity-40">SALVAR FUNÇÃO</button>
                        <button data-cast-action="status" data-cast-uid="${esc(x.uid)}" ${own||!x.profile?'disabled':''} class="rounded border border-fashion-700 text-white px-3 py-2 text-xs disabled:opacity-40">${profile.disabled?'REATIVAR':'DESATIVAR'}</button>
                        <button data-cast-action="out" data-cast-uid="${esc(x.uid)}" ${own||!x.profile?'disabled':''} class="rounded border border-fashion-700 text-white px-3 py-2 text-xs disabled:opacity-40">${profile.out?'REINTEGRAR':'MARCAR OUT'}</button>
                        <button data-cast-action="delete" data-cast-uid="${esc(x.uid)}" ${own?'disabled':''} class="rounded border border-red-800 text-red-300 px-3 py-2 text-xs disabled:opacity-40">EXCLUIR</button>
                    </div></article>`;
            }).join('')}${!rows.length&&!pending&&!errors?'<span class="text-gray-500">Nenhum usuário encontrado para este filtro.</span>':''}${pending?'<span class="text-gray-400">Sincronizando dados…</span>':''}`;
        };
        [['inscricoes','inscricoes_designers'],['identidades','identidades'],['perfis','perfis']].forEach(([key,collection])=>{
            sub(db.collection(collection),snap=>{auditCache[key]=snap.docs;auditErrors[key]=null;renderCastAudit();},err=>{auditCache[key]=[];auditErrors[key]=err.message||String(err);renderCastAudit();});
        });
    };

    window.openAtelierHistory = async (atelierUid, atelierName) => {
        const modal = $('#atelierHistoryModal');
        const title = $('#historyModalTitle');
        const content = $('#historyModalContent');

        title.textContent = `Portfólio do Designer — ${atelierName}`;
        content.innerHTML = '<p class="col-span-full text-gray-400 py-8">Carregando looks...</p>';
        modal.classList.remove('hidden');

        const [looksSnap, evalsSnap, perfilSnap] = await Promise.all([
            db.collection('looks').where('uid', '==', atelierUid).get(),
            db.collection('avaliacoes').where('alvo', '==', atelierUid).get(),
            db.doc(`perfis/${atelierUid}`).get()
        ]);

        const looks = looksSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.t - a.t);
        const evals = evalsSnap.docs.map(d => d.data());
        const perfilData = perfilSnap.data() || {};

        if (!looks.length) {
            content.innerHTML = '<p class="col-span-full text-gray-500 py-8">Nenhum look registrado.</p>';
            return;
        }

        let bioHtml = '';
        if (perfilData.bio) {
            bioHtml = `<div class="col-span-full bg-fashion-950 p-3 rounded border border-fashion-gold/40 text-left text-xs text-gray-300 italic mb-2">
                <strong class="text-fashion-gold not-italic font-cinzel">Designer: ${esc(perfilData.ate || 'Não definida')}</strong> — "${esc(perfilData.bio)}"
            </div>`;
        }

        content.innerHTML = bioHtml + looks.map(l => {
            return `
                <div class="bg-fashion-950 p-3 rounded border border-fashion-700 space-y-2 text-left flex flex-col justify-between">
                    <div class="space-y-2">
                        <img src="${esc(l.url)}" class="w-full img-look rounded border border-fashion-700 shadow">
                        <div class="flex justify-between items-center text-[10px]">
                            <span class="font-cinzel text-fashion-gold font-bold">Rodada: ${esc(l.rodada)}</span>
                            <span class="text-gray-400 font-cinzel">${esc(l.titulo || '')}</span>
                        </div>
                    </div>
                    <p class="text-[11px] text-gray-300 italic leading-relaxed line-clamp-3">${esc(l.mem)}</p>
                    ${creativeDossier(l)}
                </div>
            `;
        }).join('');
    };

    window.closeAtelierHistoryModal = () => { $('#atelierHistoryModal').classList.add('hidden'); };
    window.closeBroadcastModal = () => { $('#broadcastModal').classList.add('hidden'); };
</script>

<script>
    (() => {
        const Q = ['“Make it work. And make it unforgettable.”', '“Designers, you have a challenge!”', '“I don\'t want to see safe. I want to see fashion.”', '“You have to take risks to stand out.”', '“One challenge can change everything.”', '“Auf Wiedersehen!”', '“This is the final countdown. Make it count.”'];
        const el = document.getElementById('quoteStrip'); let i = 0;
        const show = () => { el.style.opacity = 0; setTimeout(() => { el.textContent = Q[i++ % Q.length]; el.style.opacity = 1; }, 600); };
        show(); setInterval(show, 7000);
    })();

    (() => {
        const hero = document.getElementById('challengeHero');
        const pretty = r => String(r || '').toUpperCase();
        setInterval(() => {
            if (typeof currentUser === 'undefined' || !currentUser || !globalState || !globalState.rodada || !globalState.themeId) { hero.classList.add('hidden'); return; }
            const fase = globalState.fase === 'final' ? 'THE GRAND FINALE' : globalState.fase === 'top5' ? 'TOP 5 — THE FINAL FILTER' : 'THE CHALLENGE';
            const d = (globalState.prazo || 0) - Date.now();
            const t = !globalState.prazo ? 'WORKROOM · AGUARDANDO PRAZO' : d <= 0 ? 'TIME IS UP · THE WORKROOM IS CLOSED' : d <= 60000 ? 'THE FINAL MINUTE' : d <= 600000 ? 'THE FINAL COUNTDOWN' : d <= 3600000 ? 'ONE HOUR REMAINING' : d <= 86400000 ? 'THE FINAL DAY' : 'THE WORKROOM IS OPEN';
            hero.innerHTML = `<div class="text-[10px] tracking-[.4em] text-fashion-gold font-cinzel">${fase}</div><div class="font-cinzel text-white text-lg tracking-widest">${esc(fauRoundLabel())}</div><div class="font-mono text-xs ${d <= 0 ? 'text-red-400' : 'text-gray-300'}">${t}</div>`;
            // A faixa intermediária repetia o desafio e a fase; a central já apresenta ambos.
            hero.classList.add('hidden');
        }, 1000);

        // The winner is revealed by the host on WhatsApp. Never show an automatic
        // full-screen winner announcement merely because the ranking document changed.

    })();

    (() => {
        const card=document.getElementById('poderCard');
        let chosen=null,unsub=null,choiceKey='',last='',privateClues={};
        const render=()=>{

            if(!currentUser||!g?.rodada){card.classList.add('hidden');return;}
            const owner=g.poderUid===currentUser.uid;

                if(owner&&chosen)html+='<p class="text-fashion-gold mt-3">🔒 Escolha registrada. Aguarde a revelação da produção.</p>';

            }

        };

            if(!confirm('Confirmar esta pista? Sua escolha será definitiva e o tema continuará secreto até a produção revelar.'))return;

            catch(err){showToast('Não foi possível registrar: '+err.message);}
        };
        setInterval(()=>{
            const g=globalState,owner=currentUser&&g?.poderUid===currentUser.uid;
            const key=owner?g.rodada:'';
            if(key!==choiceKey){
                choiceKey=key;chosen=null;privateClues={};last='';if(unsub){unsub();unsub=null;}
                if(key){
                    unsub=db.doc(`escolhas/${key}`).onSnapshot(sn=>{chosen=sn.exists?sn.data().opcaoId:null;last='';},()=>{});
                    Promise.all((g.proxOpcoes||[]).map(async o=>{
                        try{const sn=await db.collection('theme_vault_private').doc(o.id).get();if(sn.exists)privateClues[o.id]=sn.data().clue||'';}catch(e){}
                    })).then(()=>{last='';render();});
                }
            }
            render();
        },1000);
    })();
</script>

<!-- UX layer: contextual help and short-lived local recovery of Workroom text only. -->
<script>
(function(){
  'use strict';
  const main=document.getElementById('mainView');
  if(!main)return;
  let lastContext='', isApplying=false;
  const getContext=()=>{
    const nav=document.querySelector('nav [aria-current="page"],nav .active');
    const title=(nav?.textContent||'').trim().slice(0,60);
    return title||document.title;
  };
  function augment(){
    if(isApplying)return;
    isApplying=true;
    try{
      // Never create help for fields that already have a visible explanation.
      const headings=[...main.querySelectorAll('h1,h2,h3')].map(x=>x.textContent.toLowerCase()).join(' ');
      const isWork=!!main.querySelector('#personalTwistSlot,.fau-atelier-identity');
      const isJudging=/judg|bancada|avaliaç|critique/.test(headings);
      const isRunway=!!main.querySelector('#runwayGroups,#runwayGrid,.fau-runway-editorial');
      const key=isWork?'work':isJudging?'judge':isRunway?'runway':'';
      const root=main.querySelector('.fau-atelier-identity,.fau-runway-editorial')||main.firstElementChild;
      if(root&&key&&!main.querySelector('[data-fau-ux-help]')){
        const detail=document.createElement('details');detail.className='fau-ux-help';detail.dataset.fauUxHelp=key;
        const summary=document.createElement('summary');summary.textContent='Como funciona esta etapa?';
        const body=document.createElement('p');body.style.marginTop='8px';
        body.textContent=key==='work'?'Leia o briefing e confira as exigências antes de enviar. Enquanto a produção não encerrar o prazo, você pode revisar sua criação. Você pode salvar textos manualmente na nuvem quando o Firebase permitir. Imagens precisam ser selecionadas novamente.':key==='judge'?'Avalie os looks pelos critérios da rodada. Confira as notas antes de concluir. As avaliações não são mostradas aos designers antes da liberação oficial.':'Explore as criações publicadas e toque nas imagens para ampliá-las. Notas e resultados privados continuam protegidos.';
        detail.append(summary,body);root.insertAdjacentElement('afterend',detail);
      }
      // Workroom: optional cross-device draft. Only text, explicit save/restore, no silent overwrites.
      if(isWork && typeof currentUser!=='undefined' && currentUser?.uid && typeof db!=='undefined'){
        const eligible=[...main.querySelectorAll('textarea')].filter(el=>el.id&&!el.disabled&&!el.readOnly&&!/password|vote|nota|score|critique|jurad|admin|secret/i.test(el.id));
        const anchor=main.querySelector('.fau-atelier-identity');
        if(anchor && eligible.length && !main.querySelector('#fauCloudDraftPanel')){
          const panel=document.createElement('section');panel.id='fauCloudDraftPanel';panel.className='rounded-xl border border-fashion-gold/40 bg-fashion-950 p-4 space-y-2';
          panel.innerHTML='<p class="text-fashion-gold text-xs font-bold tracking-widest">THE ATELIER · RASCUNHO DE TEXTO</p><p class="text-xs text-gray-300">Salve e recupere seus textos entre dispositivos. Imagens não são salvas aqui e devem ser enviadas como arquivos. Rascunho não é entrega oficial.</p><div class="flex flex-wrap gap-2"><button type="button" id="fauCloudSave" class="rounded bg-fashion-gold text-black px-4 py-2 text-xs font-bold">Salvar textos na nuvem</button><button type="button" id="fauCloudRestore" class="rounded border border-fashion-gold/60 px-4 py-2 text-xs text-fashion-gold">Consultar rascunho salvo</button></div><p id="fauCloudStatus" role="status" aria-live="polite" class="text-xs text-gray-300">O salvamento é manual.</p>';
          anchor.insertAdjacentElement('afterend',panel);
          const owner=currentUser.uid,round=String(globalState?.rodada||'preseason');
          const doc=db.collection('rascunhos_atelier').doc(owner+'_'+round);
          const MAX_DRAFT_CHARS=18000;
          const currentDraftFields=()=>Object.fromEntries(eligible.map(el=>[el.id,el.value.slice(0,5000)]));
          const status=()=>panel.querySelector('#fauCloudStatus');
          const buttons=[...panel.querySelectorAll('button')];
          const busy=async fn=>{buttons.forEach(b=>b.disabled=true);try{await fn();}catch(err){status().textContent='Não foi possível acessar o rascunho: '+(err.code==='permission-denied'?'permissão do Firebase não configurada.':'verifique a conexão e tente novamente.');}finally{buttons.forEach(b=>b.disabled=false);}};
          panel.querySelector('#fauCloudSave').onclick=()=>busy(async()=>{
            if(!navigator.onLine)throw new Error('offline');
            const fields=currentDraftFields();
            if(JSON.stringify(fields).length>MAX_DRAFT_CHARS){status().textContent='Rascunho muito longo. Reduza os textos antes de salvar.';return;}
            await doc.set({ownerUid:owner,round,fields,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
            status().textContent='✓ Textos salvos na nuvem. Isto não envia sua criação para a passarela.';
          });
          panel.querySelector('#fauCloudRestore').onclick=()=>busy(async()=>{
            const snap=await doc.get();if(!snap.exists){status().textContent='Nenhum rascunho na nuvem para esta rodada.';return;}
            const data=snap.data();if(data.ownerUid!==owner||data.round!==round||!data.fields||typeof data.fields!=='object'||Array.isArray(data.fields))throw new Error('draft owner mismatch');
            const available=eligible.filter(el=>typeof data.fields?.[el.id]==='string'&&data.fields[el.id].length<=5000);
            if(!available.length){status().textContent='Não há campos de texto compatíveis neste rascunho.';return;}
            const hasCurrent=available.some(el=>el.value.trim());
            if(hasCurrent&&!window.confirm('Restaurar os textos salvos? Isso substituirá os textos atualmente digitados nestes campos.'))return;
            available.forEach(el=>{el.value=data.fields[el.id];el.dispatchEvent(new Event('input',{bubbles:true}));});
            status().textContent='✓ '+available.length+' campo(s) restaurado(s). Revise antes de enviar.';
          });
        }
      }
      // Workroom: session-only text recovery. Never persist images, passwords, votes or jury scores.
      if(isWork){
        const textFields=[...main.querySelectorAll('textarea')].filter(el=>!el.disabled&&!el.readOnly&&el.id&&!/password|vote|nota|score|critique|jurad/i.test(el.id));
        textFields.forEach(el=>{
          if(el.dataset.fauDraftReady)return;
          el.dataset.fauDraftReady='1';
          const scope=(document.querySelector('#globalStatusBanner')?.textContent||'').trim().slice(0,100);
          const identity=(typeof currentUser!=='undefined' && currentUser?.uid)||'no-user';
          const round=(typeof globalState!=='undefined' && globalState?.rodada)||'preseason';
          const key='fau:workroom:session:'+identity+':'+round+':'+scope+':'+el.id;
          let previous='';try{previous=sessionStorage.getItem(key)||'';}catch(e){}
          if(previous&&!el.value){
            const bar=document.createElement('div');bar.className='fau-ux-save-state';
            const restore=document.createElement('button');restore.type='button';restore.textContent='↺ Recuperar texto digitado nesta sessão';restore.className='underline underline-offset-4';
            restore.addEventListener('click',()=>{el.value=previous;el.dispatchEvent(new Event('input',{bubbles:true}));bar.remove();el.focus();});
            bar.appendChild(restore);el.insertAdjacentElement('afterend',bar);
          }
          el.addEventListener('input',()=>{try{sessionStorage.setItem(key,el.value);}catch(e){}},{passive:true});
        });
      }
    }finally{isApplying=false;}
  }
  let queued=false;
  const observer=new MutationObserver(()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;augment();});});
  observer.observe(main,{childList:true,subtree:true});
  augment();
  // Explicit network state feedback; never pretend an offline submission succeeded.
  const net=document.createElement('div');net.setAttribute('role','status');net.setAttribute('aria-live','polite');
  net.style.cssText='position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:9998;max-width:90vw;padding:10px 16px;border-radius:9px;background:#40212b;color:#fff;font-size:12px;box-shadow:0 8px 24px #0008;display:none;text-align:center';
  net.textContent='Sem conexão. Não envie sua criação até a internet voltar.';document.body.appendChild(net);
  function updateNetwork(){net.style.display=navigator.onLine?'none':'block';}
  window.addEventListener('online',updateNetwork);window.addEventListener('offline',updateNetwork);updateNetwork();
})();
</script>

 }finally{busy=false;}

<script id="fau-control-room-v73">
(()=>{
  'use strict';
  const focusTarget=(id)=>{const el=document.getElementById(id);if(!el)return false;el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});return true;};
  document.addEventListener('click',event=>{
    const target=event.target.closest('[data-production-target]');
    if(target?.closest('#fauProductionDesk')){
      const id=target.dataset.productionTarget;
      if(id==='ctrlAudit'){focusTarget('ctrlAudit');document.getElementById('ctrlAudit')?.click();return;}
      if(!focusTarget(id)){const hint=document.getElementById('fauDeskStageHint');if(hint)hint.textContent='Este controle ainda não está disponível nesta etapa.';}
      return;
    }
    const stage=event.target.closest('[data-production-stage]');
    if(stage?.closest('#fauProductionDesk')){
      const id=stage.dataset.productionStage;
      const control=document.querySelector(`[data-flow-stage="${id}"]`);
      const hint=document.getElementById('fauDeskStageHint');
      if(hint)hint.textContent=control?.innerText?.trim().replace(/\s+/g,' ')||'Etapa disponível na linha de produção.';
      if(control)control.scrollIntoView({behavior:'smooth',block:'center'});
    }
  });
  let lastRoot=null,observer=null;
  const refresh=()=>{
    const desk=document.getElementById('fauProductionDesk');
    if(!desk){if(observer){observer.disconnect();observer=null;lastRoot=null;}return;}
    const root=document.getElementById('fauStatusDashboard');
    if(!root)return;
    if(root!==lastRoot){observer?.disconnect();lastRoot=root;observer=new MutationObserver(update);observer.observe(root,{childList:true,subtree:true,characterData:true});}
    update();
  };
  const update=()=>{
    const root=document.getElementById('fauStatusDashboard');
    const list=document.getElementById('fauDeskQueue');
    const counter=document.getElementById('fauDeskQueueCount');
    if(!root||!list||!counter)return;
    const cards=[...root.querySelectorAll('article')];
    if(!cards.length){list.textContent='Aguardando dados da rodada. Use Atualizar no painel de pendências.';counter.textContent='Aguardando';return;}
    const jobs=cards.map(c=>{
      const title=c.querySelector('strong')?.textContent?.trim()||'Tarefa';
      const match=c.textContent.match(/(\d+) pendentes/);
      const pending=match?Number(match[1]):null;
      return {title,pending};
    });
    const outstanding=jobs.filter(j=>j.pending!==null&&j.pending>0);
    counter.textContent=outstanding.length?`${outstanding.length} áreas com pendências`:'Nenhuma pendência identificada';
    list.replaceChildren();
    const shown=outstanding.length?outstanding:jobs.slice(0,3);
    shown.forEach(j=>{
      const b=document.createElement('button');b.type='button';b.className='w-full text-left rounded-lg border border-fashion-700 px-3 py-3 hover:border-fashion-gold focus-visible:outline focus-visible:outline-2 focus-visible:outline-fashion-gold';
      const title=document.createElement('span');title.className='block text-xs text-white';title.textContent=j.title;
      const detail=document.createElement('span');detail.className='block text-[11px] text-gray-400 mt-1';detail.textContent=j.pending===null?'Conferir detalhes':j.pending?`${j.pending} pendentes · conferir nomes`:'Concluído';
      b.append(title,detail);b.addEventListener('click',()=>focusTarget('fauStatusDashboard'));list.append(b);
    });
  };
  const watcher=new MutationObserver(()=>{const root=document.getElementById('fauStatusDashboard');if(root!==lastRoot)refresh();});
  watcher.observe(document.body,{childList:true,subtree:true});
  refresh();
})();
</script>

<script id="fau-v92-full-simulation">

(()=>{

 {name:'THE FIRST SIN',subtitle:'The Beginning of Everything',key:'first',slots:1,eliminate:false},
 {name:'AFTER EDEN',subtitle:'The Art of Evolution',key:'new',slots:1,eliminate:true},

let sim=null,overlay=null,role='admin',tab='overview',person=1,judge=0;
const labMutations=FAU_MUTATIONS;
function labShuffle(){const a=[0,1,2,3];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function labMutation(r){if(current()?.key!=='w02_new_form')return '';if(!r)return '';const chosen=r.labMutation;return `<section class="fau92-panel"><div class="fau92-kicker">WEEK 02 · THE MUTATION MACHINE</div><h4>${chosen?'YOUR FATE IS SEALED':'FOUR ENVELOPES. ONE NEW FORM.'}</h4>${chosen?`<div class="fau92-notice"><strong>ENVELOPE ${String(chosen.envelope).padStart(2,'0')} · ${escape(labMutations[chosen.index][0])}</strong><p>${escape(labMutations[chosen.index][1])}</p><p>Preserve um elemento visual da Week 01.</p></div><div class="fau92-actions"><button data-lab-reset="${r.id}">REINICIAR ENVELOPES (TESTE)</button></div>`:`<p>Escolha um envelope. O resultado é definitivo na rodada real, mas pode ser reiniciado aqui.</p><div class="fau92-envelopes">${[1,2,3,4].map(n=>`<button data-lab-envelope="${r.id}|${n}" aria-label="Abrir envelope ${n}"><span>✉</span><small>${String(n).padStart(2,'0')}</small></button>`).join('')}</div>`}</section>`;}

const escape=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=()=>{sim.seed=(Math.imul(sim.seed,1664525)+1013904223)>>>0;return sim.seed/4294967296};
const number=()=>Math.round((32+rnd()*17)*10)/10;
const getPerson=id=>sim.people.find(p=>p.id===id);
const current=()=>sim.episode;
const live=()=>sim.people.filter(p=>!p.out);
const stageName={brief:'BRIEFING',workroom:'WORKROOM',runway:'RUNWAY',jury:'JUDGING',results:'RESULTADOS',done:'ARQUIVADO'};
function newSim(){sim={seed:86342,index:0,selectedThemeId:officialThemes.find(t=>t.id==='w01_first_garment')?.id||null,iconChoice:null,iconRevealed:false,stage:'brief',history:[],people:names.map((name,i)=>({id:i+1,name,out:false,total:0,wins:0,icons:0,color:colors[i]})),episode:null};role='admin';tab='overview';person=1;judge=0;makeEpisode();draw()}
function makeEpisode(){let official=officialThemes.find(x=>x.id===sim.selectedThemeId);let theme=official?{name:official.title,subtitle:official.subtitle,key:official.id,slots:official.numSubmissoes||1,eliminate:official.elimTipo!=='none',official}:themes[sim.index];if(!theme){sim.episode=null;sim.stage='done';return}
 let participants=theme.key==='finale'?[...live()].sort((a,b)=>b.total-a.total).slice(0,3):live();
 sim.episode={key:theme.key,theme:theme.name,subtitle:theme.subtitle,official:theme.official||null,rows:participants.map(p=>({id:p.id,looks:Array.from({length:theme.slots},(_,i)=>({id:`${sim.index}-${p.id}-${i}`,title:theme.key==='finale'?['THE ORIGIN','THE REINVENTION','THE CONFRONTATION','THE LEGACY'][i]:theme.key==='supreme'?['OLD SUPREME','NEXT SUPREME'][i]:`LOOK ${String(i+1).padStart(2,'0')}`,sent:false,judges:[null,null,null]})),selected:null,labMutation:null,labOrder:labShuffle(),points:null,award:'—',icon:false,restLook:null,restVotes:[],eliminated:false})),published:false,bottom:[],eliminated:null,champion:null,iconVotes:{}};
 sim.stage='brief';tab='overview';person=participants[0]?.id||1;
}
function readyRows(){return current()?.rows||[]}
function chosenLook(r){return r.looks[(r.selected||1)-1]}
function submissionsComplete(){return readyRows().every(r=>r.looks.every(l=>l.sent))}

 if(sim.stage==='brief'){sim.stage='workroom';tab='workroom'}
 else if(sim.stage==='workroom'){submitAll();return}
 else if(sim.stage==='runway'){if(current().key==='supreme')voteSupremes();sim.stage='jury';tab='jury'}

 if(ep.key==='finale'&&sorted.length){sorted[0].award='WINNER';ep.champion=sorted[0].id}

function header(){const ep=current();return `<header class="fau92-head"><div><div class="fau92-kicker">PROJECT RUNWAY: FAU · PRODUCTION LAB</div><h2>THE TEST RUN <span>✦</span></h2><p>Prévia interativa de uma temporada fictícia. WIN = vencedor de uma rodada; WINNER = campeão da temporada. Não grava nem lê dados do Firebase.</p></div><button class="fau92-close" data-action="close" aria-label="Fechar">✕</button></header>

 <section class="fau92-panel"><h4>🎬 PRODUCTION CONTROL</h4><p>Acompanhe o ciclo de uma rodada. Você pode avançar automaticamente ou navegar pelas telas para visualizar cada perfil.</p><div class="fau92-flow">${['brief','workroom','runway','jury','results'].map(s=>`<span class="${sim.stage===s?'on':''}">${stageName[s]}</span>`).join('<b>→</b>')}</div><div class="fau92-actions"><button class="primary" data-action="next" ${!ep?'disabled':''}>${sim.stage==='brief'?'ABRIR WORKROOM':sim.stage==='workroom'?'GERAR ENTREGAS E ABRIR RUNWAY':sim.stage==='runway'?'ENCERRAR DESFILE / ABRIR JÚRI':sim.stage==='jury'?'CALCULAR E PUBLICAR RESULTADO':sim.stage==='results'?'ARQUIVAR E AVANÇAR RODADA':'TEMPORADA CONCLUÍDA'}</button><button data-action="reset">REINICIAR</button><button data-action="export">EXPORTAR JSON</button></div></section>
 <section class="fau92-panel"><h4>🗝️ THE THEME VAULT · TODOS OS TEMAS</h4><p>Selecione qualquer desafio oficial para inspecionar seu briefing, número de looks, sorteio e regras. O salto reinicia somente a rodada fictícia atual; o histórico já publicado continua no laboratório.</p><select id="fau93Theme" style="width:100%;max-width:100%;margin:10px 0"><option value="">Escolher um tema oficial…</option>${officialThemes.map(t=>`<option value="${escape(t.id)}" ${sim.selectedThemeId===t.id?'selected':''}>${escape(t.title)}</option>`).join('')}</select><div class="fau92-actions"><button data-action="jumpTheme">▶ TESTAR ESTE TEMA</button></div>${ep?.official?`<div class="fau92-notice"><strong>${escape(ep.official.code||'DESAFIO')}</strong><p>${escape(ep.official.subtitle||'')}</p><p><b>Entregas:</b> ${ep.official.numSubmissoes||1} · <b>Eliminação:</b> ${escape(ep.official.elimTipo||'none')} · <b>Sorteio:</b> ${escape(ep.official.drawType||'none')}</p><p>${escape(ep.official.mandate||'')}</p>${ep.official.extraField?`<p><b>Campo extra:</b> ${escape(ep.official.extraField.label)}</p>`:''}${ep.official.drawPool?`<p><b>Opções de sorteio:</b> ${ep.official.drawPool.map(escape).join(' · ')}</p>`:''}</div>`:''}</section><section class="fau92-panel"><h4>👑 THE FASHION ICON · ESCOLHA SECRETA</h4><p>Prévia do painel de escolha do próximo desafio. Selecione um tema, mantenha-o secreto e revele quando desejar.</p><select id="fau93IconTheme" style="width:100%;max-width:100%;margin:10px 0"><option value="">Escolha secreta do Ícone…</option>${officialThemes.map(t=>`<option value="${escape(t.id)}" ${sim.iconChoice===t.id?'selected':''}>${escape(t.title)}</option>`).join('')}</select><div class="fau92-actions"><button data-action="chooseIcon">🔒 CONFIRMAR ESCOLHA</button><button data-action="revealIcon" ${!sim.iconChoice?'disabled':''}>🎭 REVELAR TEMA</button></div><p>${sim.iconChoice?(sim.iconRevealed?'🎭 REVELADO: '+escape(officialThemes.find(t=>t.id===sim.iconChoice)?.title||''):'🔒 Escolha registrada. O tema continua secreto para os demais perfis.'):'Nenhuma escolha registrada.'}</p></section><section class="fau92-panel"><h4>👥 CAST</h4><div class="fau92-cast">${sim.people.map(p=>`<div><i style="background:${p.color}"></i><span>${escape(p.name)}</span>${pill(p.out?'OUT':'IN',p.out?'warn':'good')}</div>`).join('')}</div></section>`}
function workroom(){const ep=current();if(!ep)return empty('Temporada encerrada.');let rows=ep.rows.filter(r=>role!=='designer'||r.id===person);return `<div class="fau92-hero"><div class="fau92-kicker">THE WORKROOM · WEEK ${sim.index+1}</div><h3>${escape(ep.theme)}</h3><p>${escape(ep.subtitle)} · ${ep.key==='supreme'?'Duas Supremas por Designer':ep.key==='finale'?'Quatro editoriais por finalista':'Um editorial por Designer'}</p></div><div class="fau92-sectiontitle"><h4>DESIGNER SUBMISSIONS</h4><span>${ep.rows.reduce((n,r)=>n+r.looks.filter(l=>l.sent).length,0)} / ${ep.rows.reduce((n,r)=>n+r.looks.length,0)} looks enviados</span></div><div class="fau92-gallery">${rows.flatMap(r=>r.looks.map((l,i)=>lookCard(r,l,i))).join('')}</div>${ep.key==='w02_new_form'?(role==='designer'?labMutation(ep.rows.find(r=>r.id===person)):ep.rows.map(labMutation).join('')):''}${role==='designer'?`<div class="fau92-notice">Esta é uma prévia fictícia da Workroom. Para testar um envio real, é necessário usar uma conta de teste conectada ao Firebase.</div>`:''}${role==='admin'&&sim.stage==='workroom'?`<div class="fau92-actions"><button class="primary" data-action="submit">SIMULAR TODAS AS ENTREGAS</button></div>`:''}`}
function runway(){const ep=current();if(!ep)return empty('Nenhum desfile ativo.');if(sim.stage==='brief'||sim.stage==='workroom')return empty('O desfile ainda não foi aberto. Avance a produção para visualizar os looks.');const visible=ep.rows.flatMap(r=>ep.key==='supreme'&&r.selected?[chosenLook(r)].map((l,i)=>[r,l,r.selected-1]):r.looks.map((l,i)=>[r,l,i]));return `<div class="fau92-hero"><div class="fau92-kicker">LIGHTS. CAMERA. RUNWAY.</div><h3>${escape(ep.theme)}</h3><p>${ep.key==='supreme'&&ep.rows.some(r=>r.selected)?'A plateia escolheu uma Suprema por Designer.':'As criações da rodada estão na passarela.'}</p></div><div class="fau92-gallery">${visible.map(([r,l,i])=>lookCard(r,l,i)).join('')}</div><section class="fau92-panel"><h4>👑 ÍCONE DA MODA</h4><p>Voto popular separado do WIN dos jurados. Nesta simulação, o Ícone é sorteado na publicação do resultado.</p>${role==='audience'?`<div class="fau92-notice">Prévia do espaço da plateia. Votações reais exigem uma conta autenticada e uma rodada configurada no Firebase.</div>`:''}</section>`}
function jury(){const ep=current();if(!ep)return empty('Temporada encerrada.');if(role==='audience')return empty('As avaliações individuais são privadas.');if(sim.stage==='brief'||sim.stage==='workroom'||sim.stage==='runway')return empty('O julgamento ainda não foi aberto.');return `<div class="fau92-hero"><div class="fau92-kicker">THE JURY ROOM · PRIVATE SESSION</div><h3>THE JUDGES' VERDICT</h3><p>Três jurados avaliam os editoriais. Cada nota é independente e não deve ser exibida à plateia.</p></div><div class="fau92-jurylist">${ep.rows.map(r=>`<section class="fau92-panel"><div class="fau92-row"><h4>${escape(getPerson(r.id).name)}</h4>${ep.published?pill(r.award,r.award==='OUT'?'warn':'good'):''}</div><div class="fau92-gallery compact">${r.looks.map((l,i)=>lookCard(r,l,i,{score:true})).join('')}</div>${r.looks.map((l,i)=>`<div class="fau92-scoreline"><span>${escape(l.title)}</span>${(role==='juror'?[judge]:[0,1,2]).map(j=>`<label>${escape(judgeNames[j])}<input type="number" min="0" max="50" step="0.1" data-score="${r.id}|${i}|${j}" value="${l.judges[j]??''}" ${ep.published?'disabled':''} placeholder="0–50" /></label>`).join('')}</div>`).join('')}</section>`).join('')}</div>${!ep.published?`<div class="fau92-notice">Notas simuladas são salvas apenas na memória desta página. Ao publicar, notas não preenchidas são geradas automaticamente.</div>`:''}`}
function results(){const ep=current();if(!ep)return empty('Temporada encerrada. Confira o Fashion Archive.');if(!ep.published)return empty('Resultados ainda não publicados. O ADM precisa concluir o julgamento.');let rows=[...ep.rows].sort((a,b)=>b.points-a.points);return `<div class="fau92-hero"><div class="fau92-kicker">THE FINAL VERDICT</div><h3>ONE DAY YOU'RE IN...</h3><p>${escape(ep.theme)} · Resultados oficiais fictícios</p></div><div class="fau92-leaderboard">${rows.map((r,i)=>`<div><b>${String(i+1).padStart(2,'0')}</b><span>${escape(getPerson(r.id).name)} ${r.icon?'✦':''}</span><strong>${escape(r.award)}</strong>${role==='admin'||role==='juror'?`<small>${r.points.toFixed(1)}</small>`:''}</div>`).join('')}</div><section class="fau92-panel"><h4>🏆 EPISODE HONORS</h4><p>WIN: <b>${escape(getPerson(rows.find(r=>r.award==='WIN'||r.award==='CHAMPION')?.id)?.name||'—')}</b></p><p>Ícone da Moda: <b>${escape(getPerson(rows.find(r=>r.icon)?.id)?.name||'—')}</b></p>${ep.eliminated?`<p>OUT: <b>${escape(getPerson(ep.eliminated).name)}</b></p>`:''}${ep.key==='rest'?`<p>🕯️ O Bottom 3 apresentou um segundo look. Os votos especiais não entraram no acumulado.</p>`:''}${ep.key==='finale'?`<p>🏆 A final foi julgada separadamente do acumulado.</p>`:''}</section>`}
function archive(){let history=[...sim.history,...(current()?.published?[current()]:[])];return `<div class="fau92-hero"><div class="fau92-kicker">THE FASHION ARCHIVE</div><h3>EVERY LOOK TELLS A STORY.</h3><p>Runway History · Track Record · Hall of Fame</p></div><div class="fau92-sectiontitle"><h4>SEASON TRACK RECORD</h4><span>WIN e Ícone são títulos distintos</span></div><div class="fau92-tablewrap"><table><thead><tr><th>DESIGNER</th>${history.map((_,i)=>`<th>W${String(i+1).padStart(2,'0')}</th>`).join('')}<th>WIN</th><th>ÍCONE</th><th>STATUS</th></tr></thead><tbody>${sim.people.map(p=>`<tr><td>${escape(p.name)}</td>${history.map(h=>`<td>${escape(h.rows.find(r=>r.id===p.id)?.award||'—')}</td>`).join('')}<td>${p.wins}</td><td>${p.icons}</td><td>${p.out?'OUT':'IN'}</td></tr>`).join('')}</tbody></table></div><div class="fau92-sectiontitle"><h4>RUNWAY HISTORY</h4><span>${history.length} episódios</span></div>${history.length?history.map((h,i)=>`<section class="fau92-panel"><div class="fau92-row"><h4>WEEK ${String(i+1).padStart(2,'0')} · ${escape(h.theme)}</h4>${pill('PUBLISHED','good')}</div><p>${h.rows.length} Designers · ${h.rows.reduce((n,r)=>n+r.looks.length,0)} looks · ${h.eliminated?'Eliminado: '+escape(getPerson(h.eliminated).name):'Sem eliminação'}</p><div class="fau92-gallery compact">${h.rows.slice(0,4).map(r=>lookCard(r,r.looks[0])).join('')}</div></section>`).join(''):'<div class="fau92-notice">O arquivo será preenchido após a publicação dos resultados.</div>'}<section class="fau92-panel"><h4>🏅 HALL OF FAME</h4><p>WIN: ${sim.people.filter(p=>p.wins).sort((a,b)=>b.wins-a.wins).map(p=>`${escape(p.name)} (${p.wins})`).join(' · ')||'—'}</p><p>Ícone da Moda: ${sim.people.filter(p=>p.icons).sort((a,b)=>b.icons-a.icons).map(p=>`${escape(p.name)} (${p.icons})`).join(' · ')||'—'}</p></section>`}
function empty(msg){return `<div class="fau92-empty"><h3>NOT YET ON THE RUNWAY</h3><p>${escape(msg)}</p></div>`}
function vault(){return `<div class="fau92-hero"><div class="fau92-kicker">THE THEME VAULT</div><h3>EVERY CHALLENGE. EVERY TWIST.</h3><p>Catálogo dos ${officialThemes.length} temas oficiais cadastrados nesta versão.</p></div><div class="fau92-gallery">${officialThemes.map(t=>`<section class="fau92-panel"><h4>${escape(t.title)}</h4><p>${escape(t.subtitle||'')}</p><p>Looks: ${t.numSubmissoes||1} · ${escape(t.elimTipo||'none')} · ${escape(t.drawType||'none')}</p>${role==='admin'?`<button data-jump="${escape(t.id)}">▶ SIMULAR</button>`:''}</section>`).join('')}</div>`}
function draw(){if(!sim)newSim();if(!overlay){overlay=document.createElement('div');overlay.id='fau92Overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','Simulador de temporada');document.body.appendChild(overlay)}if(role==='audience'&&!['runway','results','archive'].includes(tab))tab='runway';if(role==='designer'&&tab==='jury')tab='workroom';if(role==='juror'&&tab==='workroom')tab='jury';overlay.innerHTML=`<div class="fau92-shell">${header()}<main class="fau92-main">${({overview,workroom,runway,jury,results,archive,vault})[tab]()}</main><footer class="fau92-foot"><span>SIMULATION MODE · NÃO CONECTADO AO FIRESTORE</span>${role==='admin'&&tab!=='overview'?`<button data-tab="overview">← CONTROL ROOM</button>`:''}</footer></div>`;overlay.hidden=false;wire()}
function wire(){overlay.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draw()});overlay.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{let a=b.dataset.action;if(a==='close')overlay.hidden=true;if(a==='jumpTheme'){let id=overlay.querySelector('#fau93Theme')?.value;if(!id){alert('Escolha um tema.');return}sim.selectedThemeId=id;makeEpisode();draw();return}if(a==='chooseIcon'){let id=overlay.querySelector('#fau93IconTheme')?.value;if(!id){alert('Selecione um tema para o Ícone.');return}sim.iconChoice=id;sim.iconRevealed=false;draw();return}if(a==='revealIcon'){sim.iconRevealed=true;draw();return}if(a==='next')advance();if(a==='submit')submitAll();if(a==='reset'&&confirm('Reiniciar a temporada de teste?'))newSim();if(a==='export'){let blob=new Blob([JSON.stringify({simulation:true,generatedAt:new Date().toISOString(),...sim},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fau-full-test-run.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});overlay.querySelector('#fau92Role').onchange=e=>{role=e.target.value;tab=role==='audience'?'runway':role==='juror'?'jury':role==='designer'?'workroom':'overview';draw()};let p=overlay.querySelector('#fau92Person');if(p)p.onchange=e=>{person=Number(e.target.value);draw()};let j=overlay.querySelector('#fau92Judge');if(j)j.onchange=e=>{judge=Number(e.target.value);draw()};overlay.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{sim.selectedThemeId=b.dataset.jump;makeEpisode();tab='overview';draw()});overlay.querySelectorAll('[data-lab-envelope]').forEach(b=>b.onclick=()=>{let [id,envelope]=b.dataset.labEnvelope.split('|').map(Number);let r=current()?.rows.find(x=>x.id===id);if(!r||r.labMutation)return;r.labMutation={envelope,index:r.labOrder[envelope-1]};draw()});overlay.querySelectorAll('[data-lab-reset]').forEach(b=>b.onclick=()=>{let r=current()?.rows.find(x=>x.id===Number(b.dataset.labReset));if(!r)return;r.labMutation=null;r.labOrder=labShuffle();draw()});overlay.querySelectorAll('[data-score]').forEach(i=>i.onchange=e=>{let [id,slot,j]=e.target.dataset.score.split('|').map(Number);let v=e.target.value.trim();let n=v===''?null:Number(v);if(n!==null&&(!Number.isFinite(n)||n<0||n>50)){alert('A nota deve estar entre 0 e 50.');draw();return}let r=current()?.rows.find(r=>r.id===id);if(r&&!current().published)r.looks[slot].judges[j]=n})}
function install(){const desk=document.querySelector('#fauProductionDesk');if(!desk||document.getElementById('fau92Launch'))return;if(typeof currentUser==='undefined'||!currentUser||currentUser.role!=='admin')return;let section=document.createElement('section');section.id='fau92Launch';section.className='rounded-xl border border-fashion-gold/50 bg-fashion-900 p-5 space-y-3';section.innerHTML='<p class="text-[10px] tracking-[.3em] text-fashion-gold">🧪 PRODUCTION LAB · ADMIN ONLY</p><h3 class="font-cinzel text-xl text-white">THE FULL TEST RUN</h3><p class="text-xs text-gray-300">Prévia de uma temporada completa: Workroom, Runway, Jury Room, resultados, Fashion Archive e visualização por perfil. Nenhuma gravação no Firebase.</p><button type="button" id="fau92Open" class="rounded bg-fashion-gold text-black px-4 py-3 text-xs font-bold">▶ ABRIR SIMULAÇÃO COMPLETA</button>';desk.after(section);section.querySelector('#fau92Open').onclick=()=>{if(!sim)newSim();else draw()}}

<script id="fau-jury-photo-viewer-fix">
(()=>{

function open(img){close();previousFocus=img;dialog=document.createElement('div');dialog.className='fau-jury-photo-dialog';dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.setAttribute('aria-label','Fotografia da criação ampliada');dialog.innerHTML='<div class="fau-jury-photo-panel"><div class="fau-jury-photo-head"><span>PROJECT RUNWAY: FAU · JURY VIEW</span><button type="button" aria-label="Fechar fotografia">✕ FECHAR</button></div><img alt="Fotografia da criação ampliada"></div>';const photo=dialog.querySelector('img');photo.src=img.currentSrc||img.src;photo.alt=img.alt||'Look para avaliação';dialog.querySelector('button').onclick=close;dialog.addEventListener('click',e=>{if(e.target===dialog)close();});document.body.appendChild(dialog);document.addEventListener('keydown',keys);dialog.querySelector('button').focus();}
document.addEventListener('click',e=>{const img=e.target.closest?.('#juryCardsContainer img.img-look');if(!img)return;open(img);});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const img=e.target.closest?.('#juryCardsContainer img.img-look');if(!img)return;e.preventDefault();open(img);});
})();

<script id="fau-image-consistency-script">
(()=>{
  const exclusions='button,a,label,[role="button"],#fauVaultViewer,#fauV83Premiere,.fau-runway-viewer,.fau-vault-viewer,[id*="lightbox"],[id*="Lightbox"]';
  const isEligible=img=>{
    if(!img||!img.src||img.closest(exclusions))return false;
    if(img.id==='fauUploadPreview'||img.id==='fauEditPreview'||img.id==='fauDemoImagePreview')return false;
    if(img.closest('#runwayGrid,#runwayGroups,#fauVaultGrid,#fauVaultViewer,#fauUniversalImageViewer'))return false;
    if(img.matches('[data-no-zoom]'))return false;
    return !!img.closest('main,#main-content,#app,[id="view"],.fau-archive-card,.fau-atelier-identity') &&
      (img.classList.contains('img-look')||img.classList.contains('fau-archive-img')||img.closest('.fau-archive-card'));
  };
  const viewer=document.createElement('div');
  viewer.id='fauUniversalImageViewer';viewer.hidden=true;
  viewer.setAttribute('role','dialog');viewer.setAttribute('aria-modal','true');viewer.setAttribute('aria-label','Fotografia ampliada');
  viewer.innerHTML='<div class="fau-zoom-top"><span>PROJECT RUNWAY: FAU · EDITORIAL</span><button type="button" id="fauUniversalImageClose">FECHAR ×</button></div><img alt=""><p></p>';
  document.body.appendChild(viewer);
  const photo=viewer.querySelector('img'),caption=viewer.querySelector('p'),closeButton=viewer.querySelector('button');
  let lastFocus=null,oldOverflow='';
  const close=()=>{if(viewer.hidden)return;viewer.hidden=true;document.body.style.overflow=oldOverflow;photo.removeAttribute('src');lastFocus?.focus?.();};
  const open=img=>{
    lastFocus=document.activeElement;oldOverflow=document.body.style.overflow;
    photo.src=img.currentSrc||img.src;photo.alt=img.alt||'Editorial ampliado';
    caption.textContent=img.alt||'Editorial de moda';
    viewer.hidden=false;document.body.style.overflow='hidden';closeButton.focus();
  };
  closeButton.addEventListener('click',close);
  viewer.addEventListener('click',e=>{if(e.target===viewer)close();});
  document.addEventListener('keydown',e=>{
    if(viewer.hidden)return;
    if(e.key==='Escape'){e.preventDefault();close();}
    if(e.key==='Tab'){e.preventDefault();closeButton.focus();}
  });
  document.addEventListener('click',e=>{
    const img=e.target.closest?.('img');
    if(isEligible(img)){e.preventDefault();open(img);}
  });
  document.addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==' ')return;
    if(isEligible(e.target)){e.preventDefault();open(e.target);}
  });
  const observer=new MutationObserver(()=>{
    document.querySelectorAll('img.img-look,img.fau-archive-img').forEach(img=>{
      if(isEligible(img)&&!img.classList.contains('fau-photo-zoom')){
        img.classList.add('fau-photo-zoom');img.setAttribute('tabindex','0');
        img.setAttribute('role','button');img.setAttribute('title','Ampliar fotografia');
      }
    });
  });
  observer.observe(document.body,{subtree:true,childList:true});
})();
</script>

<script id="fau-runway-collection-v2">
(()=>{
 const enhance=()=>{
  const root=document.getElementById('runwayGrid');if(!root)return;
  for(const card of root.querySelectorAll(':scope > .bg-fashion-900')){
   if(card.classList.contains('fau-collection-card'))continue;
   const content=card.querySelector(':scope > .space-y-2');
   const img=content?.querySelector('img.img-look');if(!content||!img)continue;
   card.classList.add('fau-collection-card');
   const name=content.querySelector(':scope > .flex');if(name)name.classList.add('fau-collection-name');
   const originalTitle=content.querySelector(':scope > .font-cinzel.text-fashion-gold.font-bold');
   const originalConcept=content.querySelector(':scope > p.italic');
   const photo=document.createElement('div');photo.className='fau-collection-photo';
   img.parentNode.insertBefore(photo,img);photo.appendChild(img);
   const copy=document.createElement('div');copy.className='fau-collection-copy';
   const title=document.createElement('h3');title.className='fau-collection-title';title.textContent=originalTitle?.textContent?.trim()||'Editorial';
   const excerpt=document.createElement('p');excerpt.className='fau-collection-excerpt';excerpt.textContent=originalConcept?.textContent?.trim()||'';
   const details=document.createElement('details');details.className='fau-collection-details';
   const summary=document.createElement('summary');summary.textContent='CONCEITO, REAÇÕES E COMENTÁRIOS';
   const body=document.createElement('div');body.className='fau-collection-detailbody';
   for(const child of [...content.children])if(child!==name&&child!==photo)body.appendChild(child);
   for(const child of [...card.children])if(child!==content)body.appendChild(child);
   details.append(summary,body);
   if(name)copy.append(name);copy.append(title);if(excerpt.textContent)copy.append(excerpt);copy.append(details);
   // Production sharing stays visible even when the editorial details are collapsed.
   const share=details.querySelector('[data-fau-whatsapp]');
   if(share){share.classList.add('fau-gallery-share-visible');content.append(share);}

   content.append(copy);
   img.setAttribute('aria-label','Ampliar fotografia e ler o editorial completo');
   img.setAttribute('title','Ampliar fotografia');
  }
 };
 let pending=false;
 const observer=new MutationObserver(()=>{if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;enhance()})});
 const main=document.getElementById('mainView');if(main)observer.observe(main,{childList:true,subtree:true});
 enhance();
})();
</script>

<script id="fau-runway-two-column-gallery">
(()=>{
 const enhance=()=>{
  const root=document.getElementById('runwayGrid');if(!root)return;

   if(card.querySelector('.fau-gallery-view-photo'))return;

 };

 enhance();
})();

<script id="fau-unified-operations-bindings">
 document.addEventListener('click',function(event){
   const trigger=event.target.closest('[data-fau-command]');if(!trigger)return;
   const id=trigger.getAttribute('data-fau-command');const target=document.getElementById(id);
   const msg=document.getElementById('fauCommandMessage');
   if(!target){if(msg)msg.textContent='Este controle não está disponível nesta etapa. Consulte os controles específicos da rodada abaixo.';return;}
   if(target.matches('button')){
     if(id==='fauDeskLoad'||id==='fauDeskPublish'){const tab=document.querySelector('#fauDirectorTabs button[data-hq-tab=\"episode\"]');if(tab)tab.click();const section=document.getElementById('fauResultsDesk');if(section){section.scrollIntoView({behavior:'smooth',block:'start'});}if(id==='fauDeskLoad')target.click();else {section?.scrollIntoView({behavior:'smooth',block:'start'});if(msg)msg.textContent='Confirme a publicação na seção oficial, após anunciar no WhatsApp.';}return;}
     if(target.disabled){if(msg)msg.textContent='Controle indisponível nesta etapa.';return;}target.click();if(msg)msg.textContent='Ação solicitada. Confira o estado atualizado antes de prosseguir.';}
   else{target.scrollIntoView({behavior:'smooth',block:'center'});if(msg)msg.textContent='Seção de produção localizada abaixo.';}
 });
</script>
