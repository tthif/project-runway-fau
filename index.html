        const tied=results.filter(r=>!r.slot);
        if(!tied.length) return results.map(r=>({...r,decidedBy:'majority'}));
        const [votes,standings,icons,winVotes]=await Promise.all([
            supremeVotes(),computeSeasonStandings(),tallyVotes('veto'),Promise.resolve(null)
        ]);
        const iconEntries=Object.entries(icons).filter(([,n])=>n>0);

        if(iconEntries.length){
            const max=Math.max(...iconEntries.map(([,n])=>n));
            const contenders=iconEntries.filter(([,n])=>n===max).map(([uid])=>uid);
            if(contenders.length===1) iconUid=contenders[0];
            else {
                const ranked=contenders.map(uid=>standings.find(x=>x.uid===uid));
                if(ranked.every(Boolean)){
                    ranked.sort((a,b)=>b.rd-a.rd||b.tot-a.tot);

    const compressImageToBase64 = file => new Promise((resolve, reject) => {
        if (!file || !['image/jpeg','image/png','image/webp'].includes(file.type)) return reject(new Error('Escolha uma imagem JPG, PNG ou WebP do dispositivo.'));
        if (file.size > 40 * 1024 * 1024) return reject(new Error('A imagem excede 40 MB.'));
        // O Firestore guarda no máximo 1 MiB por documento. Se a foto couber, vai EXATAMENTE como foi enviada;
        // se não couber, mantém a maior resolução e qualidade que couberem.
        const MAX_B64 = 950000;
        const reader = new FileReader();
        reader.onload = e => {
            const original = e.target.result;
            if (original.length <= MAX_B64) return resolve(original);
            const img = new Image();
            img.onload = () => {
                for (const scale of [1, 0.85, 0.7, 0.6, 0.5, 0.42, 0.35, 0.3]) {
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.max(1, Math.round(img.width * scale));
                    canvas.height = Math.max(1, Math.round(img.height * scale));
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    for (const q of [0.92, 0.85, 0.78]) {
                        const result = canvas.toDataURL('image/jpeg', q);
                        if (result.length <= MAX_B64) return resolve(result);
                    }
                }
                reject(new Error('Não foi possível ajustar esta imagem. Tente outra foto.'));
            };
            img.onerror = reject;
            img.src = original;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });

        const shell = $('#fauWorkroomClock');
        const status = $('#fauClockStatus');
        const direction = $('#fauClockDirection');
        const fill = $('#fauClockProgress');
        const deadline = Number(globalState.prazo) || 0;
        const remaining = deadline - now();
        let phase, label, cue;
        if (!deadline) {phase='unset';label='Aguardando prazo oficial';cue='The workroom will open soon.';clock.textContent='--:--:--';}
        else if (remaining <= 0) {phase='closed';label='TIME IS UP · WORKROOM CLOSED';cue='Hands off. It’s runway time.';clock.textContent='00:00:00';}
        else {
            const sec = Math.max(0, Math.ceil(remaining/1000));
            const h = Math.floor(sec/3600),m=Math.floor(sec%3600/60),ss=sec%60;
            clock.textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
            if(sec<=60){phase='last';label='THE FINAL MINUTE';cue='Designers, one minute remaining!';}
            else if(sec<=600){phase='critical';label='THE FINAL COUNTDOWN';cue='Designers, ten minutes!';}
            else if(sec<=3600){phase='urgent';label='ONE HOUR REMAINING';cue='Final adjustments. No time to waste.';}
            else if(sec<=86400){phase='day';label='THE FINAL DAY';cue='The runway is getting closer.';}
            else {phase='open';label='THE WORKROOM IS OPEN';cue='Your vision. Your rules. Your time.';}
        }
        if(shell){shell.dataset.phase=phase;}
        if(status)status.textContent=label;
        if(direction)direction.textContent=cue;
        if(fill){const elapsed = !deadline ? 0 : remaining<=0 ? 100 : remaining<=600 ? 97 : remaining<=3600 ? 90 : remaining<=86400 ? 75 : 30;fill.style.width=elapsed+'%';}

                  <p class="text-gray-400 text-[10px] tracking-widest">THE FRONT ROW</p>
                  <button type="button" id="fauAudienceEntry" class="w-full border border-fashion-700 rounded-lg px-4 py-3 text-xs tracking-widest text-gray-200 hover:border-fashion-gold disabled:opacity-60">ENTRAR COMO PLATEIA</button>
                  <p id="fauAudienceError" class="hidden text-xs text-red-200" role="alert"></p>
                </div>
              </div>
            </div>
          </section>
        `);
        const showError = message => { const el=$('#loginError'); if(el){el.textContent=message;el.classList.remove('hidden');} else showToast(message); };
        $('#fauOpenRegistration').onclick=()=>showDesignerRegistration();
        // A inscrição é sempre a primeira opção, sem consultar configurações do ADM.
        $('#fauRegistrationEntry').classList.remove('hidden');
        $('#fauOpenRegistration').disabled=false;
        $('#fauEnrollmentStatus').textContent='Crie sua conta, conheça o manual e garanta sua vaga.';
        $('#fauExistingLogin').open=false;
        $('#fauGoogleLogin').onclick=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());}catch(ex){showError('Não foi possível entrar com Google: '+(ex.message||'tente novamente'));}};
        $('#fauAudienceEntry').onclick=async()=>{
            const btn=$('#fauAudienceEntry'),error=$('#fauAudienceError');
            btn.disabled=true;btn.textContent='ABRINDO A PRIMEIRA FILA…';error.classList.add('hidden');
            try{await auth.signInAnonymously();}
            catch(err){console.error('Audience entry:',err);error.textContent=err?.code==='auth/operation-not-allowed'?'A entrada da plateia precisa ser habilitada no Firebase Authentication (método Anônimo).':'Não foi possível abrir a plateia. Verifique sua conexão ou tente novamente.';error.classList.remove('hidden');btn.disabled=false;btn.textContent='ENTRAR COMO PLATEIA';}
        };
        $('#toggleLoginPass').onclick = () => { const input=$('#loginPass'); const show=input.type==='password'; input.type=show?'text':'password'; $('#toggleLoginPass').setAttribute('aria-pressed',String(show)); $('#toggleLoginPass').setAttribute('aria-label',show?'Ocultar senha':'Mostrar senha'); $('#toggleLoginPass').innerHTML=`<i class="fa-solid fa-eye${show?'-slash':''}" aria-hidden="true"></i>`; };
        $('#fauLoginForm').onsubmit = async event => {
            event.preventDefault();
            const name=$('#loginName').value.trim(),pass=$('#loginPass').value;
            if(!name||!pass){showError('Preencha usuário e senha para entrar.');(!name?$('#loginName'):$('#loginPass')).focus();return;}
            const button=$('#btnLogin');button.disabled=true;button.innerHTML='<i class="fa-solid fa-circle-notch fa-spin mr-2" aria-hidden="true"></i> OPENING THE DOORS…';
            $('#loginError').classList.add('hidden');
            try { await auth.signInWithEmailAndPassword(formatEmail(name),pass); }
            catch(err) { showError(err?.code==='auth/network-request-failed'?'Sem conexão. Verifique sua internet e tente novamente.':'Não foi possível entrar. Confira seu usuário e sua senha.');button.disabled=false;button.innerHTML='ENTER THE RUNWAY <i class="fa-solid fa-arrow-right ml-2" aria-hidden="true"></i>'; }
        };
    };

    const initUserSession = async user => {
        unsubsGlobal.forEach(u => u());
        unsubsGlobal = [];
        unsubsTab.forEach(u => u());
        unsubsTab = [];
        $('#navContainer').innerHTML = '';

        if (!user) {
            currentUser = null;
            $('#userHeaderSlot').innerHTML = '';
            return showLogin();
        }

        // Spectators use anonymous authentication and have no registered profile.
        // They must receive only public data via Firestore Security Rules.
        let profileData={};
        if(user.isAnonymous){isAdmin=false;profileData={role:'plateia',ate:'Plateia',username:'spectator'};}
        else {
            const adminCheck=await db.doc(`admins/${user.uid}`).get();
            const adminByEmail=user.email?await db.doc(`admins/${user.email}`).get():{exists:false};
            isAdmin=adminCheck.exists||adminByEmail.exists;
            const profileSnap=await db.doc(`perfis/${user.uid}`).get();
            profileData=profileSnap.data()||{};
            if(!profileSnap.exists&&!isAdmin){
                const draft=sessionStorage.getItem('fauRegistrationDraft');
                if(draft && user.providerData?.some(p=>p.providerId==='password')){
                    try { const d=JSON.parse(draft);const enrollment=await db.doc(`inscricoes_designers/${user.uid}`).get();if(enrollment.exists){await fauProvisionDesigner(user,enrollment.data());sessionStorage.removeItem('fauRegistrationDraft');showRegistrationReceipt(user,true);return;}await db.doc(`inscricoes_designers/${user.uid}`).set({real:d.real,designer:d.designer,username:d.username,email:user.email,uid:user.uid,status:'ativo',createdAt:firebase.firestore.FieldValue.serverTimestamp()});await fauProvisionDesigner(user,d);sessionStorage.removeItem('fauRegistrationDraft');showRegistrationReceipt(user,false);return; }catch(ex){console.warn('Registration completion:',ex);}
                }
                const enrollment=await db.doc(`inscricoes_designers/${user.uid}`).get();
                if(enrollment.exists){
                    try {
                        profileData=await fauProvisionDesigner(user,enrollment.data());
                        // Perfil recuperado: segue o login normalmente como Designer.
                    } catch(ex) {
                        console.error('Falha ao ativar perfil Designer:',ex);
                        showToast('Sua inscrição existe, mas o perfil não pôde ser criado. Confira as regras do Firestore.');
                        await auth.signOut();return showLogin();
                    }
                } else if(user.providerData?.some(p=>p.providerId==='google.com')&&sessionStorage.getItem('fauGoogleRegistration')==='1'){
                    sessionStorage.removeItem('fauGoogleRegistration');
                    if(fauCanEnroll(await fauEnrollmentState())){await showDesignerRegistration(user);return;}
                }
                if(!enrollment.exists){
                    await auth.signOut();showToast('Acesso restrito a Designers e Jurados cadastrados.');return showLogin();
                }
            }
        }

        if (profileData.disabled && !isAdmin) {
            await auth.signOut();
            showToast('Acesso desativado pela direção.');
            return showLogin();
        }

        currentUser = {
            uid: user.uid,
            role: 'plateia',
            ate: 'Público',
            ...profileData
        };

        if (isAdmin) {
            currentUser.role = 'admin';
            currentUser.ate = profileData.ate || 'The Control Room (Admin & Júri)';
        }

        $('#userHeaderSlot').innerHTML = `
            <span class="text-fashion-gold font-medium font-cinzel">${esc(currentUser.ate)}</span>
            <span class="text-[10px] bg-fashion-800 text-white px-2 py-0.5 rounded border border-fashion-700 uppercase font-semibold" aria-label="Seu perfil: ${currentUser.role}">${currentUser.role === 'estilista' ? 'DESIGNER' : currentUser.role === 'jurado' ? 'JURADO' : currentUser.role === 'plateia' ? 'PLATEIA' : 'PRODUÇÃO'}${isAdmin ? ' · JÚRI' : ''}</span>
            ${!user.isAnonymous && !user.providerData?.some(p=>p.providerId==='google.com')?'<button id="fauLinkGoogle" class="text-[10px] text-fashion-gold border border-fashion-gold/40 rounded px-2 py-1" title="Usar Google nesta mesma conta">VINCULAR GOOGLE</button>':''}
            <button onclick="auth.signOut()" class="text-gray-400 hover:text-white transition ml-2" title="Sair">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </button>
        `;

        $('#fauLinkGoogle')?.addEventListener('click',async()=>{
            const btn=$('#fauLinkGoogle');btn.disabled=true;
            try{
                const before=auth.currentUser.uid;
                const result=await auth.currentUser.linkWithPopup(new firebase.auth.GoogleAuthProvider());
                if(result.user.uid!==before)throw new Error('A conta mudou inesperadamente.');
                showToast('Google vinculado! Os dois métodos agora usam o mesmo perfil.');
                btn.remove();
            }catch(ex){
                console.error('Vincular Google:',ex);
                showToast(ex.code==='auth/credential-already-in-use'||ex.code==='auth/email-already-in-use'?'Este Google já está vinculado a outra conta. Não é seguro juntar os perfis automaticamente; procure a produção.':'Não foi possível vincular o Google: '+(ex.message||ex.code));
                btn.disabled=false;
            }
        });
        unsubsGlobal.push(db.doc('config/estado').onSnapshot(snap => {
            globalState = snap.data() || {};
            updateGlobalBanner();
            navigate(activeTab);
        }));
    };

    const updateGlobalBanner = () => {
        const b = $('#globalStatusBanner');
        let bannerMsg = '';

        if (!globalState.rodada || !globalState.themeId) { b.classList.add('hidden'); b.innerHTML=''; return; }
        const flow=flowHint(currentUser?.role||'plateia');
        bannerMsg += `<span class="text-fashion-gold text-[10px] uppercase tracking-wider">${esc(flow.stage.icon+' '+flow.stage.title)}</span> <span class="text-gray-300 text-[10px]">${esc(flow.tip)}</span> `;
        if (globalState.elimTipo === 'none' || globalState.naoEliminatoria) {
            bannerMsg += `<span class="bg-blue-900/40 text-blue-300 border border-blue-600 px-2 py-0.5 rounded ml-2 font-mono uppercase font-bold">✨ RODADA NÃO ELIMINATÓRIA</span> `;
        } else if (globalState.elimDupla || globalState.elimTipo === 'double') {
            bannerMsg += `<span class="bg-fashion-red/20 text-red-400 px-2 py-0.5 rounded ml-2 font-mono uppercase font-bold">⚠️ ELIMINAÇÃO DUPLA (2 OUT)</span> `;
        }

        if ((globalState.numSubmissoes || 1) > 1 && globalState.fase !== 'final') {
            bannerMsg += `<span class="bg-fashion-gold/20 text-fashion-gold border border-fashion-gold/40 px-2 py-0.5 rounded ml-2 font-mono uppercase font-bold">📸 ${globalState.numSubmissoes} FOTOS NESTA RODADA</span> `;
        }
        if (globalState.regras) {
            bannerMsg += `<div class="mt-2 text-fashion-sand"><span class="text-fashion-gold font-cinzel uppercase tracking-widest">Regras desta rodada:</span> ${esc(globalState.regras)}</div>`;
        }

        if (bannerMsg) {
            b.innerHTML = bannerMsg;
            b.classList.remove('hidden');
        } else {
            b.classList.add('hidden');
        }
    };

    // SEASON FLOW — um estado compartilhado para orientar todas as experiências.
    // Etapas não publicadas nunca são apresentadas como eventos concluídos.
    const getSeasonFlow = () => {
        const g = globalState || {};
        const configured = !!(g.rodada && g.themeId);
        const deadline = Number(g.prazo) || 0;
        const submissionsOpen = configured && deadline > now();
        const runwayOpen = configured && !!g.liberado;
        const ballotOpen = configured && !!g.urna;
        const rankingVisible = configured && !!g.rankingLiberado;
        const phase = !configured ? 'preseason' : rankingVisible && !submissionsOpen && !ballotOpen ? 'intermission' : submissionsOpen ? 'workroom' : !runwayOpen ? 'backstage' : ballotOpen ? 'voting' : rankingVisible ? 'results' : 'runway';
        const labels = {preseason:'PRÉ-ESTREIA',workroom:'THE WORKROOM',backstage:'BACKSTAGE · AGUARDANDO ESTREIA',runway:'THE RUNWAY',voting:'THE VOTING ROOM',results:'THE RESULTS SHOW',intermission:'BETWEEN THE RUNWAYS'};
        return {configured,deadline,submissionsOpen,runwayOpen,ballotOpen,rankingVisible,phase,label:labels[phase]};
    };
    const getAvailableTabs = () => {
        const role=currentUser?.role;
        const flow=getSeasonFlow();
        let tabs=[...(ABAS_POR_PERFIL[role] || ['runway','conf','manual'])];
        if(role==='estilista') {
            if(currentUser.out) return ['runway','conf','legado','pistas','manual'];
            if(!hasMaisonIdentity() || !flow.configured) return ['work','legado','pistas','manual'];
            if(!flow.runwayOpen) tabs=tabs.filter(t=>t!=='runway');
            if(!flow.ballotOpen) tabs=tabs.filter(t=>t!=='tribunal');
            if(!flow.rankingVisible && !flow.ballotOpen) tabs=tabs.filter(t=>t!=='berlinda');
        } else if(role==='plateia') {
            if(!flow.runwayOpen) tabs=tabs.filter(t=>t!=='runway');
        } else if(role==='jurado') {
            if(!flow.runwayOpen) tabs=tabs.filter(t=>t!=='runway');
        }
        return tabs;
    };
    const navigate = tabKey => {
        // Nunca renderizar abas ou conteúdo de qualquer perfil antes do login.
        // A entrada da plateia só acontece por autenticação anônima explícita.
        if (!auth.currentUser || !currentUser || auth.currentUser.uid !== currentUser.uid) {
            showLogin();
            return;
        }
        const allowedTabs = getAvailableTabs();
        activeTab = allowedTabs.includes(tabKey) ? tabKey : allowedTabs[0];
        unsubsTab.forEach(u => u());
        unsubsTab = [];

        $('#navContainer').innerHTML = allowedTabs.map(t => `
            <button type="button" onclick="navigate('${t}')" ${t===activeTab?'aria-current="page"':''} class="px-3 py-2 border-b-2 transition ${t === activeTab ? 'border-fashion-gold text-fashion-gold font-bold' : 'border-transparent text-gray-300 hover:text-white'}">
                ${ROTULOS_ABAS[t]}
            </button>
        `).join('');

        VIEWS[activeTab]();
        renderAfterShow();
    };

    // Apenas o After Show entre rodadas, sem o guia de experiência.
    const renderAfterShow = () => {
        if (!auth.currentUser || !currentUser || auth.currentUser.uid !== currentUser.uid) return;
        document.querySelector('[aria-label="Intervalo entre desafios"]')?.remove();
        const main = document.getElementById('mainView');
        if (!main || !currentUser) return;
        const role = currentUser.role;
        const flow = getSeasonFlow();
        const intermission = flow.phase === 'intermission';
        document.querySelector('[aria-label="Intervalo entre desafios"]')?.remove();
        if(intermission){
          const inter=document.createElement('section');
          inter.className='max-w-6xl mx-auto mb-6 rounded-2xl border border-fashion-gold/40 bg-gradient-to-br from-fashion-900 via-fashion-950 to-black p-6 md:p-9 fau-editorial-transition';
          inter.setAttribute('aria-label','Intervalo entre desafios');
          inter.innerHTML=`<div class="flex flex-col md:flex-row md:items-center justify-between gap-6"><div class="space-y-3"><p class="text-[10px] tracking-[.35em] text-fashion-gold">✦ THE AFTER SHOW ✦</p><h2 class="font-cinzel text-2xl md:text-3xl text-white">${role==='estilista'&&currentUser.out?'YOUR LAST WALK. YOUR LEGACY.':'ONE RUNWAY ENDS. ANOTHER AWAITS.'}</h2><p class="text-sm text-gray-300 max-w-xl">${role==='estilista'&&currentUser.out?'Sua jornada competitiva terminou, mas suas criações permanecem no arquivo da temporada.':'As decisões desta rodada já foram anunciadas. Reveja os looks, acompanhe seu histórico e os comentários publicados. O próximo briefing continua sob sigilo da produção.'}</p><p class="text-[11px] text-fashion-gold/80">🔒 NEXT CHALLENGE · NOT YET REVEALED</p></div><div class="flex flex-wrap gap-2"><button type="button" data-after-go="legado" class="border border-fashion-gold/50 rounded px-4 py-3 text-xs text-fashion-gold">THE FASHION ARCHIVE</button><button type="button" data-after-go="runway" class="bg-fashion-gold text-black rounded px-4 py-3 text-xs font-bold">REVISIT THE RUNWAY</button></div></div>`;
          inter.querySelectorAll('[data-after-go]').forEach(b=>{if(getAvailableTabs().includes(b.dataset.afterGo))b.addEventListener('click',()=>navigate(b.dataset.afterGo));else b.remove();});
          main.parentNode.insertBefore(inter, main);
          // Personalizar apenas depois da autorização oficial. O documento público
          // traz a classificação, nunca as notas individuais ou o ranking acumulado.
          if(role==='estilista') {
            const round=String(globalState.rodada||'');
            const uid=currentUser.uid;
            const maison=currentUser.ate||'';
            db.collection('ranking_historico').doc(round).get().then(snap=>{
              if(!inter.isConnected || !snap.exists || !getSeasonFlow().rankingVisible || String(globalState.rodada||'')!==round || currentUser?.uid!==uid)return;
              const rows=Array.isArray(snap.data().rows)?snap.data().rows:[];
              const mine=rows.find(x=>x.uid===uid) || rows.find(x=>String(x.ate||'').trim().toLocaleLowerCase('pt-BR')===maison.trim().toLocaleLowerCase('pt-BR'));
              if(!mine)return;
              const status=String(mine.status||'').toUpperCase();
              const out=!!currentUser.out || /\bOUT\b|ELIMINAD/.test(status);
              let key=out?'out':/(?:WINNER|VENCEDOR DA TEMPORADA)/.test(status)?'champion':/\bWIN\b/.test(status)?'win':/\bHIGH\b|\bTOP\b/.test(status)?'high':/\bLOW\b|\bBOTTOM\b/.test(status)?'low':'safe';
              const messages={
                champion:['THE WINNER · THE LEGEND IS BORN','Seu Designer conquistou a temporada. A passarela agora faz parte do seu legado.','🏆'],
                win:['THE WINNING LOOK','Esta foi a sua passarela. Sua criação venceu o desafio e conquistou o destaque máximo da rodada.','🏆'],
                high:['THE STANDOUTS','Seu look chamou a atenção dos jurados e colocou seu Designer entre os destaques da semana.','✨'],
                safe:['YOU ARE SAFE','Seu Designer continua na competição. A próxima passarela será uma nova oportunidade de surpreender.','🕊️'],
                low:['A CLOSE CALL','Os jurados esperavam mais desta criação. A próxima oportunidade ainda pode mudar sua trajetória.','⚠️'],
                out:['THE FINAL WALK','Sua jornada competitiva terminou, mas a história da seu Designer continua no arquivo da temporada.','🥀']
              };
              const [headline,description,symbol]=messages[key];
              inter.dataset.maisonStatus=key;
              const h=inter.querySelector('h2');const p=h?.nextElementSibling;
              if(h)h.textContent=symbol+' '+headline;
              if(p)p.textContent=description;
              const statusLine=document.createElement('div');
              statusLine.className='fau-personal-verdict rounded-xl border border-fashion-gold/30 bg-black/40 p-4 mt-4';
              statusLine.innerHTML=`<p class="text-[10px] uppercase tracking-[.25em] text-fashion-gold">WEEK ${esc(round)} · OFFICIAL VERDICT</p><p class="font-cinzel text-xl text-white mt-2">${esc(maison)} · ${esc(out?'OUT':status)}</p><p class="text-xs text-gray-400 mt-2">Resultado oficial já divulgado. As notas individuais ficam no seu Track Record; críticas aparecem somente quando autorizadas pela produção.</p>`;
              inter.querySelector('.space-y-3')?.append(statusLine);
              // Somente informações oficialmente publicadas. Nenhum voto bruto ou nota privada é consultado.
              const achievements=[];
              if(/\bICON[EÊ]\b|[ÍI]CONE DA MODA/i.test(status))achievements.push(['👑','Ícone da Moda','Escolhido pelos estilistas na votação secreta.']);
              if(/FORA DE MODA/i.test(status))achievements.push(['🥀','Fora de Moda','Título decidido pela votação secreta dos estilistas.']);
              if(/SALV[OA]|SAVED|SAVE VOTE/i.test(status)&&!out)achievements.push(['🛟','Saved by the Atelier','Seu Designer foi salva pelo voto dos outros estilistas.']);
              if(achievements.length){
                const award=document.createElement('div');award.className='flex flex-wrap gap-2 mt-3';
                award.innerHTML=achievements.map(([icon,label,detail])=>`<div class="rounded-xl border border-fashion-gold/40 bg-fashion-gold/5 p-3 flex-1 min-w-[190px]"><p class="font-cinzel text-fashion-gold">${icon} ${esc(label)}</p><p class="text-xs text-gray-300 mt-1">${esc(detail)}</p></div>`).join('');
                statusLine.after(award);
              }
              db.collection('fau_titulos_publicos').doc(round).get().then(t=>{
                if(!t.exists||!t.data().published||!inter.isConnected||currentUser?.uid!==uid||String(globalState.rodada)!==round)return;
                const d=t.data(),badges=[];
                if(d.icon===uid)badges.push(['👑','THE FASHION ICON','Seu Designer foi escolhida pelos estilistas. Você conquistou o direito de escolher o próximo tema entre as opções disponíveis.']);
                if(d.fora===uid)badges.push(['🥀','FORA DE MODA','Os votos da rodada marcaram seu Designer. Seu resultado permanece parte da história da competição.']);
                if((d.saved||[]).includes(uid))badges.push(['🛟','SAVED BY THE ATELIER','Seus concorrentes escolheram manter seu Designer na competição.']);
                if(!badges.length)return;
                const el=document.createElement('section');el.className='mt-4 grid gap-3';
                el.innerHTML=badges.map(([emoji,title,desc])=>`<div class="rounded-xl border border-fashion-gold/50 bg-fashion-gold/10 p-5"><p class="text-3xl mb-2">${emoji}</p><p class="font-cinzel text-lg text-fashion-gold">${title}</p><p class="text-xs text-gray-200 mt-2">${desc}</p></div>`).join('');
                statusLine.after(el);
              }).catch(err=>console.warn('Títulos públicos indisponíveis',err));
              // A publicação de críticas é independente da apuração. Exibir só as liberadas.
              db.collection('fau_criticas_publicas').doc(round).get().then(critSnap=>{
                if(!inter.isConnected||!getSeasonFlow().rankingVisible||String(globalState.rodada||'')!==round||currentUser?.uid!==uid)return;
                const pub=critSnap.data()||{};
                if(!pub.published)return;
                const own=(Array.isArray(pub.entries)?pub.entries:[]).filter(x=>String(x.maison||'').trim().toLocaleLowerCase('pt-BR')===maison.trim().toLocaleLowerCase('pt-BR')&&String(x.text||'').trim());
                if(!own.length)return;
                const notes=document.createElement('section');notes.className='mt-4 rounded-xl border border-fashion-gold/30 bg-black/30 p-4 space-y-3';
                notes.innerHTML=`<p class="text-[10px] tracking-[.25em] text-fashion-gold">THE JUDGES' VERDICT · PUBLISHED CRITIQUES</p>${own.map(x=>`<article class="border-t border-fashion-700 pt-3"><p class="text-xs font-bold text-fashion-gold">${esc(x.jurorNome||'Jurado')}</p><p class="text-sm text-gray-200 mt-2 whitespace-pre-wrap">${esc(x.text)}</p></article>`).join('')}`;
                inter.querySelector('.space-y-3')?.append(notes);
              }).catch(err=>console.warn('After Show: críticas indisponíveis',err));
            }).catch(err=>console.warn('After Show: status indisponível',err));
          }
        }
    };

    auth.onAuthStateChanged(user => {
        if (!isAuthProcessing) initUserSession(user);
    });

    const VIEWS = {};

    // 1. CONFESSIONÁRIO

    // THE THEME VAULT: acesso permanente para todos os perfis autenticados.
    // Apenas os campos explicitamente publicados são exibidos; não consultar theme_vault_private.
    VIEWS.pistas = () => {
        const host=$('#mainView');
        host.innerHTML=`<section class="space-y-5"><div class="text-center space-y-2"><div class="text-fashion-gold text-[10px] uppercase tracking-[.35em]">The Season's Secrets</div><h2 class="font-cinzel text-2xl text-white">🔐 THE THEME VAULT</h2><p class="text-sm text-gray-300 max-w-xl mx-auto">Cada fotografia esconde um desafio da temporada. Observe as fotografias e tente descobrir os desafios. As pistas escritas são exclusivas do Ícone da Moda (ou do WIN autorizado).</p></div><div id="publicThemeClues" class="grid grid-cols-2 md:grid-cols-3 gap-3"><p class="text-gray-400 text-sm col-span-full text-center">Abrindo o arquivo de pistas…</p></div></section>`;
        const list=$('#publicThemeClues');
        const unsub=db.collection('theme_vault_public').onSnapshot(snap=>{
            if(!list.isConnected)return;
            const docs=snap.docs.sort((a,b)=>a.id.localeCompare(b.id));
            list.innerHTML=docs.map((d,i)=>{

                else if(nominated && ['twist','judging','closed'].includes(rest.phase)) box.innerHTML=`<h3 class="font-cinzel text-fashion-gold">⚰️ YOUR OWN FUNERAL — THE LAST LOOK</h3><p class="text-sm text-gray-300">Você está entre os três homenageados. Crie seu último look sem NENHUM detalhe branco. Esta entrega é separada da primeira passarela.</p>${restLook.exists?'<p class="text-green-300">Seu último look já foi entregue.</p>':rest.phase==='twist'?`<input id="restTitle" class="w-full bg-black border border-fashion-700 rounded p-2 text-white" placeholder="Título do último look"><textarea id="restConcept" maxlength="500" class="w-full bg-black border border-fashion-700 rounded p-2 text-white" placeholder="Conceito (até 500 caracteres)"></textarea><input id="restFile" type="file" accept="image/*" class="text-xs text-white"><button id="restSubmit" class="bg-fashion-gold text-black px-4 py-2 rounded text-xs font-bold">Enviar meu último look</button>`:'<p class="text-amber-300">Prazo encerrado pela produção.</p>'}`;
                else box.innerHTML='<h3 class="font-cinzel text-fashion-gold">🕯️ THE LAST FAREWELL</h3><p class="text-sm text-gray-300">A produção convocou três estilistas para seu próprio funeral. Os demais serão convidados a avaliar as novas criações após a liberação.</p>';
                document.querySelector('#workroomFormModule').before(box);
                const submit=box.querySelector('#restSubmit');
                if(submit) submit.onclick=safeExec(async()=>{
                    const title=box.querySelector('#restTitle').value.trim(), concept=box.querySelector('#restConcept').value.trim(), file=box.querySelector('#restFile').files[0];
                    if(!title||!concept||!file||concept.length>500) throw new Error('Preencha título, conceito e imagem (conceito até 500 caracteres).');
                    if((await restState()).phase!=='twist') throw new Error('A segunda etapa foi encerrada.');
                    if((await db.doc(`rest_looks/${restSecondLookId(currentUser.uid)}`).get()).exists) throw new Error('Seu último look já foi entregue.');
                    const url=await compressImageToBase64(file);
                    await db.doc(`rest_looks/${restSecondLookId(currentUser.uid)}`).set({uid:currentUser.uid,ate:currentUser.ate,rodada:globalState.rodada,titulo:title,mem:concept,url,t:now()});
                    showToast('Seu último look foi entregue em sigilo.'); navigate('work');
                });
            }
            if(globalState.themeId==='theme_next_supreme') {
                const ss=await supremeState();
                if(ss.phase==='closed') {
                    const mine=await supremeOwnTieStatus();
                    if(mine && mine.decidedBy==='pending_self') {
                        const tieBox=document.createElement('section');
                        tieBox.className='bg-fashion-950 border border-fashion-gold rounded-lg p-5 mb-5 space-y-3';
                        tieBox.innerHTML=`<h3 class="font-cinzel text-fashion-gold">👑 THE FINAL SAY · YOUR CROWN</h3><p class="text-xs text-gray-300">A votação terminou empatada. O Ícone da Moda e o WIN não conseguiram desempatar sua disputa. Você decide qual Suprema continuará.</p><div class="flex gap-2"><button data-own-supreme="1" class="bg-fashion-gold text-black px-4 py-2 rounded">OLD SUPREME</button><button data-own-supreme="2" class="bg-fashion-gold text-black px-4 py-2 rounded">NEXT SUPREME</button></div>`;
                        document.querySelector('#workroomFormModule').before(tieBox);
                        tieBox.querySelectorAll('[data-own-supreme]').forEach(btn=>btn.onclick=safeExec(async()=>{
                            if((await supremeState()).phase!=='closed') throw new Error('A decisão já foi encerrada.');
                            const slot=Number(btn.dataset.ownSupreme);
                            if(!productionConfirm('Confirmar sua escolha definitiva?')) return;
                            await supremeTieRef(currentUser.uid).set({uid:currentUser.uid,rodada:globalState.rodada,slot,decidedAt:firebase.firestore.FieldValue.serverTimestamp()});
                            showToast('Sua decisão foi registrada em sigilo.');navigate('work');
                        }));
                    }
                }
            }
            const formSlot = $('#workroomFormModule');
            if (beauty && currentRoundLooks.length===1 && beauty.phase==='first') {
                formSlot.innerHTML = `<div class="bg-fashion-900 border border-fashion-gold/40 p-6 rounded-lg text-center space-y-3">
                    <h3 class="font-cinzel text-fashion-gold">👁️ THE EXHIBITION IS NOT OVER YET</h3>
                    <p class="text-sm text-gray-300">Sua primeira visão está guardada. A produção está recolhendo os conceitos antes de abrir a segunda etapa.</p></div>`;
            } else if (beauty && currentRoundLooks.length===1 && beauty.phase==='assigned' && !beautyAssignment) {
                formSlot.innerHTML = '<p class="text-amber-300">Seu envelope ainda não foi distribuído. Avise a produção.</p>';
            } else if (currentRoundLooks.length >= requiredLooks) {
                formSlot.innerHTML = `
                    <div class="bg-fashion-900 border border-green-800/40 p-6 rounded-lg text-center space-y-2">
                        <i class="fa-solid fa-circle-check text-green-500 text-2xl"></i>
                        <h3 class="font-cinzel text-base text-white">Look(s) Enviado(s) para a Passarela! (${currentRoundLooks.length}/${requiredLooks})</h3>
                        <p class="text-xs text-gray-400">Sua criação gerada por IA está no aguardo do veredito da bancada de jurados.</p>
                    </div>
                `;
            } else {
                formSlot.innerHTML = `
                    <div class="bg-fashion-900 border border-fashion-700 p-6 rounded-lg space-y-6">
                        <div class="fau-runway-marquee rounded-2xl border border-fashion-gold/30 bg-gradient-to-r from-black via-fashion-900 to-black p-6 md:p-10 text-center space-y-3"><p class="text-[10px] tracking-[.45em] text-fashion-gold">FAU · THE OFFICIAL FASHION SHOW</p><h2 class="font-cinzel text-3xl md:text-5xl text-white">LIGHTS. CAMERA. RUNWAY.</h2><p class="text-xs text-gray-300">Cada look é uma visão. Cada detalhe conta uma história.</p><p class="text-[10px] text-fashion-gold/70 tracking-[.25em]">THE FRONT ROW IS WATCHING</p></div>
                <div class="border-b border-fashion-700 pb-3 flex justify-between items-center">
                            <h3 class="font-cinzel text-lg text-white font-normal">Envio para a Passarela · Look ${currentRoundLooks.length + 1} de ${requiredLooks}</h3>
                            <span class="text-xs text-fashion-gold font-mono">Fashion, Art & Uniqueness</span>
                        </div>

                        <div class="space-y-4 text-xs">
                            <div>
                                <label class="block text-gray-300 mb-1 uppercase tracking-wider font-semibold">2. Fotografia do look (envie um arquivo do dispositivo)</label>
                                <input type="file" id="lookFileInput" accept="image/jpeg,image/png,image/webp" class="w-full bg-fashion-950 border border-fashion-700 rounded p-2 text-white">
                            </div>

                            <div id="fauUploadPreviewWrap" class="hidden rounded-xl border border-fashion-gold/40 bg-fashion-950 p-3 space-y-2"><p class="text-[10px] uppercase tracking-widest text-fashion-gold">YOUR LOOK · FILE READY</p><img id="fauUploadPreview" class="max-h-64 w-full object-contain rounded" alt="Prévia da imagem selecionada para entrega"><p id="fauUploadFileInfo" class="text-xs text-gray-300" role="status"></p></div>
                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <label class="uppercase tracking-wider font-semibold text-gray-300">3. Nome da Criação</label>
                                </div>
                                <input id="lookTitleInput" class="w-full bg-fashion-950 border border-fashion-700 rounded p-2 text-white font-cinzel" placeholder="Ex: Sombra Abissal, Veludo Tóxico...">
                            </div>

                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <label class="uppercase tracking-wider font-semibold text-gray-300">4. Conceito (Até 500 caracteres)</label>
                                    <span id="charCounter" class="text-gray-500 font-mono text-[10px]">0 / 500 letras</span>
                                </div>
                                <textarea id="lookMemorialText" maxlength="500" rows="3" class="w-full bg-fashion-950 border border-fashion-700 rounded p-2 text-white focus:outline-none focus:border-fashion-gold" placeholder="Explique a inspiração, a narrativa e a conexão com a assinatura da sua maison..."></textarea>
                            </div>

                            <button id="btnSubmitLook" type="button" class="w-full bg-fashion-gold hover:bg-fashion-gold-hover text-black font-semibold py-3 rounded uppercase tracking-widest text-xs transition">Enviar Look Oficial para a Passarela</button>
                        </div>
                    </div>
                `;

                if (isFinalPhase) {
                    const actIndex = currentRoundLooks.length;
                    const actTitles = ['🌍 ACT I — THE ORIGIN','♻️ ACT II — THE REINVENTION','⚔️ ACT III — THE CONFRONTATION','👑 ACT IV — THE LEGEND'];
                    const actHints = [
                      'Escolha a raiz histórica, cultural ou estética da Maison. Transforme sua essência em moda, sem fantasia literal.',
                      'Reinterprete um look que recebeu oficialmente FORA DE MODA. Preserve elementos reconhecíveis, mas transforme-o pela identidade da seu Designer.',
                      'Reinterprete um look que recebeu oficialmente ÍCONE DA MODA. Preserve a essência e apresente uma assinatura autoral própria.',
                      'Apresente a imagem definitiva da Maison: o legado, a assinatura e a evolução dos três atos anteriores.'
                    ];
                    const previousFinal = currentRoundLooks[0]?.finaleMeta || {};
                    const shared = actIndex===0 ? `<div class="space-y-3 border-t border-fashion-700 pt-4">
                      <h4 class="font-cinzel text-fashion-gold">🧵 THE HOUSE CODE · IDENTIDADE DA MAISON</h4>
                      <label class="block text-xs text-gray-300">Nome da Maison<input id="finalMaison" maxlength="100" class="block w-full bg-fashion-950 border border-fashion-700 rounded p-3 mt-1 text-white" value="${esc(currentUser.ate||'')}" placeholder="Nome oficial da Maison"></label>
                      <label class="block text-xs text-gray-300">Referência de origem<input id="finalOrigin" maxlength="180" class="block w-full bg-fashion-950 border border-fashion-700 rounded p-3 mt-1 text-white" placeholder="Movimento, cultura, período ou estética"></label>
                      ${[['Silhueta','finalSilhouette'],['Materiais e texturas','finalMaterials'],['Paleta de cores','finalPalette'],['Detalhes de assinatura','finalSignature'],['Filosofia criativa','finalPhilosophy']].map(([label,id])=>`<label class="block text-xs text-gray-300">${label}<textarea id="${id}" maxlength="500" rows="2" class="block w-full bg-fashion-950 border border-fashion-700 rounded p-3 mt-1 text-white"></textarea></label>`).join('')}
                      <label class="block text-xs text-gray-300">Collection Manifesto — a história dos quatro atos<textarea id="finalManifesto" maxlength="3000" rows="4" class="block w-full bg-fashion-950 border border-fashion-700 rounded p-3 mt-1 text-white" placeholder="Explique a visão da Maison e como os quatro capítulos se conectam"></textarea></label>
                    </div>` : `<div class="text-xs text-gray-300 border border-fashion-gold/30 rounded p-3">🧵 Maison: <strong>${esc(previousFinal.maison||currentUser.ate||'—')}</strong> · Origem: ${esc(previousFinal.origin||'—')}. Mantenha o House Code nos quatro editoriais.</div>`;
                    const archive = actIndex===1 || actIndex===2 ? `<label class="block text-xs text-gray-300">📜 Referência oficial do arquivo (look, estilista e rodada)<textarea id="finalArchive" maxlength="600" rows="3" class="block w-full bg-fashion-950 border border-fashion-700 rounded p-3 mt-1 text-white" placeholder="Nome do look original, Maison/estilista responsável e rodada em que recebeu o título oficial"></textarea></label>` : '';
                    formSlot.insertAdjacentHTML('afterbegin', `<section class="bg-fashion-950 border border-fashion-gold/50 rounded-lg p-5 mb-4 space-y-3">
                      <h3 class="font-cinzel text-fashion-gold text-lg">${actTitles[actIndex]||'THE FINAL SHOW'}</h3>
                      <p class="text-xs text-gray-300">${actHints[actIndex]||''}</p>
                      <p class="text-xs text-fashion-gold">Cada ato vale até 50 pontos · Coleção completa: 200 pontos · Placar da temporada zerado</p>
                      ${shared}${archive}
                    </section>`);
                }
                if (globalState.themeId==='w02_new_form') {
                    const original=allMyLooks.find(l=>l.themeId==='w01_first_garment');
                    formSlot.insertAdjacentHTML('afterbegin', `<section class="bg-fashion-950 border border-fashion-gold/50 rounded-lg p-5 mb-4 space-y-3">
                        <h3 class="font-cinzel text-fashion-gold">🔮 FROM THE FIRST GARMENT TO A NEW FORM</h3>
                        ${original?`<div class="flex flex-col sm:flex-row gap-4"><img src="${esc(original.url)}" class="w-full sm:w-40 rounded object-cover" alt="Seu look da Week 01"><div><p class="text-sm text-white font-semibold">${esc(original.titulo)}</p><p class="text-xs text-gray-300 italic mt-2">${esc(original.mem)}</p></div></div>`:'<p class="text-xs text-amber-300">Sua criação da Week 01 não foi encontrada. Avise a produção antes de enviar.</p>'}
                        <p class="text-xs text-gray-300">Recupere um elemento visual reconhecível da sua primeira criação, transforme-o e explique a conexão no conceito. Não é necessário criar uma estética futurista.</p>
                    </section>`);
                }
                if (beauty && currentRoundLooks.length===1 && beautyAssignment) {
                    formSlot.insertAdjacentHTML('afterbegin', `<div class="bg-fashion-950 border border-fashion-gold rounded-lg p-5 mb-4 space-y-3">
                        <div class="text-fashion-gold font-cinzel">🎭 ANOTHER POINT OF VIEW — YOUR SEALED CONCEPT</div>
                        <h3 class="text-white font-cinzel">${esc(beautyAssignment.title)}</h3>
                        <p class="text-sm text-gray-300 italic">${esc(beautyAssignment.concept)}</p>
                        <p class="text-xs text-amber-200">Você recebeu apenas título e conceito. A imagem e a identidade original continuam em segredo. Crie uma releitura com título próprio.</p></div>`);
                }
                // Prévia da imagem real selecionada, sem upload automático.
                $('#lookFileInput')?.addEventListener('change', e=>{
                    const file=e.target.files?.[0],wrap=$('#fauUploadPreviewWrap'),preview=$('#fauUploadPreview'),info=$('#fauUploadFileInfo');
                    if(preview?.dataset.url){URL.revokeObjectURL(preview.dataset.url);delete preview.dataset.url;}
                    if(wrap)wrap.classList.add('hidden');
                    if(!file)return;
                    if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>40*1024*1024){
                        e.target.value='';showToast('Use JPG, PNG ou WebP de até 40 MB.');return;
                    }
                    const url=URL.createObjectURL(file);preview.src=url;preview.dataset.url=url;
                    info.textContent=`${file.name} · ${(file.size/1048576).toFixed(2)} MB · Ainda não enviado`;
                    wrap.classList.remove('hidden');
                });
                $('#lookMemorialText').oninput = e => {
                    $('#charCounter').textContent = `${e.target.value.length} / 500 letras`;
                };
            }

            renderPersonalTwist().catch(console.error);
            if(themeHasDraw(getTheme())) sub(drawGateRef(),()=>renderPersonalTwist().catch(console.error));
            $('#myLooksCount').textContent = `${allMyLooks.length} looks`;
            $('#myLooksArchiveGrid').innerHTML = allMyLooks.map(l => {
                const lookEvals = myEvaluations.filter(e => e.look === l.id);
                const avgTotal = lookEvals.length ? (lookEvals.reduce((a, b) => a + b.total, 0) / lookEvals.length).toFixed(1) : null;

                return `
                    <div class="bg-fashion-950 p-3 rounded border border-fashion-700 space-y-2">
                        <img src="${esc(l.url)}" class="w-full img-look rounded">
                        <div class="flex justify-between items-center text-[10px]">
                            <span class="text-fashion-gold font-bold font-cinzel">Rodada ${esc(l.rodada)}</span>
                            <span class="text-gray-400 font-cinzel">${esc(l.titulo || 'Look Sem Nome')}</span>
                        </div>
                        <div class="bg-fashion-900 p-2 rounded border border-fashion-700/60 text-center space-y-1">
                            <span class="text-[9px] uppercase tracking-wider text-gray-400 block font-cinzel">Notas dos Jurados</span>
                            <div class="font-mono font-bold text-fashion-gold text-sm">${avgTotal !== null ? `${avgTotal} / 50.0 pts` : 'Aguardando Júri'}</div>
                            ${lookEvals.length ? `
                                <div class="pt-1 border-t border-fashion-800 space-y-1 text-[9px] text-left">
                                    ${CRITERIOS.map((crit, cIdx) => {
                                        const critAvg = (lookEvals.reduce((sum, ev) => sum + (ev.nota && ev.nota[cIdx] ? Number(ev.nota[cIdx]) : 0), 0) / lookEvals.length).toFixed(1);
                                        return `
                                            <div class="flex justify-between items-center text-gray-400">
                                                <span class="truncate">${crit}:</span>
                                                <span class="font-mono font-bold text-fashion-gold">${critAvg}</span>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            ` : ''}
                        </div>
                        <p class="text-[10px] text-gray-400 line-clamp-2 italic">${esc(l.mem)}</p>
                    </div>
                `;
            }).join('') || '<div class="col-span-full text-center text-gray-500 py-4">Seu Designer ainda não enviou looks.</div>';
        };

        $('#mainView').onclick = safeExec(async e => {
            const target = e.target;

            if (target.id === 'btnLockAtelierIdentity') {
                if (globalState.rodada || globalState.themeId) throw new Error('A identidade da Maison fica bloqueada após o início da competição. Solicite mudanças à produção.');
                const atelierName = $('#setupAtelierNameInput').value.trim();
                const atelierBio = $('#setupAtelierBioInput').value.trim();

                if (atelierName.length < 2 || atelierName.length > 70 || atelierBio.length > 300) throw new Error('Informe um nome de Maison (2–70 caracteres) e manifesto (até 300).');
                if (/[<>]/.test(atelierName)) throw new Error('O nome da Maison não pode conter os símbolos < ou >.');

                await db.doc(`perfis/${currentUser.uid}`).update({
                    ate: atelierName,
                    bio: atelierBio
                });

                currentUser.ate = atelierName;
                currentUser.bio = atelierBio;

                showToast('Identidade da Maison oficializada com sucesso!');
                refreshWorkroomUI();
            }

            if (target.id === 'btnSubmitLook') {
                if (now() > globalState.prazo) throw new Error('O tempo acabou! A rodada está encerrada.');
                const file = $('#lookFileInput').files[0];
                const lookTitle = $('#lookTitleInput').value.trim();
                const memorial = $('#lookMemorialText').value.trim();

                if (!file || !lookTitle || !memorial) throw new Error('Preencha imagem, título e conceito da criação.');

                const theme = getTheme();
                const beauty = theme?.id === 'theme_beauty_eye' ? await beautyState() : null;
                const previousLooks = allMyLooks.filter(l=>l.rodada===globalState.rodada);
                if (beauty && previousLooks.length===1 && (beauty.phase!=='assigned' || !beauty.assignments?.some(a=>a.uid===currentUser.uid))) throw new Error('Aguarde a produção liberar seu conceito.');
                if (beauty && previousLooks.length===0 && beauty.phase!=='first') throw new Error('A primeira etapa já foi encerrada. Procure a produção.');
                if(theme?.id==='w02_new_form' && !allMyLooks.some(l=>l.themeId==='w01_first_garment')) throw new Error('Sua criação da Week 01 não foi encontrada. Procure a produção para regularizar o histórico antes de enviar A New Form.');
                const draw = theme ? await getPersonalTwist() : null;
                if(themeHasDraw(theme)){
                    const gate=await getDrawGate();
                    if(gate.phase!=='released')throw new Error('Aguarde a produção liberar o resultado do seu envelope antes de enviar o look.');
                }
                if (theme && (themeHasDraw(theme) || theme.drawType === 'faction_choice') && !draw) throw new Error('Abra seu envelope antes de enviar o look.');
                if (theme?.extraField && !document.getElementById('themeExtraInput')?.value.trim()) throw new Error('Preencha a exigência especial deste desafio.');
                if(theme?.id==='theme_climate_chaos') {
                    if(!draw || draw.themeId!=='theme_climate_chaos' || !draw.value || !draw.value.includes(' + ')) throw new Error('Seu sorteio das duas estações está ausente ou inválido. Procure a produção.');
                    const interpretation=document.getElementById('themeExtraInput')?.value.trim()||'';
                    if(interpretation.length<20) throw new Error('Explique como as duas estações estão presentes visualmente no mesmo look (pelo menos 20 caracteres).');
                }
                let finaleMeta = null;
                if (isFinalPhase) {
                    const previousFinalLooks = allMyLooks.filter(l=>l.rodada===globalState.rodada);
                    if (previousFinalLooks.length===0) {
                        const val=id=>document.getElementById(id)?.value.trim()||'';
                        finaleMeta = {maison:val('finalMaison'),origin:val('finalOrigin'),silhouette:val('finalSilhouette'),materials:val('finalMaterials'),palette:val('finalPalette'),signature:val('finalSignature'),philosophy:val('finalPhilosophy'),manifesto:val('finalManifesto')};
                        if(Object.values(finaleMeta).some(v=>!v)) throw new Error('Preencha o nome da Maison, referência de origem, os cinco códigos da Maison e o manifesto da coleção.');
                    } else {
                        finaleMeta = {...(previousFinalLooks[0].finaleMeta||{})};
                    }
                    if(previousFinalLooks.length===1 || previousFinalLooks.length===2) {
                        const archive=document.getElementById('finalArchive')?.value.trim()||'';
                        if(!archive) throw new Error('Identifique o look original, seu estilista e a rodada do título oficial.');
                        finaleMeta.archiveReference=archive;
                    }
                }
                const currentRoundLooks = allMyLooks.filter(l => l.rodada === globalState.rodada);
                if (currentRoundLooks.length >= (theme?.numSubmissoes || globalState.numSubmissoes || 1)) throw new Error('Todas as entregas desta rodada já foram enviadas.');
                showToast('Otimizando a fotografia e enviando...');
                const index = currentRoundLooks.length;
                const lookDocId = `${globalState.rodada}_${currentUser.uid}_${index}`;
                const submitButton=$('#btnSubmitLook');
                if(submitButton?.disabled)throw new Error('O envio já está em andamento. Aguarde.');
                if(submitButton){submitButton.disabled=true;submitButton.textContent='ENVIANDO · AGUARDE...';}
                let photoBase64;
                try {photoBase64 = await compressImageToBase64(file);}
                catch(error){if(submitButton){submitButton.disabled=false;submitButton.textContent='Enviar Look Oficial para a Passarela';}throw error;}

                const batch = db.batch();
                batch.set(db.doc(`looks/${lookDocId}`), {
                    uid: currentUser.uid,
                    ate: currentUser.ate,
                    rodada: globalState.rodada,
                    themeId: theme?.id || null,
                    slot: index + 1,
                    twistValue: ['theme_traitors','theme_beauty_eye'].includes(theme?.id) ? null : (draw?.value || null),
                    beautySourceUid: beauty && index===1 ? beauty.assignments.find(a=>a.uid===currentUser.uid)?.sourceUid : null,
                    themeExtra: document.getElementById('themeExtraInput')?.value.trim() || '',
                    finaleMeta: finaleMeta,
                    titulo: lookTitle,
                    url: photoBase64,
                    mem: memorial,
                    t: now()
                });
                batch.set(db.doc(`envios/${lookDocId}`), {
                    rodada: globalState.rodada,
                    uid: currentUser.uid
                });

                try {await batch.commit();}
                catch(error){if(submitButton){submitButton.disabled=false;submitButton.textContent='TENTAR NOVAMENTE';}throw error;}
                showToast('Entrega confirmada pelo servidor! Make it work!');
            }
        });

        db.collection('perfis').get().then(snap => {
            const profiles = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            activeStylistsCount = profiles.filter(d => d.role === 'estilista' && !d.out && !d.disabled).length;
            refreshWorkroomUI();
        });

        let myEvaluations = [];

        sub(db.collection('looks').where('uid', '==', currentUser.uid), snap => {
            allMyLooks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            refreshWorkroomUI();
        });

        sub(db.collection('avaliacoes').where('alvo', '==', currentUser.uid), snap => {
            myEvaluations = snap.docs.map(d => d.data());
            refreshWorkroomUI();
        });

        sub(db.collection('envios').where('rodada', '==', globalState.rodada || '-'), snap => {
            roundSubmissions = snap.docs.map(d => d.data());
            refreshWorkroomUI();
        });
    };

                const entries=Object.values(byRound).sort((a,b)=>String(a.round).localeCompare(String(b.round),undefined,{numeric:true}));

                slot.innerHTML = `<div class="space-y-5"><div class="rounded-xl border border-fashion-gold/40 bg-fashion-950 p-5"><p class="text-[10px] tracking-[.25em] text-fashion-gold uppercase">PRIVATE MAISON DOSSIER</p><h3 class="font-cinzel text-xl text-white mt-2">${esc(currentUser.ate || 'Minha Maison')}</h3><p class="text-xs text-gray-400 mt-2">Somente você vê seu desempenho acumulado. A classificação e as pontuações das outras Maisons são exclusivas da produção.</p><div class="grid grid-cols-2 gap-3 mt-4"><div class="rounded-lg bg-fashion-900 p-3"><p class="text-[10px] text-gray-400">RODADAS COM ENTREGA</p><p class="text-2xl text-white font-cinzel">${entries.length}</p></div><div class="rounded-lg bg-fashion-900 p-3"><p class="text-[10px] text-gray-400">SUA MÉDIA</p><p class="text-2xl text-fashion-gold font-cinzel">${avg===null?'—':avg.toFixed(2)}</p></div></div></div><div class="space-y-3"><h3 class="font-cinzel text-fashion-gold">MY RUNWAY TIMELINE</h3>${entries.length?entries.map(x=>{const score=x.scores.length?(x.scores.reduce((a,b)=>a+b,0)/x.scores.length).toFixed(2):null;return `<div class="rounded-lg border border-fashion-700 bg-fashion-950 p-4 flex items-center justify-between gap-3"><div><p class="text-xs text-fashion-gold uppercase tracking-wider">${esc(x.round)}</p><p class="text-sm text-white mt-1">${x.looks.length} criação(ões) registrada(s)</p></div><div class="text-right"><p class="text-[10px] text-gray-400">SUA NOTA</p><p class="font-cinzel text-xl text-white">${score??'Aguardando'}</p></div></div>`}).join(''):'<p class="text-gray-400 py-4">Sua história na passarela ainda vai começar.</p>'}</div></div>`;

    // V84 — Acervo de resultados publicados, sem consultar entregas privadas.

    // 4. BANCADA DE JÚRI (AI EDITION)
    // V54 · Critique Call: notas primeiro, uma crítica opcional por Maison apenas quando convocada.
    const fauCritiqueTargets = async () => {
        const round=String(globalState.rodada||'');
        if(!round)return [];
        const current=await db.collection('ranking_historico').doc(round).get();
        if(!current.exists)return [];
        const currentRows=current.data().rows||[];
        const prev=await db.collection('ranking_historico').doc(String(Number(round)-1)).get();
        const previousWinner=prev.exists?(prev.data().rows||[]).find(r=>/\bWIN\b/i.test(r.status||''))?.ate:null;
        const selected=new Map();
        currentRows.forEach(r=>{
            const status=String(r.status||'');
            if(/\b(WIN|TOP|HIGH|BOTTOM|LOW)\b/i.test(status)||r.ate===previousWinner){
                selected.set(r.ate,{ate:r.ate,reason:/\b(WIN|TOP|HIGH|BOTTOM|LOW)\b/i.test(status)?status:'WIN anterior'});
            }
        });
        return [...selected.values()];

        const computeSeasonStandings = async () => {
            const [profilesSnap, evalsSnap] = await Promise.all([
                db.collection('perfis').where('role', '==', 'estilista').get(),

            if(supremeRankingState && supremeRankingState.phase!=='selected') throw new Error('A Supreme Vote precisa ser concluída antes de apurar o ranking.');
            const supremeWinners=new Map((supremeRankingState?.winners||[]).map(w=>[w.uid,`${globalState.rodada}_${w.uid}_${w.slot-1}`]));
            const evaluationsByLook = {};
            evalsSnap.docs.forEach(d => {

                if(supremeRankingState && data.rodada===globalState.rodada && supremeWinners.get(data.alvo)!==data.look) return;

                const slotsByUid = {};

                const missing = activeStylists.filter(d => {
                    const slots=slotsByUid[d.id];
                    if (!slots?.has(1) || !slots?.has(2)) return true;

                    const pr = (perRound[lookData.r] ??= { sum: 0, n: 0 });

                    if (r === globalState.rodada) currentRoundScore += v;
                    if (globalState.fase !== 'final' || r === globalState.rodada) totalAccumulated += v;
                }

                return { uid: doc.id, ate: doc.data().ate, tot: Number(totalAccumulated.toFixed(2)), rd: Number(currentRoundScore.toFixed(2)) };
            });

            const byScore = (a,b) => a.rd-b.rd || a.tot-b.tot || a.uid.localeCompare(b.uid);
            const faithful = members.filter(x => x.faction === 'Faithful').sort(byScore)[0];
            const traitor = members.filter(x => x.faction === 'Traitor').sort(byScore)[0];
            if (!faithful || !traitor) {
                const win = [...members].sort((a,b) => b.rd-a.rd || b.tot-a.tot)[0];

                if (!accumulated) throw new Error('Não há terceiro participante elegível.');
                return {pool:[...worstRound,accumulated], members, win, fallback:true, reason:'Facção única: regra normal (dois piores da rodada + pior acumulado elegível).'};

            const win = [...members].sort((a,b) => b.rd-a.rd || b.tot-a.tot)[0];

            const selected = [];

                    await batch.commit();showToast('Registros de cadastro removidos do Firestore.');
                }
            })();
        });
        // Auditoria unificada: inscrições novas + identidades legadas + perfis ativos.
        // A coleção identidades não é gravada pelo cadastro público (somente ADM).
        const auditCache={inscricoes:null,identidades:null,perfis:null};
        const auditErrors={};
        const renderCastAudit=()=>{
            const root=$('#castAuditList');if(!root)return;
            const entries=new Map();
            const ensure=uid=>{if(!entries.has(uid))entries.set(uid,{uid});return entries.get(uid);};
            (auditCache.identidades||[]).forEach(d=>{const x=ensure(d.id);x.legacy=d.data();});
            (auditCache.inscricoes||[]).forEach(d=>{const x=ensure(d.id);x.registration=d.data();});
            (auditCache.perfis||[]).forEach(d=>{const x=ensure(d.id);x.profile=d.data();});
            castRows=[...entries.values()].sort((a,b)=>String(a.registration?.real||a.legacy?.real||a.profile?.ate||'').localeCompare(String(b.registration?.real||b.legacy?.real||b.profile?.ate||''),'pt-BR'));
            const search=($('#castSearch')?.value||'').toLocaleLowerCase('pt-BR'),filter=$('#castFilter')?.value||'all';
            const rows=castRows.filter(x=>{
                const r=x.registration||{},l=x.legacy||{},p=x.profile||{};
                const hay=[x.uid,r.real,r.designer,r.username,r.email,l.real,l.username,p.ate,p.username].join(' ').toLocaleLowerCase('pt-BR');
                if(search&&!hay.includes(search))return false;
                if(filter==='active')return !!x.profile&&!p.disabled&&!p.out;
                if(filter==='disabled')return !!p.disabled;
                if(filter==='out')return !!p.out;
                if(filter==='missing')return !x.profile||(!x.registration&&!x.legacy);
                return true;
            });
            const errors=Object.entries(auditErrors).filter(([,value])=>value).map(([name,value])=>`<p class="text-red-300 p-2 border border-red-900 rounded">Erro ao consultar ${esc(name)}: ${esc(value)}. Verifique as regras do Firestore.</p>`).join('');
            const pending=Object.values(auditCache).some(v=>v===null);
            root.innerHTML=`<p class="text-[11px] text-gray-400 mb-2">${rows.length} exibido(s) de ${castRows.length} conta(s) · Inscrições + identidades antigas + perfis.</p>${errors}${rows.map(x=>{
                const reg=x.registration||{},legacy=x.legacy||{},profile=x.profile||{};
                const real=reg.real||legacy.real||'Nome real não registrado';
                const atelier=profile.ate||reg.designer||legacy.ate||'Designer não informado';
                const username=reg.username||profile.username||legacy.username||reg.email||legacy.email||'Não informado';
                const badges=[!x.registration&&!x.legacy?'Sem ficha de identidade':'',!x.profile?'Sem perfil de acesso':'',profile.disabled?'Desativado':'',profile.out?'Eliminado':''].filter(Boolean);
                const own=x.uid===auth.currentUser?.uid;
                return `<article class="p-3 border border-fashion-700 bg-fashion-950 rounded-xl space-y-3 mb-2">
                    <div class="flex flex-wrap justify-between gap-2"><div><p class="text-white font-semibold">${esc(real)}</p><p class="text-fashion-gold font-cinzel">${esc(atelier)}</p><p class="text-[10px] text-gray-400 break-all">${esc(username)} · UID: ${esc(x.uid)}</p></div><span class="text-xs ${profile.disabled?'text-red-300':'text-green-300'}">${profile.disabled?'DESATIVADO':x.profile?'ATIVO':'SEM PERFIL'}</span></div>
                    ${badges.length?`<p class="text-[10px] text-amber-300">${badges.map(esc).join(' · ')}</p>`:''}
                    <div class="flex flex-wrap items-center gap-2">
                        <button data-cast-action="edit" data-cast-uid="${esc(x.uid)}" ${own?'disabled':''} class="rounded border border-fashion-gold text-fashion-gold px-3 py-2 text-xs disabled:opacity-40">EDITAR</button>
                        <select data-cast-role="${esc(x.uid)}" ${own||!x.profile?'disabled':''} class="bg-fashion-900 border border-fashion-700 rounded p-2 text-xs text-white">${[['estilista','Designer'],['jurado','Jurado'],['plateia','Plateia']].map(([v,t])=>`<option value="${v}" ${profile.role===v?'selected':''}>${t}</option>`).join('')}</select>
                        <button data-cast-action="role" data-cast-uid="${esc(x.uid)}" ${own||!x.profile?'disabled':''} class="rounded border border-fashion-700 text-white px-3 py-2 text-xs disabled:opacity-40">SALVAR FUNÇÃO</button>
                        <button data-cast-action="status" data-cast-uid="${esc(x.uid)}" ${own||!x.profile?'disabled':''} class="rounded border border-fashion-700 text-white px-3 py-2 text-xs disabled:opacity-40">${profile.disabled?'REATIVAR':'DESATIVAR'}</button>
                        <button data-cast-action="out" data-cast-uid="${esc(x.uid)}" ${own||!x.profile?'disabled':''} class="rounded border border-fashion-700 text-white px-3 py-2 text-xs disabled:opacity-40">${profile.out?'REINTEGRAR':'MARCAR OUT'}</button>
                        <button data-cast-action="delete" data-cast-uid="${esc(x.uid)}" ${own?'disabled':''} class="rounded border border-red-800 text-red-300 px-3 py-2 text-xs disabled:opacity-40">EXCLUIR</button>
                    </div></article>`;
            }).join('')}${!rows.length&&!pending&&!errors?'<span class="text-gray-500">Nenhum usuário encontrado para este filtro.</span>':''}${pending?'<span class="text-gray-400">Sincronizando dados…</span>':''}`;
        };
        [['inscricoes','inscricoes_designers'],['identidades','identidades'],['perfis','perfis']].forEach(([key,collection])=>{
            sub(db.collection(collection),snap=>{auditCache[key]=snap.docs;auditErrors[key]=null;renderCastAudit();},err=>{auditCache[key]=[];auditErrors[key]=err.message||String(err);renderCastAudit();});
        });
    };

    window.openAtelierHistory = async (atelierUid, atelierName) => {
        const modal = $('#atelierHistoryModal');
        const title = $('#historyModalTitle');
        const content = $('#historyModalContent');

        title.textContent = `Portfólio da Maison — ${atelierName}`;
        content.innerHTML = '<p class="col-span-full text-gray-400 py-8">Carregando looks e pontuações...</p>';
        modal.classList.remove('hidden');

        const [looksSnap, evalsSnap, perfilSnap] = await Promise.all([
            db.collection('looks').where('uid', '==', atelierUid).get(),
            db.collection('avaliacoes').where('alvo', '==', atelierUid).get(),
            db.doc(`perfis/${atelierUid}`).get()
        ]);

        const looks = looksSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.t - a.t);
        const evals = evalsSnap.docs.map(d => d.data());
        const perfilData = perfilSnap.data() || {};

        if (!looks.length) {
            content.innerHTML = '<p class="col-span-full text-gray-500 py-8">Nenhum look registrado.</p>';
            return;
        }

        let bioHtml = '';
        if (perfilData.bio) {
            bioHtml = `<div class="col-span-full bg-fashion-950 p-3 rounded border border-fashion-gold/40 text-left text-xs text-gray-300 italic mb-2">
                <strong class="text-fashion-gold not-italic font-cinzel">Maison: ${esc(perfilData.ate || 'Não definida')}</strong> — "${esc(perfilData.bio)}"
            </div>`;
        }

        content.innerHTML = bioHtml + looks.map(l => {
            const lookEvals = evals.filter(e => e.look === l.id);
            const avgTotal = lookEvals.length ? (lookEvals.reduce((a, b) => a + b.total, 0) / lookEvals.length).toFixed(1) : null;

            return `
                <div class="bg-fashion-950 p-3 rounded border border-fashion-700 space-y-2 text-left flex flex-col justify-between">
                    <div class="space-y-2">
                        <img src="${esc(l.url)}" class="w-full img-look rounded border border-fashion-700 shadow">
                        <div class="flex justify-between items-center text-[10px]">
                            <span class="font-cinzel text-fashion-gold font-bold">Rodada: ${esc(l.rodada)}</span>
                            <span class="text-gray-400 font-cinzel">${esc(l.titulo || '')}</span>
                        </div>
                        <div class="bg-fashion-900 p-2 rounded border border-fashion-700/60 text-center">
                            <span class="text-[9px] uppercase tracking-wider text-gray-400 block font-cinzel">Nota dos Jurados</span>
                            <div class="font-mono font-bold text-fashion-gold text-sm">${avgTotal !== null ? `${avgTotal} / 50.0 pts` : 'Aguardando Júri'}</div>
                        </div>
                    </div>
                    <p class="text-[11px] text-gray-300 italic leading-relaxed line-clamp-3">${esc(l.mem)}</p>
                    ${creativeDossier(l)}
                </div>
            `;
        }).join('');
    };

    window.closeAtelierHistoryModal = () => { $('#atelierHistoryModal').classList.add('hidden'); };
    window.closeBroadcastModal = () => { $('#broadcastModal').classList.add('hidden'); };
</script>

            const fase = globalState.fase === 'final' ? 'THE GRAND FINALE' : globalState.fase === 'top5' ? 'TOP 5 — THE FINAL FILTER' : 'THE CHALLENGE';
            const d = (globalState.prazo || 0) - Date.now();
            const t = !globalState.prazo ? 'WORKROOM · AGUARDANDO PRAZO' : d <= 0 ? 'TIME IS UP · THE WORKROOM IS CLOSED' : d <= 60000 ? 'THE FINAL MINUTE' : d <= 600000 ? 'THE FINAL COUNTDOWN' : d <= 3600000 ? 'ONE HOUR REMAINING' : d <= 86400000 ? 'THE FINAL DAY' : 'THE WORKROOM IS OPEN';
            hero.innerHTML = `<div class="text-[10px] tracking-[.4em] text-fashion-gold font-cinzel">${fase}</div><div class="font-cinzel text-white text-lg tracking-widest">${esc(pretty(globalState.rodada))}</div><div class="font-mono text-xs ${d <= 0 ? 'text-red-400' : 'text-gray-300'}">${t}</div>`;
            hero.classList.toggle('hidden', currentUser.role === 'plateia' && !globalState.liberado);
        }, 1000);

        // The winner is revealed by the host on WhatsApp. Never show an automatic

    })();

    (() => {
        const card=document.getElementById('poderCard');
        let chosen=null,unsub=null,choiceKey='',last='',privateClues={};
        const render=()=>{
            const g=globalState;
            if(!currentUser||!g?.rodada){card.classList.add('hidden');return;}
            const owner=g.poderUid===currentUser.uid;
            const key=[g.rodada,g.poderUid,g.proxTema?.themeId,chosen,JSON.stringify(g.proxOpcoes||[]),Object.keys(privateClues).length].join('|');
            if(key===last)return;last=key;
            let html='';
            if(g.proxTema)html=`<div class="text-fashion-gold font-cinzel tracking-[.25em]">🎭 THE RESULTS SHOW · THE REVEAL</div><div class="font-cinzel text-white text-xl mt-2">${esc(g.proxTema.nome)}</div><p class="text-gray-400">O próximo desafio foi revelado pela produção.</p>`;
            else if(g.poderUid&&(g.proxOpcoes||[]).length){
                html=`<div class="text-fashion-gold font-cinzel tracking-[.25em]">👑 THE ICON'S CHOICE</div><p class="text-gray-300 mt-2">${owner?'Você tem o poder. Explore as pistas e escolha o próximo desafio.':'O próximo desafio está nas mãos de '+esc(g.poderNome||'um estilista')+'. Qual pista será escolhida?'}</p>`;
                if(owner&&chosen)html+='<p class="text-fashion-gold mt-3">🔒 Escolha registrada. Aguarde a revelação da produção.</p>';
                html+=`<div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-4">${g.proxOpcoes.map((o,i)=>`<div class="rounded-lg border border-fashion-gold/30 bg-fashion-950 overflow-hidden"><div class="aspect-[4/5] bg-fashion-900">${o.photo?`<img src="${esc(o.photo)}" alt="Pista ${i+1}" class="w-full h-full object-cover">`:''}</div><div class="p-3 space-y-2"><strong class="block font-cinzel text-fashion-gold">MYSTERY ${String(i+1).padStart(2,'0')}</strong>${owner&&!chosen?`<p class="text-gray-300 text-xs">${esc(privateClues[o.id]||'Pista em preparação…')}</p><button data-op="${esc(o.id)}" class="w-full bg-fashion-gold text-black rounded py-2 font-semibold">Escolher esta pista</button>`:''}</div></div>`).join('')}</div>`;
            }
            card.innerHTML=html;card.classList.toggle('hidden',!html);
        };
        card.onclick=async e=>{
            const b=e.target.closest('[data-op]');if(!b)return;
            const o=(globalState.proxOpcoes||[]).find(x=>x.id===b.dataset.op);if(!o)return;
