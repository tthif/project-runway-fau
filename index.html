                extraField: { key: "referenciaNatural", label: "Referência Natural Escolhida", placeholder: "Ex: Fungo Cordyceps / Víbora-do-Gabão / Erupção Vulcânica..." }
            },
            "w_finale": {
                id: "w_finale",
                code: "GRANDE FINAL",
                fixedOrder: 99,
                title: "THE FINAL COLLECTION — A Consagração Suprema",
                subtitle: "Desfile final da temporada com coleção cápsula autoral em IA disputando a coroa de Project Runway: FAU's Edition.",
                elimTipo: "finale",
                numSubmissoes: 2,
                slotLabels: ["Look 1 — Manifesto Conceitual", "Look 2 — Peça Mestra de Alta-Costura"],
                drawType: "none",
                mandate: "👑 GRANDE FINAL: Apresente os looks definitivos da sua Maison para o veredito final.",
                extraField: null
            }
        };

        // =========================================================================
        // 2. ESTADO GLOBAL & PERSISTÊNCIA HÍBRIDA (FIRESTORE + LOCAL STORAGE SYNC)
        // =========================================================================
        const STORAGE_KEY = "PR_FAU_AI_EDITION_STATE_V3";
        let currentView = "admin";
        let filterOnlyPending = false;

        const defaultState = {
            rodadaKey: "theme_wedding_party",
            fase: "workroom", // 'workroom' | 'runway' | 'tribunal' | 'concluida'
            sorteioLiberadoAdmin: true,
            passarelaLiberadaAdmin: false,
            notasLiberadasAdmin: false,
            twistAtiva: null, // 'traitors' | 'funeral' | 'fazenda' | 'supreme_duel'
            iconeUid: "s1",
            winUid: "s2",
            bottomUids: ["s4", "s5", "s6"],
            restaUmChain: ["s2"], // Inicia pelo WIN quando acionado
            profiles: [
                { uid: "admin1", nome: "Thiago (Direção Executiva)", ate: "Produção FAU", role: "admin", out: false, disabled: false, accScore: 0 },
                { uid: "s1", nome: "Estilista 01", ate: "Maison McQueen", role: "estilista", out: false, disabled: false, accScore: 142.5 },
                { uid: "s2", nome: "Estilista 02", ate: "Maison Mugler", role: "estilista", out: false, disabled: false, accScore: 138.0 },
                { uid: "s3", nome: "Estilista 03", ate: "Maison Schiaparelli", role: "estilista", out: false, disabled: false, accScore: 134.2 },
                { uid: "s4", nome: "Estilista 04", ate: "Maison Westwood", role: "estilista", out: false, disabled: false, accScore: 125.8 },
                { uid: "s5", nome: "Estilista 05", ate: "Maison Margiela", role: "estilista", out: false, disabled: false, accScore: 121.0 },
                { uid: "s6", nome: "Estilista 06", ate: "Maison Balenciaga", role: "estilista", out: false, disabled: false, accScore: 118.4 },
                { uid: "j1", nome: "Jurado Fixo 01 (Moda)", ate: "Bancada Oficial", role: "jurado", out: false, disabled: false, ignoredInRound: false },
                { uid: "j2", nome: "Jurado Fixo 02 (Editorial)", ate: "Bancada Oficial", role: "jurado", out: false, disabled: false, ignoredInRound: false },
                { uid: "j3", nome: "Prof. Convidado (Matemática / Especial)", ate: "Bancada Convidada", role: "jurado", out: false, disabled: false, ignoredInRound: false }
            ],
            // Registro de sorteios com trava de clique único: key = `${rodadaKey}_${uid}`
            draws: {},
            // Submissões dos ateliês
            submissions: [],
            // Avaliações dos jurados (5 critérios de 0 a 10 = até 50 pts)
            evaluations: [],
            // Votos de tribunais (Urna Bottom 3, Ícone da Moda, Funeral, Supreme Vote)
            votes: []
        };

        let globalState = loadState();
        let currentUser = globalState.profiles[0]; // Inicia como Direção Executiva (Admin)

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    return { ...defaultState, ...parsed };
                }
            } catch (e) {
                console.warn("Erro ao ler estado local:", e);
            }
            return JSON.parse(JSON.stringify(defaultState));
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(globalState));
            } catch (e) {
                console.warn("Erro ao salvar estado:", e);
            }
            updateHeaderUI();
        }

        // Helpers
        const $ = (sel) => document.querySelector(sel);
        const esc = (str) => String(str ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

        function showToast(msg, type = "gold") {
            const container = $("#toastContainer");
            if (!container) return;
            const el = document.createElement("div");
            const borderClass = type === "error" ? "border-red-500 text-red-200" : "border-fashion-gold text-fashion-gold";
            el.className = `pointer-events-auto bg-fashion-950/95 border ${borderClass} px-4 py-3 rounded-lg shadow-xl text-xs font-mono flex items-center justify-between gap-3 animate-reveal`;
            el.innerHTML = `<span>${esc(msg)}</span>`;
            container.appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }

        function getCurrentTheme() {
            return SEASON_THEMES[globalState.rodadaKey] || SEASON_THEMES["w01_first_garment"];
        }

        // =========================================================================
        // 3. CENTRAL UNIVERSAL DE MONITORAMENTO EM TEMPO REAL (QUEM FEZ VS QUEM FALTA)
        // =========================================================================
        // Presente em TODOS os temas e envios da temporada para a Direção Executiva:
        // 1) Sorteios / Envelopes / Facções
        // 2) Envios do Workroom (Simples, Duplos e Velório)
        // 3) Fichas Técnicas da Bancada de Jurados
        // 4) Votações e Tribunais do Elenco
        function renderUniversalAdminRadars() {
            const theme = getCurrentTheme();
            const roundKey = globalState.rodadaKey;
            const stylists = globalState.profiles.filter(p => p.role === "estilista" && !p.out && !p.disabled);
            const activeJudges = globalState.profiles.filter(p => p.role === "jurado" && !p.disabled && !p.ignoredInRound);
            const reqSlots = theme.numSubmissoes || 1;
            const hasDraw = theme.drawType && theme.drawType !== "none";

            // Contadores Gerais
            let completedStylistsCount = 0;
            let completedDrawsCount = 0;

            const stylistRadarRows = stylists.map(s => {
                const drawKey = `${roundKey}_${s.uid}`;
                const drawData = globalState.draws[drawKey];
                const isDrawDone = Boolean(drawData && drawData.revelado);
                if (isDrawDone) completedDrawsCount++;

                const mySubs = globalState.submissions.filter(sub => sub.rodadaKey === roundKey && sub.uid === s.uid && !sub.isFuneralLook);
                const isSubDone = mySubs.length >= reqSlots;
                if (isSubDone) completedStylistsCount++;

                if (filterOnlyPending && isSubDone && (!hasDraw || isDrawDone)) {
                    return "";
                }

                const lastTime = mySubs.length > 0 ? new Date(mySubs[mySubs.length - 1].t).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : "--:--";
                const extraInfo = mySubs[0]?.extraValue ? `<span class="block text-[10px] text-fashion-gold font-mono mt-0.5">📌 ${esc(mySubs[0].extraValue)}</span>` : "";

                // Coluna de Sorteio / Facção
                let drawStatusHtml = `<span class="text-[10px] text-gray-500 font-mono">Sem sorteio</span>`;
                if (hasDraw) {
                    if (isDrawDone) {
                        const displayVal = theme.drawType === "faction_choice"
                            ? (drawData.resultado === "Traitor" ? "🗡️ TRAITOR" : "🕊️ FAITHFUL")
                            : esc(drawData.resultado);
                        drawStatusHtml = `
                            <div>
                                <span class="bg-emerald-950/80 text-emerald-400 border border-emerald-700/60 px-2 py-0.5 rounded font-mono text-[10px]">✓ Revelado (${drawData.hora || ''})</span>
                                <span class="block text-[10px] text-amber-200 font-mono mt-0.5">${displayVal}</span>
                            </div>
                        `;
                    } else {
                        drawStatusHtml = `
                            <div class="flex items-center gap-1.5">
                                <span class="bg-amber-950/70 text-amber-300 border border-amber-700/50 px-2 py-0.5 rounded font-mono text-[10px]">⏳ Envelope Lacrado</span>
                                <button onclick="forceAdminDrawForUser('${s.uid}')" title="Revelar por Decreto da Produção" class="text-[10px] bg-fashion-800 hover:bg-fashion-gold hover:text-black text-gray-200 px-1.5 py-0.5 rounded font-mono transition">⚡ Forçar</button>
                            </div>
                        `;
                    }
                }

                return `
                    <tr class="border-b border-fashion-800/80 hover:bg-fashion-850/60 transition text-xs">
                        <td class="py-2.5 pr-2">
                            <div class="font-cinzel font-bold text-white">${esc(s.ate)}</div>
                            <div class="text-[10px] text-gray-400 font-mono">${esc(s.nome)}</div>
                        </td>
                        <td class="py-2.5 px-2">${drawStatusHtml}</td>
                        <td class="py-2.5 px-2">
                            ${isSubDone
                                ? `<span class="bg-emerald-950/80 text-emerald-400 border border-emerald-700/60 px-2 py-0.5 rounded font-mono text-[10px]">✓ ENTREGUE (${mySubs.length}/${reqSlots})</span>`
                                : `<span class="bg-rose-950/70 text-rose-300 border border-rose-700/60 px-2 py-0.5 rounded font-mono text-[10px]">⏳ FALTA ENVIAR (${mySubs.length}/${reqSlots})</span>`
                            }
                            ${extraInfo}
                        </td>
                        <td class="py-2.5 px-2 font-mono text-[11px] text-gray-400">${lastTime}</td>
                        <td class="py-2.5 pl-2 text-right space-x-1">
                            ${mySubs.length > 0
                                ? `<button onclick="openAuditModal('${s.uid}')" class="bg-fashion-800 hover:bg-fashion-gold hover:text-black text-gray-200 px-2 py-1 rounded text-[10px] font-mono transition">👁️ Prévia</button>`
                                : `<button onclick="copySingleReminder('${esc(s.ate)}', 'envio do look no Workroom')" class="bg-fashion-950 border border-fashion-700 hover:border-fashion-gold text-gray-300 px-2 py-1 rounded text-[10px] font-mono transition">🔔 Cobrar</button>`
                            }
                        </td>
                    </tr>
                `;
            }).join("");

            // Radar da Bancada de Jurados
            const totalAtelierTargets = stylists.length;
            let completedJudgesCount = 0;

            const judgeRadarRows = activeJudges.map(j => {
                const myEvals = globalState.evaluations.filter(ev => ev.rodadaKey === roundKey && ev.juradoUid === j.uid);
                const evaluatedUids = new Set(myEvals.map(e => e.estilistaUid));
                const missingStylists = stylists.filter(st => !evaluatedUids.has(st.uid));
                const isJudgeDone = totalAtelierTargets > 0 && missingStylists.length === 0;
                if (isJudgeDone) completedJudgesCount++;

                if (filterOnlyPending && isJudgeDone) return "";

                const pct = totalAtelierTargets > 0 ? Math.round((evaluatedUids.size / totalAtelierTargets) * 100) : 0;
                const missingNames = missingStylists.map(m => m.ate).join(", ");

                return `
                    <tr class="border-b border-fashion-800/80 hover:bg-fashion-850/60 transition text-xs">
                        <td class="py-2.5 pr-2">
                            <div class="font-cinzel font-bold text-white">${esc(j.nome)}</div>
                            <div class="text-[10px] text-gray-400 font-mono">${esc(j.ate)}</div>
                        </td>
                        <td class="py-2.5 px-2 font-mono text-[11px]">
                            <span class="text-white font-bold">${evaluatedUids.size}/${totalAtelierTargets}</span> ateliês (${pct}%)
                        </td>
                        <td class="py-2.5 px-2">
                            ${isJudgeDone
                                ? `<span class="bg-emerald-950/80 text-emerald-400 border border-emerald-700/60 px-2 py-0.5 rounded font-mono text-[10px]">✓ FICHA COMPLETA</span>`
                                : `<span class="bg-amber-950/70 text-amber-300 border border-amber-700/60 px-2 py-0.5 rounded font-mono text-[10px]">⏳ FALTAM ${missingStylists.length}</span>`
                            }
                            ${missingStylists.length > 0 ? `<span class="block text-[10px] text-gray-400 font-mono mt-0.5">Pendentes: ${esc(missingNames)}</span>` : ""}
                        </td>
                        <td class="py-2.5 pl-2 text-right space-x-1">
                            ${!isJudgeDone
                                ? `<button onclick="copySingleReminder('${esc(j.nome)}', 'avaliação na passarela (${missingStylists.length} looks restantes)')" class="bg-fashion-950 border border-fashion-700 hover:border-fashion-gold text-gray-300 px-2 py-1 rounded text-[10px] font-mono transition">🔔 Cobrar</button>`
                                : `<span class="text-[10px] font-mono text-emerald-400">Pronto</span>`
                            }
                            <button onclick="toggleIgnoreJudge('${j.uid}')" title="Desconsiderar jurado nesta rodada em caso de W.O." class="bg-rose-950/50 border border-rose-800/60 hover:bg-rose-800 text-rose-200 px-2 py-1 rounded text-[10px] font-mono transition">W.O.</button>
                        </td>
                    </tr>
                `;
            }).join("");

            // Radar de Votação do Elenco (Urna / Ícone / Tribunais)
            const roundVotes = globalState.votes.filter(v => v.rodadaKey === roundKey);
            const votedUids = new Set(roundVotes.map(v => v.voterUid));
            const missingVoters = stylists.filter(s => !votedUids.has(s.uid));

            // Mapa Termométrico de Escolhas quando for Seven Deadly Styles (7 Anões)
            let dwarfThermometerHtml = "";
            if (roundKey === "theme_seven_deadly") {
                const counts = {};
                globalState.submissions.filter(s => s.rodadaKey === roundKey && s.extraValue).forEach(s => {
                    counts[s.extraValue] = (counts[s.extraValue] || 0) + 1;
                });
                const badges = Object.entries(counts).map(([k, c]) => `<span class="bg-fashion-950 border border-fashion-gold/40 px-2.5 py-1 rounded text-[11px] font-mono text-gray-200">${esc(k)}: <strong class="text-fashion-gold">${c}</strong></span>`).join("");
                dwarfThermometerHtml = `
                    <div class="mt-3 pt-3 border-t border-fashion-800 flex flex-wrap items-center gap-2">
                        <span class="text-[10px] font-cinzel uppercase text-fashion-gold font-bold">🍎 Termômetro dos 7 Anões:</span>
                        ${badges || '<span class="text-[11px] text-gray-500 font-mono">Nenhum anão selecionado ainda.</span>'}
                    </div>
                `;
            }

            return `
                <section class="card-luxury rounded-xl p-5 mb-6">
                    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-fashion-800 pb-3 mb-4">
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                                <h3 class="font-cinzel font-bold text-sm md:text-base text-fashion-gold uppercase tracking-wider">
                                    📡 Central de Monitoramento em Tempo Real — Quem Já Fez vs. Quem Falta
                                </h3>
                            </div>
                            <p class="text-[11px] text-gray-400 font-mono mt-0.5">
                                Tema Ativo: <strong class="text-white">${esc(theme.code)} — ${esc(theme.title)}</strong>
                            </p>
                        </div>

                        <div class="flex flex-wrap items-center gap-2">
                            <button onclick="togglePendingFilter()" class="px-3 py-1.5 rounded text-xs font-mono border transition ${filterOnlyPending ? 'bg-fashion-gold text-black border-fashion-gold font-bold' : 'bg-fashion-950 text-gray-300 border-fashion-700 hover:border-fashion-gold'}">
                                ${filterOnlyPending ? '👁️ Mostrando Apenas Pendentes' : '🔍 Filtrar Apenas Pendentes'}
                            </button>
                            <button onclick="copyBatchWhatsAppReminder()" class="px-3 py-1.5 rounded text-xs font-mono bg-emerald-950/90 hover:bg-emerald-800 text-emerald-200 border border-emerald-700 transition">
                                📋 Copiar Cobrança Geral (WhatsApp)
                            </button>
                        </div>
                    </div>

                    <!-- Resumo de Indicadores -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
                        <div class="bg-fashion-950 border border-fashion-800 p-3 rounded-lg">
                            <span class="text-[10px] font-mono uppercase text-gray-400 block">1. Sorteios / Envelopes</span>
                            <span class="text-base font-cinzel font-bold text-white">${hasDraw ? `${completedDrawsCount} / ${stylists.length} Revelados` : 'N/A nesta semana'}</span>
                        </div>
                        <div class="bg-fashion-950 border border-fashion-800 p-3 rounded-lg">
                            <span class="text-[10px] font-mono uppercase text-gray-400 block">2. Envios dos Ateliês</span>
                            <span class="text-base font-cinzel font-bold ${completedStylistsCount === stylists.length ? 'text-emerald-400' : 'text-amber-300'}">${completedStylistsCount} / ${stylists.length} Concluídos</span>
                        </div>
                        <div class="bg-fashion-950 border border-fashion-800 p-3 rounded-lg">
                            <span class="text-[10px] font-mono uppercase text-gray-400 block">3. Bancada de Jurados</span>
                            <span class="text-base font-cinzel font-bold ${completedJudgesCount === activeJudges.length ? 'text-emerald-400' : 'text-amber-300'}">${completedJudgesCount} / ${activeJudges.length} Fichas Prontas</span>
                        </div>
                        <div class="bg-fashion-950 border border-fashion-800 p-3 rounded-lg">
                            <span class="text-[10px] font-mono uppercase text-gray-400 block">4. Votos na Urna / Elenco</span>
                            <span class="text-base font-cinzel font-bold text-white">${votedUids.size} / ${stylists.length} Votaram</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
                        <!-- TABELA 1: ATELIÊS -->
                        <div class="bg-fashion-950/90 border border-fashion-800 rounded-lg p-4">
                            <div class="flex items-center justify-between border-b border-fashion-800 pb-2 mb-2">
                                <h4 class="font-cinzel text-xs font-bold text-fashion-gold uppercase tracking-wider">👗 Radar dos Ateliês (Sorteios & Looks)</h4>
                                <span class="text-[10px] font-mono text-gray-400">${reqSlots} look(s) exigido(s)</span>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left">
                                    <thead>
                                        <tr class="text-[10px] font-mono uppercase text-gray-500 border-b border-fashion-800">
                                            <th class="pb-1.5">Maison</th>
                                            <th class="pb-1.5">Sorteio / Facção</th>
                                            <th class="pb-1.5">Status Look</th>
                                            <th class="pb-1.5">Hora</th>
                                            <th class="pb-1.5 text-right">Ação</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${stylistRadarRows || '<tr><td colspan="5" class="py-4 text-center text-gray-500 font-mono text-xs">Nenhuma pendência encontrada.</td></tr>'}
                                    </tbody>
                                </table>
                            </div>
                            ${dwarfThermometerHtml}
                        </div>

                        <!-- TABELA 2: BANCADA DE JURADOS & URNA -->
                        <div class="space-y-4">
                            <div class="bg-fashion-950/90 border border-fashion-800 rounded-lg p-4">
                                <div class="flex items-center justify-between border-b border-fashion-800 pb-2 mb-2">
                                    <h4 class="font-cinzel text-xs font-bold text-fashion-gold uppercase tracking-wider">⚖️ Radar da Bancada de Jurados</h4>
                                    <span class="text-[10px] font-mono text-gray-400">5 Critérios (0–10)</span>
                                </div>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left">
                                        <thead>
                                            <tr class="text-[10px] font-mono uppercase text-gray-500 border-b border-fashion-800">
                                                <th class="pb-1.5">Jurado</th>
                                                <th class="pb-1.5">Progresso</th>
                                                <th class="pb-1.5">Status</th>
                                                <th class="pb-1.5 text-right">Controle</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${judgeRadarRows || '<tr><td colspan="4" class="py-4 text-center text-gray-500 font-mono text-xs">Todos os jurados concluíram!</td></tr>'}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            <!-- SUB-RADAR DE VOTAÇÃO DO ELENCO -->
                            <div class="bg-fashion-950/90 border border-fashion-800 rounded-lg p-3.5">
                                <div class="flex items-center justify-between mb-1.5">
                                    <h4 class="font-cinzel text-xs font-bold text-fashion-gold uppercase tracking-wider">🗳️ Radar de Votação Secreta & Tribunais</h4>
                                    <span class="text-[10px] font-mono text-gray-400">${votedUids.size}/${stylists.length} votos registrados</span>
                                </div>
                                <p class="text-[11px] font-mono text-gray-300">
                                    ${missingVoters.length === 0
                                        ? '✓ Todos os estilistas ativos já depositaram seu voto na urna desta rodada.'
                                        : `⏳ <strong class="text-amber-300">Faltam votar:</strong> ${missingVoters.map(m => esc(m.ate)).join(', ')}`
                                    }
                                </p>
                            </div>
                        </div>
                    </div>
                </section>
            `;
        }

        // =========================================================================
        // 4. SISTEMA NATIVO DE SORTEIO INTERATIVO COM TRAVA DE CLIQUE ÚNICO
        // =========================================================================
        // Todos os sorteios acontecem 100% dentro do site.
        // O estilista clica uma única vez -> o resultado é gravado e travado para sempre.
        function renderInteractiveDrawModule(uid) {
            const theme = getCurrentTheme();
            const roundKey = globalState.rodadaKey;
            if (!theme.drawType || theme.drawType === "none") return "";

            const drawKey = `${roundKey}_${uid}`;
            const existingDraw = globalState.draws[drawKey];

            // Caso o Admin ainda não tenha liberado o sorteio no Admin Gate
            if (!globalState.sorteioLiberadoAdmin && (!existingDraw || !existingDraw.revelado)) {
                return `
                    <div class="card-luxury rounded-xl p-5 mb-6 border-amber-700/50 text-center space-y-2">
                        <span class="text-[10px] font-mono uppercase tracking-widest text-amber-300 block">🔒 Aguardando Liberação da Direção Executiva</span>
                        <h3 class="font-cinzel text-sm font-bold text-white uppercase">O Oráculo da Rodada Está Selado</h3>
                        <p class="text-xs text-gray-400 max-w-xl mx-auto">A Produção está auditando o baralho oficial desta semana. Assim que o Admin Gate liberar, o botão de sorteio único aparecerá aqui.</p>
                    </div>
                `;
            }

            // SE JÁ CLICOU E REVELOU -> EXIBE O RESULTADO TRAVADO PERMANENTEMENTE (SEM BOTÃO DE RE-SORTEIO)
            if (existingDraw && existingDraw.revelado) {
                return `
                    <div class="card-luxury rounded-xl p-5 mb-6 border-2 border-fashion-gold animate-reveal">
                        <div class="flex flex-wrap items-center justify-between gap-2 border-b border-fashion-800 pb-2 mb-3">
                            <span class="text-[10px] font-mono uppercase tracking-widest text-emerald-400">✓ Sorteio Único Realizado & Travado no Sistema</span>
                            <span class="text-[10px] font-mono text-gray-400">Revelado às ${esc(existingDraw.hora || '--:--')}</span>
                        </div>
                        <div class="text-center py-2 space-y-1">
                            <span class="text-xs font-cinzel uppercase tracking-widest text-gray-400 block">Sua Atribuição Oficial Inegociável:</span>

        function togglePendingFilter() {

            globalState.rodadaKey = newRoundKey;

            showToast(`Rodada alterada para: ${SEASON_THEMES[newRoundKey].code}`);

        function toggleIgnoreJudge(judgeUid) {
            const j = globalState.profiles.find(p => p.uid === judgeUid);
            if (!j) return;
            j.ignoredInRound = !j.ignoredInRound;
            saveState();
            showToast(`${j.nome} foi ${j.ignoredInRound ? 'desconsiderado nesta rodada' : 'reativado na bancada'}.`);
            renderApp();

        function triggerTwist(type) {
            globalState.twistAtiva = globalState.twistAtiva === type ? null : type;
            saveState();
            showToast(globalState.twistAtiva ? `Twist [${type.toUpperCase()}] disparada!` : `Twist desativada.`);
            renderApp();
        }

        function consolidateRoundScores() {
            const roundKey = globalState.rodadaKey;
            const stylists = globalState.profiles.filter(p => p.role === "estilista" && !p.out && !p.disabled);
            const activeJudges = globalState.profiles.filter(p => p.role === "jurado" && !p.disabled && !p.ignoredInRound);

            // Verifica se algum jurado ativo ainda tem fichas pendentes
            let pendingCount = 0;
            activeJudges.forEach(j => {
                const evals = globalState.evaluations.filter(ev => ev.rodadaKey === roundKey && ev.juradoUid === j.uid);
                if (evals.length < stylists.length) pendingCount += (stylists.length - evals.length);
            });

            if (pendingCount > 0) {
                if (!confirm(`⚠️ ATENÇÃO DIREÇÃO: Ainda existem ${pendingCount} fichas técnicas pendentes na bancada de jurados. Deseja consolidar as médias mesmo assim?`)) {
                    return;
                }
            }

            const roundTotals = stylists.map(s => {
                const myEvals = globalState.evaluations.filter(ev => ev.rodadaKey === roundKey && ev.estilistaUid === s.uid);
                const avg = myEvals.length > 0 ? myEvals.reduce((a, b) => a + b.total, 0) / myEvals.length : 0;
                return { uid: s.uid, ate: s.ate, avg, acc: s.accScore + avg };
            }).sort((a, b) => b.avg - a.avg);

            if (roundTotals.length > 0) {
                globalState.winUid = roundTotals[0].uid;
                const worstTwo = roundTotals.slice(-2).map(r => r.uid);
                const remainingByAcc = roundTotals.filter(r => r.uid !== globalState.winUid && !worstTwo.includes(r.uid)).sort((a, b) => a.acc - b.acc);
                const thirdNominee = remainingByAcc[0]?.uid;
                globalState.bottomUids = [...worstTwo, ...(thirdNominee ? [thirdNominee] : [])];
            }

            globalState.notasLiberadasAdmin = true;
            saveState();
            showToast("Médias consolidadas! WIN e Bottom 3 atualizados.");
            renderApp();
        }

Olá, *${targetName}*! Consta como pendente no nosso radar em tempo real o seu registro de *${taskDesc}* referente à rodada *${theme.code} (${theme.title})*. Acesse o sistema para concluir antes do fechamento do prazo!`;

            const missingSubs = stylists.filter(s => {
                const subs = globalState.submissions.filter(sub => sub.rodadaKey === roundKey && sub.uid === s.uid && !sub.isFuneralLook);
                return subs.length < reqSlots;
            }).map(s => s.ate);

            const missingDraws = (theme.drawType && theme.drawType !== "none")
                ? stylists.filter(s => !globalState.draws[`${roundKey}_${s.uid}`]?.revelado).map(s => s.ate)
                : [];

            const missingJudges = judges.filter(j => {
                const evs = globalState.evaluations.filter(ev => ev.rodadaKey === roundKey && ev.juradoUid === j.uid);
                return evs.length < stylists.length;
            }).map(j => j.nome);

            const msg = [
                `🚨 *RADAR OFICIAL — ${theme.code}: ${theme.title}* 🚨`,
                missingDraws.length ? `
🎲 *Faltam realizar o Sorteio de Clique Único:* ${missingDraws.join(", ")}` : `🎲 *Sorteios:* 100% concluídos!`,
                missingSubs.length ? `👗 *Faltam entregar Look no Workroom:* ${missingSubs.join(", ")}` : `👗 *Entregas do Workroom:* 100% concluídas!`,
                missingJudges.length ? `⚖️ *Jurados com fichas pendentes:* ${missingJudges.join(", ")}` : `⚖️ *Bancada de Jurados:* 100% avaliada!`
            ].join("
");

            navigator.clipboard?.writeText(msg);
            showToast("Relatório geral de pendências copiado para o WhatsApp!");
        }

            const stylist = globalState.profiles.find(p => p.uid === uid);
            const subs = globalState.submissions.filter(s => s.rodadaKey === roundKey && s.uid === uid);
            const drawData = globalState.draws[`${roundKey}_${uid}`];

            $("#auditModalTitle").textContent = `Auditoria Prévia — ${stylist?.ate || 'Maison'}`;
            $("#auditModalBody").innerHTML = `
                <div class="space-y-3">
                    <div class="bg-fashion-950 p-3 rounded border border-fashion-800 font-mono">
                        <div><strong class="text-fashion-gold">Estilista:</strong> ${esc(stylist?.nome)}</div>
                        <div><strong class="text-fashion-gold">Sorteio / Facção:</strong> ${esc(drawData?.resultado || 'N/A')}</div>
                        ${subs[0]?.extraValue ? `<div><strong class="text-fashion-gold">Campo Específico:</strong> ${esc(subs[0].extraValue)}</div>` : ''}
                    </div>
                    ${subs.map(s => `
                        <div class="bg-fashion-950 p-3 rounded border border-fashion-800 space-y-2">
                            <div class="font-cinzel font-bold text-white">Look #0${s.slotIndex}: ${esc(s.titulo)}</div>
                            <img src="${esc(s.imgUrl)}" class="w-48 aspect-[3/4] object-cover rounded border border-fashion-700">
                            <div><strong class="text-fashion-gold">Conceito:</strong> ${esc(s.conceito)}</div>
                            <div class="text-gray-400 font-mono"><strong class="text-gray-200">Prompt IA:</strong> ${esc(s.prompt)}</div>
                        </div>
                    `).join("")}
                </div>
            `;
            $("#auditModal").classList.remove("hidden");
        }

        function closeAuditModal() {
            $("#auditModal").classList.add("hidden");
        }

        // =========================================================================
        // 7. INICIALIZAÇÃO, NAVEGAÇÃO & BARRA DO ÍCONE DA MODA
        // =========================================================================
        function populateRoleSelector() {
            const sel = $("#userRoleSelect");
            if (!sel) return;
            sel.innerHTML = globalState.profiles.map(p => `
                <option value="${p.uid}" ${p.uid === currentUser.uid ? 'selected' : ''}>
                    ${p.role === 'admin' ? '👑 ' : p.role === 'jurado' ? '⚖️ ' : '👗 '}${esc(p.ate)} (${esc(p.nome)})
                </option>
            `).join("");
        }

        function handleUserSwitch(uid) {
            const found = globalState.profiles.find(p => p.uid === uid);
            if (found) {
                currentUser = found;
                if (currentUser.role !== "admin" && currentView === "admin") {
                    currentView = "work";
                }
                renderApp();
            }
        }

        function switchView(viewName) {
            if (viewName === "admin" && currentUser.role !== "admin") {
                showToast("Acesso exclusivo à Direção Executiva (Admin Gate)!", "error");
                return;
            }
            currentView = viewName;
            renderApp();
        }

        function updateHeaderUI() {
            const theme = getCurrentTheme();
            if ($("#headerRoundBadge")) $("#headerRoundBadge").textContent = theme.code;
            if ($("#headerPhaseBadge")) {
                $("#headerPhaseBadge").textContent = globalState.passarelaLiberadaAdmin ? "PASSARELA & JÚRI" : "WORKROOM & SORTEIO";
            }

            // Atualiza banner do Ícone da Moda (que escolhe a próxima rodada não-fixa)
            const iconProfile = globalState.profiles.find(p => p.uid === globalState.iconeUid);
            const banner = $("#iconPrivilegeBanner");
            if (banner && iconProfile) {
                banner.classList.remove("hidden");
                $("#iconBannerText").textContent = `${iconProfile.ate} detém o título de Ícone da Moda e escolhe o próximo tema entre as semanas de ordem livre!`;
                if (currentUser.uid === iconProfile.uid || currentUser.role === "admin") {
                    const freeThemes = Object.values(SEASON_THEMES).filter(t => !t.fixedOrder);
                    $("#iconThemeSelectorSlot").innerHTML = `
                        <select onchange="changeActiveRound(this.value)" class="bg-fashion-950 border border-fashion-gold/60 rounded px-2 py-1 text-[11px] font-mono text-fashion-gold">
                            ${freeThemes.map(ft => `<option value="${ft.id}" ${ft.id === globalState.rodadaKey ? 'selected' : ''}>Próximo Tema: ${esc(ft.code)}</option>`).join("")}
                        </select>
                    `;
                } else {
                    $("#iconThemeSelectorSlot").innerHTML = "";
                }
            }
        }

        function renderApp() {
            populateRoleSelector();
            updateHeaderUI();

            document.querySelectorAll(".nav-btn").forEach(btn => {
                const isAct = btn.getAttribute("data-view") === currentView;
                btn.classList.toggle("bg-fashion-gold", isAct);
                btn.classList.toggle("text-black", isAct);
                btn.classList.toggle("font-bold", isAct);
            });

            const viewport = $("#appViewport");
            if (viewport && VIEWS[currentView]) {
                viewport.innerHTML = VIEWS[currentView]();
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            renderApp();
        });
    </script>
</body>
</html>
