            catch(err){showToast('Não foi possível registrar: '+err.message);}
        };
        setInterval(()=>{
            const g=globalState,owner=currentUser&&g?.poderUid===currentUser.uid;
            const key=owner?g.rodada:'';
            if(key!==choiceKey){
                choiceKey=key;chosen=null;privateClues={};last='';if(unsub){unsub();unsub=null;}
                if(key){
                    unsub=db.doc(`escolhas/${key}`).onSnapshot(sn=>{chosen=sn.exists?sn.data().opcaoId:null;last='';},()=>{});
                    Promise.all((g.proxOpcoes||[]).map(async o=>{
                        try{const sn=await db.collection('theme_vault_private').doc(o.id).get();if(sn.exists)privateClues[o.id]=sn.data().clue||'';}catch(e){}
                    })).then(()=>{last='';render();});
                }
            }
            render();
        },1000);
    })();
</script>

<!-- UX layer: contextual help and short-lived local recovery of Workroom text only. -->
<script>
(function(){
  'use strict';
  const main=document.getElementById('mainView');
  if(!main)return;
  let lastContext='', isApplying=false;
  const getContext=()=>{
    const nav=document.querySelector('nav [aria-current="page"],nav .active');
    const title=(nav?.textContent||'').trim().slice(0,60);
    return title||document.title;
  };
  function augment(){
    if(isApplying)return;
    isApplying=true;
    try{
      // Never create help for fields that already have a visible explanation.
      const headings=[...main.querySelectorAll('h1,h2,h3')].map(x=>x.textContent.toLowerCase()).join(' ');
      const isWork=!!main.querySelector('#personalTwistSlot,.fau-atelier-identity');
      const isJudging=/judg|bancada|avaliaç|critique/.test(headings);
      const isRunway=!!main.querySelector('#runwayGroups,#runwayGrid,.fau-runway-editorial');
      const key=isWork?'work':isJudging?'judge':isRunway?'runway':'';
      const root=main.querySelector('.fau-atelier-identity,.fau-runway-editorial')||main.firstElementChild;
      if(root&&key&&!main.querySelector('[data-fau-ux-help]')){
        const detail=document.createElement('details');detail.className='fau-ux-help';detail.dataset.fauUxHelp=key;
        const summary=document.createElement('summary');summary.textContent='Como funciona esta etapa?';
        const body=document.createElement('p');body.style.marginTop='8px';
        body.textContent=key==='work'?'Leia o briefing e confira as exigências antes de enviar. Enquanto a produção não encerrar o prazo, você pode revisar sua criação. Você pode salvar textos manualmente na nuvem quando o Firebase permitir. Imagens precisam ser selecionadas novamente.':key==='judge'?'Avalie os looks pelos critérios da rodada. Confira as notas antes de concluir. As avaliações não são mostradas aos designers antes da liberação oficial.':'Explore as criações publicadas e toque nas imagens para ampliá-las. Notas e resultados privados continuam protegidos.';
        detail.append(summary,body);root.insertAdjacentElement('afterend',detail);
      }
      // Workroom: optional cross-device draft. Only text, explicit save/restore, no silent overwrites.
      if(isWork && typeof currentUser!=='undefined' && currentUser?.uid && typeof db!=='undefined'){
        const eligible=[...main.querySelectorAll('textarea')].filter(el=>el.id&&!el.disabled&&!el.readOnly&&!/password|vote|nota|score|critique|jurad|admin|secret/i.test(el.id));
        const anchor=main.querySelector('.fau-atelier-identity');
        if(anchor && eligible.length && !main.querySelector('#fauCloudDraftPanel')){
          const panel=document.createElement('section');panel.id='fauCloudDraftPanel';panel.className='rounded-xl border border-fashion-gold/40 bg-fashion-950 p-4 space-y-2';
          panel.innerHTML='<p class="text-fashion-gold text-xs font-bold tracking-widest">THE ATELIER · RASCUNHO DE TEXTO</p><p class="text-xs text-gray-300">Salve e recupere seus textos entre dispositivos. Imagens não são salvas aqui e devem ser enviadas como arquivos. Rascunho não é entrega oficial.</p><div class="flex flex-wrap gap-2"><button type="button" id="fauCloudSave" class="rounded bg-fashion-gold text-black px-4 py-2 text-xs font-bold">Salvar textos na nuvem</button><button type="button" id="fauCloudRestore" class="rounded border border-fashion-gold/60 px-4 py-2 text-xs text-fashion-gold">Consultar rascunho salvo</button></div><p id="fauCloudStatus" role="status" aria-live="polite" class="text-xs text-gray-300">O salvamento é manual.</p>';
          anchor.insertAdjacentElement('afterend',panel);
          const owner=currentUser.uid,round=String(globalState?.rodada||'preseason');
          const doc=db.collection('rascunhos_atelier').doc(owner+'_'+round);
          const MAX_DRAFT_CHARS=18000;
          const currentDraftFields=()=>Object.fromEntries(eligible.map(el=>[el.id,el.value.slice(0,5000)]));
          const status=()=>panel.querySelector('#fauCloudStatus');
          const buttons=[...panel.querySelectorAll('button')];
          const busy=async fn=>{buttons.forEach(b=>b.disabled=true);try{await fn();}catch(err){status().textContent='Não foi possível acessar o rascunho: '+(err.code==='permission-denied'?'permissão do Firebase não configurada.':'verifique a conexão e tente novamente.');}finally{buttons.forEach(b=>b.disabled=false);}};
          panel.querySelector('#fauCloudSave').onclick=()=>busy(async()=>{
            if(!navigator.onLine)throw new Error('offline');
            const fields=currentDraftFields();
            if(JSON.stringify(fields).length>MAX_DRAFT_CHARS){status().textContent='Rascunho muito longo. Reduza os textos antes de salvar.';return;}
            await doc.set({ownerUid:owner,round,fields,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
            status().textContent='✓ Textos salvos na nuvem. Isto não envia sua criação para a passarela.';
          });
          panel.querySelector('#fauCloudRestore').onclick=()=>busy(async()=>{
            const snap=await doc.get();if(!snap.exists){status().textContent='Nenhum rascunho na nuvem para esta rodada.';return;}
            const data=snap.data();if(data.ownerUid!==owner||data.round!==round||!data.fields||typeof data.fields!=='object'||Array.isArray(data.fields))throw new Error('draft owner mismatch');
            const available=eligible.filter(el=>typeof data.fields?.[el.id]==='string'&&data.fields[el.id].length<=5000);
            if(!available.length){status().textContent='Não há campos de texto compatíveis neste rascunho.';return;}
            const hasCurrent=available.some(el=>el.value.trim());
            if(hasCurrent&&!window.confirm('Restaurar os textos salvos? Isso substituirá os textos atualmente digitados nestes campos.'))return;
            available.forEach(el=>{el.value=data.fields[el.id];el.dispatchEvent(new Event('input',{bubbles:true}));});
            status().textContent='✓ '+available.length+' campo(s) restaurado(s). Revise antes de enviar.';
          });
        }
      }
      // Workroom: session-only text recovery. Never persist images, passwords, votes or jury scores.
      if(isWork){
        const textFields=[...main.querySelectorAll('textarea')].filter(el=>!el.disabled&&!el.readOnly&&el.id&&!/password|vote|nota|score|critique|jurad/i.test(el.id));
        textFields.forEach(el=>{
          if(el.dataset.fauDraftReady)return;
          el.dataset.fauDraftReady='1';
          const scope=(document.querySelector('#globalStatusBanner')?.textContent||'').trim().slice(0,100);
          const identity=(typeof currentUser!=='undefined' && currentUser?.uid)||'no-user';
          const round=(typeof globalState!=='undefined' && globalState?.rodada)||'preseason';
          const key='fau:workroom:session:'+identity+':'+round+':'+scope+':'+el.id;
          let previous='';try{previous=sessionStorage.getItem(key)||'';}catch(e){}
          if(previous&&!el.value){
            const bar=document.createElement('div');bar.className='fau-ux-save-state';
            const restore=document.createElement('button');restore.type='button';restore.textContent='↺ Recuperar texto digitado nesta sessão';restore.className='underline underline-offset-4';
            restore.addEventListener('click',()=>{el.value=previous;el.dispatchEvent(new Event('input',{bubbles:true}));bar.remove();el.focus();});
            bar.appendChild(restore);el.insertAdjacentElement('afterend',bar);
          }
          el.addEventListener('input',()=>{try{sessionStorage.setItem(key,el.value);}catch(e){}},{passive:true});
        });
      }
    }finally{isApplying=false;}
  }
  let queued=false;
  const observer=new MutationObserver(()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;augment();});});
  observer.observe(main,{childList:true,subtree:true});
  augment();
  // Explicit network state feedback; never pretend an offline submission succeeded.
  const net=document.createElement('div');net.setAttribute('role','status');net.setAttribute('aria-live','polite');
  net.style.cssText='position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:9998;max-width:90vw;padding:10px 16px;border-radius:9px;background:#40212b;color:#fff;font-size:12px;box-shadow:0 8px 24px #0008;display:none;text-align:center';
  net.textContent='Sem conexão. Não envie sua criação até a internet voltar.';document.body.appendChild(net);
  function updateNetwork(){net.style.display=navigator.onLine?'none':'block';}
  window.addEventListener('online',updateNetwork);window.addEventListener('offline',updateNetwork);updateNetwork();
})();
</script>

<script id="fau-accessibility-v67-script">
(()=>{
'use strict';
const main=document.getElementById('mainView');if(!main)return;
const labels={WIN:'WIN · Melhor look da rodada',HIGH:'HIGH · Destaque',SAFE:'SAFE · Continua na competição',LOW:'LOW · Entre os piores',OUT:'OUT · Eliminado'};
let busy=false;
const apply=()=>{
 if(busy)return;busy=true;
 try{
  // Do not infer status from CSS color: explicit visible words are authoritative.
  main.querySelectorAll('[data-maison-status]').forEach(el=>{
   const key=(el.dataset.maisonStatus||'').toUpperCase();
   const label=labels[key]||((key==='CHAMPION'||key==='WINNER')?'WINNER · Campeão da temporada':'');
   if(label && el.dataset.fauStatusExplained!==key){
    el.dataset.fauStatusExplained=key;
    let note=el.querySelector('[data-fau-status-label]');
    if(!note){note=document.createElement('p');note.dataset.fauStatusLabel='';note.className='fau-status-text text-xs mt-3';el.prepend(note);}
    note.textContent='CLASSIFICAÇÃO: '+label;
   }
  });
  const hasRanking=!!main.querySelector('[data-maison-status],#trackRecord,#rankingTable');
  if(hasRanking&&!main.querySelector('[data-fau-access-legend]')){
   const legend=document.createElement('details');legend.className='fau-accessibility-legend';legend.dataset.fauAccessLegend='';
   const summary=document.createElement('summary');summary.textContent='Entenda as classificações (sem depender das cores)';
   const p=document.createElement('p');p.textContent='WIN = vencedor da rodada; HIGH = destaque; SAFE = continua na competição; LOW = entre os piores; OUT = eliminado. O Elimination Pool é uma etapa separada da classificação LOW. As cores são apenas apoio visual.';
   legend.append(summary,p);main.prepend(legend);
  }
  // Public look images are discoverable to keyboard users; accessible label when missing.
  main.querySelectorAll('img.img-look').forEach(img=>{
   if(!img.hasAttribute('alt')||!img.alt.trim())img.alt='Look de moda apresentado na passarela';
   if(!img.hasAttribute('tabindex'))img.tabIndex=0;
   if(!img.hasAttribute('role'))img.setAttribute('role','button');
   if(!img.hasAttribute('aria-label'))img.setAttribute('aria-label',(img.alt||'Look')+' — pressione Enter para ampliar');
   if(!img.dataset.fauKeyZoom){img.dataset.fauKeyZoom='1';img.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();img.click();}});}
  });
 }finally{busy=false;}
};
let pending=false;
new MutationObserver(()=>{if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;apply();});}).observe(main,{subtree:true,childList:true,attributes:true,attributeFilter:['data-maison-status']});
apply();
})();
</script>
<script id="fau-control-room-v73">
(()=>{
  'use strict';
  const focusTarget=(id)=>{const el=document.getElementById(id);if(!el)return false;el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});return true;};
  document.addEventListener('click',event=>{
    const target=event.target.closest('[data-production-target]');
    if(target?.closest('#fauProductionDesk')){
      const id=target.dataset.productionTarget;
      if(id==='ctrlAudit'){focusTarget('ctrlAudit');document.getElementById('ctrlAudit')?.click();return;}
      if(!focusTarget(id)){const hint=document.getElementById('fauDeskStageHint');if(hint)hint.textContent='Este controle ainda não está disponível nesta etapa.';}
      return;
    }
    const stage=event.target.closest('[data-production-stage]');
    if(stage?.closest('#fauProductionDesk')){
      const id=stage.dataset.productionStage;
      const control=document.querySelector(`[data-flow-stage="${id}"]`);
      const hint=document.getElementById('fauDeskStageHint');
      if(hint)hint.textContent=control?.innerText?.trim().replace(/\s+/g,' ')||'Etapa disponível na linha de produção.';
      if(control)control.scrollIntoView({behavior:'smooth',block:'center'});
    }
  });
  let lastRoot=null,observer=null;
  const refresh=()=>{
    const desk=document.getElementById('fauProductionDesk');
    if(!desk){if(observer){observer.disconnect();observer=null;lastRoot=null;}return;}
    const root=document.getElementById('fauStatusDashboard');
    if(!root)return;
    if(root!==lastRoot){observer?.disconnect();lastRoot=root;observer=new MutationObserver(update);observer.observe(root,{childList:true,subtree:true,characterData:true});}
    update();
  };
  const update=()=>{
    const root=document.getElementById('fauStatusDashboard');
    const list=document.getElementById('fauDeskQueue');
    const counter=document.getElementById('fauDeskQueueCount');
    if(!root||!list||!counter)return;
    const cards=[...root.querySelectorAll('article')];
    if(!cards.length){list.textContent='Aguardando dados da rodada. Use Atualizar no painel de pendências.';counter.textContent='Aguardando';return;}
    const jobs=cards.map(c=>{
      const title=c.querySelector('strong')?.textContent?.trim()||'Tarefa';
      const match=c.textContent.match(/(\d+) pendentes/);
      const pending=match?Number(match[1]):null;
      return {title,pending};
    });
    const outstanding=jobs.filter(j=>j.pending!==null&&j.pending>0);
    counter.textContent=outstanding.length?`${outstanding.length} áreas com pendências`:'Nenhuma pendência identificada';
    list.replaceChildren();

    shown.forEach(j=>{

      const detail=document.createElement('span');detail.className='block text-[11px] text-gray-400 mt-1';detail.textContent=j.pending===null?'Conferir detalhes':j.pending?`${j.pending} pendentes · conferir nomes`:'Concluído';
      b.append(title,detail);b.addEventListener('click',()=>focusTarget('fauStatusDashboard'));list.append(b);
    });
  };
  const watcher=new MutationObserver(()=>{const root=document.getElementById('fauStatusDashboard');if(root!==lastRoot)refresh();});
  watcher.observe(document.body,{childList:true,subtree:true});

<script id="fau-v92-full-simulation">
/* FAU PRODUCTION LAB: isolated, client-side end-to-end experience preview. */
(()=>{
'use strict';
const themes=[
 {name:'THE FIRST SIN',subtitle:'The Beginning of Everything',key:'first',slots:1,eliminate:false},
 {name:'AFTER EDEN',subtitle:'The Art of Evolution',key:'new',slots:1,eliminate:true},
 {name:'THE NEXT SUPREME',subtitle:'Old Supreme vs. Next Supreme',key:'supreme',slots:2,eliminate:true},
 {name:'REST IN STYLE',subtitle:'The Final Farewell',key:'rest',slots:1,eliminate:true},
 {name:'THE FOUR ACTS OF A LEGEND',subtitle:'The Final Show',key:'finale',slots:4,eliminate:false}
];
const officialThemes=typeof SEASON_THEMES!=='undefined'?Object.values(SEASON_THEMES):[];
const names=['ATELIER NOIR','STUDIO RUBI','CASA ÍRIS','ATELIER VÊNUS','STUDIO ÁUREA','CASA FERAL','ATELIER ECLIPSE','STUDIO SEDA'];
const judgeNames=['JURADO A','JURADO B','JURADO C'];
const colors=['#7d2535','#a38b69','#4c6680','#93669d','#c07645','#436f62','#8c8895','#bc7486'];
let sim=null,overlay=null,role='admin',tab='overview',person=1,judge=0;
const escape=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=()=>{sim.seed=(Math.imul(sim.seed,1664525)+1013904223)>>>0;return sim.seed/4294967296};
const number=()=>Math.round((32+rnd()*17)*10)/10;
const getPerson=id=>sim.people.find(p=>p.id===id);
const current=()=>sim.episode;
const live=()=>sim.people.filter(p=>!p.out);
const stageName={brief:'BRIEFING',workroom:'WORKROOM',runway:'RUNWAY',jury:'JUDGING',results:'RESULTADOS',done:'ARQUIVADO'};
function newSim(){sim={seed:86342,index:0,selectedThemeId:null,iconChoice:null,iconRevealed:false,stage:'brief',history:[],people:names.map((name,i)=>({id:i+1,name,out:false,total:0,wins:0,icons:0,color:colors[i]})),episode:null};role='admin';tab='overview';person=1;judge=0;makeEpisode();draw()}
function makeEpisode(){let official=officialThemes.find(x=>x.id===sim.selectedThemeId);let theme=official?{name:official.title,subtitle:official.subtitle,key:official.id,slots:official.numSubmissoes||1,eliminate:official.elimTipo!=='none',official}:themes[sim.index];if(!theme){sim.episode=null;sim.stage='done';return}
 let participants=theme.key==='finale'?[...live()].sort((a,b)=>b.total-a.total).slice(0,3):live();
 sim.episode={key:theme.key,theme:theme.name,subtitle:theme.subtitle,official:theme.official||null,rows:participants.map(p=>({id:p.id,looks:Array.from({length:theme.slots},(_,i)=>({id:`${sim.index}-${p.id}-${i}`,title:theme.key==='finale'?['THE ORIGIN','THE REINVENTION','THE CONFRONTATION','THE LEGACY'][i]:theme.key==='supreme'?['OLD SUPREME','NEXT SUPREME'][i]:`LOOK ${String(i+1).padStart(2,'0')}`,sent:false,judges:[null,null,null]})),selected:null,points:null,award:'—',icon:false,restLook:null,restVotes:[],eliminated:false})),published:false,bottom:[],eliminated:null,champion:null,iconVotes:{}};
 sim.stage='brief';tab='overview';person=participants[0]?.id||1;
}
function readyRows(){return current()?.rows||[]}
function chosenLook(r){return r.looks[(r.selected||1)-1]}
function submissionsComplete(){return readyRows().every(r=>r.looks.every(l=>l.sent))}
function voteSupremes(){if(current().key!=='supreme')return;readyRows().forEach(r=>{r.selected=1+Math.floor(rnd()*2)})}
function submitAll(){readyRows().forEach(r=>r.looks.forEach(l=>l.sent=true));sim.stage='runway';tab='runway';draw()}
function advance(){if(!current())return;
 if(sim.stage==='brief'){sim.stage='workroom';tab='workroom'}
 else if(sim.stage==='workroom'){submitAll();return}
 else if(sim.stage==='runway'){if(current().key==='supreme')voteSupremes();sim.stage='jury';tab='jury'}
 else if(sim.stage==='jury'){fillJudging();publish();return}
 else if(sim.stage==='results'){sim.history.push(JSON.parse(JSON.stringify(current())));sim.index++;sim.selectedThemeId=null;sim.iconChoice=null;sim.iconRevealed=false;makeEpisode();if(!current())tab='archive'}
 draw();}

function calcPoints(r){let looks=current().key==='supreme'?[chosenLook(r)]:r.looks;return Math.round(looks.reduce((a,l)=>a+l.judges.reduce((s,n)=>s+(n||0),0)/3,0)/looks.length*10)/10}
function publish(){const ep=current();if(!ep)return;fillJudging();ep.rows.forEach(r=>{r.points=calcPoints(r);r.award='SAFE'});const sorted=[...ep.rows].sort((a,b)=>b.points-a.points||a.id-b.id);if(sorted.length){sorted[0].award='WIN';getPerson(sorted[0].id).wins++}
 const icon=sorted.length?sorted[Math.floor(rnd()*sorted.length)]:null;if(icon){icon.icon=true;getPerson(icon.id).icons++}
 if((ep.official?ep.official.elimTipo!=='none':themes[sim.index].eliminate)){ep.bottom=sorted.slice(-Math.min(3,sorted.length)).map(r=>r.id);let eliminated=sorted[sorted.length-1];if(ep.key==='rest'){ep.bottom.forEach(id=>{let r=ep.rows.find(x=>x.id===id);r.restLook={title:'THE FINAL FAREWELL',sent:true};r.restVotes=Array.from({length:Math.max(1,ep.rows.length-3)},()=>number())});eliminated=[...sorted.filter(r=>ep.bottom.includes(r.id))].sort((a,b)=>average(a.restVotes)-average(b.restVotes))[0]}if(eliminated){eliminated.award='OUT';eliminated.eliminated=true;ep.eliminated=eliminated.id;getPerson(eliminated.id).out=true}}
 if(ep.key==='finale'&&sorted.length){sorted[0].award='WINNER';ep.champion=sorted[0].id}
 if(ep.key!=='finale')ep.rows.forEach(r=>getPerson(r.id).total+=r.points);
 ep.published=true;sim.stage='results';tab='results';draw();}
const average=a=>a.reduce((x,y)=>x+y,0)/(a.length||1);
const pill=(value,kind='')=>`<span class="fau92-pill ${kind}">${escape(value)}</span>`;
const garment=(p,look,idx=0)=>`<div class="fau92-garment" style="--fabric:${p.color};--angle:${(idx*23+p.id*11)%80-40}deg"><div class="fau92-silhouette"><div class="fau92-neck"></div><div class="fau92-top"></div><div class="fau92-skirt"></div></div><span class="fau92-watermark">SIMULATED LOOK</span></div>`;
const lookCard=(r,l,idx=0,opts={})=>{let p=getPerson(r.id);return `<article class="fau92-lookcard">${garment(p,l,idx)}<div class="fau92-lookinfo"><small>${escape(p.name)}</small><strong>${escape(l.title)}</strong><div class="fau92-meta">${l.sent?pill('ENTREGUE','good'):pill('RASCUNHO','warn')} ${r.selected===idx+1?pill('ESCOLHIDA','good'):''}</div>${opts.score&&l.judges.some(n=>n!=null)?`<p>Notas: ${l.judges.map(n=>n==null?'—':n.toFixed(1)).join(' · ')}</p>`:''}</div></article>`};

function workroom(){const ep=current();if(!ep)return empty('Temporada encerrada.');let rows=ep.rows.filter(r=>role!=='designer'||r.id===person);return `<div class="fau92-hero"><div class="fau92-kicker">THE WORKROOM · WEEK ${sim.index+1}</div><h3>${escape(ep.theme)}</h3><p>${escape(ep.subtitle)} · ${ep.key==='supreme'?'Duas Supremas por Designer':ep.key==='finale'?'Quatro editoriais por finalista':'Um editorial por Designer'}</p></div><div class="fau92-sectiontitle"><h4>DESIGNER SUBMISSIONS</h4><span>${ep.rows.reduce((n,r)=>n+r.looks.filter(l=>l.sent).length,0)} / ${ep.rows.reduce((n,r)=>n+r.looks.length,0)} looks enviados</span></div><div class="fau92-gallery">${rows.flatMap(r=>r.looks.map((l,i)=>lookCard(r,l,i))).join('')}</div>${role==='designer'?`<div class="fau92-notice">Esta é uma prévia fictícia da Workroom. Para testar um envio real, é necessário usar uma conta de teste conectada ao Firebase.</div>`:''}${role==='admin'&&sim.stage==='workroom'?`<div class="fau92-actions"><button class="primary" data-action="submit">SIMULAR TODAS AS ENTREGAS</button></div>`:''}`}
function runway(){const ep=current();if(!ep)return empty('Nenhum desfile ativo.');if(sim.stage==='brief'||sim.stage==='workroom')return empty('O desfile ainda não foi aberto. Avance a produção para visualizar os looks.');const visible=ep.rows.flatMap(r=>ep.key==='supreme'&&r.selected?[chosenLook(r)].map((l,i)=>[r,l,r.selected-1]):r.looks.map((l,i)=>[r,l,i]));return `<div class="fau92-hero"><div class="fau92-kicker">LIGHTS. CAMERA. RUNWAY.</div><h3>${escape(ep.theme)}</h3><p>${ep.key==='supreme'&&ep.rows.some(r=>r.selected)?'A plateia escolheu uma Suprema por Designer.':'As criações da rodada estão na passarela.'}</p></div><div class="fau92-gallery">${visible.map(([r,l,i])=>lookCard(r,l,i)).join('')}</div><section class="fau92-panel"><h4>👑 ÍCONE DA MODA</h4><p>Voto popular separado do WIN dos jurados. Nesta simulação, o Ícone é sorteado na publicação do resultado.</p>${role==='audience'?`<div class="fau92-notice">Prévia do espaço da plateia. Votações reais exigem uma conta autenticada e uma rodada configurada no Firebase.</div>`:''}</section>`}
function jury(){const ep=current();if(!ep)return empty('Temporada encerrada.');if(role==='audience')return empty('As avaliações individuais são privadas.');if(sim.stage==='brief'||sim.stage==='workroom'||sim.stage==='runway')return empty('O julgamento ainda não foi aberto.');return `<div class="fau92-hero"><div class="fau92-kicker">THE JURY ROOM · PRIVATE SESSION</div><h3>THE JUDGES' VERDICT</h3><p>Três jurados avaliam os editoriais. Cada nota é independente e não deve ser exibida à plateia.</p></div><div class="fau92-jurylist">${ep.rows.map(r=>`<section class="fau92-panel"><div class="fau92-row"><h4>${escape(getPerson(r.id).name)}</h4>${ep.published?pill(r.award,r.award==='OUT'?'warn':'good'):''}</div><div class="fau92-gallery compact">${r.looks.map((l,i)=>lookCard(r,l,i,{score:true})).join('')}</div>${r.looks.map((l,i)=>`<div class="fau92-scoreline"><span>${escape(l.title)}</span>${(role==='juror'?[judge]:[0,1,2]).map(j=>`<label>${escape(judgeNames[j])}<input type="number" min="0" max="50" step="0.1" data-score="${r.id}|${i}|${j}" value="${l.judges[j]??''}" ${ep.published?'disabled':''} placeholder="0–50" /></label>`).join('')}</div>`).join('')}</section>`).join('')}</div>${!ep.published?`<div class="fau92-notice">Notas simuladas são salvas apenas na memória desta página. Ao publicar, notas não preenchidas são geradas automaticamente.</div>`:''}`}
function results(){const ep=current();if(!ep)return empty('Temporada encerrada. Confira o Fashion Archive.');if(!ep.published)return empty('Resultados ainda não publicados. O ADM precisa concluir o julgamento.');let rows=[...ep.rows].sort((a,b)=>b.points-a.points);return `<div class="fau92-hero"><div class="fau92-kicker">THE FINAL VERDICT</div><h3>ONE DAY YOU'RE IN...</h3><p>${escape(ep.theme)} · Resultados oficiais fictícios</p></div><div class="fau92-leaderboard">${rows.map((r,i)=>`<div><b>${String(i+1).padStart(2,'0')}</b><span>${escape(getPerson(r.id).name)} ${r.icon?'✦':''}</span><strong>${escape(r.award)}</strong>${role==='admin'||role==='juror'?`<small>${r.points.toFixed(1)}</small>`:''}</div>`).join('')}</div><section class="fau92-panel"><h4>🏆 EPISODE HONORS</h4><p>WIN: <b>${escape(getPerson(rows.find(r=>r.award==='WIN'||r.award==='CHAMPION')?.id)?.name||'—')}</b></p><p>Ícone da Moda: <b>${escape(getPerson(rows.find(r=>r.icon)?.id)?.name||'—')}</b></p>${ep.eliminated?`<p>OUT: <b>${escape(getPerson(ep.eliminated).name)}</b></p>`:''}${ep.key==='rest'?`<p>🕯️ O Bottom 3 apresentou um segundo look. Os votos especiais não entraram no acumulado.</p>`:''}${ep.key==='finale'?`<p>🏆 A final foi julgada separadamente do acumulado.</p>`:''}</section>`}

function wire(){overlay.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draw()});overlay.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{let a=b.dataset.action;if(a==='close')overlay.hidden=true;if(a==='jumpTheme'){let id=overlay.querySelector('#fau93Theme')?.value;if(!id){alert('Escolha um tema.');return}sim.selectedThemeId=id;makeEpisode();draw();return}if(a==='chooseIcon'){let id=overlay.querySelector('#fau93IconTheme')?.value;if(!id){alert('Selecione um tema para o Ícone.');return}sim.iconChoice=id;sim.iconRevealed=false;draw();return}if(a==='revealIcon'){sim.iconRevealed=true;draw();return}if(a==='next')advance();if(a==='submit')submitAll();if(a==='reset'&&confirm('Reiniciar a temporada de teste?'))newSim();if(a==='export'){let blob=new Blob([JSON.stringify({simulation:true,generatedAt:new Date().toISOString(),...sim},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fau-full-test-run.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});overlay.querySelector('#fau92Role').onchange=e=>{role=e.target.value;tab=role==='audience'?'runway':role==='juror'?'jury':role==='designer'?'workroom':'overview';draw()};let p=overlay.querySelector('#fau92Person');if(p)p.onchange=e=>{person=Number(e.target.value);draw()};let j=overlay.querySelector('#fau92Judge');if(j)j.onchange=e=>{judge=Number(e.target.value);draw()};overlay.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{sim.selectedThemeId=b.dataset.jump;makeEpisode();tab='overview';draw()});overlay.querySelectorAll('[data-score]').forEach(i=>i.onchange=e=>{let [id,slot,j]=e.target.dataset.score.split('|').map(Number);let v=e.target.value.trim();let n=v===''?null:Number(v);if(n!==null&&(!Number.isFinite(n)||n<0||n>50)){alert('A nota deve estar entre 0 e 50.');draw();return}let r=current()?.rows.find(r=>r.id===id);if(r&&!current().published)r.looks[slot].judges[j]=n})}
function install(){const desk=document.querySelector('#fauProductionDesk');if(!desk||document.getElementById('fau92Launch'))return;if(typeof currentUser==='undefined'||!currentUser||currentUser.role!=='admin')return;let section=document.createElement('section');section.id='fau92Launch';section.className='rounded-xl border border-fashion-gold/50 bg-fashion-900 p-5 space-y-3';section.innerHTML='<p class="text-[10px] tracking-[.3em] text-fashion-gold">🧪 PRODUCTION LAB · ADMIN ONLY</p><h3 class="font-cinzel text-xl text-white">THE FULL TEST RUN</h3><p class="text-xs text-gray-300">Prévia de uma temporada completa: Workroom, Runway, Jury Room, resultados, Fashion Archive e visualização por perfil. Nenhuma gravação no Firebase.</p><button type="button" id="fau92Open" class="rounded bg-fashion-gold text-black px-4 py-3 text-xs font-bold">▶ ABRIR SIMULAÇÃO COMPLETA</button>';desk.after(section);section.querySelector('#fau92Open').onclick=()=>{if(!sim)newSim();else draw()}}
