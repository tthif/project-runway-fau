                numSubmissoes,
                elimTipo,
                elimDupla,
                naoEliminatoria,
                liberado: false,
                urna: false,
                berlinda: []
            }, { merge: true });

            showToast(`Rodada ${rid} iniciada! (${naoEliminatoria ? 'Não Eliminatória' : elimDupla ? 'Eliminação Dupla' : 'Elimina 1'})`);
        });

        $('#btnCreateAccount').onclick = safeExec(async () => {
            const real = $('#createRealName').value.trim();
            const username = $('#createUsername').value.trim();
            const pass = $('#createPassword').value;
            const role = $('#createRole').value;

            if (!real || !username || pass.length < 6) throw new Error('Preencha o nome real, nome de usuário e senha (mínimo 6 dígitos).');

            const ate = role === 'estilista' ? 'Maison ' + username : username;

            const tempAppName = `app_${Date.now()}`;
            const secondaryApp = firebase.initializeApp(firebaseConfig, tempAppName);
            try {
                const cred = await secondaryApp.auth().createUserWithEmailAndPassword(formatEmail(username), pass);
                await db.doc(`perfis/${cred.user.uid}`).set({ ate, username, role, disabled: false, estilistaFixo: '', bio: '', createdAt: now() });
                await db.doc(`identidades/${cred.user.uid}`).set({ real, username, ate, createdAt: now() });
                showToast(`Perfil de ${username} adicionado.`);
                $('#createRealName').value = '';
                $('#createUsername').value = '';
                $('#createPassword').value = '';
            } finally {
                await secondaryApp.delete();
            }
        });

        $('#btnApurarRanking').onclick = safeExec(async () => {
            const rows = await computeSeasonStandings();
            $('#adminOutput').innerHTML = printTable(rows);
        });

        $('#btnPublishRunway').onclick = safeExec(async () => {
            const standings = (await computeSeasonStandings()).sort((a, b) => b.rd - a.rd);
            const count = standings.length;
            const isFinal = globalState.fase === 'final';
            const isNonElim = globalState.elimTipo === 'none' || globalState.naoEliminatoria;

            const statuses = standings.map((item, idx) => {
                if (isFinal) return ['VENCEDOR DA TEMPORADA', '2º LUGAR', '3º LUGAR'][idx] || '';
                if (idx === 0) return 'WIN (PROTEGIDO)';
                if (isNonElim) return idx <= 2 ? 'TOP (HIGH SCORE)' : 'SAFE';
                if (idx >= count - 2) return 'BOTTOM (BERLINDA)';
                return 'SAFE';
            });

            const stateUpdate = {};
            if (globalState.fase === 'normal') {
                if (isNonElim) {
                    stateUpdate.berlinda = [];
                    stateUpdate.imune = standings[0].uid;
                } else {
                    const winUid = standings[0].uid;
                    const worstRound = standings.slice(-2);
                    const worstAccum = [...standings].sort((a, b) => a.tot - b.tot).find(x => x.uid !== winUid && !worstRound.some(w => w.uid === x.uid));
                    stateUpdate.berlinda = [...worstRound, worstAccum].filter(Boolean).map(x => ({ uid: x.uid, ate: x.ate }));
                    stateUpdate.imune = standings[0].uid;
                }
            }

            await db.doc('ranking/atual').set({
                rodada: globalState.rodada,
                rows: standings.map((x, i) => ({ ate: x.ate, status: statuses[i] }))
            });

            await db.doc('config/estado').set(stateUpdate, { merge: true });
            $('#adminOutput').innerHTML = `
                <p class="text-green-400 font-bold mb-2 font-cinzel">Classificação publicada na The Runway!</p>
                ${stateUpdate.berlinda?.length ? `<p><strong>NO BOTTOM (BERLINDA):</strong> ${stateUpdate.berlinda.map(b => b.ate).join(', ')}</p>` : '<p class="text-blue-300"><strong>Rodada Não Eliminatória:</strong> Ninguém na berlinda!</p>'}
                <p><strong>WINNER DA RODADA:</strong> ${standings[0]?.ate || 'N/A'}</p>
            `;
        });

        $('#btnApurarTribunal').onclick = safeExec(async () => {
            const atelierMap = await getAtelierNamesMap();
            let outputHtml = '';

            for (const [tipo, rotulo] of [['veto', 'Ícone da Moda (Melhor Look)'], ['fdm', 'Fora de Moda (Pior Look)']]) {
                const tally = Object.entries(await tallyVotes(tipo)).sort((a, b) => b[1] - a[1]);
                outputHtml += `
                    <div class="mb-3">
                        <strong>${rotulo}:</strong> ${tally.map(([uid, c]) => `${esc(atelierMap[uid])} (${c} votos)`).join(', ') || 'Nenhum voto.'}
                    </div>
                `;
            }
            $('#adminOutput').innerHTML = outputHtml;
        });

        $('#btnApurarBerlinda').onclick = safeExec(async () => {
            if (globalState.elimTipo === 'none' || globalState.naoEliminatoria) {
                $('#adminOutput').innerHTML = `<div class="p-4 bg-blue-900/30 border border-blue-600 rounded text-blue-300 font-cinzel">✨ RODADA NÃO ELIMINATÓRIA.</div>`;
                return;
            }
            const berlinda = globalState.berlinda || [];
            if (!berlinda.length) throw new Error('Não há participantes na berlinda.');

            const votes = await tallyVotes('ber');
            const isDouble = globalState.elimDupla === true;
            const topOf = async t => { const e = Object.entries(await tallyVotes(t)).sort((a, b) => b[1] - a[1]); return e.length && (e.length < 2 || e[0][1] > e[1][1]) ? e[0][0] : null; };
            const fdmUid = await topOf('fdm'), iconeUid = await topOf('veto');
            const key = u => u === fdmUid ? -1 : u === iconeUid ? 1 : 0;
            const sorted = [...berlinda].sort((a, b) => ((votes[a.uid] || 0) - (votes[b.uid] || 0)) || (key(a.uid) - key(b.uid)));
            const lowV = votes[sorted[0].uid] || 0;
            const tied = sorted.filter(x => (votes[x.uid] || 0) === lowV && key(x.uid) === key(sorted[0].uid));
            const tieNote = tied.length > 1 ? '<div class="text-yellow-300">⚖️ Empate sem Fora de Moda nem Ícone: o WIN da rodada decide quem é salvo.</div>' : '';
            let toEliminate = isDouble ? [sorted[0], sorted[1]].filter(Boolean) : [sorted[0]];

            $('#adminOutput').innerHTML = `
                <div class="space-y-3">
                    <span class="text-fashion-gold font-bold uppercase block font-cinzel">Veredito do Elimination Pool:</span>${tieNote}
                    ${berlinda.map(b => `<div>${esc(b.ate)}: <strong>${votes[b.uid] || 0} voto(s)</strong> para salvar</div>`).join('')}
                    <div class="p-3 bg-fashion-red/20 border border-fashion-red/40 rounded space-y-1 text-red-300">
                        <strong>Eliminados:</strong>
                        ${toEliminate.map(e => `<div>🚫 ${esc(e.ate)} ➔ OUT.</div>`).join('')}
                    </div>
                    <div class="flex gap-2">
                        ${toEliminate.map(e => `
                            <button data-exec="elim|${e.uid}" class="bg-fashion-red text-white px-3 py-1.5 rounded uppercase font-bold text-[10px]">
                                Confirmar Eliminação de ${esc(e.ate)}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        });

        $('#btnCalcTop5').onclick = safeExec(async () => {
            const standings = await computeSeasonStandings();
            if (globalState.fase !== 'top5' || standings.length !== 5) throw new Error('Exige fase Top 5 com exatamente 5 maisons.');

            const directFinalist = standings[0];
            const directEliminated = standings[4];
            const middleThree = standings.slice(1, 4).sort((a, b) => a.rd - b.rd);
            const roundEliminated = middleThree[0];
            const finalTop3 = [directFinalist, middleThree[1], middleThree[2]];

            calculationState = { outList: [directEliminated, roundEliminated], standings };

            $('#adminOutput').innerHTML = `
                <div class="space-y-3">
                    <span class="text-fashion-gold font-bold uppercase block font-cinzel">Cálculo do Duelo Top 5 ➔ Top 3:</span>
                    ${printTable(standings)}
                    <div class="p-3 bg-fashion-900 border border-fashion-700 rounded space-y-1 text-xs">
                        <div>👑 <strong>1º Lugar (Direto na Final):</strong> ${esc(directFinalist.ate)}</div>
                        <div>🚫 <strong>Eliminado Direto (OUT):</strong> ${esc(directEliminated.ate)}</div>
                        <div>✂️ <strong>Eliminado pelo Desempenho (OUT):</strong> ${esc(roundEliminated.ate)}</div>
                        <div class="pt-2 text-green-400 font-bold font-cinzel">🏆 TOP 3 FINALISTAS: ${finalTop3.map(f => esc(f.ate)).join(', ')}</div>
                    </div>
                    <button data-exec="apply-top5" class="bg-fashion-red hover:bg-red-700 text-white px-4 py-2 rounded uppercase font-bold text-xs">
                        Confirmar Top 3 e Concluir Fase
                    </button>
                </div>
            `;
        });

        $('#btnHallOfFame').onclick = safeExec(async () => {
            const evalSnap = await db.collection('avaliacoes').get();
            const scoresByRound = {};
            evalSnap.docs.forEach(d => {
                const data = d.data();
                (scoresByRound[data.rodada] ??= []).push({ ate: data.alvoAte, total: data.total });
            });

            let html = '<div class="space-y-4"><h4 class="font-cinzel text-fashion-gold font-bold text-sm">🏆 Hall da Fama (Vencedores por Rodada)</h4>';
            for (const rodada in scoresByRound) {
                const sorted = scoresByRound[rodada].sort((a, b) => b.total - a.total);
                const winner = sorted[0];
                if (winner) {
                    html += `<div class="bg-fashion-900 p-2.5 rounded border border-fashion-700 flex justify-between items-center text-xs"><span class="font-cinzel text-white font-bold">Rodada: ${esc(rodada)}</span><span class="text-fashion-gold font-bold">👑 ${esc(winner.ate)} (${winner.total} pts)</span></div>`;
                }
            }
            html += '</div>';
            $('#adminOutput').innerHTML = html;
        });

        $('#btnAuditLogs').onclick = safeExec(async () => {
            const votesSnap = await db.collection('votos').where('rodada', '==', globalState.rodada).orderBy('t', 'desc').get();
            const atelierMap = await getAtelierNamesMap();

            $('#adminOutput').innerHTML = `
                <div class="space-y-2">
                    <span class="text-fashion-gold font-bold uppercase block font-cinzel">Registro de Votos da Rodada:</span>
                    <div class="max-h-60 overflow-y-auto space-y-1 text-[11px]">
                        ${votesSnap.docs.map(d => {
                            const v = d.data();
                            return `<div class="p-1.5 bg-fashion-900 border border-fashion-800 rounded flex justify-between"><span><strong>${esc(v.voterName || v.voter)}</strong> votou em <strong>${esc(atelierMap[v.alvo] || v.alvo)}</strong> [${v.tipo}]</span></div>`;
                        }).join('') || '<div class="text-gray-500">Nenhum voto registrado.</div>'}
                    </div>
                </div>
            `;
        });

        $('#btnExportJSON').onclick = safeExec(async () => {
            const [perfis, looks, avaliacoes, votos] = await Promise.all([
                db.collection('perfis').get(),
                db.collection('looks').get(),
                db.collection('avaliacoes').get(),
                db.collection('votos').get()
            ]);
            const seasonData = {
                config: globalState,
                perfis: perfis.docs.map(d => ({ id: d.id, ...d.data() })),
                looks: looks.docs.map(d => ({ id: d.id, ...d.data() })),
                avaliacoes: avaliacoes.docs.map(d => ({ id: d.id, ...d.data() })),
                votos: votos.docs.map(d => ({ id: d.id, ...d.data() }))
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(seasonData, null, 2));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = `project_runway_fau_ai_backup_${now()}.json`;
            a.click();
            showToast('Backup exportado.');
        });

        $('#btnLiveBroadcast').onclick = safeExec(async () => {
            const standings = (await computeSeasonStandings()).sort((a, b) => b.rd - a.rd);
            const winner = standings[0];
            const modal = $('#broadcastModal');
            const stage = $('#broadcastStage');

            stage.innerHTML = `
                <div class="space-y-3">
                    <span class="text-xs uppercase tracking-[0.3em] text-fashion-gold font-bold font-cinzel">Vencedor(a) da Rodada</span>
                    <h1 class="font-cinzel text-4xl text-white font-bold tracking-wider">${winner ? esc(winner.ate) : 'Calculando...'}</h1>
                    <p class="text-sm text-fashion-gold uppercase tracking-widest font-mono">You are the WINNER of this challenge. Imunidade garantida.</p>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-4">
                    ${standings.slice(0, 3).map((s, idx) => `
                        <div class="bg-fashion-900 border border-fashion-700 p-3 rounded-lg space-y-1">
                            <span class="text-xs font-cinzel text-fashion-gold font-bold">TOP #${idx + 1}</span>
                            <div class="text-base font-bold text-white">${esc(s.ate)}</div>
                            <div class="text-xs text-gray-400 font-mono">Nota: ${s.rd} (Total: ${s.tot})</div>
                        </div>
                    `).join('')}
                </div>

                ${globalState.berlinda?.length ? `
                    <div class="bg-fashion-red/20 border border-fashion-red/50 p-4 rounded-lg text-center space-y-1">
                        <span class="text-xs font-bold text-fashion-red uppercase font-mono tracking-wider">No BOTTOM (Berlinda)</span>
                        <div class="text-lg font-cinzel text-white font-bold">${globalState.berlinda.map(b => esc(b.ate)).join('  vs  ')}</div>
                    </div>
                ` : ''}
            `;
            modal.classList.remove('hidden');
        });

        $('#btnWppDispatch').onclick = safeExec(async () => {
            const standings = (await computeSeasonStandings()).sort((a, b) => b.rd - a.rd);
            const evalsSnap = await db.collection('avaliacoes').where('rodada', '==', globalState.rodada).get();
            const commentsByStylist = {};
            evalsSnap.docs.forEach(doc => {
                const data = doc.data();
                const text = data.comentAdmin || '';
                if (text && text.trim()) {
                    (commentsByStylist[data.alvoAte || data.alvo] ??= []).push({ jurado: data.juradoNome || 'Jurado', txt: text.trim() });
                }
            });

            const lines = [
                '*PROJECT RUNWAY: FAU\'S EDITION* (AI EDITION) 🪡🤖',
                `*RESULTADO OFICIAL — THE RUNWAY · RODADA ${globalState.rodada ? globalState.rodada.toUpperCase() : ''}*`,
                '---------------------------------------------',
                `👑 *WINNER:* ${standings[0]?.ate || 'N/A'} (PROTEGIDO NO POOL)`,
                '',
                '📊 *CLASSIFICAÇÃO:*',
                ...standings.map((s, idx) => `#${idx + 1} *${s.ate}* — Nota: ${s.rd} | Total: ${s.tot}`),
                '',
                globalState.berlinda?.length ? `⚠️ *BERLINDA:* ${globalState.berlinda.map(b => b.ate).join(' vs ')}` : '',
                '---------------------------------------------',
                '💬 *PARECERES DOS JURADOS:*',
                ...standings.map(s => {
                    const jurComments = commentsByStylist[s.ate];
                    if (!jurComments || !jurComments.length) return `\n📌 *${s.ate}:* _Sem comentários._`;
                    return `\n📌 *${s.ate}:*\n` + jurComments.map(c => `  • _${c.jurado}:_ "${c.txt}"`).join('\n');
                }),
                '\n---------------------------------------------',
                '_Make It Work!_'
            ].filter(Boolean).join('\n');

            $('#adminOutput').innerHTML = `
                <div class="space-y-2">
                    <span class="text-green-400 font-bold block font-cinzel">Texto Formatado para o WhatsApp:</span>
                    <textarea class="w-full h-48 bg-fashion-900 border border-fashion-700 rounded p-2 text-white font-mono text-xs focus:outline-none">${esc(lines)}</textarea>
                    <a href="https://api.whatsapp.com/send?text=${encodeURIComponent(lines)}" target="_blank" class="inline-block bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded uppercase font-bold text-xs">
                        <i class="fa-brands fa-whatsapp"></i> Abrir no WhatsApp
                    </a>
                </div>
            `;
        });

        $('#mainView').onclick = safeExec(async e => {
            const btn = e.target.closest('button[data-act], button[data-exec]');
            if (!btn) return;
            const act = btn.dataset.act || btn.dataset.exec?.split('|')[0];
            const uid = btn.dataset.uid;
            const atelierMap = await getAtelierNamesMap();

            if (act === 'save-role') {
                const sel = document.querySelector(`select[data-role-select="${uid}"]`);
                if (!sel) return;
                const newRole = sel.value;
                await db.doc(`perfis/${uid}`).update({ role: newRole });
                showToast(`Cargo atualizado.`);
            }

            if (act === 'toggle-status') {
                const currentDisabled = btn.dataset.current === 'true';
                await db.doc(`perfis/${uid}`).update({ disabled: !currentDisabled });
                showToast(`Status atualizado.`);
            }

            if (act === 'delete-profile') {
                const name = btn.dataset.name || 'este perfil';
                if (!confirm(`Deseja excluir "${name}"?`)) return;
                const batch = db.batch();
                batch.delete(db.doc(`perfis/${uid}`));
                batch.delete(db.doc(`identidades/${uid}`));
                await batch.commit();
                showToast('Excluído.');
            }

            if (btn.dataset.exec) {
                const [execAct, val] = btn.dataset.exec.split('|');
                if (execAct === 'elim') {
                    await db.doc(`perfis/${val}`).update({ out: true });
                    showToast(`${atelierMap[val]} está OUT.`);
                }
                if (execAct === 'apply-top5' && calculationState) {
                    for (const outItem of calculationState.outList) {
                        await db.doc(`perfis/${outItem.uid}`).update({ out: true });
                    }
                    await db.doc('config/estado').update({ fase: 'final' });
                    showToast('Top 3 definido para a Grande Final.');
                }
            }
        });

        sub(db.collection('identidades').orderBy('createdAt', 'desc'), snap => {
            $('#castAuditList').innerHTML = snap.docs.map(d => {
                const data = d.data();
                return `<div class="p-1 border-b border-fashion-800 flex justify-between"><span>${esc(data.real)}</span> <strong class="text-fashion-gold">${esc(data.ate)}</strong></div>`;
            }).join('') || '<span class="text-gray-500">Nenhum registro.</span>';
        });
    };

    window.openAtelierHistory = async (atelierUid, atelierName) => {
        const modal = $('#atelierHistoryModal');
        const title = $('#historyModalTitle');
        const content = $('#historyModalContent');

        title.textContent = `Portfólio da Maison — ${atelierName}`;
        content.innerHTML = '<p class="col-span-full text-gray-400 py-8">Carregando looks e pontuações...</p>';
        modal.classList.remove('hidden');

        const [looksSnap, evalsSnap, perfilSnap] = await Promise.all([
            db.collection('looks').where('uid', '==', atelierUid).get(),
            db.collection('avaliacoes').where('alvo', '==', atelierUid).get(),
            db.doc(`perfis/${atelierUid}`).get()
        ]);

        const looks = looksSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.t - a.t);
        const evals = evalsSnap.docs.map(d => d.data());
        const perfilData = perfilSnap.data() || {};

        if (!looks.length) {
            content.innerHTML = '<p class="col-span-full text-gray-500 py-8">Nenhum look registrado.</p>';
            return;
        }

        let bioHtml = '';
        if (perfilData.bio) {
            bioHtml = `<div class="col-span-full bg-fashion-950 p-3 rounded border border-fashion-gold/40 text-left text-xs text-gray-300 italic mb-2">
                <strong class="text-fashion-gold not-italic font-cinzel">Estilista Assinatura: ${esc(perfilData.estilistaFixo || 'N/D')}</strong> — "${esc(perfilData.bio)}"
            </div>`;
        }

        content.innerHTML = bioHtml + looks.map(l => {
            const lookEvals = evals.filter(e => e.look === l.id);
            const avgTotal = lookEvals.length ? (lookEvals.reduce((a, b) => a + b.total, 0) / lookEvals.length).toFixed(1) : null;

            return `
                <div class="bg-fashion-950 p-3 rounded border border-fashion-700 space-y-2 text-left flex flex-col justify-between">
                    <div class="space-y-2">
                        <img src="${esc(l.url)}" class="w-full img-look rounded border border-fashion-700 shadow">
                        <div class="flex justify-between items-center text-[10px]">
                            <span class="font-cinzel text-fashion-gold font-bold">Rodada: ${esc(l.rodada)}</span>
                            <span class="text-gray-400 font-cinzel">${esc(l.titulo || '')}</span>
                        </div>
                        <div class="bg-fashion-900 p-2 rounded border border-fashion-700/60 text-center">
                            <span class="text-[9px] uppercase tracking-wider text-gray-400 block font-cinzel">Nota dos Jurados</span>
                            <div class="font-mono font-bold text-fashion-gold text-sm">${avgTotal !== null ? `${avgTotal} / 50.0 pts` : 'Aguardando Júri'}</div>
                        </div>
                    </div>
                    <p class="text-[11px] text-gray-300 italic leading-relaxed line-clamp-3">${esc(l.mem)}</p>
                </div>
            `;
        }).join('');
    };

    window.closeAtelierHistoryModal = () => { $('#atelierHistoryModal').classList.add('hidden'); };
    window.closeBroadcastModal = () => { $('#broadcastModal').classList.add('hidden'); };
</script>

<script>
    (() => {
        const sp = document.getElementById('splash');
        let seen = false; try { seen = sessionStorage.getItem('splash'); sessionStorage.setItem('splash', '1'); } catch (e) {}
        if (sp && seen) sp.remove();
        else if (sp) setTimeout(() => { sp.style.opacity = 0; setTimeout(() => sp.remove(), 1000); }, 2800);
        const Q = ['“Make it work. And make it unforgettable.”', '“Designers, you have a challenge!”', '“I don\'t want to see safe. I want to see fashion.”', '“You have to take risks to stand out.”', '“One challenge can change everything.”', '“Auf Wiedersehen!”', '“This is the final countdown. Make it count.”'];
        const el = document.getElementById('quoteStrip'); let i = 0;
        const show = () => { el.style.opacity = 0; setTimeout(() => { el.textContent = Q[i++ % Q.length]; el.style.opacity = 1; }, 600); };
        show(); setInterval(show, 7000);
    })();
</script>
</body>
</html>
