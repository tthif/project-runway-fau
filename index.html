<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT RUNWAY: FAU'S EDITION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        fashion: {
                            950: '#080808',
                            900: '#111111',
                            850: '#151419',
                            800: '#1a1921',
                            700: '#2c2933',
                            600: '#3a3643',
                            gold: '#c9a24b',
                            'gold-hover': '#b58f3c',
                            sand: '#f3ede2',
                            red: '#b3263e'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Firebase SDKs Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #080808; color: #f3ede2; }
        .font-cinzel { font-family: 'Cinzel', serif; letter-spacing: 0.05em; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #080808; }
        ::-webkit-scrollbar-thumb { background: #2c2933; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #c9a24b; }
        input[type=range] { accent-color: #c9a24b; }
        .img-editorial { aspect-ratio: 3/4; object-fit: cover; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-fashion-gold selection:text-black">

    <!-- CABEÇALHO EDITORIAL -->
    <header class="border-b border-fashion-700 bg-fashion-900/90 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="navigate('runway')">
                <span class="font-cinzel font-bold text-white text-base tracking-widest">PROJECT RUNWAY</span>
                <span class="text-xs text-fashion-gold tracking-widest uppercase border-l border-fashion-700 pl-3 font-cinzel">FAU'S EDITION</span>
            </div>
            <div id="userHeaderSlot" class="flex items-center space-x-3 text-xs">
                <!-- Preenchido via Javascript -->
            </div>
        </div>
    </header>

    <!-- NAVEGAÇÃO SUPERIOR -->
    <nav class="border-b border-fashion-700 bg-fashion-950 sticky top-16 z-30 overflow-x-auto">
        <div id="navContainer" class="max-w-6xl mx-auto px-4 flex space-x-1 py-1 text-xs uppercase tracking-widest font-medium">
            <!-- Abas dinâmicas montadas com base no perfil -->
        </div>
    </nav>

    <!-- BANNER DE STATUS GLOBAL / VETO ATIVO -->
    <div id="globalStatusBanner" class="hidden bg-fashion-900 border-b border-fashion-700 text-xs py-2 px-4 text-center"></div>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-8">
        <div id="mainView" class="space-y-8">
            <!-- As vistas são injetadas dinamicamente aqui -->
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-fashion-700 bg-fashion-950 py-6 text-center text-[10px] text-gray-500 uppercase tracking-widest">
        PROJECT RUNWAY: FAU'S EDITION &mdash; High Fashion Competition System
    </footer>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-fashion-900 border border-fashion-gold text-fashion-sand px-5 py-2.5 rounded shadow-2xl text-xs uppercase tracking-wider hidden z-50 flex items-center gap-2">
        <i class="fa-solid fa-circle-info text-fashion-gold"></i>
        <span id="toastMsg"></span>
    </div>

    <!-- SCRIPT DO SISTEMA MESTRE -->
    <script>
        // CONFIGURAÇÃO DO FIREBASE (Insira as credenciais do seu projeto da consola Firebase)
        const firebaseConfig = {
            apiKey: "COLE_AQUI_SUA_API_KEY",
            authDomain: "project-runway-faus.firebaseapp.com",
            projectId: "project-runway-faus",
            storageBucket: "project-runway-faus.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // Helpers de Segurança & Texto
        const $ = s => document.querySelector(s);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const slug = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
        const formatEmail = n => slug(n) + '@fau.game';
        const now = () => Date.now();

        const CRITERIOS = [
            'Criatividade & Originalidade',
            'Styling & Composição',
            'Interpretação do Briefing',
            'Harmonia Modelo & Look',
            'Impacto Visual & Coesão'
        ];

        const ROTULOS_ABAS = {
            work: 'Workroom',
            guerra: 'Sala de Guerra',
            runway: 'The Runway',
            tribunal: 'Tribunal Front Row',
            berlinda: 'A Berlinda',
            conf: 'Confessionário',
            bancada: 'Bancada de Júri',
            direcao: 'Direção Executiva'
        };

        const ABAS_POR_PERFIL = {
            estilista: ['work', 'guerra', 'runway', 'tribunal', 'berlinda', 'conf'],
            jurado: ['bancada', 'runway'],
            plateia: ['runway', 'tribunal'],
            admin: ['direcao', 'runway', 'guerra', 'conf']
        };

        // Estado da Aplicação
        let currentUser = null;
        let isAdmin = false;
        let globalState = {};
        let activeTab = 'runway';
        let unsubsGlobal = [];
        let unsubsTab = [];
        let isAuthProcessing = false;

        const showToast = (msg, duration = 3500) => {
            const t = $('#toast');
            $('#toastMsg').textContent = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), duration);
        };

        const renderView = html => {
            $('#mainView').innerHTML = html;
        };

        const sub = (query, callback) => unsubsTab.push(query.onSnapshot(callback, err => showToast(`Erro: ${err.message}`)));

        const safeExec = fn => async (...args) => {
            try {
                await fn(...args);
            } catch (err) {
                console.error(err);
                showToast(err.message || 'Ocorreu um erro na operação.');
            }
        };

        // Compressão Editorial e Remoção de EXIF no Canvas
        const compressImage = file => new Promise(resolve => {
            const img = new Image();
            img.onload = () => {
                const maxDim = 1400;
                const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
                const canvas = document.createElement('canvas');
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                canvas.toBlob(resolve, 'image/jpeg', 0.88);
            };
            img.src = URL.createObjectURL(file);
        });

        // Contagem Decrescente do Workroom
        setInterval(() => {
            const clock = $('#roundTimer');
            if (!clock) return;
            const diff = (globalState.prazo || 0) - now();
            if (diff <= 0) {
                clock.textContent = 'ENCERRADO';
                clock.classList.add('text-fashion-red');
                return;
            }
            const h = Math.floor(diff / 36e5);
            const m = Math.floor((diff % 36e5) / 6e4);
            const s = Math.floor((diff % 6e4) / 1e3);
            clock.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }, 1000);

        // AUTENTICAÇÃO E LOGIN EDITORIAL
        const showLogin = () => {
            renderView(`
                <div class="max-w-md mx-auto my-12 bg-fashion-900 border border-fashion-700 rounded-lg p-8 space-y-6 shadow-2xl">
                    <div class="text-center space-y-2">
                        <span class="text-xs uppercase tracking-[0.2em] text-fashion-gold font-medium">Portal Oficial</span>
                        <h2 class="font-cinzel text-2xl text-white font-normal">Identificação de Acesso</h2>
                        <p class="text-xs text-gray-400">Insira as credenciais do seu ateliê ou perfil de júri.</p>
                    </div>

                    <div class="space-y-4 text-xs">
                        <div>
                            <label class="block text-gray-400 mb-1 uppercase tracking-wider">Identificador (Nome do Ateliê / Direção)</label>
                            <input id="loginName" class="w-full bg-fashion-950 border border-fashion-700 rounded p-2.5 text-white focus:outline-none focus:border-fashion-gold" placeholder="Ex: Ateliê Iris ou direcao">
                        </div>
                        <div>
                            <label class="block text-gray-400 mb-1 uppercase tracking-wider">Chave de Acesso / Senha</label>
                            <input id="loginPass" type="password" class="w-full bg-fashion-950 border border-fashion-700 rounded p-2.5 text-white focus:outline-none focus:border-fashion-gold" placeholder="••••••••">
                        </div>
                        <div class="flex items-center gap-2 pt-2 text-gray-400">
                            <input id="isGuestCheck" type="checkbox" class="w-4 h-4 rounded bg-fashion-950 border-fashion-700 accent-fashion-gold">
                            <label for="isGuestCheck" class="cursor-pointer">Acesso Convidado (Primeira Fila / Público)</label>
                        </div>
                        <button id="btnLogin" class="w-full bg-fashion-gold hover:bg-fashion-gold-hover text-black font-semibold py-3 rounded text-xs uppercase tracking-widest transition duration-150">
                            Entrar na Temporada
                        </button>
                    </div>
                </div>
            `);

            $('#btnLogin').onclick = safeExec(async () => {
                const name = $('#loginName').value.trim();
                const pass = $('#loginPass').value;
                const isGuest = $('#isGuestCheck').checked;

                if (!name || !pass) throw new Error('Preencha os campos de acesso.');

                try {
                    await auth.signInWithEmailAndPassword(formatEmail(name), pass);
                } catch (err) {
                    if (!isGuest) throw new Error('Credenciais inválidas. Contacte a Direção.');
                    isAuthProcessing = true;
                    try {
                        const cred = await auth.createUserWithEmailAndPassword(formatEmail(name), pass);
                        await db.doc(`perfis/${cred.user.uid}`).set({
                            ate: name,
                            role: 'plateia',
                            createdAt: now()
                        });
                    } finally {
                        isAuthProcessing = false;
                    }
                    initUserSession(auth.currentUser);
                }
            });
        };

        const initUserSession = async user => {
            unsubsGlobal.forEach(u => u());
            unsubsGlobal = [];
            unsubsTab.forEach(u => u());
            unsubsTab = [];
            $('#navContainer').innerHTML = '';

            if (!user) {
                $('#userHeaderSlot').innerHTML = '';
                return showLogin();
            }

            const adminCheck = await db.doc(`admins/${user.uid}`).get();
            isAdmin = adminCheck.exists;
            const profileSnap = await db.doc(`perfis/${user.uid}`).get();
            const profileData = profileSnap.data() || {};

            currentUser = {
                uid: user.uid,
                role: 'plateia',
                ate: 'Convidado',
                ...profileData
            };

            if (isAdmin) {
                currentUser.role = 'admin';
                currentUser.ate = 'Direção Executiva';
            }

            $('#userHeaderSlot').innerHTML = `
                <span class="text-fashion-gold font-medium font-cinzel">${esc(currentUser.ate)}</span>
                <span class="text-[10px] bg-fashion-800 text-gray-400 px-2 py-0.5 rounded border border-fashion-700 uppercase">${currentUser.role}</span>
                <button onclick="auth.signOut()" class="text-gray-400 hover:text-white transition ml-2" title="Terminar Sessão">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                </button>
            `;

            unsubsGlobal.push(db.doc('config/estado').onSnapshot(snap => {
                globalState = snap.data() || {};
                updateGlobalBanner();
                navigate(activeTab);
            }));
        };

        const updateGlobalBanner = () => {
            const b = $('#globalStatusBanner');
            if (globalState.vetoDetAtelier && globalState.vetoModeloNome) {
                b.innerHTML = `<span class="text-fashion-gold font-bold font-cinzel">VETO EXECUTADO:</span> O modelo <strong>${esc(globalState.vetoModeloNome)}</strong> foi bloqueado para os adversários e fica reservado exclusivamente ao ateliê <strong>${esc(globalState.vetoDetAtelier)}</strong>.`;
                b.classList.remove('hidden');
            } else {
                b.classList.add('hidden');
            }
        };

        const navigate = tabKey => {
            let allowedTabs = ABAS_POR_PERFIL[currentUser?.role] || ['runway'];
            if (currentUser?.out && currentUser?.role === 'estilista') {
                allowedTabs = ['runway', 'guerra'];
            }

            activeTab = allowedTabs.includes(tabKey) ? tabKey : allowedTabs[0];
            unsubsTab.forEach(u => u());
            unsubsTab = [];

            $('#navContainer').innerHTML = allowedTabs.map(t => `
                <button onclick="navigate('${t}')" class="px-3 py-2 border-b-2 transition ${t === activeTab ? 'border-fashion-gold text-fashion-gold font-bold' : 'border-transparent text-gray-400 hover:text-white'}">
                    ${ROTULOS_ABAS[t]}
                </button>
            `).join('');

            VIEWS[activeTab]();
        };

        auth.onAuthStateChanged(user => {
            if (!isAuthProcessing) initUserSession(user);
        });

        // VISTAS DO SISTEMA
        const VIEWS = {};

        // 1. SALA DE GUERRA & CONFESSIONÁRIO
        const setupChat = (collectionName, title, subtitle) => () => {
            renderView(`
                <div class="space-y-4">
                    <div class="border-b border-fashion-700 pb-2">
                        <span class="text-xs uppercase tracking-widest text-fashion-gold font-medium font-cinzel">${title}</span>
                        <h2 class="font-cinzel text-xl text-white font-normal">${subtitle}</h2>
                    </div>
                    <div id="chatFeed" class="bg-fashion-900 border border-fashion-700 rounded-lg p-4 h-96 overflow-y-auto space-y-3 font-mono text-xs">
                        <p class="text-gray-500 italic text-center py-8">A sincronizar mensagens confidenciais...</p>
                    </div>
                    <div class="flex gap-2">
                        <input id="chatInput" class="flex-grow bg-fashion-950 border border-fashion-700 rounded p-2.5 text-xs text-white focus:outline-none focus:border-fashion-gold" placeholder="Escreva a sua mensagem oficial...">
                        <button id="btnSendChat" class="bg-fashion-gold hover:bg-fashion-gold-hover text-black font-semibold px-6 py-2.5 rounded text-xs uppercase tracking-wider transition">
                            Publicar
                        </button>
                    </div>
                </div>
            `);

            sub(db.collection(collectionName).orderBy('t').limitToLast(120), snap => {
                const feed = $('#chatFeed');
                feed.innerHTML = snap.docs.map(d => {
                    const m = d.data();
                    const isSelf = m.uid === currentUser.uid;
                    return `
                        <div class="p-2.5 rounded ${isSelf ? 'bg-fashion-800/80 border border-fashion-gold/30 ml-8' : 'bg-fashion-950 border border-fashion-700 mr-8'} space-y-1">
                            <div class="flex justify-between items-center text-[10px] text-gray-400 border-b border-fashion-700/50 pb-1">
                                <span class="font-cinzel font-bold text-fashion-gold">${esc(m.ate)}</span>
                                <span>${new Date(m.t).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</span>
                            </div>
                            <p class="text-fashion-sand text-xs leading-relaxed font-sans">${esc(m.txt)}</p>
                        </div>
                    `;
                }).join('');
                feed.scrollTop = feed.scrollHeight;
            });

            $('#btnSendChat').onclick = safeExec(async () => {
                const input = $('#chatInput');
                const text = input.value.trim();
                if (!text) return;
                await db.collection(collectionName).add({
                    ate: currentUser.ate,
                    uid: currentUser.uid,
                    txt: text,
                    t: now()
                });
                input.value = '';
            });

            $('#chatInput').onkeydown = e => {
                if (e.key === 'Enter') $('#btnSendChat').click();
            };
        };

        VIEWS.guerra = setupChat('sala_de_guerra', 'Bastidores Confinados', 'Sala de Guerra em Tempo Real');
        VIEWS.conf = setupChat('confessionarios', 'Depoimentos Oficiais', 'O Confessionário');

        // 2. WORKROOM
        VIEWS.work = () => {
            let modelosList = [];
            let mySubmissions = [];
            let roundSubmissions = [];
            let activeStylistsCount = 0;
            const isFinalPhase = globalState.fase === 'final';

            renderView(`
                <div class="space-y-6">
                    <div class="bg-fashion-900 border border-fashion-700 p-6 rounded-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div class="space-y-1">
                            <span class="text-xs uppercase tracking-widest text-fashion-gold font-medium font-cinzel">Ambiente de Criação</span>
                            <h2 class="font-cinzel text-2xl text-white font-normal">Workroom · Rodada ${esc(globalState.rodada || 'Pendente')}</h2>
                            <p class="text-xs text-gray-400">Respeite o cronómetro rigoroso e certifique-se das restrições de casting.</p>
                        </div>
                        <div class="bg-fashion-950 border border-fashion-700 px-6 py-3 rounded text-center">
                            <span class="text-[10px] uppercase tracking-widest text-gray-400 block mb-1">Encerramento</span>
                            <div id="roundTimer" class="font-mono text-xl font-bold text-fashion-gold">--:--:--</div>
                        </div>
                    </div>

                    <!-- TERMÓMETRO ANÓNIMO -->
                    <div id="workroomThermometer" class="bg-fashion-900 border border-fashion-700 p-4 rounded-lg flex items-center justify-between text-xs">
                        <span class="text-gray-400">A carregar termómetro anónimo de submissões...</span>
                    </div>

                    <!-- MÓDULO DE ATIVAÇÃO DE VETO (SE APLICÁVEL) -->
                    <div id="vetoActivationModule"></div>

                    <!-- MESA DE CORTE & SUBMISSÃO -->
                    <div id="workroomFormModule"></div>
                </div>
            `);

            const refreshWorkroomUI = () => {
                const currentRoundLooks = mySubmissions.filter(l => l.rodada === globalState.rodada);
                const usedModelIds = new Set((isFinalPhase ? currentRoundLooks : mySubmissions).map(l => l.modelo));
                const requiredLooks = isFinalPhase ? 4 : 1;
                const distinctSenders = new Set(roundSubmissions.map(e => e.uid)).size;

                $('#workroomThermometer').innerHTML = `
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-chart-pie text-fashion-gold"></i>
                        <span><strong>Estado dos Ateliês:</strong> ${distinctSenders} enviados | ${Math.max(activeStylistsCount - distinctSenders, 0)} pendentes</span>
                    </div>
                    <span class="text-[10px] uppercase font-mono text-gray-500">Total Ativos: ${activeStylistsCount}</span>
                `;

                // Veto de Casting
                const canCastVeto = globalState.vetoDet === currentUser.uid && !globalState.vetoModeloNome;
                if (canCastVeto) {
                    const availableToVeto = modelosList.filter(m => !m.vetoPor);
                    $('#vetoActivationModule').innerHTML = `
                        <div class="bg-fashion-900 border border-fashion-gold/40 p-4 rounded-lg space-y-3">
                            <div class="flex items-center gap-2 text-fashion-gold text-xs font-bold font-cinzel">
                                <i class="fa-solid fa-gavel"></i>
                                <span>PODER DE VETO ATIVO — Escolha o Modelo a Barrar</span>
                            </div>
                            <div class="flex gap-2">
                                <select id="vetoTargetSelect" class="bg-fashion-950 border border-fashion-700 rounded p-2 text-xs text-white flex-grow focus:outline-none">
                                    ${availableToVeto.map(m => `<option value="${m.id}|${m.nome}">${esc(m.nome)} [${m.g}]</option>`).join('')}
                                </select>
                                <button id="btnExecuteVeto" class="bg-fashion-gold hover:bg-fashion-gold-hover text-black px-4 py-2 rounded text-xs font-semibold uppercase tracking-wider">
                                    Confirmar Veto
                                </button>
                            </div>
                        </div>
                    `;
                } else {
                    $('#vetoActivationModule').innerHTML = '';
                }

                // Formulário de Submissão
                const formSlot = $('#workroomFormModule');
                if (currentRoundLooks.length >= requiredLooks) {
                    formSlot.innerHTML = `
                        <div class="bg-fashion-900 border border-green-800/40 p-6 rounded-lg text-center space-y-2">
                            <i class="fa-solid fa-circle-check text-green-500 text-2xl"></i>
                            <h3 class="font-cinzel text-base text-white">Submissão Concluída (${currentRoundLooks.length}/${requiredLooks})</h3>
                            <p class="text-xs text-gray-400">O seu look encontra-se em arquivo sob sigilo e aguarda avaliação dos jurados.</p>
                        </div>
                    `;
                } else {
                    // Filtrar modelos: não usados e não vetados (ou vetados por si mesmo)
                    const availableModels = modelosList.filter(m => {
                        const notUsed = !usedModelIds.has(m.id);
                        const vetoPermitted = !m.vetoPor || m.vetoPor === currentUser.uid;
                        return notUsed && vetoPermitted;
                    }).sort((a, b) => a.nome.localeCompare(b.nome));

                    formSlot.innerHTML = `
                        <div class="bg-fashion-900 border border-fashion-700 p-6 rounded-lg space-y-6">
                            <div class="border-b border-fashion-700 pb-3 flex justify-between items-center">
                                <h3 class="font-cinzel text-lg text-white font-normal">Mesa de Corte & Confecção</h3>
                                <span class="text-xs text-fashion-gold">${isFinalPhase ? `Look ${currentRoundLooks.length + 1} de 4 (Obrigatório: 2F + 2M)` : 'Look da Rodada'}</span>
                            </div>

                            <div class="space-y-4 text-xs">
                                <div>
                                    <label class="block text-gray-400 mb-2 uppercase tracking-wider font-semibold">1. Selecionar Modelo Disponível</label>
                                    <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-3 max-h-60 overflow-y-auto p-2 bg-fashion-950 border border-fashion-700 rounded">
                                        ${availableModels.map(m => `
                                            <label class="block relative border border-fashion-700 rounded p-1 hover:border-fashion-gold cursor-pointer bg-fashion-900 transition">
                                                <input type="radio" name="selectedModel" value="${m.id}" data-gender="${m.g}" class="absolute top-2 right-2 accent-fashion-gold">
                                                <img src="${esc(m.foto)}" class="w-full aspect-[3/4] object-cover rounded mb-1" loading="lazy">
                                                <div class="text-[10px] text-center font-medium text-white truncate">${esc(m.nome)}</div>
                                                <div class="text-[9px] text-center text-gray-400">[${m.g}] ${m.vetoPor ? '🔒 Exclusivo' : ''}</div>
                                            </label>
                                        `).join('')}
                                    </div>
                                </div>

                                <div>
                                    <label class="block text-gray-400 mb-1 uppercase tracking-wider font-semibold">2. Fotografia do Look</label>
                                    <input type="file" id="lookFileInput" accept="image/*" class="w-full bg-fashion-950 border border-fashion-700 rounded p-2 text-white">
                                </div>

                                <div>
                                    <label class="block text-gray-400 mb-1 uppercase tracking-wider font-semibold">3. Memorial Conceitual</label>

                    await db.doc(`modelos/${mId}`).update({ vetoPor: currentUser.uid });

                        vetoModeloNome: mNome,
                        vetoDetAtelier: currentUser.ate
                    });
                    showToast('Veto de casting concretizado.');
                }

                if (target.id === 'btnSubmitLook') {
                    if (now() > globalState.prazo) throw new Error('O prazo da rodada expirou.');
                    const modelRadio = document.querySelector('input[name="selectedModel"]:checked');
                    const file = $('#lookFileInput').files[0];
                    const memorial = $('#lookMemorialText').value.trim();

                    if (!modelRadio || !file || !memorial) {
                        throw new Error('Escolha o modelo, anexe a foto e elabore o memorial.');
                    }

                    const modelId = modelRadio.value;
                    const modelGender = modelRadio.dataset.gender;

                    // Verificação Paritária da Final
                    const currentRoundLooks = mySubmissions.filter(l => l.rodada === globalState.rodada);
                    if (isFinalPhase) {
                        const countGender = currentRoundLooks.filter(l => l.g === modelGender).length;
                        if (countGender >= 2) throw new Error(`Limite de 2 modelos do género [${modelGender}] já atingido para a Final.`);

                    const compressedBlob = await compressImage(file);
                    await storageRef.put(compressedBlob);
                    const photoUrl = await storageRef.getDownloadURL();

                    const batch = db.batch();
                    batch.set(db.doc(`looks/${lookDocId}`), {
                        uid: currentUser.uid,
                        ate: currentUser.ate,
                        rodada: globalState.rodada,
                        modelo: modelId,
                        g: modelGender,
                        url: photoUrl,
                        mem: memorial,
                        t: now()
                    });
                    batch.set(db.doc(`envios/${lookDocId}`), {
                        rodada: globalState.rodada,
                        uid: currentUser.uid
                    });

                    await batch.commit();
                    showToast('Look gravado com sucesso no arquivo do Reality.');

            // Carregamento de dados

                activeStylistsCount = snap.docs.filter(d => !d.data().out).length;

                refreshWorkroomUI();

        // 3. BANCADA DOS JURADOS
        VIEWS.bancada = () => {
            let looks = [];
            let evaluations = {};
            let currentMediaRecorder = null;
            let audioChunks = [];

            renderView(`
                <div class="space-y-6">
                    <div class="border-b border-fashion-700 pb-3">
                        <span class="text-xs uppercase tracking-widest text-fashion-gold font-medium font-cinzel">Avaliação Técnica Especializada</span>
                        <h2 class="font-cinzel text-xl text-white font-normal">Bancada de Júri · Rodada ${esc(globalState.rodada || '')}</h2>
                    </div>
                    <div id="juryCardsContainer" class="space-y-8"></div>
                </div>

            const refreshJuryUI = () => {
                const container = $('#juryCardsContainer');
                if (!looks.length) {
                    container.innerHTML = `<div class="bg-fashion-900 border border-fashion-700 p-8 rounded-lg text-center text-gray-500 text-xs">Nenhum look submetido até ao momento nesta rodada.</div>`;
                    return;
                }

                container.innerHTML = looks.map(look => {
                    const ev = evaluations[look.id] || {};

                    const audioUrl = ev.audio || '';

                    return `
                        <div class="bg-fashion-900 border border-fashion-700 rounded-lg p-6 space-y-6" data-look="${look.id}">

                                <div class="md:col-span-4 space-y-2">

                                    <div class="font-cinzel font-bold text-fashion-gold text-sm">${esc(look.ate)}</div>
                                    <p class="text-xs text-gray-400 italic bg-fashion-950 p-2.5 rounded border border-fashion-700/60 leading-relaxed">${esc(look.mem)}</p>

                                <div class="md:col-span-8 space-y-4 text-xs">
                                    <div class="flex justify-between items-center border-b border-fashion-700 pb-2">
                                        <span class="uppercase tracking-wider text-gray-400 font-semibold">Critérios Oficiais (0.0 a 10.0)</span>
                                        <div class="font-cinzel text-fashion-gold font-bold text-sm">
                                            Total: <span id="tot-${look.id}">${(scores.reduce((a, b) => a + b, 0)).toFixed(1)}</span> / 50.0
                                        </div>
                                    </div>

                                    <div class="space-y-3">
                                        ${CRITERIOS.map((c, i) => `
                                            <div class="space-y-1">
                                                <div class="flex justify-between text-gray-300">
                                                    <span>${c}</span>
                                                    <span class="font-mono text-fashion-gold font-bold" id="val-${look.id}-${i}">${Number(scores[i]).toFixed(1)}</span>
                                                </div>
                                                <input type="range" min="0" max="10" step="0.1" value="${scores[i]}" 
                                                    data-look-id="${look.id}" data-idx="${i}" 
                                                    class="score-slider w-full h-1 bg-fashion-700 rounded cursor-pointer">
                                            </div>
                                        `).join('')}
                                    </div>

                                    <!-- COMENTÁRIOS MÚLTIPLOS -->
                                    <div class="space-y-2 pt-2 border-t border-fashion-700/70">
                                        <label class="block uppercase tracking-wider text-gray-400 font-semibold">Pareceres Textuais</label>
                                        <div id="commentBox-${look.id}" class="space-y-2">
                                            ${comments.map(c => `
                                                <textarea class="w-full bg-fashion-950 border border-fashion-700 rounded p-2 text-white focus:outline-none focus:border-fashion-gold" rows="2" placeholder="Observação técnica...">${esc(c)}</textarea>
                                            `).join('')}
                                        </div>
                                        <button data-action="add-comment" data-look="${look.id}" class="text-fashion-gold text-[11px] hover:underline uppercase">
                                            + Adicionar outro parecer

                                    <!-- GRAVAÇÃO DE NOTA DE VOZ -->
                                    <div class="pt-2 border-t border-fashion-700/70 space-y-2">

            // Event Listeners dos Sliders
            $('#mainView').oninput = e => {
                if (e.target.classList.contains('score-slider')) {
                    const lId = e.target.dataset.lookId;
                    const idx = e.target.dataset.idx;
                    $(`#val-${lId}-${idx}`).textContent = Number(e.target.value).toFixed(1);

                    const sliders = [...document.querySelectorAll(`.score-slider[data-look-id="${lId}"]`)];
                    const sum = sliders.reduce((acc, curr) => acc + Number(curr.value), 0);
                    $(`#tot-${lId}`).textContent = sum.toFixed(1);
                }
            };

            // Event Delegation de Ações do Júri
            $('#mainView').onclick = safeExec(async e => {
                const btn = e.target.closest('button[data-action]');
                if (!btn) return;

                const act = btn.dataset.action;
                const lookId = btn.dataset.look;

                if (act === 'add-comment') {
                    const box = $(`#commentBox-${lookId}`);
                    const area = document.createElement('textarea');
                    area.className = 'w-full bg-fashion-950 border border-fashion-700 rounded p-2 text-white focus:outline-none focus:border-fashion-gold';
                    area.rows = 2;
                    area.placeholder = 'Observação técnica adicional...';
                    box.appendChild(area);
                }

                if (act === 'record-audio') {
                    if (currentMediaRecorder && currentMediaRecorder.state === 'recording') {
                        currentMediaRecorder.stop();
                        return;
                    }

                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioChunks = [];
                    currentMediaRecorder = new MediaRecorder(stream);
                    currentMediaRecorder.ondataavailable = ev => audioChunks.push(ev.data);

                    currentMediaRecorder.onstop = safeExec(async () => {
                        stream.getTracks().forEach(t => t.stop());
                        showToast('A enviar áudio da bancada...');
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const ref = storage.ref(`audios/${lookId}_${currentUser.uid}.webm`);
                        await ref.put(blob);
                        const audioUrl = await ref.getDownloadURL();

                        await db.doc(`avaliacoes/${lookId}_${currentUser.uid}`).set({
                            audio: audioUrl
                        }, { merge: true });

                        showToast('Nota de voz registada.');
                        $(`#recStatus-${lookId}`).textContent = 'Gravar Nova Nota';

                    const targetLook = looks.find(l => l.id === lookId);

                        alvo: targetLook.uid,
                        rodada: targetLook.rodada,

                        juradoNome: currentUser.ate,

                        coment: comments,
                        t: now()

                    showToast(`Notas para ${targetLook.ate} validadas com sucesso.`);
                }
            });

            sub(db.collection('looks').where('rodada', '==', globalState.rodada || '-'), snap => {
                looks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                refreshJuryUI();
            });

            sub(db.collection('avaliacoes').where('jurado', '==', currentUser.uid), snap => {

                snap.docs.forEach(d => evaluations[d.data().look] = d.data());
                refreshJuryUI();

        // 4. THE RUNWAY & FACE-OFF

                        <h2 class="font-cinzel text-xl text-white">Desfile sob Sigilo da Direção</h2>
                        <p class="text-xs text-gray-400 leading-relaxed font-light">

                        </p>
                    </div>
                `);
                return;
            }

            let looks = [];
            let reactions = [];
            let selectedFaceOff = [];

            renderView(`
                <div class="space-y-8">

                            <span class="text-xs uppercase tracking-widest text-fashion-gold font-medium font-cinzel">Passarela Oficial</span>
                            <h2 class="font-cinzel text-2xl text-white font-normal">The Runway · Rodada ${esc(globalState.rodada || '')}</h2>

                    </div>

                    <!-- QUADRO DE CLASSIFICAÇÃO PUBLICADO -->
                    <div id="publishedRankingBox"></div>

                    <!-- COMPARADOR FACE-OFF -->
                    <div id="faceOffComparisonBox" class="hidden bg-fashion-900 border border-fashion-gold/40 p-6 rounded-lg space-y-4"></div>

                    <!-- GRADE DE LOOKS -->
                    <div id="runwayGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
                </div>
            `);

            const refreshRunwayUI = () => {
                // Face-Off
                const foBox = $('#faceOffComparisonBox');
                if (selectedFaceOff.length === 2) {
                    const [lookA, lookB] = selectedFaceOff.map(id => looks.find(l => l.id === id)).filter(Boolean);
                    if (lookA && lookB) {
                        foBox.classList.remove('hidden');
                        foBox.innerHTML = `
                            <div class="flex justify-between items-center border-b border-fashion-700 pb-2">
                                <span class="font-cinzel text-xs text-fashion-gold font-bold tracking-widest uppercase">Comparador Editorial: Face-Off</span>
                                <button onclick="selectedFaceOff = []; refreshRunwayUI();" class="text-gray-400 hover:text-white text-xs">Fechar</button>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="space-y-2 text-center">
                                    <img src="${esc(lookA.url)}" class="w-full img-editorial rounded border border-fashion-700">
                                    <span class="font-cinzel font-bold text-white text-xs">${esc(lookA.ate)}</span>
                                </div>
                                <div class="space-y-2 text-center">
                                    <img src="${esc(lookB.url)}" class="w-full img-editorial rounded border border-fashion-700">
                                    <span class="font-cinzel font-bold text-white text-xs">${esc(lookB.ate)}</span>
                                </div>
                            </div>
                        `;
                    }
                } else {
                    foBox.classList.add('hidden');
                }

                // Grid de Looks
                $('#runwayGrid').innerHTML = looks.map(look => {
                    const reactCounts = {};
                    reactions.filter(r => r.look === look.id).forEach(r => {
                        reactCounts[r.e] = (reactCounts[r.e] || 0) + 1;
                    });

                    const isChecked = selectedFaceOff.includes(look.id);

                    return `
                        <div class="bg-fashion-900 border border-fashion-700 rounded-lg overflow-hidden space-y-3 p-4 flex flex-col justify-between">
                            <div class="space-y-2">
                                <div class="flex justify-between items-center border-b border-fashion-700/60 pb-2">
                                    <span class="font-cinzel font-bold text-white text-xs tracking-wider">${esc(look.ate)}</span>
                                    <label class="flex items-center gap-1.5 text-[10px] text-gray-400 cursor-pointer">
                                        <input type="checkbox" data-faceoff="${look.id}" ${isChecked ? 'checked' : ''} class="accent-fashion-gold">
                                        <span>Face-Off</span>

                                <img src="${esc(look.url)}" class="w-full img-editorial rounded border border-fashion-700 shadow" loading="lazy">
                                <p class="text-[11px] text-gray-400 italic line-clamp-3 leading-relaxed">${esc(look.mem)}</p>

                                    <span class="text-[10px] font-mono px-2 py-0.5 rounded ${row.status.includes('WIN') ? 'bg-fashion-gold/20 text-fashion-gold' : row.status.includes('BOTTOM') ? 'bg-fashion-red/20 text-red-400' : 'bg-fashion-800 text-gray-300'} font-bold uppercase">${esc(row.status)}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
        };

        // 5. TRIBUNAL FRONT ROW
        VIEWS.tribunal = () => {
            renderView(`
                <div class="max-w-2xl mx-auto space-y-6">
                    <div class="border-b border-fashion-700 pb-3 text-center">
                        <span class="text-xs uppercase tracking-widest text-fashion-gold font-medium font-cinzel">Soberania Popular</span>

        VIEWS.berlinda = () => {

            if (!globalState.urna || !bottomList.length) {
                renderView(`

            const getAtelierNamesMap = async () => {
                const snap = await db.collection('perfis').get();
                return Object.fromEntries(snap.docs.map(d => [d.id, d.data().ate]));
            };

            const tallyVotes = async type => {
                const snap = await db.collection('votos').where('rodada', '==', globalState.rodada).where('tipo', '==', type).get();
                const counts = {};
                snap.docs.forEach(d => {
                    counts[d.data().alvo] = (counts[d.data().alvo] || 0) + 1;
                });
                return counts;
            };

            const computeSeasonStandings = async () => {
                const [profilesSnap, evalsSnap] = await Promise.all([
                    db.collection('perfis').where('role', '==', 'estilista').get(),
                    db.collection('avaliacoes').get()
                ]);

                const evaluationsByLook = {};
                evalsSnap.docs.forEach(d => {
                    const data = d.data();
                    ((evaluationsByLook[data.alvo] ??= {})[data.look] ??= { r: data.rodada, scores: [] }).scores.push(data.total);
                });

                const activeStylists = profilesSnap.docs.filter(d => !d.data().out);
                const rows = activeStylists.map(doc => {
                    let totalAccumulated = 0;
                    let currentRoundScore = 0;
                    const looksObj = evaluationsByLook[doc.id] || {};

                    for (const lookKey in looksObj) {
                        const lookData = looksObj[lookKey];
                        const avg = lookData.scores.reduce((a, b) => a + b, 0) / lookData.scores.length;
                        if (lookData.r === globalState.rodada) currentRoundScore += avg;
                        if (globalState.fase !== 'final' || lookData.r === globalState.rodada) {
                            totalAccumulated += avg;
                        }
                    }

                    return {
                        uid: doc.id,
                        ate: doc.data().ate,
                        tot: Number(totalAccumulated.toFixed(2)),
                        rd: Number(currentRoundScore.toFixed(2))
                    };
                });

                return rows.sort((a, b) => b.tot - a.tot || b.rd - a.rd);
            };

            const printTable = rows => `
                <table class="w-full text-left">
                    <thead><tr class="border-b border-fashion-700 text-fashion-gold"><th>#</th><th>Ateliê</th><th>Acumulado</th><th>Rodada Atual</th></tr></thead>
                    <tbody>${rows.map((r, i) => `<tr class="border-b border-fashion-800"><td>${i + 1}</td><td>${esc(r.ate)}</td><td>${r.tot}</td><td>${r.rd}</td></tr>`).join('')}</tbody>
                </table>
            `;

            // Controlos Rápidos
            $('#btnTogglePublic').onclick = safeExec(async () => {
                await db.doc('config/estado').update({ liberado: !globalState.liberado });
                showToast('Estado da passarela atualizado.');
            });

            $('#btnToggleUrn').onclick = safeExec(async () => {
                await db.doc('config/estado').update({ urna: !globalState.urna });
                showToast('Estado da urna atualizado.');
            });

            $('#btnStartRound').onclick = safeExec(async () => {
                const rid = slug($('#newRoundId').value);
                const pzVal = $('#newRoundDeadline').value;
                if (!rid || !pzVal) throw new Error('Defina o ID e o prazo da rodada.');

                const pzTimestamp = new Date(pzVal).getTime();
                const modelsSnap = await db.collection('modelos').get();
                const batch = db.batch();

                // Limpar vetos ativos da rodada anterior
                modelsSnap.docs.forEach(d => {
                    if (d.data().vetoPor) batch.update(d.ref, { vetoPor: '' });
                });

                batch.set(db.doc('config/estado'), {
                    rodada: rid,
                    prazo: pzTimestamp,
                    fase: $('#newRoundPhase').value,
                    liberado: false,
                    urna: false,
                    berlinda: [],
                    vetoDet: '',
                    vetoModeloNome: '',
                    vetoDetAtelier: ''
                }, { merge: true });

                await batch.commit();
                showToast(`Rodada ${rid} iniciada com sucesso.`);
            });

            $('#btnCreateAccount').onclick = safeExec(async () => {
                const real = $('#createRealName').value.trim();
                const ate = $('#createAtelierName').value.trim();
                const pass = $('#createPassword').value;
                const role = $('#createRole').value;

                if (!real || !ate || pass.length < 6) {
                    throw new Error('Preencha os campos obrigatórios (senha mínima: 6 caracteres).');
                }

                // Criação segura de sessão secundária
                const tempAppName = `app_${Date.now()}`;
                const secondaryApp = firebase.initializeApp(firebaseConfig, tempAppName);
                try {
                    const cred = await secondaryApp.auth().createUserWithEmailAndPassword(formatEmail(ate), pass);
                    await db.doc(`perfis/${cred.user.uid}`).set({ ate, role });
                    await db.doc(`identidades/${cred.user.uid}`).set({ real, ate, createdAt: now() });
                    showToast(`Perfil de ${ate} adicionado.`);
                    $('#createRealName').value = '';
                    $('#createAtelierName').value = '';
                    $('#createPassword').value = '';
                } finally {
                    await secondaryApp.delete();
                }
            });

            $('#btnAddModel').onclick = safeExec(async () => {
                const nome = $('#modelNameInput').value.trim();
                const foto = $('#modelPhotoUrlInput').value.trim();
                const g = $('#modelGenderInput').value;

                if (!nome || !foto) throw new Error('Defina o nome e a URL da foto.');

                await db.collection('modelos').add({
                    nome,
                    foto,
                    g,
                    vetoPor: ''
                });

                showToast(`Modelo ${nome} integrado ao casting.`);
                $('#modelNameInput').value = '';
                $('#modelPhotoUrlInput').value = '';
            });

            // Apurações
            $('#btnApurarRanking').onclick = safeExec(async () => {
                const rows = await computeSeasonStandings();
                $('#adminOutput').innerHTML = printTable(rows);
            });

            $('#btnPublishRunway').onclick = safeExec(async () => {
                const standings = (await computeSeasonStandings()).sort((a, b) => b.rd - a.rd);
                const count = standings.length;
                const isFinal = globalState.fase === 'final';

                const statuses = standings.map((item, idx) => {
                    if (isFinal) return ['VENCEDOR', 'RUNNER-UP', '3º LUGAR'][idx] || '';
                    if (idx === 0) return 'WIN (IMUNE)';
                    if (idx >= count - 2) return 'BOTTOM (RODADA)';
                    return 'SAFE';
                });

                const stateUpdate = {};
                if (globalState.fase === 'normal') {
                    // Pior da rodada 1 e 2
                    const worstRound = standings.filter(x => x.uid !== globalState.imune).slice(-2);
                    // Pior do acumulado que não esteja imune nem no worstRound
                    const worstAccum = [...standings].sort((a, b) => a.tot - b.tot).find(x => x.uid !== globalState.imune && !worstRound.some(w => w.uid === x.uid));

                    stateUpdate.berlinda = [...worstRound, worstAccum].filter(Boolean).map(x => ({ uid: x.uid, ate: x.ate }));
                    stateUpdate.imune = standings[0].uid;
                }

                await db.doc('ranking/atual').set({
                    rodada: globalState.rodada,
                    rows: standings.map((x, i) => ({ ate: x.ate, status: statuses[i] }))
                });

                await db.doc('config/estado').set(stateUpdate, { merge: true });
                $('#adminOutput').innerHTML = `
                    <p class="text-green-400 font-bold mb-2">Classificação publicada na Passarela.</p>
                    ${stateUpdate.berlinda ? `<p><strong>Formação da Berlinda:</strong> ${stateUpdate.berlinda.map(b => b.ate).join(', ')}</p>` : ''}
                    <p><strong>Imunidade da Próxima Rodada:</strong> ${standings[0]?.ate || 'N/A'}</p>
                `;
            });

            $('#btnApurarTribunal').onclick = safeExec(async () => {
                const atelierMap = await getAtelierNamesMap();
                let outputHtml = '';

                for (const [tipo, rotulo] of [['veto', 'Favorito (Poder de Veto)'], ['fdm', 'Fora de Moda']]) {
                    const tally = Object.entries(await tallyVotes(tipo)).sort((a, b) => b[1] - a[1]);
                    outputHtml += `
                        <div class="mb-3">
                            <strong>${rotulo}:</strong> ${tally.map(([uid, c]) => `${esc(atelierMap[uid])} (${c})`).join(', ') || 'Nenhum voto.'}
                            ${tally[0] ? `
                                <button data-exec="${tipo}|${tally[0][0]}" class="ml-2 bg-fashion-800 text-fashion-gold border border-fashion-600 px-2 py-0.5 rounded text-[10px] uppercase font-bold">
                                    Atribuir a ${esc(atelierMap[tally[0][0]])}
                                </button>
                            ` : ''}
                        </div>
                    `;
                }
                $('#adminOutput').innerHTML = outputHtml;
            });

            $('#btnApurarBerlinda').onclick = safeExec(async () => {
                const berlinda = globalState.berlinda || [];
                if (!berlinda.length) throw new Error('Não há ateliês na Berlinda.');

                const votes = await tallyVotes('ber');
                const minVotes = Math.min(...berlinda.map(b => votes[b.uid] || 0));
                const tied = berlinda.filter(b => (votes[b.uid] || 0) === minVotes);

                let eliminated = tied[0];
                let reason = 'Menor número de votos para salvar.';

                if (tied.length > 1) {
                    const fdmMatch = tied.find(b => b.uid === globalState.fdm?.uid);
                    if (fdmMatch) {
                        eliminated = fdmMatch;
                        reason = 'Empate fatal: possuía o selo Fora de Moda.';
                    } else {
                        const standings = await computeSeasonStandings();
                        eliminated = [...tied].sort((a, b) => {
                            const totA = standings.find(x => x.uid === a.uid)?.tot || 0;
                            const totB = standings.find(x => x.uid === b.uid)?.tot || 0;
                            return totA - totB;
                        })[0];
                        reason = 'Empate sem selo: pior acumulado histórico da temporada.';
                    }
                }

                $('#adminOutput').innerHTML = `
                    <div class="space-y-2">
                        <p><strong>Contagem de Salvação:</strong></p>
                        ${berlinda.map(b => `<div>${esc(b.ate)}: ${votes[b.uid] || 0} voto(s)</div>`).join('')}
                        <p class="text-fashion-red font-bold pt-2">Eliminado: ${esc(eliminated.ate)} (${reason})</p>
                        <button data-exec="elim|${eliminated.uid}" class="bg-fashion-red hover:bg-red-700 text-white px-4 py-1.5 rounded uppercase font-bold text-[10px]">
                            Confirmar Eliminação
                        </button>
                    </div>
                `;
            });

            $('#btnCalcTop5').onclick = safeExec(async () => {
                const standings = await computeSeasonStandings();
                if (globalState.fase !== 'top5' || standings.length !== 5) {
                    throw new Error('Esta ação exige a fase Top 5 com exatamente 5 estilistas ativos.');
                }

                const directFinalist = standings[0];
                const directEliminated = standings[4];
                const middleThree = standings.slice(1, 4).sort((a, b) => a.rd - b.rd);
                const roundEliminated = middleThree[0];
                const qualifiedMiddle = [middleThree[1], middleThree[2]];

                const finalTop3 = [directFinalist, qualifiedMiddle[0], qualifiedMiddle[1]];

                calculationState = {
                    outList: [directEliminated, roundEliminated],
                    standings
                };

                $('#adminOutput').innerHTML = `
                    <div class="space-y-3">
                        <span class="text-fashion-gold font-bold uppercase block">Cálculo Oficial do Top 5:</span>
                        ${printTable(standings)}
                        <div class="p-3 bg-fashion-900 border border-fashion-700 rounded space-y-1">
                            <div>👑 <strong>Finalista 1 (1º Acumulado):</strong> ${esc(directFinalist.ate)} (${directFinalist.tot} pts)</div>

                            <div>✂️ <strong>Eliminado na Rodada (Pior dos 3 do Meio):</strong> ${esc(roundEliminated.ate)} (${roundEliminated.rd} pts na rodada)</div>
                            <div class="pt-2 text-green-400 font-bold">🏆 Top 3 da Grande Final: ${finalTop3.map(f => esc(f.ate)).join(', ')}</div>
                        </div>
                        <button data-exec="apply-top5" class="bg-fashion-red hover:bg-red-700 text-white px-4 py-2 rounded uppercase font-bold text-xs">
                            Efetivar Top 3 e Eliminações
                        </button>
                    </div>
                `;
            });

            $('#btnWppDispatch').onclick = safeExec(async () => {
                const standings = (await computeSeasonStandings()).sort((a, b) => b.rd - a.rd);
                const lines = [
                    `*PROJECT RUNWAY: FAU'S EDITION* 🪡✨`,
                    `*COMUNICADO OFICIAL DA DIREÇÃO — RODADA ${globalState.rodada?.toUpperCase()}*`,
                    `---------------------------------------------`,
                    `👑 *Vencedor(a) da Rodada:* ${standings[0]?.ate || 'N/A'} (Imune)`,
                    ``,
                    `📊 *Classificação da Passarela:*`,
                    ...standings.map((s, idx) => `#${idx + 1} *${s.ate}* — Nota: ${s.rd} (Acumulado: ${s.tot})`),
                    ``,
                    globalState.berlinda?.length ? `⚠️ *A BERLINDA ESTÁ FORMADA:* ${globalState.berlinda.map(b => b.ate).join(' vs ')}` : '',
                    `---------------------------------------------`,
                    `_Aceda ao portal para acompanhar o Tribunal e a Sala de Guerra._`
                ].filter(Boolean).join('\n');

                $('#adminOutput').innerHTML = `
                    <div class="space-y-2">
                        <span class="text-green-400 font-bold block">Texto Formatado para o WhatsApp:</span>
                        <textarea class="w-full h-36 bg-fashion-900 border border-fashion-700 rounded p-2 text-white font-mono text-xs focus:outline-none">${lines}</textarea>
                        <a href="https://api.whatsapp.com/send?text=${encodeURIComponent(lines)}" target="_blank" class="inline-block bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded uppercase font-bold text-xs">
                            <i class="fa-brands fa-whatsapp"></i> Abrir no WhatsApp Web
                        </a>
                    </div>
                `;
            });

            // Handlers de Ações Delegadas
            $('#mainView').onclick = safeExec(async e => {
                const btn = e.target.closest('button[data-exec]');
                if (!btn) return;

                const [act, val] = btn.dataset.exec.split('|');
                const atelierMap = await getAtelierNamesMap();

                if (act === 'veto') {
                    await db.doc('config/estado').update({ vetoDet: val });
                    showToast(`Poder de Veto atribuído a ${atelierMap[val]}.`);
                }

                if (act === 'fdm') {
                    await db.doc('config/estado').update({
                        fdm: { uid: val, ate: atelierMap[val] }
                    });
                    showToast(`Selo Fora de Moda fixado em ${atelierMap[val]}.`);
                }

                if (act === 'elim') {
                    await db.doc(`perfis/${val}`).update({ out: true });
                    const rkSnap = await db.doc('ranking/atual').get();
                    if (rkSnap.exists) {
                        const rkData = rkSnap.data();
                        await rkSnap.ref.update({
                            rows: rkData.rows.map(r => r.ate === atelierMap[val] ? { ...r, status: 'ELIMINADO' } : r)
                        });
                    }
                    await db.doc('config/estado').update({ fdm: null });
                    showToast(`${atelierMap[val]} foi eliminado da competição.`);
                }

                if (act === 'apply-top5' && calculationState) {
                    for (const outItem of calculationState.outList) {
                        await db.doc(`perfis/${outItem.uid}`).update({ out: true });
                    }
                    const updatedRows = calculationState.standings.map(s => ({
                        ate: s.ate,
                        status: calculationState.outList.some(o => o.uid === s.uid) ? 'ELIMINADO' : 'FINALISTA'
                    }));
                    await db.doc('ranking/atual').set({
                        rodada: globalState.rodada,
                        rows: updatedRows
                    });
                    await db.doc('config/estado').update({ fase: 'final' });
                    showToast('Top 3 consolidado e fase alterada para Grande Final.');
                }
            });

            // Auditoria de Elenco
            sub(db.collection('identidades').orderBy('createdAt', 'desc'), snap => {
                $('#castAuditList').innerHTML = snap.docs.map(d => {
                    const data = d.data();
                    return `<div class="p-1 border-b border-fashion-800 flex justify-between"><span>${esc(data.real)}</span> <strong class="text-fashion-gold">${esc(data.ate)}</strong></div>`;
                }).join('') || '<span class="text-gray-500">Nenhum registo de identidade auditado.</span>';
            });
        };
    </script>
</body>
</html>
