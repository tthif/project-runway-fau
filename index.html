        /* Workroom Clock — cinematic urgency without disruptive alerts. */

    const compressImageToBase64 = file => new Promise((resolve, reject) => {
        if (!file || !['image/jpeg','image/png','image/webp'].includes(file.type)) return reject(new Error('Escolha uma imagem JPG, PNG ou WebP do dispositivo.'));
        if (file.size > 5 * 1024 * 1024) return reject(new Error('A imagem excede 5 MB.'));
        // O Firestore guarda no máximo 1 MiB por documento. Se a foto couber, vai EXATAMENTE como foi enviada;
        // se não couber, mantém a maior resolução e qualidade que couberem.
        const MAX_B64 = 950000;
        const reader = new FileReader();
        reader.onload = e => {
            const original = e.target.result;
            if (original.length <= MAX_B64) return resolve(original);
            const img = new Image();
            img.onload = () => {
                for (const scale of [1, 0.85, 0.7, 0.6, 0.5, 0.42, 0.35, 0.3]) {
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.max(1, Math.round(img.width * scale));
                    canvas.height = Math.max(1, Math.round(img.height * scale));
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    for (const q of [0.92, 0.85, 0.78]) {
                        const result = canvas.toDataURL('image/jpeg', q);
                        if (result.length <= MAX_B64) return resolve(result);
                    }
                }
                reject(new Error('Não foi possível ajustar esta imagem. Tente outra foto.'));
            };
            img.onerror = reject;
            img.src = original;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });

        if (!deadline) {phase='unset';label='Aguardando prazo oficial';cue='The workroom will open soon.';clock.textContent='--:--:--';}
        else if (remaining <= 0) {phase='closed';label='TIME IS UP · WORKROOM CLOSED';cue='Hands off. It’s runway time.';clock.textContent='00:00:00';}
        else {
            const sec = Math.max(0, Math.ceil(remaining/1000));

            clock.textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;

            else if(sec<=600){phase='critical';label='THE FINAL COUNTDOWN';cue='Designers, ten minutes!';}

                }
                const enrollment=await db.doc(`inscricoes_designers/${user.uid}`).get();
                if(enrollment.exists){
                    try {
                        profileData=await fauProvisionDesigner(user,enrollment.data());

                    } catch(ex) {
                        console.error('Falha ao ativar perfil Designer:',ex);

                }

        }

        if (!isAdmin && !user.isAnonymous && !['estilista','jurado','plateia'].includes(profileData.role)) {

        currentUser = {

        const accountDisplayName = String(currentUser.nome || currentUser.name || currentUser.displayName || currentUser.username || user.displayName || (user.email ? user.email.split('@')[0] : 'Plateia')).trim();
        $('#userHeaderSlot').innerHTML = `
            <span class="fau-account-role fau-account-display text-[10px] bg-fashion-800 text-white px-2 py-0.5 rounded border border-fashion-700 font-semibold" title="${esc(accountDisplayName)}" aria-label="Usuário: ${esc(accountDisplayName)}">${esc(accountDisplayName)}</span>
            ${!user.isAnonymous && !user.providerData?.some(p=>p.providerId==='google.com')?'<button id="fauLinkGoogle" class="fau-account-link text-[10px] text-fashion-gold border border-fashion-gold/40 rounded px-2 py-1" title="Vincular Google" aria-label="Vincular Google"><i class="fa-brands fa-google" aria-hidden="true"></i></button>':''}
            <button onclick="auth.signOut()" class="text-gray-400 hover:text-white transition ml-2" title="Sair">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>

        `;

        $('#fauLinkGoogle')?.addEventListener('click',async()=>{
            const btn=$('#fauLinkGoogle');btn.disabled=true;
            try{
                const before=auth.currentUser.uid;

                if(result.user.uid!==before)throw new Error('A conta mudou inesperadamente.');

    const updateGlobalBanner = () => {

    // SEASON FLOW — um estado compartilhado para orientar todas as experiências.
    // Etapas não publicadas nunca são apresentadas como eventos concluídos.
    const getSeasonFlow = () => {
        const g = globalState || {};

        const runwayOpen = configured && !!g.liberado;

        const phase = !configured ? 'preseason' : rankingVisible && !submissionsOpen && !ballotOpen ? 'intermission' : submissionsOpen ? 'workroom' : !runwayOpen ? 'backstage' : ballotOpen ? 'voting' : rankingVisible ? 'results' : 'runway';
        const labels = {preseason:'PRÉ-ESTREIA',workroom:'THE WORKROOM',backstage:'BACKSTAGE · AGUARDANDO ESTREIA',runway:'THE RUNWAY',voting:'THE VOTING ROOM',results:'THE RESULTS SHOW',intermission:'BETWEEN THE RUNWAYS'};

    };
    const getAvailableTabs = () => {
        const role=currentUser?.role;
        const flow=getSeasonFlow();

        if(role==='estilista') {
            if(currentUser.out) return ['home','cast','meu_perfil','runway','tribunal','conf','legado','pistas','manual'];
            if(!hasMaisonIdentity() || !flow.configured) return ['home','cast','meu_perfil','work','runway','tribunal','legado','pistas','manual'];
            // The Runway permanece no menu; VIEWS.runway controla a visibilidade dos looks.

        } else if(role==='jurado') {

    const navigate = tabKey => {

                ${ROTULOS_ABAS[t]}

        VIEWS[activeTab]();

    // Apenas o After Show entre rodadas, sem o guia de experiência.
    const renderAfterShow = () => {
        if (!auth.currentUser || !currentUser || auth.currentUser.uid !== currentUser.uid) return;
        document.querySelector('[aria-label="Intervalo entre desafios"]')?.remove();

          inter.setAttribute('aria-label','Intervalo entre desafios');
          inter.innerHTML=`<div class="flex flex-col md:flex-row md:items-center justify-between gap-6"><div class="space-y-3"><p class="text-[10px] tracking-[.35em] text-fashion-gold">✦ THE AFTER SHOW ✦</p><h2 class="font-cinzel text-2xl md:text-3xl text-white">${role==='estilista'&&currentUser.out?'YOUR LAST WALK. YOUR LEGACY.':'ONE RUNWAY ENDS. ANOTHER AWAITS.'}</h2><p class="text-sm text-gray-300 max-w-xl">${role==='estilista'&&currentUser.out?'Sua jornada competitiva terminou, mas suas criações permanecem no arquivo da temporada.':'As decisões desta rodada já foram anunciadas. Reveja os looks, acompanhe seu histórico e os comentários publicados. O próximo briefing continua sob sigilo da produção.'}</p><p class="text-[11px] text-fashion-gold/80">🔒 NEXT CHALLENGE · NOT YET REVEALED</p></div><div class="flex flex-wrap gap-2"><button type="button" data-after-go="legado" class="border border-fashion-gold/50 rounded px-4 py-3 text-xs text-fashion-gold">THE FASHION ARCHIVE</button><button type="button" data-after-go="runway" class="bg-fashion-gold text-black rounded px-4 py-3 text-xs font-bold">REVISIT THE RUNWAY</button></div></div>`;
          inter.querySelectorAll('[data-after-go]').forEach(b=>{if(getAvailableTabs().includes(b.dataset.afterGo))b.addEventListener('click',()=>navigate(b.dataset.afterGo));else b.remove();});

              const messages={
                champion:['THE WINNER · THE LEGEND IS BORN','Seu Designer conquistou a temporada. A passarela agora faz parte do seu legado.','🏆'],
                win:['THE WINNING LOOK','Esta foi a sua passarela. Sua criação venceu o desafio e conquistou o destaque máximo da rodada.','🏆'],

              const [headline,description,symbol]=messages[key];

              statusLine.innerHTML=`<p class="text-[10px] uppercase tracking-[.25em] text-fashion-gold">WEEK ${esc(round)} · OFFICIAL VERDICT</p><p class="font-cinzel text-xl text-white mt-2">${esc(maison)} · ${esc(out?'OUT':status)}</p><p class="text-xs text-gray-400 mt-2">Resultado oficial já divulgado. Seu acumulado privado fica em My Profile; críticas aparecem somente quando autorizadas pela produção.</p>`;
              inter.querySelector('.space-y-3')?.append(statusLine);
              // Somente informações oficialmente publicadas. Nenhum voto bruto ou nota privada é consultado.

              if(/FORA DE MODA/i.test(status))achievements.push(['🥀','Fora de Moda','Título decidido pela votação secreta dos estilistas.']);
              if(/SALV[OA]|SAVED|SAVE VOTE/i.test(status)&&!out)achievements.push(['🛟','Saved by the Atelier','Seu Designer foi salva pelo voto dos outros estilistas.']);
              if(achievements.length){
                const award=document.createElement('div');award.className='flex flex-wrap gap-2 mt-3';
                award.innerHTML=achievements.map(([icon,label,detail])=>`<div class="rounded-xl border border-fashion-gold/40 bg-fashion-gold/5 p-3 flex-1 min-w-[190px]"><p class="font-cinzel text-fashion-gold">${icon} ${esc(label)}</p><p class="text-xs text-gray-300 mt-1">${esc(detail)}</p></div>`).join('');
                statusLine.after(award);
              }
              db.collection('fau_titulos_publicos').doc(round || 'sem-rodada').get().then(t=>{
                if(!t.exists||!t.data().published||!inter.isConnected||currentUser?.uid!==uid||String(globalState.rodada)!==round)return;
                const d=t.data(),badges=[];
                if(d.icon===uid)badges.push(['👑','THE FASHION ICON','Seu Designer foi escolhida pelos estilistas. Você conquistou o direito de escolher o próximo tema entre as opções disponíveis.']);
                if(d.fora===uid)badges.push(['🥀','FORA DE MODA','Os votos da rodada marcaram seu Designer. Seu resultado permanece parte da história da competição.']);
                if((d.saved||[]).includes(uid))badges.push(['🛟','SAVED BY THE ATELIER','Seus concorrentes escolheram manter seu Designer na competição.']);

                statusLine.after(el);

              // A publicação de críticas é independente da apuração. Exibir só as liberadas.
              db.collection('fau_criticas_publicas').doc(round || 'sem-rodada').get().then(critSnap=>{

        }
    };

    auth.onAuthStateChanged(user => {
        if (!isAuthProcessing) initUserSession(user);
    });

    const VIEWS = {};

    // Photo upload uses the existing protected profile document. A compressed image
    // is kept under Firestore's document size limit, avoiding a separate storage setup.
    document.addEventListener('change', async event => {
        const input=event.target.closest('input[data-cast-upload]');
        if(!input)return;
        const uid=input.dataset.castUpload, file=input.files?.[0];
        if(!file)return;
        if(!isAdmin || !auth.currentUser || !uid) { showToast('Acesso restrito à produção.');return; }
        if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size>8*1024*1024){showToast('Escolha uma imagem JPG, PNG ou WebP de até 8 MB.');input.value='';return;}
        input.disabled=true;
        try {
            const bitmap=await createImageBitmap(file);
            const max=320,scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));
            const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
            const ctx=canvas.getContext('2d');ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();
            let data=canvas.toDataURL('image/webp',.78);
            if(data.length>140000)data=canvas.toDataURL('image/jpeg',.65);
            if(data.length>180000)throw new Error('A imagem ficou grande demais. Tente outra foto.');
            const ref=db.doc(`perfis/${uid}`),snap=await ref.get();
            if(!snap.exists||(!['estilista','jurado'].includes(snap.data().role)&&uid!==auth.currentUser.uid))throw new Error('Perfil não autorizado para fotografia.');
            await ref.update({fotoElenco:data});
            showToast('Fotografia do perfil atualizada.');
        } catch(err){console.error('Foto do elenco:',err);showToast('Não foi possível salvar a foto: '+(err.message||err.code||'erro'));}
        finally{input.disabled=false;input.value='';}
    });

    // Publicação deliberada da identidade apenas depois da eliminação.
    // As coleções privadas nunca são consultadas por visitantes.
    async function fauPublishOutIdentity(uid) {
        if (!isAdmin || !uid) return;
        const profileRef=db.doc(`perfis/${uid}`);
        const [profile, identity, registration]=await Promise.all([
            profileRef.get(), db.doc(`identidades/${uid}`).get(), db.doc(`inscricoes_designers/${uid}`).get()
        ]);

        const movePhoto=(direction)=>{
            const shown=entries.filter(e=>filter==='all'||(filter==='used'?e.data.used:!e.data.used)).filter(e=>!!e.data.photo);

            if(modal.hidden)return;

                const buttons=[...modal.querySelectorAll('button:not(:disabled)')];

                if(e.shiftKey&&i<=0){e.preventDefault();buttons[buttons.length-1]?.focus();}

            }

      if(theme.id==='theme_rest_in_style')return `<section class="rounded-xl border border-fashion-gold/50 bg-fashion-900 p-5 space-y-3"><p class="text-[10px] tracking-widest text-fashion-gold">TWIST REVELADA · FASE 02</p><h3 class="font-cinzel text-2xl text-white">YOUR OWN FUNERAL</h3><p class="text-sm text-gray-300">A segunda parte é revelada após o ranking inicial. Os Designers do Elimination Pool recebem as instruções do próprio funeral. A salvação segue a votação prevista para a rodada.</p><p class="text-[11px] text-gray-400">Prévia de revelação; sem envios ou votos reais.</p></section>`;
      if(theme.id==='theme_tarantino')return `<section class="rounded-xl border border-fashion-gold/50 bg-fashion-900 p-5 space-y-3"><p class="text-[10px] tracking-widest text-fashion-gold">TWIST REVELADA · FASE 02</p><h3 class="font-cinzel text-2xl text-white">DOUBLE KILL</h3><p class="text-sm text-gray-300">Uma eliminação pelo último lugar no ranking acumulado e outra pela votação de salvação do Elimination Pool.</p><p class="text-[11px] text-gray-400">Prévia da mecânica após a revelação, sem alterar resultados.</p></section>`;
      return '';
    }
    VIEWS.testlab=()=>{
      if(currentUser?.role!=='admin'){navigate('home');return;}
      const theme=SEASON_THEMES[fauTestLabState.themeId]||SEASON_THEMES.w01_first_garment;
      const phased=['theme_beauty_eye','theme_rest_in_style','theme_tarantino','theme_plaid_bay','theme_next_supreme'].includes(theme.id);
      const phaseOne=phased&&!fauTestLabState.phaseTwo;
      const count=phaseOne&&theme.id==='theme_beauty_eye'?1:Number(theme.numSubmissoes)||1;
      const visibleSlots=theme.id==='theme_beauty_eye'?[fauTestLabState.phaseTwo?2:1]:Array.from({length:count},(_,i)=>i+1);
      const isMutation=theme.id==='w02_new_form';
      const themeOptions=Object.values(SEASON_THEMES).sort((a,b)=>(a.fixedOrder||99)-(b.fixedOrder||99)).map(t=>`<option value="${esc(t.id)}" ${t.id===theme.id?'selected':''}>${esc(t.code||'WEEK')} — ${esc(t.id==='theme_beauty_eye'?'BEAUTY IS IN THE EYE':t.title)}</option>`).join('');
      renderView(`<div class="space-y-5 max-w-5xl mx-auto" id="fauExactTestLab">
        <section class="rounded-xl border border-fashion-gold/50 bg-fashion-900 p-4 space-y-3">
          <div class="flex flex-wrap justify-between gap-2"><div><p class="text-[10px] tracking-[.22em] text-fashion-gold">PRODUCTION ONLY · TEST LAB</p><h2 class="font-cinzel text-2xl text-white mt-1">THE WORKROOM PREVIEW</h2></div><span class="text-[10px] border border-fashion-gold/50 rounded px-3 py-2 text-fashion-gold self-start">SEM GRAVAÇÃO</span></div>
          <label class="block text-xs text-gray-300">Escolha o tema<select id="fauLabTheme" class="w-full mt-2 bg-fashion-950 border border-fashion-700 rounded p-3 text-white">${themeOptions}</select></label>
          <p class="text-xs text-gray-400">Prévia demonstrativa: nenhuma ação altera a rodada ativa.</p>
          ${phased?`<div class="border border-fashion-gold/30 rounded-lg p-3 space-y-2"><p class="text-[10px] tracking-widest text-fashion-gold">CONTROLE DE REVELAÇÃO · APENAS ADMIN</p><p class="text-xs text-gray-300">${phaseOne?'FASE 01 — Os Designers veem apenas o desafio inicial.':'FASE 02 — Twist revelada pela produção.'}</p><button id="fauLabPhaseToggle" type="button" class="border border-fashion-gold rounded px-4 py-2 text-xs text-fashion-gold">${phaseOne?'REVELAR FASE 02 (TESTE)':'VOLTAR À FASE 01'}</button></div>`:''}
        </section>
        <div class="space-y-6">
          <section class="fau-workroom-overview bg-fashion-900 border border-fashion-700 p-4 md:p-5 rounded-xl" aria-label="Prazo e entregas da rodada">
            <div class="fau-workroom-overview-heading"><h2 class="font-cinzel text-2xl text-white font-normal">Seu espaço de criação</h2><p class="text-xs text-gray-400">Acompanhe o prazo e as entregas da rodada.</p></div>
            <div class="fau-workroom-overview-content"><div id="fauWorkroomClock" class="fau-clock rounded-xl px-4 py-3 text-center" role="timer"><span class="fau-clock-kicker block">⏱ PRAZO DE ENTREGA</span><div id="roundTimer" class="fau-clock-digits">23:59:59</div><div id="fauClockStatus" class="fau-clock-status">PRAZO SIMULADO</div><div class="fau-clock-track"><div id="fauClockProgress" class="fau-clock-fill" style="width:50%"></div></div><p id="fauClockDirection" class="fau-clock-direction">Make it work.</p></div>
            <div class="fau-submission-board"><div id="workroomThermometer" class="text-xs"><div class="flex flex-wrap items-center justify-between gap-3 mb-3"><h3 class="font-cinzel text-white text-lg">Entregas da rodada</h3></div><p class="text-xs text-gray-300">0 de 18 Designers enviaram · 18 faltam</p><p class="text-[10px] text-gray-500 mt-2">Dados fictícios para visualização</p></div></div></div>
          </section>
          ${fauLabSecondPhase(theme)}<div id="restaUmWorkroom" class="mb-5"></div><div id="atelierSetupModule"></div>
          <section id="fauBriefingCard" class="rounded-2xl border border-fashion-gold/40 bg-fashion-900 p-4 space-y-3" aria-label="Briefing da rodada"><details class="fau-brief-open"><summary class="cursor-pointer text-sm text-fashion-gold font-semibold flex items-center justify-between gap-3"><span>Briefing do desafio</span><span class="text-gray-400 font-normal text-xs">Toque para abrir ou recolher <i class="fa-solid fa-chevron-up ml-1"></i></span></summary><div class="fau-brief-body mt-3 text-sm text-gray-300 leading-relaxed whitespace-pre-wrap">${esc(phaseOne?({'theme_beauty_eye':'THE CHALLENGE — Apresente sua visão pessoal da beleza em um look autoral. Envie sua primeira criação. A produção anunciará os próximos acontecimentos no momento certo.','theme_rest_in_style':'THE CHALLENGE — Crie um look para um funeral sem utilizar preto. A produção anunciará os próximos acontecimentos no momento certo.','theme_tarantino':'THE CHALLENGE — Crie uma proposta autoral inspirada no universo cinematográfico de Tarantino. Aguarde novas instruções da produção.','theme_plaid_bay':'THE CHALLENGE — Reinvente o uniforme xadrez da Baia para um ex-participante de A Fazenda. Xadrez obrigatório. Aguarde novas instruções da produção.'}[theme.id]):theme.mandate||'Aguarde as instruções da produção.')}</div></details></section>
          <section class="fau-submission-suite" aria-label="Envio do desafio">
          <div id="personalTwistSlot">${fauLabTwist(theme)}</div>
          <div id="fauMutationModule">${isMutation?fauMutationPanel(fauTestLabState.envelope?{envelope:fauTestLabState.envelope,mutationIndex:fauTestLabState.mutationIndex,mutationVersion:2}:null,false):''}</div>
          <div id="workroomFormModule" class="space-y-5">${visibleSlots.map(slot=>`<div class="bg-fashion-900 border border-fashion-700 p-6 rounded-lg space-y-6"><div class="space-y-3"><h3 class="font-cinzel text-2xl text-white">Envie seu look</h3></div>${theme.id==='theme_beauty_eye'&&!fauTestLabState.phaseTwo?'':`<div class="border-b border-fashion-700 pb-3"><h3 class="font-cinzel text-lg text-white font-normal">${theme.slotLabels?.[slot-1] ? esc(theme.slotLabels[slot-1]) : 'Look '+slot+(count>1?' de '+count:'')}</h3></div>`}
          <div class="space-y-4 text-xs"><div><label class="block text-gray-300 mb-1 uppercase tracking-wider font-semibold">Fotografia do look</label><input type="file" data-lab-look-file="${slot}" accept="image/jpeg,image/png,image/webp" class="w-full bg-fashion-950 border border-fashion-700 rounded p-2 text-white"><p class="text-[11px] text-gray-400 mt-2">Selecione uma imagem JPG, PNG ou WebP com até 5 MB. Você poderá conferir a prévia antes de entregar.</p></div><div data-lab-preview="${slot}" class="hidden rounded-xl border border-fashion-gold/40 bg-fashion-950 p-3 space-y-2"><p class="text-[10px] tracking-widest text-fashion-gold">YOUR LOOK · FILE READY</p><img class="max-h-64 w-full object-contain rounded" alt="Prévia do look"></div>
          <div><label class="uppercase tracking-wider font-semibold text-gray-300 block mb-1">Nome da Criação</label><input class="w-full bg-fashion-950 border border-fashion-700 rounded p-2 text-white font-cinzel" placeholder="Ex: Sombra Abissal, Veludo Tóxico..."></div><div><div class="flex flex-wrap justify-between items-center gap-2 mb-2"><label class="uppercase tracking-wider font-semibold text-gray-300">Conceito (até 500 caracteres)</label><span data-lab-chars="${slot}" class="text-gray-500 font-mono text-xs whitespace-nowrap">0 / 500</span></div><textarea data-lab-concept="${slot}" maxlength="500" rows="9" class="w-full bg-fashion-950 border border-fashion-700 rounded p-2 text-white" placeholder="Explique a inspiração, a narrativa e a conexão com a assinatura do seu Designer..."></textarea></div><button data-lab-submit="${slot}" type="button" class="w-full bg-fashion-gold text-black font-semibold py-3 rounded uppercase tracking-widest text-xs">Enviar</button></div></div>`).join('')}</div>
          </section>
          <div class="bg-fashion-900 border border-fashion-700 p-6 rounded-lg space-y-4"><div class="flex justify-between items-center border-b border-fashion-700 pb-2"><h3 class="font-cinzel text-white text-base">Meus looks</h3><span class="text-xs text-fashion-gold font-mono">0 looks</span></div><p class="text-xs text-gray-400">Nenhuma criação anterior neste ambiente de teste.</p></div>
        </div></div>`);
      document.getElementById('fauLabTheme').onchange=e=>{fauTestLabState.themeId=e.target.value;fauTestLabState.envelope=null;fauTestLabState.mutationIndex=null;fauTestLabState.draw=null;fauTestLabState.released=false;fauTestLabState.wedding={};fauTestLabState.selectedEnvelope=null;fauTestLabState.phaseTwo=false;fauTestLabState.restaVotes=[];fauTestLabState.restChoice=null;fauTestLabState.supremeVotes={};VIEWS.testlab();};
      const phaseToggle=document.getElementById('fauLabPhaseToggle');if(phaseToggle)phaseToggle.onclick=()=>{fauTestLabState.phaseTwo=!fauTestLabState.phaseTwo;VIEWS.testlab();};
      document.querySelectorAll('[data-lab-resta]').forEach(b=>b.onclick=()=>{fauTestLabState.restChoice=b.dataset.labResta;VIEWS.testlab();});
      const restaConfirm=document.getElementById('fauLabRestaConfirm');if(restaConfirm)restaConfirm.onclick=()=>{if(!fauTestLabState.restChoice){showToast('Escolha quem será salvo.');return;}fauTestLabState.restaVotes.push(fauTestLabState.restChoice);fauTestLabState.restChoice=null;VIEWS.testlab();};
      document.querySelectorAll('[data-lab-supreme]').forEach(b=>b.onclick=()=>{const [i,slot]=b.dataset.labSupreme.split('|');fauTestLabState.supremeVotes[i]=Number(slot);VIEWS.testlab();});
      document.querySelectorAll('[data-lab-envelope]').forEach(b=>b.onclick=()=>{fauTestLabState.selectedEnvelope=Number(b.dataset.labEnvelope);VIEWS.testlab();});
      document.querySelectorAll('[data-lab-wedding]').forEach(b=>b.onclick=()=>{const [key,n]=b.dataset.labWedding.split('|');fauTestLabState.wedding[key]=Number(n);VIEWS.testlab();});
      const labConfirm=document.getElementById('fauLabDrawConfirm');if(labConfirm)labConfirm.onclick=()=>{
        let value='',label='';
        if(theme.id==='theme_seven_deadly'){value=document.getElementById('fauLabCharacter')?.value||'';if(!value){showToast('Escolha um dos sete anões antes de confirmar.');return;}label='Personagem escolhido';}
        else if(theme.drawType==='faction_choice'){value=document.getElementById('fauLabFaction').value;label='Facção escolhida';}
        else if(theme.drawType==='invitation_box_3d'){
          const w=fauTestLabState.wedding;if(!w.color||!w.element||!w.print){showToast('Escolha um envelope em cada uma das três categorias.');return;}
          value=[theme.invitationBoxMap.colors[w.color-1],theme.invitationBoxMap.elements[w.element-1],theme.invitationBoxMap.prints[w.print-1]].join(' • ');label=`COLOR ${w.color} · ELEMENT ${w.element} · PRINT ${w.print}`;
        }else{const n=fauTestLabState.selectedEnvelope;if(!n){showToast('Escolha um envelope antes de confirmar.');return;}const assignment=fauEnvelopeAssignment(theme,n);value=assignment.value;label=`Envelope ${String(n).padStart(2,'0')}`;}
        fauTestLabState.draw={value,label};fauTestLabState.released=true;VIEWS.testlab();
      };
      const labRelease=document.getElementById('fauLabRelease');if(labRelease)labRelease.onclick=()=>{fauTestLabState.released=true;VIEWS.testlab();};
      const labReset=document.getElementById('fauLabDrawReset');if(labReset)labReset.onclick=()=>{fauTestLabState.draw=null;fauTestLabState.released=false;fauTestLabState.wedding={};fauTestLabState.selectedEnvelope=null;VIEWS.testlab();};
      document.querySelectorAll('[data-lab-concept]').forEach(el=>el.oninput=()=>{document.querySelector(`[data-lab-chars="${el.dataset.labConcept}"]`).textContent=el.value.length+' / 500';});
      document.querySelectorAll('[data-lab-submit]').forEach(el=>el.onclick=()=>showToast(theme.id==='theme_next_supreme'?'TEST LAB · As duas Supremas são enviadas juntas no Workroom real. Nenhum dado foi gravado.':'TEST LAB · Envio demonstrativo. Nada foi gravado.'));
      document.querySelectorAll('[data-lab-look-file]').forEach(el=>el.onchange=()=>{const file=el.files?.[0],box=document.querySelector(`[data-lab-preview="${el.dataset.labLookFile}"]`);if(!file){box.classList.add('hidden');return;}if(file.size>5*1024*1024){showError('O arquivo deve ter no máximo 5 MB.');el.value='';return;}const url=URL.createObjectURL(file);box.querySelector('img').src=url;box.classList.remove('hidden');box.querySelector('img').onload=()=>URL.revokeObjectURL(url);});
      document.querySelectorAll('#fauMutationModule [data-mutation-envelope]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.mutationEnvelope);if(!confirm(`Abrir envelope ${String(n).padStart(2,'0')} no TEST LAB?`))return;fauTestLabState.envelope=n;fauTestLabState.mutationIndex=fauMutationShuffle()[n-1];VIEWS.testlab();});
    };
    // 2. THE WORKROOM (DESIGNER & PROMPT MASTER)
    VIEWS.work = () => {
        if(currentUser?.role === 'admin') {
            // Production-only, read-only Workroom: never expose Designer submission actions to ADM.
            const round = globalState.rodada;
            const deadline = globalState.prazo ? new Date(globalState.prazo) : null;
            renderView(`<section class="space-y-4 max-w-5xl mx-auto" id="fauAdminWorkroom">
              <header class="rounded-xl border border-fashion-gold/30 bg-fashion-900 p-4 space-y-2">
                <div class="flex items-center justify-between gap-3 flex-wrap"><span class="text-xs tracking-widest text-fashion-gold">THE WORKROOM · PRODUÇÃO</span><span class="text-[10px] rounded-full border border-fashion-gold/40 px-3 py-1 text-fashion-gold">VISUALIZAÇÃO ADM</span></div>
                <h2 class="font-cinzel text-xl text-white">${esc(fauRoundLabel())}</h2>
                <p class="text-xs text-gray-300">Acompanhe as entregas sem alterar ou enviar looks pelos Designers.</p>
                <p id="fauAdminWorkroomDeadline" class="text-xs text-fashion-gold">${deadline && !Number.isNaN(deadline.getTime()) ? 'Prazo: '+deadline.toLocaleString('pt-BR') : 'Prazo definido no Control Room'}</p>
              </header>
              ${globalState.themeId==='w02_new_form'?'<div id="fauAdminMutationSummary" class="rounded-xl border border-fashion-gold/30 bg-fashion-900 p-4 text-xs text-gray-300">Sincronizando envelopes...</div>':''}
              <div id="fauAdminWorkroomCount" class="rounded-xl border border-fashion-700 bg-fashion-900 p-4 text-sm text-gray-300">Sincronizando entregas...</div>
              <div id="fauAdminWorkroomList" class="grid grid-cols-1 sm:grid-cols-2 gap-3"><p class="text-gray-400 text-sm">Carregando elenco...</p></div>
            </section>`);
            if(!round){$('#fauAdminWorkroomCount').textContent='Nenhuma rodada ativa.';$('#fauAdminWorkroomList').innerHTML='';return;}
            if(globalState.themeId==='w02_new_form'){
                let mutationRows=[], mutationProfiles=[];
                const paintMutations=()=>{
                    const host=document.getElementById('fauAdminMutationSummary');if(!host)return;
                    const names=new Map(mutationProfiles.map(p=>[String(p.uid),p.ate||p.nome||'Designer sem nome']));
                    const sorted=[...mutationRows].sort((a,b)=>String(names.get(String(a.uid))||a.uid).localeCompare(String(names.get(String(b.uid))||b.uid),'pt-BR'));
                    host.innerHTML=`<p class="text-fashion-gold font-semibold mb-2">THE MUTATION MACHINE · ${sorted.length} envelope(s) aberto(s)</p><div class="space-y-2">${sorted.map(r=>`<p><strong class="text-fashion-gold">${esc(names.get(String(r.uid))||'Designer não identificado')}</strong> · Envelope ${esc(r.envelope)} · <strong>${esc(fauMutationResult(r)?.[0]||'—')}</strong></p>`).join('')||'<p>Nenhum envelope aberto ainda.</p>'}</div>`;
                };
                sub(db.collection('fashion_mutations').where('round','==',String(round)),snap=>{
                    mutationRows=snap.docs.map(d=>d.data());paintMutations();
                });
                sub(db.collection('perfis').where('role','==','estilista'),snap=>{
                    mutationProfiles=snap.docs.map(d=>({uid:d.id,...d.data()}));paintMutations();
                });
            }
            let designers=[],looks=[],readyProfiles=false,readyLooks=false;
            const paint=()=>{
                const list=$('#fauAdminWorkroomList'),counter=$('#fauAdminWorkroomCount');
                if(!list||!counter)return;
                if(!readyProfiles||!readyLooks)return;
                const byUid=new Map();
                for(const look of looks){
                    const uid=look.uid;if(!uid)continue;
                    if(!byUid.has(uid))byUid.set(uid,[]);
                    byUid.get(uid).push(look);
                }
                const required=globalState.fase==='final'?4:(Number(globalState.numSubmissoes)||1);
                const eligible=designers.filter(d=>!d.disabled&&!d.out&&!d.eliminado&&d.ativo!==false&&String(d.status||'').toUpperCase()!=='OUT');
                const completed=eligible.filter(d=>(byUid.get(d.uid)||[]).length>=required).length;
                counter.innerHTML=`<strong class="text-fashion-gold">${completed} de ${eligible.length}</strong> Designers concluíram as entregas · <strong>${eligible.length-completed}</strong> ainda faltam. <span class="block text-xs text-gray-400 mt-1">Informações individuais visíveis somente para a produção.</span>`;
                list.innerHTML=eligible.map(d=>{
                    const entries=(byUid.get(d.uid)||[]).sort((a,b)=>(a.slot||0)-(b.slot||0));
                    return `<article class="rounded-xl border border-fashion-700 bg-fashion-900 p-4 space-y-3">
                      <div class="flex items-center gap-3">${d.fotoElenco?`<img src="${esc(d.fotoElenco)}" alt="" class="w-12 h-12 object-cover rounded-lg">`:`<div class="w-12 h-12 rounded-lg bg-fashion-950 border border-fashion-700 flex items-center justify-center">✂</div>`}<div class="min-w-0 flex-1"><h3 class="font-cinzel text-fashion-gold text-sm break-words">${esc(d.ate||'Designer')}</h3><p class="text-xs text-gray-400">${entries.length} de ${required} look(s) · ${entries.length>=required?'ENTREGA COMPLETA':'PENDENTE'}</p></div></div>
                      ${entries.length?`<div class="grid grid-cols-2 gap-2">${entries.map(l=>`<div class="space-y-1">${l.url?`<img src="${esc(l.url)}" alt="Look enviado por ${esc(d.ate||'Designer')}" loading="lazy" class="w-full aspect-[3/4] object-contain bg-black rounded-md">`:'<div class="aspect-[3/4] bg-black rounded-md"></div>'}<p class="text-xs text-gray-200 break-words">${esc(l.titulo||'Sem título')}</p><details class="text-xs text-gray-300"><summary class="cursor-pointer text-fashion-gold">Ler conceito</summary><p class="mt-2 whitespace-pre-wrap break-words">${esc(l.mem||'')}</p></details></div>`).join('')}</div>`:'<p class="text-xs text-gray-400">Nenhum look enviado nesta rodada.</p>'}
                    </article>`;
                }).join('')||'<p class="text-sm text-gray-400">Nenhum Designer ativo cadastrado.</p>';
            };
            sub(db.collection('perfis').where('role','==','estilista'),snap=>{designers=snap.docs.map(d=>({uid:d.id,...d.data()})).sort((a,b)=>String(a.ate||'').localeCompare(String(b.ate||''),'pt-BR'));readyProfiles=true;paint();});
            sub(db.collection('looks').where('rodada','==',round),snap=>{looks=snap.docs.map(d=>({id:d.id,...d.data()}));readyLooks=true;paint();});
            return;
        }

            if (host) host.innerHTML = `<section class="rounded-xl border border-red-500/50 bg-fashion-900 p-5 space-y-3"><h3 class="font-cinzel text-white">Não foi possível carregar as entregas</h3><p class="text-xs text-gray-300">${esc(error?.code === 'permission-denied' ? 'Sua conta não tem permissão para consultar os próprios looks. A produção precisa revisar as regras do Firestore.' : error?.message || 'Verifique a conexão e tente novamente.')}</p><button type="button" id="fauRetryWorkroom" class="border border-fashion-gold text-fashion-gold px-4 py-2 rounded">TENTAR NOVAMENTE</button></section>`;
            document.getElementById('fauRetryWorkroom')?.addEventListener('click',()=>navigate('work'));
        };
        const safeRefreshWorkroom = () => refreshWorkroomUI().catch(showWorkroomError);
        const waitingHost = document.getElementById('workroomFormModule');
        if(waitingHost) waitingHost.innerHTML = '<section class="border border-fashion-gold/40 bg-fashion-900 rounded-xl p-5 text-sm text-gray-300" role="status">Preparando seu ateliê e conferindo suas entregas…</section>';
        const looksQuery = db.collection('looks').where('uid', '==', currentUser.uid);
        unsubsTab.push(looksQuery.onSnapshot(snap => {
            looksLoaded = true;
            allMyLooks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            safeRefreshWorkroom();
        }, showWorkroomError));

        // Notas individuais são privadas; o designer consulta apenas o acumulado no perfil.

        // A Direção publica somente os totais; Designers nunca leem envios alheios.
        // Schema: config/entregas_publicas -> {rodada, enviados, total}.
        sub(db.doc('config/entregas_publicas'), doc => {
            const data = doc.exists ? doc.data() : null;
            submissionPulse = data && String(data.rodada)===String(globalState.rodada) ? data : null;
            // Atualiza o painel inteiro, inclusive o texto e a barra, sem recriar
            // o formulário nem apagar o que o Designer está preenchendo.
            const board = document.getElementById('workroomThermometer');
            if (board) {
                const ready = submissionPulse && Number.isFinite(Number(submissionPulse.enviados));
                const sent = ready ? Math.max(0, Number(submissionPulse.enviados)) : null;
                const total = ready ? Math.max(sent, Number(submissionPulse.total)||0) : 0;
                const pending = ready ? Math.max(0, total-sent) : null;
                const percent = ready && total ? Math.min(100,Math.round(100*sent/total)) : 0;
                const counts = board.querySelectorAll('.grid strong');
                if (counts.length >= 2) {
                    counts[0].textContent = sent===null ? '—' : String(sent);
                    counts[1].textContent = pending===null ? '—' : String(pending);
                }
                const bar = board.querySelector('.h-full.bg-fashion-gold');
                if (bar) bar.style.width = percent+'%';
                const note = board.querySelector('p.mt-2');
                if (note) note.textContent = ready
                    ? `${percent}% dos Designers concluíram as entregas. Nenhuma identidade é revelada.`
                    : 'Aguardando a sincronização da produção.';
            }
        });
    };

    // 3. HISTÓRICO DA TEMPORADA & GALERIA DE ELIMINAÇÕES

        $('#fauBackHome')?.addEventListener('click',()=>navigate('home'));

                if(ate.length<2||ate.length>70||/[<>]/.test(ate))throw new Error('Informe um nome de Designer válido (2 a 70 caracteres).');

                try{

    };

    VIEWS.historico = async (insideArchive=false) => {
        if (globalState.themeId === 'theme_traitors') {
            const ref = db.doc(`revelacoes_traitors/${globalState.rodada}`);
            sub(ref, snap => {
                const slot = document.getElementById('banquetRevealSlot');
                if (!slot) return;
                const data = snap.data();
                slot.innerHTML = data?.published ? `<div class="bg-fashion-900 border border-fashion-gold rounded-xl p-5 space-y-3"><h3 class="font-cinzel text-fashion-gold text-lg">🗡️ THE BLACK BANQUET — THE REVEAL</h3><p class="text-gray-300 text-xs">Before you leave my castle forever, you must reveal to us: are you a Faithful or are you a Traitor?</p><div class="grid sm:grid-cols-2 gap-2">${(data.members||[]).map(x=>`<div class="border border-fashion-700 rounded p-3 text-xs"><b>${esc(x.ate)}</b><div class="text-fashion-gold mt-1">${esc(x.faction)}</div></div>`).join('')}</div></div>` : '';
            });
        }
        const mountTrackRecord = insideArchive ? (html) => { const target=document.querySelector('[data-archive-panel="track"]'); if(target)target.innerHTML=html; } : renderView;
        mountTrackRecord(`

            <div class="space-y-8">
                ${globalState.themeId === 'theme_traitors' ? '<div id="banquetRevealSlot"></div>' : ''}
                <div class="border-b border-fashion-700 pb-3 flex justify-between items-center">
                    <div>
                        <span class="text-xs uppercase tracking-widest text-fashion-gold font-medium font-cinzel">${isAdmin ? 'PRODUCTION EYES ONLY · CLASSIFIED' : currentUser.role === 'estilista' ? 'YOUR RUNWAY JOURNEY' : 'THE SEASON ARCHIVE'}</span>
                        <h2 class="font-cinzel text-xl text-white font-normal">${isAdmin ? 'The Track Record · Season Intelligence' : currentUser.role === 'estilista' ? 'The Track Record · Minha Trajetória' : 'The Track Record · Momentos da Temporada'}</h2>
                    </div>
                </div>
                <div id="trackRecordTableContainer" class="bg-fashion-900 border border-fashion-700 p-4 rounded-lg overflow-x-auto text-xs font-mono">
                    <p class="text-gray-400 py-8 text-center">Calculando matriz de desempenho da temporada...</p>
                </div>

                ${insideArchive ? '' : `<div class="space-y-4 pt-4 border-t border-fashion-700">
                    <div class="border-b border-fashion-700 pb-2">
                        <span class="text-xs uppercase tracking-widest text-fashion-red font-medium font-cinzel font-bold">Auf Wiedersehen</span>
                        <h3 class="font-cinzel text-lg text-white font-normal">Galeria de Eliminações (Hall dos Eliminados)</h3>
                    </div>
                    <div id="eliminationGalleryGrid" class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
                        <p class="text-gray-500 italic py-4">Carregando galeria...</p>
                    </div>
                </div>`}
            </div>
        `);


        // Public Track Record: read ONLY published classifications, never private scores.
        if (!isAdmin) {
            const slot = $('#trackRecordTableContainer');
            try {
                const history = await db.collection('ranking_historico_publico').get();
                const rounds = history.docs.map(d=>({round:d.id,...d.data()}))
                    .filter(r=>Array.isArray(r.rows)&&r.rows.length)
                    .sort((a,b)=>String(a.round).localeCompare(String(b.round),'pt-BR',{numeric:true}));
                if (!slot?.isConnected) return;
                if (!rounds.length) {
                    slot.innerHTML='<p class="text-gray-400 text-center py-8">Nenhuma classificação oficial foi publicada ainda.</p>';
                } else {
                    // The Track Record is a chronological archive of each WEEK's official
                    // ranking, in the exact published order (not an alphabetical roster).
                    const statusLabel = raw => String(raw||'—').replace(/\s*\(PROTEGIDO\)/ig,'').trim().toUpperCase();
                    const statusClass = raw => {
                        const v=statusLabel(raw);
                        return /^WIN/.test(v)?'text-amber-200':/^(HIGH|TOP)/.test(v)?'text-violet-200':/^SAFE/.test(v)?'text-emerald-200':/^LOW/.test(v)?'text-orange-200':/^(BOTTOM|OUT)/.test(v)?'text-rose-300':'text-gray-200';
                    };
                    const weekLabel = (r,i) => {
                        const raw=String(r.round||'');
                        const num=Number(raw.match(/(?:week|w)\s*0*(\d+)/i)?.[1] || (/^\d+$/.test(raw)?raw:0));
                        const n=num||i+1;return n===1?'WEEK 01 — THE FIRST GARMENT':n===2?'WEEK 02 — A NEW FORM':`WEEK ${String(n).padStart(2,'0')}`;
                    };
                    slot.classList.remove('font-mono');
                    slot.innerHTML=`<div class="space-y-6">
                        <p class="text-xs text-gray-300 leading-relaxed">Ranking oficial de cada rodada, do primeiro ao último colocado. As notas individuais e o acumulado permanecem confidenciais.</p>
                        ${rounds.map((r,i)=>`<section class="rounded-xl border border-fashion-700 overflow-hidden" aria-label="Ranking ${weekLabel(r,i)}">
                            <div class="px-4 py-4 bg-fashion-950 border-b border-fashion-700 flex items-center justify-between gap-3">
                                <h3 class="font-cinzel text-xl text-fashion-gold">${weekLabel(r,i)}</h3>
                                <span class="text-[10px] tracking-widest text-gray-400">RANKING OFICIAL</span>
                            </div>
                            <div class="divide-y divide-fashion-700">${r.rows.map((x,rank)=>`<div class="flex items-center gap-3 px-3 sm:px-4 py-3 ${rank===0?'bg-amber-900/10':''}">
                                <span class="w-8 shrink-0 text-center font-semibold text-fashion-gold tabular-nums">${statusLabel(x.status)==='OUT'?'—':String(rank+1).padStart(2,'0')}</span>
                                <span class="min-w-0 flex-1 text-sm text-white font-medium break-words">${esc(x.ate||'Designer')}</span>
                                <span class="shrink-0 text-xs font-bold tracking-wide ${statusClass(x.status)}">${esc(statusLabel(x.status))}</span>
                            </div>`).join('')}</div>
                        </section>`).join('')}
                    </div>`;
                }
            } catch(err) {
                console.warn('Public Track Record unavailable',err);
                if(slot?.isConnected)slot.innerHTML='<p class="text-amber-200 text-sm py-5">Não foi possível consultar as classificações públicas. Verifique a leitura de ranking_historico_publico nas regras do Firestore.</p>';
            }
            const gallery=$('#eliminationGalleryGrid');
            if(gallery)gallery.innerHTML='<p class="text-gray-400 col-span-full py-5">Confira as despedidas oficiais em Auf Wiedersehen, no Fashion Archive.</p>';
            return;
        }

        let [perfisSnap, evalsSnap] = await Promise.all([
            db.collection('perfis').where('role', '==', 'estilista').get(),
            db.collection('avaliacoes_resumo').get()
        ]);
        // Plano B até a otimização das notas ser feita (mais pesado).
        if (evalsSnap.empty) evalsSnap = await db.collection('avaliacoes').get();

        const stylists = perfisSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        const evals = evalsSnap.docs.map(d => d.data());
        // Sem fotos: os looks vêm das próprias avaliações (identificação do designer e rodada).
        const looksMap = new Map();
        evals.forEach(e => { if (e.look && !looksMap.has(e.look)) looksMap.set(e.look, { id: e.look, uid: e.alvo, ate: e.ate || e.alvoAte || '', rodada: e.rodada }); });
        const looks = [...looksMap.values()];

        const rodadasSet = new Set();
        looks.forEach(l => { if (l.rodada) rodadasSet.add(l.rodada); });
        const rodadas = [...rodadasSet].sort();

        if (!rodadas.length) {
            $('#trackRecordTableContainer').innerHTML = '<p class="text-gray-500 py-8 text-center">Nenhuma rodada registrada com looks ainda.</p>';
            return;
        }

        const statsByStylist = {};
        stylists.forEach(s => { statsByStylist[s.id] = { ate: s.ate, scores: [], rounds: {} }; });

        const evalByLook = {};
        evals.forEach(e => { ((evalByLook[e.look] ??= []).push(e.total)); });

        looks.forEach(l => {
            if (!statsByStylist[l.uid]) statsByStylist[l.uid] = { ate: l.ate, scores: [], rounds: {} };
            const lookEvals = evalByLook[l.id] || [];
            if (lookEvals.length) {
                const avg = lookEvals.reduce((a, b) => a + b, 0) / lookEvals.length;
                statsByStylist[l.uid].scores.push(avg);
                statsByStylist[l.uid].rounds[l.rodada] = { avg, lookId: l.id };
            }
        });

        // Prefer the immutable, official classification for each round. Never derive
        // WIN/TOP/BOTTOM from absolute score thresholds.
        const historySnap = await db.collection('ranking_historico').get();
        const officialByRound = new Map();
        historySnap.docs.forEach(doc => {
            const data = doc.data();
            const key = String(data.rodada ?? doc.id);
            officialByRound.set(key, data);
        });
        const resolveHistory = (round, index) => {
            const raw = String(round);
            const number = raw.match(/(?:W(?:EEK)?\s*0*|^)(\d+)$/i)?.[1];
            return officialByRound.get(raw) || (number ? officialByRound.get(String(Number(number))) : null)
                || (rodadas.length === 1 && officialByRound.size === 1 ? [...officialByRound.values()][0] : null);
        };
        const officialStatuses = new Map();
        rodadas.forEach((r,i) => {
            const history = resolveHistory(r,i);
            if (!history || !Array.isArray(history.rows)) return;
            const byUid = new Map();
            history.rows.forEach(entry => {
                if (!entry.uid) return;
                const status = String(entry.status || '').toUpperCase();
                byUid.set(entry.uid, /\bOUT\b/.test(status) ? 'OUT' : /WINNER|\bWIN\b/.test(status) ? 'WIN' : /\b(TOP|HIGH)\b/.test(status) ? 'HIGH' : /\bBOTTOM\b/.test(status) ? 'BOTTOM' : /\bLOW\b/.test(status) ? 'LOW' : 'SAFE');
            });
            officialStatuses.set(r,byUid);
        });

        // Prévia estritamente administrativa: enquanto não houver histórico oficial,
        // classificar pela posição relativa da rodada, nunca por faixas de nota.
        // WIN está incluído no total de TOPs configurado.
        const previewStatuses = new Map();
        rodadas.forEach(r => {
            if (officialStatuses.has(r)) return;
            const ranked = stylists.map(s => ({uid:s.id, avg:statsByStylist[s.id]?.rounds[r]?.avg}))
                .filter(x => Number.isFinite(x.avg))
                .sort((a,b) => b.avg-a.avg || String(a.uid).localeCompare(String(b.uid)));
            if (!ranked.length) return;
            const count = ranked.length;
            const desiredTop = count >= 16 ? 5 : count >= 11 ? 4 : count >= 7 ? 3 : count === 6 ? 2 : Math.min(2,count);
            const configuredTop = Math.max(0,Number(globalState.critiqueTopCount||0));
            const configuredBottom = Math.max(0,Number(globalState.critiqueBottomCount||0));
            const bottom = Math.min(2, Math.max(0,count-1));
            const top = Math.min(configuredTop || desiredTop, Math.max(1,count-bottom));
            const statuses = new Map();
            const low = Math.min(configuredBottom ? Math.max(0,configuredBottom-bottom) : Math.max(0, count >= 16 ? 4 : count >= 9 ? 2 : 1), Math.max(0,count-top-bottom));
            ranked.forEach((x,i) => statuses.set(x.uid,i===0?'WIN':i<top?'HIGH':i>=count-bottom?'BOTTOM':i>=count-bottom-low?'LOW':'SAFE'));
            previewStatuses.set(r,statuses);
        });

        const rowsData = stylists.map(s => {
            const sObj = statsByStylist[s.id];
            const totalScores = sObj.scores;
            const ppe = totalScores.length ? (totalScores.reduce((a, b) => a + b, 0) / totalScores.length).toFixed(2) : '0.00';
            return { uid: s.id, ate: s.ate, ppe: Number(ppe), rounds: sObj.rounds, out: s.out };
        }).sort((a, b) => b.ppe - a.ppe);

        let html = `
            <table class="w-full text-center border-collapse">
                <thead>
                    <tr class="bg-fashion-950 text-fashion-gold border-b border-fashion-700 text-[11px] font-cinzel">
                        <th class="p-2.5 text-left border-r border-fashion-700">DESIGNER</th>
                        <th class="p-2.5 border-r border-fashion-700">P.P.E.</th>
                        ${rodadas.map((r, i) => { const m = String(r).match(/w(?:eek)?\s*0*(\d+)/i); const n = m ? Number(m[1]) : i + 1; const label = String(r).replace(/^w(?:eek)?\s*0*\d+[\s_-]*/i, '').replace(/([a-z])([A-Z])/g, '$1 $2').replace(/[_-]+/g, ' ').trim(); return `<th class="p-2.5 border-r border-fashion-700 uppercase">W${String(n).padStart(2, '0')}${label ? ' — ' + esc(label) : ''}</th>`; }).join('')}
                    </tr>
                </thead>
                <tbody>
        `;

        rowsData.forEach(row => {
            html += `
                <tr class="border-b border-fashion-800 hover:bg-fashion-950/40 transition">
                    <td class="p-2.5 text-left font-bold text-white border-r border-fashion-700 font-cinzel">${esc(row.ate)}</td>
                    <td class="p-2.5 font-mono text-fashion-gold border-r border-fashion-700">${row.ppe}</td>
            `;

            rodadas.forEach(r => {
                const rData = row.rounds[r];
                let badgeText = '—';
                let badgeClass = 'bg-fashion-950 text-gray-600';

                if (row.out && !rData) {
                    badgeText = 'OUT';
                    badgeClass = 'bg-red-950 text-red-400 font-bold';
                } else if (rData) {
                    const classification = officialStatuses.get(r)?.get(row.uid) || previewStatuses.get(r)?.get(row.uid);
                    badgeText = classification || '—';
                    const classes = {
                        WIN:'bg-amber-700 text-amber-50 font-bold',
                        TOP:'bg-yellow-900 text-yellow-100 font-bold',
                        HIGH:'bg-yellow-900 text-yellow-100 font-bold',
                        LOW:'bg-orange-950 text-orange-200 font-bold',
                        SAFE:'bg-fashion-800 text-gray-200',
                        BOTTOM:'bg-rose-950 text-rose-200 font-bold',
                        OUT:'bg-red-950 text-red-300 font-bold',
                        '—':'bg-fashion-950 text-gray-600'
                    };
                    badgeClass = classes[badgeText] || classes['—'];
                }

                html += `<td class="p-2 border-r border-fashion-800"><span class="px-2 py-1 rounded text-[10px] inline-block uppercase ${badgeClass}">${badgeText}</span></td>`;
            });
            html += `</tr>`;
        });

        html += `</tbody></table>`;
        $('#trackRecordTableContainer').innerHTML = html;

        const eliminatedStylists = stylists.filter(s => s.out);
        const elimGrid = $('#eliminationGalleryGrid');
        // No elimination gallery is mounted inside the Archive Track Record tab.
        // The separate Auf Wiedersehen tab owns that gallery.
        if (!elimGrid) return;
        if (!eliminatedStylists.length) {
            elimGrid.innerHTML = '<p class="col-span-full text-gray-500 italic py-4">Nenhum Designer eliminada até o momento.</p>';
        } else {
            const elimHtmls = [];
            for (const s of eliminatedStylists) {
                const sLooks = looks.filter(l => l.uid === s.id).sort((a, b) => b.t - a.t);

        const topCount=Number(globalState.critiqueTopCount||0);

        // Private, read-only live previews. Do not mutate the voting or judging windows.

            ]);
            const label=id=>names[id]||id||'Não identificado';
            const rows=snapshot.docs.map(d=>d.data());
            const escPreview=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            let html='';
            if(mode==='jury'){
              const grouped=new Map();
              rows.forEach(v=>{
                if(!v.alvo||!Array.isArray(v.nota)||v.nota.length!==5||!v.nota.every(n=>Number.isFinite(Number(n))))return;
                const sum=v.nota.reduce((a,n)=>a+Number(n),0);
                if(!grouped.has(v.alvo))grouped.set(v.alvo,[]);
                grouped.get(v.alvo).push(sum);
              });
              const ordered=[...grouped].map(([id,scores])=>({id,count:scores.length,avg:scores.reduce((a,b)=>a+b,0)/scores.length})).sort((a,b)=>b.avg-a.avg);
              const configuredTop=Math.max(0,Number(globalState.critiqueTopCount||0));
              const configuredBottom=Math.max(0,Number(globalState.critiqueBottomCount||0));
              // The provisional classification is for the ADMIN only. Preserve WIN immunity.

              const topEnd=Math.min(ordered.length-bottomSlots,Math.max(1,topSlots));
              const bottomStart=ordered.length-bottomSlots;

              if(!configuredTop&&!configuredBottom&&!official.length)html+='<p class="text-amber-200">Vagas TOP/BOTTOM não configuradas e sem ranking anterior: a distribuição exibida é apenas indicativa. Configure as vagas no painel de críticas.</p>';
              if(incomplete)html+='<p class="text-amber-200">Há quantidades diferentes de avaliações entre os Designers.</p>';
              html+=classifications.length?classifications.map((x,i)=>`<div class="flex items-center justify-between gap-3 border-b border-fashion-700 py-2"><span>${i+1}º · ${escPreview(label(x.id))} <small class="text-gray-400">(${x.count} avaliações)</small><span class="ml-2 text-fashion-gold font-semibold">${x.status}</span></span><strong class="whitespace-nowrap">${x.avg.toFixed(2)}/50</strong></div>`).join(''):'<p>Nenhuma avaliação completa nesta rodada.</p>';
              if(globalState.semEliminacao||globalState.naoEliminatoria){html+='<p class="text-gray-400">ELIMINATION POOL: rodada não eliminatória.</p>';}
              else {html+='<p class="text-gray-400">ELIMINATION POOL: depende também do acumulado, das elegibilidades e das regras especiais da rodada. Consulte a apuração oficial; esta prévia não define o Pool.</p>';}
            }else{
              const types=mode==='cast'?[['veto','ÍCONE DA MODA'],['fdm','FORA DE MODA']]:[['ber','SALVAÇÃO · ELIMINATION POOL']];
              html='<p class="text-gray-400">Contagem parcial dos votos registrados. A consulta não fecha a urna nem revela votos aos participantes.</p>';
              types.forEach(([type,title])=>{
                const counts=new Map();
                rows.filter(v=>v.tipo===type&&v.alvo).forEach(v=>counts.set(v.alvo,(counts.get(v.alvo)||0)+1));
                const sorted=[...counts].sort((a,b)=>b[1]-a[1]);

        document.addEventListener('click',e=>{
          const b=e.target.closest('[data-fau-preview]');
          if(b){renderFauPrivatePreview(b.dataset.fauPreview);return;}

        });
        const computeSeasonStandings = async () => {
            const [profilesSnap, evalsSnap] = await Promise.all([
                db.collection('perfis').where('role', '==', 'estilista').get(),
                db.collection('avaliacoes').get()
            ]);

            const supremeRankingState=globalState.themeId==='theme_next_supreme' ? await supremeState() : null;
            if(supremeRankingState && supremeRankingState.phase!=='selected') throw new Error('A Supreme Vote precisa ser concluída antes de apurar o ranking.');
            const supremeWinners=new Map((supremeRankingState?.winners||[]).map(w=>[w.uid,`${globalState.rodada}_${w.uid}_${w.slot-1}`]));
            const evaluationsByLook = {};
            evalsSnap.docs.forEach(d => {
                const data = d.data();
                if(supremeRankingState && data.rodada===globalState.rodada && supremeWinners.get(data.alvo)!==data.look) return;
                ((evaluationsByLook[data.alvo] ??= {})[data.look] ??= { r: data.rodada, scores: [] }).scores.push(data.total);
            });

            const absencesSnap = globalState.themeId === 'theme_traitors' ? await db.collection('ausencias_rodada').where('rodada','==',globalState.rodada || 'sem-rodada').get() : null;
            const absentUids = new Set(absencesSnap ? absencesSnap.docs.map(d=>d.data().uid) : []);
            const activeStylists = profilesSnap.docs.filter(d => !d.data().out && !d.data().disabled && !absentUids.has(d.id));
            if (globalState.themeId === 'theme_beauty_eye') {
                const lookSnap = await db.collection('looks').where('rodada','==',globalState.rodada || 'sem-rodada').get();
                const slotsByUid = {};
                lookSnap.docs.forEach(d => {const l=d.data(); (slotsByUid[l.uid] ??= new Set()).add(l.slot);});
                const missing = activeStylists.filter(d => {
                    const slots=slotsByUid[d.id];
                    if (!slots?.has(1) || !slots?.has(2)) return true;
                    const scored=Object.values(evaluationsByLook[d.id] || {}).filter(x=>x.r===globalState.rodada && x.scores.length);
                    return scored.length < 2;
                });
                if (missing.length) throw new Error('Beauty: os dois looks de cada estilista precisam estar enviados e avaliados antes da apuração: '+missing.map(d=>d.data().ate||d.id).join(', '));
            }
            const rows = activeStylists.map(doc => {
                let totalAccumulated = 0;
                let currentRoundScore = 0;
                const looksObj = evaluationsByLook[doc.id] || {};

                const perRound = {};
                for (const lookKey in looksObj) {
                    const lookData = looksObj[lookKey];
                    const avg = lookData.scores.reduce((a, b) => a + b, 0) / lookData.scores.length;
                    const pr = (perRound[lookData.r] ??= { sum: 0, n: 0 });
                    pr.sum += avg; pr.n++;
                }
                for (const r in perRound) {
                    // Rodadas antigas (sem modo salvo) continuam somando, como antes.
                    const isBeautyRound = r === globalState.rodada && globalState.themeId === 'theme_beauty_eye';
                    const v = !isBeautyRound && globalState.modos?.[r] === 'media' ? perRound[r].sum / perRound[r].n : perRound[r].sum;
                    if (r === globalState.rodada) currentRoundScore += v;
                    if (globalState.fase !== 'final' || r === globalState.rodada) totalAccumulated += v;
                }

                return { uid: doc.id, ate: doc.data().ate, tot: Number(totalAccumulated.toFixed(2)), rd: Number(currentRoundScore.toFixed(2)) };
            });

            return rows.sort((a, b) => b.tot - a.tot || b.rd - a.rd);
        };

        // THE BLACK BANQUET: duas lideranças imunizadas, um WIN oficial geral.
        const computeTraitorsPool = async standings => {
            if (!isAdmin) throw new Error('Apenas a produção pode apurar as facções.');
            const round = String(globalState.rodada || '');
            if (!round) throw new Error('Selecione uma rodada antes de apurar The Traitors.');
            const snaps = await Promise.all(standings.map(x => db.doc(`sorteios/${round}_${x.uid}`).get()));
            const members = standings.map((x,i) => ({...x, faction: snaps[i].exists && snaps[i].data().themeId === 'theme_traitors' ? snaps[i].data().value : null}));
            const missing = members.filter(x => !['Faithful','Traitor'].includes(x.faction));
            if (missing.length) throw new Error('Facções pendentes: '+missing.map(x=>x.ate).join(', '));
            const byBest=(a,b)=>b.rd-a.rd || b.tot-a.tot || a.uid.localeCompare(b.uid);
            const byWorst=(a,b)=>a.rd-b.rd || a.tot-b.tot || a.uid.localeCompare(b.uid);
            const byAccum=(a,b)=>a.tot-b.tot || a.rd-b.rd || a.uid.localeCompare(b.uid);
            const faithfuls=members.filter(x=>x.faction==='Faithful').sort(byBest);
            const traitors=members.filter(x=>x.faction==='Traitor').sort(byBest);
            if (!faithfuls.length || !traitors.length) throw new Error('The Traitors exige pelo menos um Faithful e um Traitor para a apuração por facções.');
            const bestFaithful=faithfuls[0], bestTraitor=traitors[0];
            const win=[bestFaithful,bestTraitor].sort(byBest)[0];
            // Facção com apenas um integrante: ele só é imune se for o WIN geral.
            // A outra facção conserva a imunidade de seu líder quando possui 2+ integrantes.
            const immuneUids=[bestFaithful,bestTraitor]
                .filter(x=>(x.faction==='Faithful'?faithfuls.length:traitors.length)>1 || x.uid===win.uid)
                .map(x=>x.uid);
            const protectedSet=new Set(immuneUids);
            const selected=[];
            const add=x=>{if(x&&!protectedSet.has(x.uid)&&!selected.some(y=>y.uid===x.uid))selected.push(x);};
            // As duas primeiras vagas pertencem às facções. Se uma facção não tiver
            // ninguém elegível, sua vaga passa ao próximo pior da facção oposta.
            const worstFaithful=[...faithfuls].sort(byWorst).filter(x=>!protectedSet.has(x.uid));
            const worstTraitor=[...traitors].sort(byWorst).filter(x=>!protectedSet.has(x.uid));
            add(worstFaithful[0]);
            add(worstTraitor[0]);
            let fallback=false;
            if (selected.length<2) {
                const replacementPool = worstFaithful.length===0 ? worstTraitor
                    : worstTraitor.length===0 ? worstFaithful
                    : [...members].filter(x=>!protectedSet.has(x.uid)).sort(byWorst);
                const replacement=replacementPool.find(x=>!selected.some(y=>y.uid===x.uid));
                if(replacement){add(replacement);fallback=true;}
            }
            // Terceira vaga: pior acumulado elegível que ainda não esteja no Pool.
            add([...members].sort(byAccum).find(x=>!protectedSet.has(x.uid)&&!selected.some(y=>y.uid===x.uid)));
            if (selected.length!==3) throw new Error(`Não foi possível formar o Elimination Pool com três pessoas: há apenas ${selected.length} elegíveis. Confira os participantes, as notas e as imunidades.`);
            return {pool:selected,members,win,bestFaithful,bestTraitor,immuneUids,fallback,
                reason:fallback?'Uma facção não tinha participante elegível: as duas vagas de facção foram preenchidas pelos dois piores elegíveis da outra facção. Terceira vaga: pior acumulado elegível. Imunidades preservadas; um único WIN oficial.':'Pior Faithful + pior Traitor + pior acumulado elegível. Líder de facção única só é imune se for o WIN geral. Um único WIN oficial exerce desempates.'};
        };

        const printTable = rows => `
            <table class="w-full text-left">
                <thead><tr class="border-b border-fashion-700 text-fashion-gold"><th>#</th><th>Designer</th><th>Acumulado da Temporada</th><th>Nota da Rodada</th></tr></thead>
                <tbody>${rows.map((r, i) => `<tr class="border-b border-fashion-800"><td>${i + 1}</td><td>${esc(r.ate)}</td><td>${r.tot}</td><td>${r.rd}</td></tr>`).join('')}</tbody>
            </table>

        document.getElementById('fauToggleScoreWindow')?.addEventListener('click',safeExec(async()=>{const closing=!globalState.notasEncerradas;if(!confirm(closing?'Encerrar o prazo de notas para todos os jurados?':'Reabrir o prazo de notas para todos os jurados?'))return;await db.doc('config/estado').update({notasEncerradas:closing});showToast(closing?'Notas encerradas':'Notas reabertas');}));
        document.getElementById('fauToggleCritiqueWindow')?.addEventListener('click',safeExec(async()=>{
            const opening=!globalState.criticasAbertas||globalState.criticasEncerradas;

                const round=String(globalState.rodada||'');
                if(!round)throw new Error('Nenhuma rodada ativa.');
                const official=await db.collection('ranking_historico').doc(round).get();
                let names=[];
                if(official.exists && Array.isArray(official.data().rows)){
                    const rows=official.data().rows;
                    const prev=Number(round)>1?await db.collection('ranking_historico').doc(String(Number(round)-1)).get():null;
                    const prevWin=prev?.exists?(prev.data().rows||[]).find(r=>/\bWIN\b/i.test(r.status||''))?.ate:null;
                    const top=Math.max(0,Number(globalState.critiqueTopCount||0));
                    const bottom=Math.max(0,Number(globalState.critiqueBottomCount||0));
                    names=rows.filter((r,i)=>/\b(WIN|TOP|HIGH)\b/i.test(r.status||'')||(bottom===0&&/\b(BOTTOM|LOW)\b/i.test(r.status||''))||r.ate===prevWin||(top>0&&i<top)||(bottom>0&&i>=rows.length-bottom)).map(r=>r.ate);

                    if(!standings.length)throw new Error('Não há entregas válidas para convocar críticas.');
                    const n=standings.length;
                    const bottom=Math.min(Math.max(0,Number(globalState.critiqueBottomCount||0))||6,Math.max(0,n-1));
                    const desiredTop=n>=16?5:n>=11?4:n>=7?3:n===6?2:Math.min(2,n);
                    const top=Math.min(Math.max(0,Number(globalState.critiqueTopCount||0))||desiredTop,Math.max(1,n-bottom));

                        const prev=await db.collection('ranking_historico').doc(String(Number(round)-1)).get();

                    }
                }
                const eligible=await fauEligibleCritiqueNames();

                if(!names.length)throw new Error('Nenhum Designer elegível para críticas.');
                update.critiqueCall={round,names};

            await db.doc('config/estado').update(update);

            if(opening)await fauCritiqueAdminMount();
        }));
        document.getElementById('fauSaveCritiqueCounts')?.addEventListener('click',safeExec(async()=>{const top=Number(document.getElementById('fauCritiqueTopCount')?.value),bottom=Number(document.getElementById('fauCritiqueBottomCount')?.value);if(!Number.isInteger(top)||!Number.isInteger(bottom)||top<0||bottom<0||top>30||bottom>30)throw new Error('Informe valores entre 0 e 30.');await db.doc('config/estado').update({critiqueTopCount:top,critiqueBottomCount:bottom});showToast('Vagas de críticas configuradas: os 2 BOTTOM estão incluídos no total inferior.');await fauCritiqueAdminMount();}));

            fauStatusEl.innerHTML=[
              '<p class="text-[11px] text-fashion-gold tracking-widest">✂️ ENTREGAS E AVALIAÇÕES</p>',
              '<div class="grid grid-cols-1 lg:grid-cols-2 gap-3">',
              fauStatusCard('✂️ Entregas dos Designers',cast,submitted,`${required} look(s) por Designer`),
              fauStatusCard('⚖️ Avaliações dos jurados',jurors,juryDone,lookIds.size?`${lookIds.size} looks na bancada`:'aguardando looks'),
              '</div>',
              '<p class="text-[11px] text-fashion-gold tracking-widest pt-2">🗳️ VOTAÇÕES DA RODADA</p>',
              '<div class="grid grid-cols-1 lg:grid-cols-2 gap-3">',...voteCards,'</div>'
            ].join('');
          }catch(err){if(fauStatusEl.isConnected)fauStatusEl.innerHTML=`<p class="text-xs text-amber-300">Não foi possível consultar os contadores: ${esc(err.message||'verifique as permissões')}</p>`;}
          finally{fauStatusBusy=false;}
        };
        $('#fauStatusRefresh')?.addEventListener('click',refreshFauStatus);
        refreshFauStatus();
        // Atualização em tempo real sem renderizar informações identificáveis.
        ['looks','avaliacoes','votos','perfis'].forEach(name=>{
          const query=name==='perfis'?db.collection(name):db.collection(name).where('rodada','==',globalState.rodada || 'sem-rodada');

        // Contagem anônima sem Cloud Functions: a Direção sincroniza o placar
        // com dados privados, publicando apenas números no documento público.
        // Não há leitura de nomes/envios alheios pelo Designer.
        let fauRosterForPulse = null;
        let fauLooksForPulse = null;
        let fauPulseWriting = false;
        let fauPulsePending = false;
        let fauLastPulseSignature = '';
        const syncFauPublicPulse = async () => {
            if (!isAdmin || !globalState.rodada || !fauRosterForPulse || !fauLooksForPulse) return;
            const round = String(globalState.rodada);
            const active = new Set(fauRosterForPulse.docs.filter(d => {
                const p = d.data();
                return p.role === 'estilista' && p.disabled !== true && p.ativo !== false && p.eliminado !== true && p.out !== true && String(p.status || '').toUpperCase() !== 'OUT';
            }).map(d => d.id));
            const required = Number(getTheme()?.numSubmissoes || globalState.numSubmissoes || 1);
            const counts = new Map();
            fauLooksForPulse.docs.forEach(d => {
                const l = d.data();
                if(active.has(l.uid)) counts.set(l.uid, (counts.get(l.uid)||0)+1);
            });
            const sent = [...counts.values()].filter(n => n >= required).length;
            const signature = [round, sent, active.size, required].join('|');
            if(signature === fauLastPulseSignature) return;
            if(fauPulseWriting){fauPulsePending=true;return;}
            fauPulseWriting=true;
            try {
                await db.doc('config/entregas_publicas').set({
                    rodada:round, enviados:sent, total:active.size,
                    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
                });
                fauLastPulseSignature=signature;
            }catch(error){console.warn('Não foi possível atualizar a contagem anônima:',error);}
            finally {
                fauPulseWriting=false;
                if(fauPulsePending){fauPulsePending=false;queueMicrotask(syncFauPublicPulse);}
            }
        };
        sub(db.collection('perfis'), snap=>{fauRosterForPulse=snap;syncFauPublicPulse();});

            container.innerHTML = `

                                <div class="min-w-0"><h4 class="fau-profile-name">${esc(p.role==='jurado'?(p.nomeJurado||p.ate||'Sem nome'):(p.ate||'Sem nome'))}</h4><p class="fau-profile-sub">${esc(p.role==='jurado'?'Jurado · nome público':(p.manifesto ? 'Manifesto cadastrado' : 'Sem manifesto'))}</p></div>

                                            <option value="estilista" ${p.role==='estilista'?'selected':''}>Designer</option><option value="jurado" ${p.role==='jurado'?'selected':''}>Jurado</option><option value="plateia" ${p.role==='plateia'?'selected':''}>Público</option>
                                        </select><button data-act="save-role" data-uid="${p.id}" ${isSelf?'disabled':''} class="fau-profile-btn">Salvar função</button></div>
                                        <div class="fau-profile-actions"><button data-act="reset-random-password" data-uid="${p.id}" data-name="${esc(p.ate||p.username||'Usuário')}" class="fau-profile-btn fau-profile-edit"><i class="fa-solid fa-key" aria-hidden="true"></i> Nova senha aleatória</button><button data-act="toggle-status" data-uid="${p.id}" data-current="${isDisabled?'true':'false'}" ${isSelf?'disabled':''} class="fau-profile-btn">${isDisabled?'Ativar':'Desativar'}</button>
                                        <button data-act="delete-profile" data-uid="${p.id}" data-name="${esc(p.ate)}" ${isSelf?'disabled':''} class="fau-profile-btn fau-profile-danger">Excluir perfil</button></div>
                                    </div>
                                </details>
                            </div>
                        </article>`;
                    }).join('')}
                </div>
            `;
        });

        // Checklist factual: evita apresentar etapas como concluídas sem confirmação.

          ['🎬','Opening Sequence','Abertura e briefing'],['✂️','The Workroom','Bastidores e entregas'],

          ['🏆','The Weekly WIN','Anúncio do WIN da rodada'],['🗳️','The Voting Room','Votação dos estilistas'],
          ['🚨','The Elimination Pool','Revelação dos elegíveis'],['🏆','The Final Decision','Resultado oficial']
        ];

          info.textContent=`CENA ${liveSceneIndex+1}/${liveScenes.length} · ${liveScenes[liveSceneIndex][1]} — ${liveScenes[liveSceneIndex][2]}. Este marcador não altera permissões nem revela informações.`;

          theme_tarantino:['🎞️ Tarantino','Use o dossiê First Kill / Last Stand e as regras específicas de dupla eliminação. Evite publicar o Bottom 3 padrão.',['btnApurarRanking']],

          twistBox.addEventListener('click',e=>{const b=e.target.closest('[data-twist-jump]');if(!b)return;const target=document.getElementById(b.dataset.twistJump);if(target){target.scrollIntoView({behavior:'smooth',block:'center'});target.focus();}else showToast('Controle específico indisponível nesta etapa.');});

        $('#fauReunionGenerate').onclick=safeExec(async()=>{

          const votes=voteSnap.docs.map(d=>d.data());
          const display=id=>names[id]||id||'Designer não identificada';
          const lines=[];

            const counts={};votes.filter(v=>v.tipo===tipo&&v.alvo).forEach(v=>counts[v.alvo]=(counts[v.alvo]||0)+1);
            const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);

            const top=sorted[0][1],leaders=sorted.filter(x=>x[1]===top);

            const ranking=Object.entries(scores).map(([id,arr])=>({id,n:arr.length,avg:arr.reduce((a,b)=>a+b,0)/arr.length})).sort((a,b)=>b.avg-a.avg);
            if(ranking.length){const top=ranking[0].avg;const leaders=ranking.filter(x=>Math.abs(x.avg-top)<0.000001);lines.push(`Maior média das avaliações | ${leaders.map(x=>display(x.id)).join(' e ')} — ${top.toFixed(2)}/50 (${leaders.map(x=>x.n).join(' e ')} avaliação(ões); média individual, não pontuação acumulada)`);}
            lines.push(`Avaliações registradas | ${jury.length} avaliações completas em ${new Set(jury.map(a=>String(a.rodada))).size} rodada(s)`);

                const desiredTop = count >= 16 ? 5 : count >= 11 ? 4 : count >= 7 ? 3 : count === 6 ? 2 : Math.min(2,count);

                const configuredTop = Math.max(0, Number(globalState.critiqueTopCount||0));
                const bottom = Math.min(2, Math.max(0, count - 1)); // BOTTOM: sempre os dois últimos
                const top = Math.min(configuredTop || desiredTop, Math.max(1, count - bottom));
                const low = Math.min(configuredBottom ? Math.max(0,configuredBottom-bottom) : Math.min(4, Math.max(0, count-top-bottom)), Math.max(0,count-top-bottom));
