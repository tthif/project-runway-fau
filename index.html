<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Runway: Fau's Edition</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<style>
:root{--ink:#0d0c10;--card:#17151c;--ivory:#f3ede2;--gold:#c9a24b;--red:#b3263e}
body{background:var(--ink);color:var(--ivory);font-family:Inter,sans-serif}
h1,h2,h3,.cz{font-family:Cinzel,serif;letter-spacing:.04em}
h2{color:var(--gold);font-size:1.25rem;margin:.5rem 0}
.card{background:var(--card);border:1px solid #2c2933;border-radius:6px;padding:12px;margin:10px 0}
input,textarea,select{background:var(--ink);border:1px solid #3a3643;border-radius:4px;padding:8px;width:100%;color:var(--ivory);margin:3px 0}
button{background:var(--gold);color:#111;font-weight:600;border-radius:4px;padding:8px 14px;cursor:pointer}
button.g{background:transparent;color:var(--ivory);border:1px solid #3a3643}
button.r{background:var(--red);color:#fff}
nav button{background:none;color:var(--ivory);padding:10px 12px;border-radius:0;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{border-color:var(--gold);color:var(--gold)}
img.l{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:4px}
.m{color:#9a94a6;font-size:.85rem}
:focus-visible{outline:2px solid var(--gold)}
</style></head>
<body>
<header class="p-3 flex justify-between items-center border-b border-zinc-800"><h1 class="text-lg text-[#c9a24b]">PROJECT RUNWAY <span class="m">Fau's Edition</span></h1><div id="who" class="m"></div></header>
<nav id="nav" class="flex overflow-x-auto border-b border-zinc-800"></nav>
<main id="v" class="p-3 max-w-3xl mx-auto"></main>
<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-black border border-zinc-700 px-4 py-2 rounded hidden z-50"></div>
<script>
// 1) Cole aqui a config do seu projeto Firebase (Configurações do projeto > Seus apps > Web)
const cfg={apiKey:"COLE_AQUI",authDomain:"",projectId:"",storageBucket:"",messagingSenderId:"",appId:""};
firebase.initializeApp(cfg);
const A=firebase.auth(),D=firebase.firestore(),S=firebase.storage(),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const mail=n=>slug(n)+'@fau.game',now=()=>Date.now();
const CRIT=['Criatividade','Styling e composição','Interpretação do briefing','Harmonia modelo/look','Impacto visual'];
const N={work:'Workroom',guerra:'Sala de Guerra',runway:'Runway',tribunal:'Tribunal',berlinda:'Berlinda',conf:'Confessionário',bancada:'Bancada',direcao:'Direção'};
const TABS={estilista:['work','guerra','runway','tribunal','berlinda','conf'],jurado:['bancada','runway'],plateia:['runway','tribunal'],admin:['direcao','runway','guerra','conf']};
const V={};let me,adm=false,st={},U=[],T=[],cur,hold=false;
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3500)};
const v=h=>{$('#v').innerHTML=h;$('#v').onclick=null};
const on=(q,f)=>T.push(q.onSnapshot(f,e=>toast('Erro: '+e.code)));
const guard=f=>async(...a)=>{try{await f(...a)}catch(e){toast(e.message)}};
const tl=()=>me.out&&me.role=='estilista'?['runway','guerra']:TABS[me.role];
const comp=f=>new Promise(ok=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(ok,'image/jpeg',.85)};i.src=URL.createObjectURL(f)}); // recomprime e remove EXIF

setInterval(()=>{const e=$('#tm');if(!e)return;const d=(st.prazo||0)-now();if(d<=0)return e.textContent='Prazo encerrado';e.textContent=[Math.floor(d/36e5),Math.floor(d%36e5/6e4),Math.floor(d%6e4/1e3)].map(x=>String(x).padStart(2,'0')).join(':')},1000);

const login=()=>{v(`<div class="card"><h2>Entrar</h2><input id="nm" placeholder="Nome do ateliê (ou direcao)"><input id="pw" type="password" placeholder="Senha"><label class="m"><input id="au" type="checkbox" style="width:auto"> Sou público (criar conta na Primeira Fila)</label><br><button id="go">Entrar</button></div>`);
 $('#go').onclick=guard(async()=>{const n=$('#nm').value.trim(),p=$('#pw').value;
  try{await A.signInWithEmailAndPassword(mail(n),p)}catch(e){if(!$('#au').checked)throw e;hold=true;try{const c=await A.createUserWithEmailAndPassword(mail(n),p);await D.doc('perfis/'+c.user.uid).set({ate:n,role:'plateia'})}finally{hold=false}start(A.currentUser)}})};

const start=async u=>{U.forEach(f=>f());U=[];T.forEach(f=>f());T=[];$('#nav').innerHTML='';if(!u){$('#who').innerHTML='';return login()}
 adm=(await D.doc('admins/'+u.uid).get()).exists;const p=await D.doc('perfis/'+u.uid).get();
 me={uid:u.uid,role:'plateia',ate:'?',...p.data()};if(adm){me.role='admin';me.ate='Direção'}
 $('#who').innerHTML=`${esc(me.ate)} <button class="g" onclick="A.signOut()">Sair</button>`;
 U.push(D.doc('config/estado').onSnapshot(s=>{st=s.data()||{};tab(cur)}))};
const tab=k=>{const l=tl();cur=k=l.includes(k)?k:l[0];T.forEach(f=>f());T=[];
 $('#nav').innerHTML=l.map(t=>`<button class="${t==k?'on':''}" onclick="tab('${t}')">${N[t]}</button>`).join('');V[k]()};
A.onAuthStateChanged(u=>hold||start(u));

const chat=(col,h)=>()=>{v(`<h2>${h}</h2><div id="ms" class="card h-80 overflow-auto"></div><div class="flex gap-2"><input id="tx"><button id="sd">Enviar</button></div>`);
 on(D.collection(col).orderBy('t').limitToLast(100),s=>{$('#ms').innerHTML=s.docs.map(d=>{const m=d.data();return `<p class="mb-1"><b class="cz">${esc(m.ate)}</b> <span class="m">${new Date(m.t).toLocaleString('pt-BR')}</span><br>${esc(m.txt)}</p>`}).join('');$('#ms').scrollTop=1e9});
 $('#sd').onclick=guard(async()=>{const x=$('#tx').value.trim();if(!x)return;await D.collection(col).add({ate:me.ate,uid:me.uid,txt:x,t:now()});$('#tx').value=''})};
V.guerra=chat('sala_de_guerra','Sala de Guerra');
V.conf=chat('confessionarios','Confessionário');

V.work=()=>{let M=[],mine=[],E=[],P=0;const fin=st.fase=='final';
 v(`<h2>Workroom · ${esc(st.rodada||'sem rodada')}</h2><div class="card"><div id="tm" class="cz text-2xl text-[#c9a24b]"></div><div id="th" class="m"></div></div><div id="vt"></div><div id="cat"></div>`);
 const R=()=>{const cl=mine.filter(l=>l.rodada==st.rodada),used=new Set((fin?cl:mine).map(l=>l.modelo)),need=fin?4:1,u=new Set(E.map(e=>e.uid)).size,
   vis=M.filter(m=>!used.has(m.id)&&(!m.vetoPor||m.vetoPor==me.uid)).sort((a,b)=>a.nome.localeCompare(b.nome));
  $('#th').textContent=`${u} enviados, ${Math.max(P-u,0)} pendentes`;
  $('#vt').innerHTML=st.vetoDet==me.uid&&!M.some(m=>m.vetoPor==me.uid)?`<div class="card"><b>Você tem o Veto de Modelo</b><select id="vs">${M.filter(m=>!m.vetoPor).map(m=>`<option value="${m.id}">${esc(m.nome)}</option>`).join('')}</select><button id="vb">Vetar</button></div>`:'';
  $('#cat').innerHTML=cl.length>=need?`<div class="card">Look enviado ✓ (${cl.length}/${need})</div>`:`<div class="card"><b>Modelos disponíveis${fin?` · enviados ${cl.length}/4 (2F + 2M)`:''}</b><div class="grid grid-cols-3 gap-2">${vis.map(m=>`<label class="m"><img class="l" src="${esc(m.foto)}"><input type="radio" name="mo" value="${m.id}" style="width:auto"> ${esc(m.nome)} (${m.g}) ${m.vetoPor?'🚫':''}</label>`).join('')}</div><input id="fl" type="file" accept="image/*"><textarea id="mem" placeholder="Memorial descritivo"></textarea><button id="sb">Enviar look</button></div>`;
  $('#v').onclick=guard(async e=>{const id=e.target.id;
   if(id=='vb')await D.doc('modelos/'+$('#vs').value).update({vetoPor:me.uid});
   if(id=='sb'){const mo=document.querySelector('[name=mo]:checked'),f=$('#fl').files[0],tx=$('#mem').value.trim();
    if(now()>st.prazo)throw Error('Prazo encerrado');if(!mo||!f||!tx)throw Error('Escolha modelo, foto e memorial');
    const m=M.find(x=>x.id==mo.value);if(fin&&cl.filter(l=>l.g==m.g).length>=2)throw Error('Final: 2 femininos e 2 masculinos');
    const i=cl.length,lid=`${st.rodada}_${me.uid}_${i}`,r=S.ref(`looks/${st.rodada}/${me.uid}_${i}.jpg`);
    await r.put(await comp(f));const url=await r.getDownloadURL(),b=D.batch();
    b.set(D.doc('looks/'+lid),{uid:me.uid,ate:me.ate,rodada:st.rodada,modelo:m.id,g:m.g,url,mem:tx,t:now()});
    b.set(D.doc('envios/'+lid),{rodada:st.rodada,uid:me.uid});await b.commit();toast('Look enviado')}})};
 D.collection('perfis').where('role','==','estilista').get().then(s=>{P=fin?3:st.fase=='top5'?5:s.docs.filter(d=>!d.data().out).length;R()});
 on(D.collection('modelos'),s=>{M=s.docs.map(d=>({id:d.id,...d.data()}));R()});
 on(D.collection('looks').where('uid','==',me.uid),s=>{mine=s.docs.map(d=>({id:d.id,...d.data()}));R()});
 on(D.collection('envios').where('rodada','==',st.rodada||'-'),s=>{E=s.docs.map(d=>d.data());R()})};

V.bancada=()=>{let L=[],AV={};const aud={};let mr;v(`<h2>Bancada dos Jurados · ${esc(st.rodada||'')}</h2><div id="ls"></div>`);
 const R=()=>{$('#ls').innerHTML=L.map(l=>{const a=AV[l.id]||{},n=a.nota||[5,5,5,5,5];return `<div class="card"><img class="l" src="${esc(l.url)}" loading="lazy"><b>${esc(l.ate)}</b><p class="m">${esc(l.mem)}</p>${CRIT.map((c,i)=>`<label class="m block">${c}: <output>${n[i]}</output><input type="range" min="0" max="10" step="0.1" value="${n[i]}" data-l="${l.id}" oninput="this.previousElementSibling.value=this.value"></label>`).join('')}<div id="c-${l.id}">${(a.coment||['']).map(c=>`<textarea placeholder="Comentário técnico">${esc(c)}</textarea>`).join('')}</div><button class="g" data-add="${l.id}">+ Comentário</button> <button class="g" data-rec="${l.id}">🎙 Nota de voz${a.audio?' ✓':''}</button> <button data-save="${l.id}">Salvar${a.nota?' ✓':''}</button></div>`}).join('')||'<p class="m">Nenhum look nesta rodada.</p>'};
 $('#ls').onclick=guard(async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,id=d.add||d.rec||d.save;
  if(d.add){const t=document.createElement('textarea');t.placeholder='Comentário técnico';$('#c-'+id).append(t)}
  if(d.rec){if(mr&&mr.state=='recording'){mr.stop();return}const s=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];mr=new MediaRecorder(s);mr.ondataavailable=x=>ch.push(x.data);
   mr.onstop=guard(async()=>{s.getTracks().forEach(t=>t.stop());const r=S.ref(`audios/${id}_${me.uid}.webm`);await r.put(new Blob(ch));aud[id]=await r.getDownloadURL();b.textContent='🎙 Áudio anexado ✓';toast('Nota de voz anexada')});mr.start();b.textContent='⏹ Parar'}
  if(d.save){const l=L.find(x=>x.id==id),nota=[...document.querySelectorAll(`input[data-l="${id}"]`)].map(x=>+x.value),coment=[...document.querySelectorAll('#c-'+id+' textarea')].map(x=>x.value.trim()).filter(Boolean);
   await D.doc(`avaliacoes/${id}_${me.uid}`).set({look:id,alvo:l.uid,rodada:l.rodada,jurado:me.uid,nota,total:+nota.reduce((p,c)=>p+c,0).toFixed(1),coment,audio:aud[id]||AV[id]?.audio||'',t:now()});toast('Avaliação salva')}});
 on(D.collection('looks').where('rodada','==',st.rodada||'-'),s=>{L=s.docs.map(d=>({id:d.id,...d.data()}));R()});
 on(D.collection('avaliacoes').where('jurado','==',me.uid),s=>{AV={};s.docs.forEach(d=>AV[d.data().look]=d.data());R()})};

V.runway=()=>{if(!st.liberado&&!adm)return v(`<div class="card"><h2>Sigilo da Direção</h2><p class="m">A Runway abre quando a Direção liberar os looks.</p></div>`);
 v(`<h2>Runway · ${esc(st.rodada||'')}</h2><div id="rk" class="card"></div><div id="fo" class="card" hidden></div><div id="gl" class="grid grid-cols-2 gap-2"></div>`);let L=[],RC=[],sel=[];
 const R=()=>{$('#gl').innerHTML=L.map(l=>{const c={};RC.filter(r=>r.look==l.id).forEach(r=>c[r.e]=(c[r.e]||0)+1);
   return `<div class="card"><img class="l" src="${esc(l.url)}" loading="lazy"><b>${esc(l.ate)}</b><p class="m">${esc(l.mem)}</p><div>${['🔥','🤯','🥱','✂️'].map(e=>`<button class="g" data-r="${l.id}|${e}">${e} ${c[e]||''}</button>`).join('')}</div><label class="m"><input type="checkbox" style="width:auto" data-s="${l.id}" ${sel.includes(l.id)?'checked':''}> Face-Off</label></div>`}).join('');
  const[a,b]=sel.map(i=>L.find(l=>l.id==i));$('#fo').hidden=!(a&&b);if(a&&b)$('#fo').innerHTML=`<h2>Face-Off</h2><div class="grid grid-cols-2 gap-2">${[a,b].map(l=>`<div><img class="l" src="${esc(l.url)}"><b>${esc(l.ate)}</b></div>`).join('')}</div>`};
 $('#gl').onclick=guard(async e=>{const b=e.target.closest('[data-r]');if(b){const[l,em]=b.dataset.r.split('|');await D.doc(`reacoes/${l}_${me.uid}`).set({look:l,e:em,uid:me.uid,rodada:st.rodada})}});
 $('#gl').onchange=e=>{const i=e.target.dataset.s;if(!i)return;sel=e.target.checked?[...sel,i].slice(-2):sel.filter(x=>x!=i);R()};
 on(D.collection('looks').where('rodada','==',st.rodada),s=>{L=s.docs.map(d=>({id:d.id,...d.data()}));R()});
 on(D.collection('reacoes').where('rodada','==',st.rodada),s=>{RC=s.docs.map(d=>d.data());R()});
 on(D.doc('ranking/atual'),s=>{const d=s.data();$('#rk').innerHTML=d?`<b>Ranking</b>${d.rows.map((x,i)=>`<div>${i+1}. ${esc(x.ate)} <span class="m">${esc(x.status)}</span></div>`).join('')}`:'<span class="m">Ranking ainda não publicado.</span>'})};

V.tribunal=()=>{v(`<h2>Tribunal Front Row</h2><div class="card"><b>Veto de Modelo</b><p class="m">Quem decide o modelo vetado na próxima rodada?</p><select id="v1"></select><button id="b1">Votar</button></div><div class="card"><b>Fora de Moda</b><p class="m">Quem leva o selo?</p><select id="v2"></select><button id="b2">Votar</button></div>`);
 D.collection('perfis').where('role','==','estilista').get().then(s=>{$('#v1').innerHTML=$('#v2').innerHTML=s.docs.filter(d=>!d.data().out&&d.id!=me.uid).map(d=>`<option value="${d.id}">${esc(d.data().ate)}</option>`).join('')});
 [1,2].forEach(n=>$('#b'+n).onclick=guard(async()=>{const t=n==1?'veto':'fdm';await D.doc(`votos/${t}_${st.rodada}_${me.uid}`).set({tipo:t,rodada:st.rodada,alvo:$('#v'+n).value,voter:me.uid});toast('Voto registrado')}))};

V.berlinda=()=>{const B=st.berlinda||[];if(!st.urna||!B.length)return v(`<div class="card"><h2>Berlinda</h2><p class="m">A urna está fechada.</p></div>`);
 if(B.some(b=>b.uid==me.uid))return v(`<div class="card"><h2>Berlinda</h2><p class="m">Você está na Berlinda e não vota nesta rodada.</p></div>`);
 v(`<h2>Berlinda</h2><div class="card"><p class="m">Escolha quem salvar. Voto secreto.</p>${B.map(b=>`<label class="block"><input type="radio" name="sv" value="${b.uid}" style="width:auto"> ${esc(b.ate)}</label>`).join('')}<button id="bv">Salvar este ateliê</button></div>`);
 $('#bv').onclick=guard(async()=>{const x=document.querySelector('[name=sv]:checked');if(!x)throw Error('Escolha um ateliê');await D.doc(`votos/ber_${st.rodada}_${me.uid}`).set({tipo:'ber',rodada:st.rodada,alvo:x.value,voter:me.uid});toast('Voto registrado')})};

// ---------- Direção Executiva ----------
const nm=async()=>Object.fromEntries((await D.collection('perfis').get()).docs.map(d=>[d.id,d.data().ate]));
const tally=async t=>{const s=await D.collection('votos').where('rodada','==',st.rodada).where('tipo','==',t).get(),c={};s.docs.forEach(d=>c[d.data().alvo]=(c[d.data().alvo]||0)+1);return c};
// Acumulado: média dos jurados por look, somada por ateliê. Na final, só conta a rodada final (placar zerado).
const rank=async()=>{const[p,a]=await Promise.all([D.collection('perfis').where('role','==','estilista').get(),D.collection('avaliacoes').get()]),by={};
 a.docs.forEach(d=>{const x=d.data();((by[x.alvo]??={})[x.look]??={r:x.rodada,s:[]}).s.push(x.total)});
 const rows=p.docs.filter(d=>!d.data().out).map(d=>{let tot=0,rd=0;const o=by[d.id]||{};for(const k in o){const m=o[k].s.reduce((q,c)=>q+c,0)/o[k].s.length;if(o[k].r==st.rodada)rd+=m;if(st.fase!='final'||o[k].r==st.rodada)tot+=m}return{uid:d.id,ate:d.data().ate,tot:+tot.toFixed(2),rd:+rd.toFixed(2)}});
 return rows.sort((x,y)=>y.tot-x.tot||y.rd-x.rd)};
const tbl=r=>`<table class="w-full"><tr><td>#<td>Ateliê<td>Acum.<td>Rodada</tr>${r.map((x,i)=>`<tr><td>${i+1}<td>${esc(x.ate)}<td>${x.tot}<td>${x.rd}</tr>`).join('')}</table>`;
const setSt=(o)=>D.doc('config/estado').set(o,{merge:true});

V.direcao=()=>{const pz=st.prazo?new Date(st.prazo-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16):'';let pend;
 v(`<h2>Direção Executiva</h2>
 <div class="card"><b>Rodada: ${esc(st.rodada||'-')} (${esc(st.fase||'-')})</b><input id="rn" placeholder="Id da nova rodada (ex: r1)"><input id="pz" type="datetime-local" value="${pz}"><select id="fs"><option value="normal">Normal<option value="top5">Top 5<option value="final">Final</select><button id="nr">Abrir nova rodada</button></div>
 <div class="card"><button id="lib" class="${st.liberado?'r':''}">${st.liberado?'Trancar':'Liberar'} resultados no site</button> <button id="urn" class="g">${st.urna?'Trancar':'Abrir'} urna da Berlinda</button></div>
 <div class="card"><b>Elenco</b><input id="rl" placeholder="Nome real"><input id="at" placeholder="Nome do ateliê"><input id="sn" placeholder="Senha (mín. 6)"><select id="pp"><option>estilista<option>jurado</select><button id="ce">Criar perfil</button><div id="id" class="m mt-2"></div></div>
 <div class="card"><b>Modelos</b><input id="mn" placeholder="Nome"><input id="mf" placeholder="URL da foto"><select id="mg"><option value="F">Feminino<option value="M">Masculino</select><button id="cm">Adicionar</button></div>
 <div class="card"><b>Apuração</b><div class="flex flex-wrap gap-2 my-2"><button class="g" id="a1">Ranking</button><button class="g" id="a2">Publicar resultado</button><button class="g" id="a3">Votos do Tribunal</button><button class="g" id="a4">Apurar Berlinda</button><button class="g" id="a5">Calculadora Top 5</button></div><div id="ap" class="m"></div></div>`);
 const out=h=>$('#ap').innerHTML=h;
 $('#nr').onclick=guard(async()=>{const id=slug($('#rn').value),p=new Date($('#pz').value).getTime();if(!id||!p)throw Error('Informe id e prazo');
  const s=await D.collection('modelos').get(),b=D.batch();s.docs.forEach(d=>d.data().vetoPor&&b.update(d.ref,{vetoPor:''}));
  b.set(D.doc('config/estado'),{rodada:id,prazo:p,fase:$('#fs').value,liberado:false,urna:false,berlinda:[],vetoDet:''},{merge:true});await b.commit();toast('Rodada aberta')});
 $('#lib').onclick=()=>setSt({liberado:!st.liberado});$('#urn').onclick=()=>setSt({urna:!st.urna});
 $('#ce').onclick=guard(async()=>{const real=$('#rl').value.trim(),ate=$('#at').value.trim(),pw=$('#sn').value;if(!real||!ate||pw.length<6)throw Error('Preencha nome real, ateliê e senha (mín. 6)');
  const sec=firebase.apps.find(a=>a.name=='sec')||firebase.initializeApp(cfg,'sec'),c=await sec.auth().createUserWithEmailAndPassword(mail(ate),pw);await sec.auth().signOut();
  await D.doc('perfis/'+c.user.uid).set({ate,role:$('#pp').value});await D.doc('identidades/'+c.user.uid).set({real,ate});toast('Perfil criado')});
 $('#cm').onclick=guard(async()=>{const nome=$('#mn').value.trim(),foto=$('#mf').value.trim();if(!nome||!foto)throw Error('Informe nome e URL');await D.collection('modelos').add({nome,foto,g:$('#mg').value,vetoPor:''});toast('Modelo adicionado')});
 on(D.collection('identidades'),s=>$('#id').innerHTML=s.docs.map(d=>`${esc(d.data().real)} ↔ <b>${esc(d.data().ate)}</b>`).join('<br>'));
 $('#a1').onclick=guard(async()=>out(tbl(await rank())));
 $('#a2').onclick=guard(async()=>{const r=(await rank()).sort((x,y)=>y.rd-x.rd),n=r.length,fin=st.fase=='final',
   sts=r.map((x,i)=>fin?['CHAMPION','RUNNER-UP','3º LUGAR'][i]||'':i==0?'WIN':i>=n-2?'BOTTOM 2':i<3?'HIGH':i>=n-4?'LOW':'SAFE'),upd={};
  if(st.fase=='normal'){const w=r.filter(x=>x.uid!=st.imune).reverse().slice(0,2),ac=[...r].sort((x,y)=>x.tot-y.tot).find(x=>x.uid!=st.imune&&!w.includes(x));
   upd.berlinda=[...w,ac].filter(Boolean).map(x=>({uid:x.uid,ate:x.ate}));upd.imune=r[0].uid}
  await D.doc('ranking/atual').set({rodada:st.rodada,rows:r.map((x,i)=>({ate:x.ate,status:sts[i]}))});await setSt(upd);
  out('Ranking publicado.'+(upd.berlinda?' Berlinda: '+upd.berlinda.map(x=>esc(x.ate)).join(', '):''))});
 $('#a3').onclick=guard(async()=>{const m=await nm();let h='';for(const[t,l]of[['veto','Veto'],['fdm','Fora de Moda']]){const e=Object.entries(await tally(t)).sort((a,b)=>b[1]-a[1]);
   h+=`<p><b>${l}</b>: ${e.map(([u,k])=>`${esc(m[u])} ${k}`).join(', ')||'sem votos'}</p>${e[0]?`<button class="g" data-do="${t}|${e[0][0]}">Definir ${esc(m[e[0][0]])}</button>`:''}`}out(h)});
 $('#a4').onclick=guard(async()=>{const B=st.berlinda||[];if(!B.length)throw Error('Berlinda vazia');const c=await tally('ber'),min=Math.min(...B.map(b=>c[b.uid]||0)),tied=B.filter(b=>(c[b.uid]||0)==min);let e=tied[0],why='menos votos de salvação';
  if(tied.length>1){const f=tied.find(b=>b.uid==st.fdm?.uid);if(f){e=f;why='empate: selo Fora de Moda'}else{const r=await rank();e=[...tied].sort((a,b)=>r.find(x=>x.uid==a.uid).tot-r.find(x=>x.uid==b.uid).tot)[0];why='empate sem selo: pior acumulado'}}
  out(`${B.map(b=>`${esc(b.ate)}: ${c[b.uid]||0} salvação(ões)`).join('<br>')}<p>Eliminado: <b>${esc(e.ate)}</b> (${why})</p><button class="r" data-do="elim|${e.uid}">Confirmar eliminação</button>`)});
 $('#a5').onclick=guard(async()=>{const r=await rank();if(st.fase!='top5'||r.length!=5)throw Error('Use na fase Top 5 com 5 estilistas ativos');
  const mid=r.slice(1,4).sort((a,b)=>a.rd-b.rd),o4=mid[0],o5=r[4],fin=[r[0],mid[1],mid[2]],
   warn=r[0].tot==r[1].tot||r[3].tot==r[4].tot||mid[0].rd==mid[1].rd?'<p class="text-red-400">Empate detectado: decida manualmente antes de aplicar.</p>':'';
  pend={o:[o4,o5],r};out(`${tbl(r)}<p>Finalista 1: <b>${esc(r[0].ate)}</b><br>5º (eliminado direto): ${esc(o5.ate)}<br>4º (pior nota no Top 5 entre os intermediários): ${esc(o4.ate)}<br>Top 3: ${fin.map(x=>esc(x.ate)).join(', ')}</p>${warn}<button class="r" data-do="top5">Aplicar</button>`)});
 $('#ap').onclick=guard(async e=>{const b=e.target.closest('[data-do]');if(!b)return;const[d,u]=b.dataset.do.split('|'),m=await nm();
  if(d=='veto')await setSt({vetoDet:u});
  if(d=='fdm')await setSt({fdm:{uid:u,ate:m[u]}});
  if(d=='elim'){const rk=await D.doc('ranking/atual').get(),x=rk.data();await D.doc('perfis/'+u).update({out:true});if(x)await rk.ref.set({...x,rows:x.rows.map(y=>y.ate==m[u]?{...y,status:'OUT'}:y)});await setSt({fdm:null})}
  if(d=='top5'){for(const x of pend.o)await D.doc('perfis/'+x.uid).update({out:true});await D.doc('ranking/atual').set({rodada:st.rodada,rows:pend.r.map(x=>({ate:x.ate,status:pend.o.includes(x)?'OUT':'FINALIST'}))})}
  toast('Aplicado')})};
